ển chất ma túy phải thực hiện theo đúng nội dung ghi trong giấy phép. Khi tiến hành giao, nhận chất ma túy phải có biên bản giao nhận giữa tổ chức cần vận chuyển với tổ chức thực hiện vận chuyển. Nội dung biên bản nêu rõ tên, địa chỉ tổ chức giao và tổ chức nhận chất ma túy; tên người giao, người nhận, giấy tờ tùy thân; tên gọi, mã CAS và mã số hàng hóa, số lượng, hàm lượng chất ma túy giao nhận; thời gian, địa điểm giao nhận và cam kết việc giao nhận đầy đủ của người giao, người nhận.","6. Hoạt động vận chuyển chất ma túy theo quy định của Điều này phải được theo dõi, kiểm tra, giám sát chặt chẽ từ quá trình được cấp giấy phép đến khi hoàn thành việc vận chuyển:","a) Tổ chức cần vận chuyển và tổ chức thực hiện vận chuyển phải chịu trách nhiệm về số lượng, chất lượng, có biện pháp bảo vệ an toàn, không để bị thất thoát trong quá trình vận chuyển và chịu sự theo dõi, kiểm tra, giám sát của cơ quan nhà nước có thẩm quyền;","b) Trong thời hạn chậm nhất là 03 ngày làm việc kể từ ngày cấp giấy phép, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi Giấy phép được gửi cho tổ chức cần vận chuyển, tổ chức thực hiện vận chuyển và lực lượng Hải quan, Bộ đội Biên phòng, Cảnh sát biển, Công an tỉnh, thành phố theo hành trình vận chuyển được ghi trên giấy phép để theo dõi, giám sát.","c) Công an cấp tỉnh, đơn vị Bộ đội Biên phòng, đơn vị Cảnh sát biển quản lý tuyến đường vận chuyển theo hành trình được cho phép phải bố trí lực lượng, phương tiện theo dõi, kiểm tra, giám sát chặt chẽ, đảm bảo việc vận chuyển theo đúng tuyến đường và nội dung ghi trong giấy phép. Trường hợp phát hiện có dấu hiệu vi phạm, cơ quan chức năng phát hiện thông báo ngay cho cơ quan cấp phép và phối hợp ngăn chặn xử lý theo quy định của pháp luật.","7. Hoạt động giao nhận, vận chuyển tiền chất công nghiệp thực hiện theo quy định pháp luật về hóa chất cần kiểm soát đặc biệt.","8. Hoạt động giao nhận, vận chuyển thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc thực hiện theo quy định của pháp luật về thuốc và nguyên liệu làm thuốc phải kiểm soát đặc biệt.","9. Hoạt động giao nhận, vận chuyển thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất thực hiện theo quy định của pháp luật về thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản có chứa chất tiền chất."]],["M","Mục 2","KIỂM SOÁT CÁC HOẠT ĐỘNG XUẤT KHẨU, NHẬP KHẨU, TẠM NHẬP, TÁI XUẤT, TẠM XUẤT, TÁI NHẬP, QUÁ CẢNH LÃNH THỔ VIỆT NAM CHẤT MA TÚY, TIỀN CHẤT"],["D",32,"Nhập khẩu, xuất khẩu chất ma túy, tiền chất",["1. Hồ sơ đề nghị cấp phép nhập khẩu, xuất khẩu","a) Văn bản đề nghị cấp giấy phép nhập khẩu, xuất khẩu theo Mẫu số 05 Phụ lục II ban hành kèm theo Nghị định này;","b) Bản sao văn bản chứng minh tư cách pháp nhân của tổ chức;","c) Văn bản thuyết minh mục đích nhập khẩu (sử dụng trong sản xuất, nghiên cứu, kiểm nghiệm, hoặc mục đích hợp pháp khác) kèm theo kế hoạch sử dụng chi tiết;","d) Bản sao có chứng thực Giấy phép nhập khẩu của nước nhập khẩu trong trường hợp đề nghị cấp giấy phép xuất khẩu;","đ) Bản sao hợp đồng, đơn đặt hàng và hóa đơn thương mại liên quan kèm theo bản chính đối chiếu (khi có yêu cầu);","e) Báo cáo tình hình xuất khẩu, mua bán, sử dụng, tồn trữ chất ma túy, tiền chất theo các Giấy phép đã được cấp trước đó;","Các tài liệu nêu trên nếu bằng tiếng nước ngoài thì phải kèm theo bản dịch tiếng Việt có công chứng (khi có yêu cầu);","2. Trình tự, thủ tục cấp giấy phép nhập khẩu, xuất khẩu","a) Tổ chức có hoạt động nhập khẩu, xuất khẩu chất ma túy theo quy định tại điểm b khoản 1 Điều 27 của Nghị định này chuẩn bị hồ sơ theo quy định tại khoản 1 Điều này, gửi trực tiếp hoặc gửi qua đường bưu điện hoặc trực tuyến về Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy);","b) Trường hợp hồ sơ chưa đầy đủ và hợp lệ, trong vòng 03 ngày làm việc kể từ ngày tiếp nhận hồ sơ, cơ quan có thẩm quyền cấp phép có văn bản yêu cầu tổ chức sửa đổi, bổ sung hồ sơ. Trường hợp hết thời hạn yêu cầu sửa đổi, bổ sung hồ sơ hoặc hồ sơ sửa đổi, bổ sung không đáp ứng yêu cầu, cơ quan có thẩm quyền cấp phép ban hành văn bản từ chối cấp phép và nêu rõ lý do;","c) Trong thời hạn chậm nhất là 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép thẩm định và cấp giấy phép nhập khẩu, xuất khẩu;","d) Trong trường hợp phải thực hiện thông báo tiền xuất khẩu theo quy định tại điểm b khoản 2 Điều 53 của Nghị định này, trong thời hạn chậm nhất là 12 ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan cấp phép thẩm định hồ sơ và cấp giấy phép xuất khẩu sau khi có ý kiến đồng ý của cơ quan có thẩm quyền nước nhập khẩu. Trường hợp cơ quan có thẩm quyền nước nhập khẩu không đồng ý thì cơ quan cấp phép từ chối cấp phép và thông báo bằng văn bản, nêu rõ lý do;","đ) Giấy phép nhập khẩu, xuất khẩu theo Mẫu số 06 Phụ lục II ban hành kèm theo Nghị định này; được cấp cho từng lần nhập khẩu, xuất khẩu và tối đa không quá 12 tháng và được gia hạn 01 lần và không quá 06 tháng.","3. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại Giấy phép nhập khẩu, xuất khẩu chất ma túy, tiền chất","a) Trường hợp Giấy phép bị mất, sai sót, hư hỏng hoặc có thay đổi về thông tin của tổ chức, tổ chức lập 01 bộ hồ sơ đề nghị điều chỉnh, cấp lại Giấy phép; gửi trực tiếp hoặc qua đường bưu điện qua hoặc trực tuyến về Cơ quan có thẩm quyền cấp phép;","b) Hồ sơ đề nghị điều chỉnh, cấp lại Giấy phép bao gồm: Văn bản đề nghị điều chỉnh, cấp lại Giấy phép, trong đó nêu rõ nội dung, lý do điều chỉnh, cấp lại; tài liệu xác nhận các nội dung điều chỉnh;","c) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép kiểm tra, cấp lại Giấy phép cho tổ chức. Trường hợp từ chối điều chỉnh, cấp lại, cơ quan có thẩm quyền cấp phép trả lời bằng văn bản và nêu rõ lý do;","d) Thời hạn của Quyết định cấp lại bằng thời hạn còn lại của Giấy phép đã cấp.","4. Hồ sơ, trình tự, thủ tục gia hạn Giấy phép nhập khẩu, xuất khẩu chất ma túy, tiền chất","a) Giấy phép được gia hạn trong trường hợp hết thời hạn ghi trong Giấy phép xuất khẩu, nhập khẩu nhưng việc xuất khẩu, nhập khẩu chưa thực hiện được hoặc thực hiện chưa xong.","b) Trước khi Giấy phép hết hạn tối thiểu 03 ngày làm việc, tổ chức có nhu cầu gia hạn phải lập 01 bộ hồ sơ đề nghị gia hạn Giấy phép gửi trực tiếp hoặc qua đường bưu điện qua hoặc trực tuyến về Cơ quan có thẩm quyền cấp phép;","c) Hồ sơ đề nghị gia hạn bao gồm: Văn bản đề nghị gia hạn Giấy phép, trong đó nêu rõ lý do, thời gian đề nghị gia hạn; Báo cáo tình hình, kết quả xuất khẩu, nhập khẩu đã thực hiện đến thời điểm đề nghị gia hạn;","d) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép gia hạn Giấy phép cho tổ chức. Trường hợp từ chối gia hạn, cơ quan có thẩm quyền cấp phép trả lời bằng văn bản và nêu rõ lý do."]],["D",33,"Nhập khẩu, xuất khẩu thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất",["1. Hồ sơ đề nghị cấp phép nhập khẩu, xuất khẩu","a) Các tài liệu quy định tại điểm a, điểm b, điểm d và điểm đ khoản 1 Điều 32 của Nghị định này;","b) Giấy chứng nhận đủ điều kiện nhập khẩu thuốc thú y đối với thuốc thú y có chứa chất ma túy và Giấy chứng nhận lưu hành thuốc thú y tại Việt Nam, trừ trường hợp nhập khẩu vì mục đích nghiên cứu, kiểm nghiệm, sử dụng điều trị bệnh cho động vật hoang dã, quý hiếm có tài liệu thuyết minh mục đích nhập khẩu;","c)  Phiếu phân tích chất lượng sản phẩm (CoA) của nhà sản xuất hoặc Phiếu kết quả kiểm định sản phẩm;","d) Tài liệu khác theo quy định về quản lý nhập khẩu, xuất khẩu thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản (nếu có).","2. Trình tự, thủ tục cấp giấy phép nhập khẩu, xuất khẩu","a) Tổ chức, cá nhân có hoạt động nhập khẩu, xuất khẩu thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất ở dạng đơn chất (nguyên liệu đơn) quy định tại điểm b khoản 2 Điều 27 của Nghị định này chuẩn bị hồ sơ theo khoản 1 Điều này, gửi trực tiếp hoặc gửi qua đường bưu điện hoặc gửi trực tuyến về Ủy ban nhân dân cấp tỉnh;","b) Trình tự, thủ tục cấp giấy phép nhập khẩu, xuất khẩu thực hiện theo quy định tại điểm b, điểm c, điểm d, điểm đ khoản 2 Điều 32 của Nghị định này;","3. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại, gia hạn nhập khẩu, xuất khẩu thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất thực hiện theo quy định tại khoản 3, khoản 4 Điều 32 của Nghị định này.","4. Hoạt động nhập khẩu, xuất khẩu thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất ở dạng hỗn hợp thực hiện theo quy định của pháp luật về quản lý thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất."]],["D",34,"Nhập khẩu chất chuẩn thuộc danh mục dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phục vụ nghiên cứu, kiểm nghiệm thuốc",["1. Chất chuẩn thuộc danh mục dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc được xem xét cấp phép nhập khẩu khi được sử dụng để phục vụ hoạt động kiểm nghiệm, nghiên cứu thuốc và nguyên liệu làm thuốc tại chính cơ sở kinh doanh dược, cơ sở có hoạt động dược không vì mục đích thương mại theo quy định của pháp luật về dược.","2. Hồ sơ đề nghị cấp phép nhập khẩu chất chuẩn","a) Các tài liệu quy định tại điểm a, điểm b, điểm c khoản 1 Điều 32 của Nghị định này;","b) Giấy chứng nhận đủ điều kiện kinh doanh dược hoặc tài liệu pháp lý thể hiện cơ sở được thực hiện hoạt động dược không vì mục đích thương mại.","3. Trình tự thủ tục cấp giấy phép nhập khẩu chất chuẩn","a) Tổ chức, cá nhân hoạt động theo quy định điểm c khoản 4 Điều 27 của Nghị định này chuẩn bị hồ sơ theo khoản 2 Điều này, gửi trực tiếp hoặc gửi qua đường bưu điện hoặc gửi trực tuyến về Bộ Y tế (Cục Quản lý Dược);","b) Trong thời hạn chậm nhất là 15 ngày kể từ ngày nhận đủ hồ sơ đề nghị cấp giấy phép nhập khẩu theo quy định, cơ quan cấp phép tiến hành cấp giấy phép nhập khẩu hoặc có văn bản thông báo không cấp phép và nêu rõ lý do;","c) Giấy phép nhập khẩu, xuất khẩu theo Mẫu số 07A và 07B Phụ lục II ban hành kèm theo Nghị định này, được cấp cho từng lần nhập khẩu và tối đa không quá 12 tháng."]],["D",35,"Nhập khẩu, xuất khẩu tiền chất công nghiệp và thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc",["1. Hồ sơ, trình tự, thủ tục cho phép nhập khẩu, xuất khẩu tiền chất công nghiệp tại điểm b khoản 3 Điều 27 của Nghị định này thực hiện theo quy định của pháp luật về hóa chất cần kiểm soát đặc biệt.","2. Hồ sơ, trình tự, thủ tục cho phép nhập khẩu, xuất khẩu thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc tại điểm b khoản 4 Điều 27 của Nghị định này thực hiện theo quy định của pháp luật về thuốc và nguyên liệu làm thuốc phải kiểm soát đặc biệt.","3. Hoạt động xuất khẩu tiền chất công nghiệp (dạng đơn chất hay hỗn hợp) và thuốc tiền chất, tiền chất dùng làm thuốc (dạng nguyên liệu hay chế phẩm) trước khi cấp giấy phép xuất khẩu, cơ quan có thẩm quyền cấp phép phối hợp với Bộ Công an thực hiện thông báo tiền xuất khẩu theo quy định tại điểm b khoản 2 Điều 53 của Nghị định này."]],["D",36,"Tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc; thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất ở dạng đơn chất (nguyên liệu đơn)",["1. Doanh nghiệp có hoạt động theo quy định điểm c khoản 3 Điều 27 của Nghị định này chuẩn bị hồ sơ đề nghị cấp giấy phép theo quy định của pháp luật về quản lý ngoại thương, gửi trực tiếp hoặc gửi qua đường bưu điện hoặc gửi trực tuyến về Ủy ban nhân dân tỉnh, thành phố.","2. Cơ quan cấp phép tiếp nhận hồ sơ, thẩm định, phối hợp với Bộ Công an thực hiện thông báo tiền xuất khẩu theo quy định tại điểm d khoản 2 Điều 53 của Nghị định này và cấp giấy phép tạm nhập, tái xuất, tạm xuất, tái nhập theo quy định của Luật Quản lý ngoại thương."]],["D",37,"Hoạt động quá cảnh lãnh thổ Việt Nam chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất ở dạng đơn chất (nguyên liệu đơn)",["1. Hồ sơ đề nghị cấp giấy phép quá cảnh:","a) Đơn đề nghị cấp giấy phép quá cảnh của doanh nghiệp gồm các thông tin về tên, địa chỉ của doanh nghiệp; thời gian, địa điểm, lý do quá cảnh; tên, địa chỉ nơi sản xuất, tên gọi, mã CAS, mã số hàng hóa, khối lượng, hàm lượng chất ma túy, tiền chất cần quá cảnh; giá trị hàng hóa; phương tiện, hành trình và điều kiện bảo đảm an toàn vận chuyển;","b) Bản chính hợp đồng vận tải; Bản sao Giấy đăng ký kinh doanh ngành nghề giao nhận, vận tải của đơn vị làm dịch vụ vận chuyển hàng hóa quá cảnh.","c) Bản chính một trong các giấy tờ sau: Công thư đề nghị của cơ quan có thẩm quyền của nước đề nghị cho hàng hóa quá cảnh, Giấy phép xuất khẩu của nước có hàng xuất khẩu hoặc Giấy phép nhập khẩu của nước có hàng nhập khẩu;","d) Bản chính Giấy phép quá cảnh của nước mà hàng xuất khẩu hoặc nhập khẩu đã đi qua trước khi đến Việt Nam (trường hợp vận chuyển quá cảnh nhiều nước).","Các tài liệu trên nếu bằng tiếng nước ngoài thì phải được dịch ra tiếng Việt có công chứng.","2. Trình tự, thủ tục cấp giấy phép quá cảnh lãnh thổ Việt Nam","a) Doanh nghiệp có hoạt động tại điểm d khoản 1 Điều 27 của Nghị định này chuẩn bị hồ sơ đề nghị cấp giấy phép theo quy định tại khoản 2 Điều này, gửi trực tiếp hoặc gửi qua đường bưu điện hoặc trực tuyến về Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy);","b) Trong thời hạn chậm nhất là 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định, cơ quan cấp phép tiến hành thẩm định và cấp giấy phép quá cảnh. Trường hợp không cấp giấy phép quá cảnh thì phải thông báo bằng văn bản, nêu rõ lý do.","3. Giấy phép quá cảnh","a) Nội dung giấy phép phải ghi rõ tên, địa chỉ của doanh nghiệp được phép quá cảnh; tên gọi, mã CAS, mã số hàng hóa, mã UN (nếu có), số lượng, hàm lượng các chất được phép quá cảnh; thời gian, phương tiện thực hiện việc vận chuyển quá cảnh; tên các cửa khẩu mà hàng vận chuyển quá cảnh đi qua;","b) Giấy phép quá cảnh có giá trị một lần theo thời hạn ghi trên giấy phép nhưng thời hạn ghi không quá 02 tháng. Trường hợp hết thời hạn ghi trên giấy phép nhưng việc quá cảnh chưa thực hiện được thì doanh nghiệp đề nghị được gia hạn thời hạn quá cảnh. Việc gia hạn được thực hiện một lần với thời hạn không quá 30 ngày;","c) Trường hợp cần điều chỉnh giấy phép do sai sót hoặc cấp lại giấy phép do mất, thất lạc, doanh nghiệp có đơn đề nghị kèm theo giấy tờ, tài liệu chứng minh nội dung cần điều chỉnh hoặc báo cáo giải trình lý do mất, thất lạc, gửi cơ quan cấp phép. Trong thời hạn chậm nhất là 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định, cơ quan cấp phép tiến hành xem xét điều chỉnh giấy phép hoặc cấp lại giấy phép. Trường hợp từ chối điều chỉnh hoặc cấp lại giấy phép, cơ quan cấp phép trả lời bằng văn bản, nêu rõ lý do.","4. Chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất quá cảnh lãnh thổ Việt Nam phải được chứa trong thùng chứa, đóng gói, niêm phong và đảm bảo tuân thủ tiêu chuẩn, quy chuẩn quốc tế và hồ sơ kèm theo. Trường hợp phát hiện thay đổi niêm phong hoặc thay đổi nguyên trạng hàng vận chuyển quá cảnh, Cơ quan Hải quan nơi làm thủ tục quá cảnh tạm dừng các thủ tục hải quan, lập biên bản, xử lý theo thẩm quyền và thông báo ngay qua đường dây nóng cho Bộ Công an để phối hợp quản lý, kiểm soát.","5. Nguyên tắc quản lý hoạt động quá cảnh và thời gian quá cảnh chất ma túy, tiền chất; thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất qua lãnh thổ Việt Nam được thực hiện theo quy định tại Nghị định này và Luật Quản lý ngoại thương."]],["D",38,"Kiểm soát các hoạt động xuất khẩu, nhập khẩu, tạm nhập, tái xuất; tạm xuất, tái nhập, quá cảnh lãnh thổ Việt Nam",["1. Trong thời hạn chậm nhất là 03 ngày làm việc kể từ ngày cấp giấy phép, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi giấy phép xuất khẩu, nhập khẩu; tạm nhập, tái xuất; tạm xuất, tái nhập cho Chi cục Hải quan nơi làm thủ tục hải quan, Bộ Tài chính (Cục Hải quan) và Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy) để theo dõi, kiểm tra và thực hiện thông báo tiền xuất khẩu theo điểm a khoản 2 Điều 53 của Nghị định này. Giấy phép quá cảnh được gửi cho Công an cấp tỉnh, đơn vị Hải quan, Bộ đội Biên phòng, Cảnh sát biển nơi hàng vận chuyển quá cảnh đi qua, Bộ Tài chính (Cục Hải quan) để để các đơn vị trên phối hợp theo dõi, kiểm tra, giám sát.","2. Lực lượng Hải quan có trách nhiệm có trách nhiệm thực hiện thủ tục và quản lý, giám sát theo quy định của pháp luật Hải quan. Trường hợp phát hiện hàng nhập khẩu; xuất khẩu; tạm nhập, tái xuất; tạm xuất, tái nhập, quá cảnh lãnh thổ Việt Nam không đúng với nội dung giấy phép, cơ quan Hải quan tạm dừng các thủ tục hải quan, lập biên bản, xử lý theo thẩm quyền; đồng thời trong thời hạn chậm nhất là 03 ngày làm việc, kể từ ngày phát hiện sai phạm, cơ quan Hải quan có trách nhiệm thông báo trực tiếp qua đường dây nóng cho cơ quan có thẩm quyền cấp phép và Bộ Công an để phối hợp quản lý, kiểm soát.","3. Đối với trường hợp vi phạm các quy định về nhập khẩu, xuất khẩu, Thủ trưởng cơ quan cấp phép và Chi cục trưởng Chi cục Hải quan nơi làm thủ tục hải quan tùy theo tính chất, mức độ vi phạm có thể quyết định thu hồi giấy phép đã cấp, đình chỉ, tạm đình chỉ việc nhập khẩu, xuất khẩu, xử lý theo thẩm quyền hoặc chuyển giao cho cơ quan có thẩm quyền xử lý theo quy định của pháp luật.","4. Công an cấp tỉnh, đơn vị Bộ đội Biên phòng, đơn vị Cảnh sát biển quản lý tuyến đường vận chuyển của hoạt động quá cảnh được cho phép phải bố trí lực lượng, phương tiện kiểm soát chặt chẽ, đảm bảo việc vận chuyển tuân thủ theo đúng tuyến đường và nội dung ghi trong giấy phép. Trường hợp hàng vận chuyển có số lượng lớn hoặc trong trường hợp cần thiết khác, đơn vị cấp phép được quyền yêu cầu lực lượng Công an địa phương, Bộ đội Biên phòng, Cảnh sát biển phối hợp với lực lượng Hải quan tổ chức việc áp tải hàng vận chuyển quá cảnh ra khỏi lãnh thổ Việt Nam. Trong quá trình doanh nghiệp thực hiện thủ tục quá cảnh, các cơ quan chức năng phát hiện có dấu hiệu vi phạm thì thông báo ngay cho cơ quan Hải quan để phối hợp ngăn chặn và xử lý theo quy định của pháp luật.","5. Việc mang theo thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất vì mục đích điều trị bệnh cho bản thân người nhập cảnh, xuất cảnh thực hiện theo quy định của pháp luật về nhập khẩu, xuất khẩu thuốc phải kiểm soát đặc biệt không vì mục đích thương mại. Người nhập cảnh, xuất cảnh có trách nhiệm khai báo và giải trình về số lượng thuốc đã sử dụng với cơ quan Hải quan của Việt Nam, có nghĩa vụ thực hiện nghiêm các biện pháp an toàn để phòng ngừa, ngăn chặn việc sử dụng không đúng mục đích hoặc vận chuyển trái phép các thuốc đó, đồng thời chịu sự kiểm soát của cơ quan có thẩm quyền của Việt Nam."]],["M","Mục 3","KIỂM SOÁT CÁC HOẠT ĐỘNG HỢP PHÁP LIÊN QUAN ĐẾN MA TÚY VÌ MỤC ĐÍCH QUỐC PHÒNG, AN NINH"],["D",39,"Cơ quan có thẩm quyền cho phép và các đơn vị được tiến hành các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh",["1. Hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh bao gồm: hoạt động nghiên cứu, sản xuất, nhập khẩu, xuất khẩu, vận chuyển, bảo quản, phân phối, sử dụng, xử lý chất ma túy, tiền chất, mẫu chất ma túy của cơ quan có thẩm quyền phục vụ công tác giám định, truy nguyên nguồn gốc ma túy, huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy, huấn luyện động vật nghiệp vụ để phát hiện chất ma túy trong lực lượng Công an nhân dân, Quân đội nhân dân và Hải quan; thực hiện nhiệm vụ hợp tác quốc tế và các công tác nghiệp vụ khác trong lực lượng Công an nhân dân.","2. Bộ Công an cho phép các đơn vị tiến hành các hoạt động hợp pháp liên quan đến ma túy quy định tại khoản 1 Điều này đối với toàn bộ các chất ma túy, tiền chất thuộc các Danh mục chất ma túy và tiền chất do Chính phủ quy định.","3.  Các đơn vị được quản lý và sử dụng chất ma túy, tiền chất, mẫu chất ma túy bao gồm:","a) Đơn vị chức năng thuộc Viện Khoa học hình sự, Bộ Công an; Phòng Kỹ thuật hình sự Công an cấp tỉnh; Phòng Giám định kỹ thuật hình sự, Bộ Quốc phòng được nhận mẫu, quản lý và sử dụng mẫu chất ma túy từ Viện Khoa học hình sự để giám định, huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy và truy nguyên nguồn gốc ma túy;","b) Các cơ quan chuyên trách phòng, chống tội phạm về ma túy; các cơ sở đào tạo người làm công tác phòng, chống tội phạm về ma túy thuộc lực lượng Công an, Bộ đội Biên phòng, Cảnh sát biển, Hải quan được nhận mẫu, quản lý và sử dụng mẫu chất ma túy từ Viện Khoa học hình sự để huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy;","c) Các đơn vị huấn luyện động vật nghiệp vụ để phát hiện ma túy thuộc lực lượng Công an, Bộ đội Biên phòng, Cảnh sát biển, Hải quan được nhận mẫu, quản lý và sử dụng mẫu chất ma túy từ Viện Khoa học hình sự để huấn luyện động vật nghiệp vụ;","d) Các đơn vị hoạt động khoa học và công nghệ, trực thuộc Bộ Công an được quản lý, sử dụng chất ma túy, tiền chất để phục vụ hợp tác quốc tế, nghiên cứu, hướng dẫn quy trình và chuyển giao công nghệ.","4. Mẫu chất ma túy là một khối lượng hoặc một đơn vị cụ thể chất ma túy được sử dụng vì mục đích quốc phòng, an ninh, bao gồm:","a) Mẫu lấy từ vật chứng từ các vụ án về tội phạm ma túy để phục vụ trưng cầu giám định và truy nguyên nguồn gốc;","b) Mẫu chất chuẩn ma túy phục vụ công tác giám định, nghiên cứu;","c) Mẫu chế phẩm có chứa chất ma túy phục vụ công tác huấn luyện nghiệp vụ, huấn luyện động vật nghiệp vụ."]],["D",40,"Nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh",["1. Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an chịu trách nhiệm tiếp nhận hồ sơ, thẩm định, cấp phép tiến hành hoạt động nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh.","2. Cục Khoa học, chiến lược và lịch sử Công an, Bộ Công an chịu trách nhiệm tiếp nhận hồ sơ, tổ chức tuyển chọn hoặc giao trực tiếp nhiệm vụ khoa học và công nghệ trong Công an nhân dân liên quan đến việc nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh theo chức năng và nhiệm vụ được giao;","3. Viện Khoa học hình sự, Cục Công nghiệp an ninh và Phòng Kỹ thuật hình sự Công an cấp tỉnh là các đơn vị được giao tiến hành hoạt động nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh.","4. Hồ sơ đề nghị cấp phép nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh","a) Văn bản đề nghị cấp phép nghiên cứu chất ma túy, tiền chất của đơn vị đăng ký chủ trì thực hiện nhiệm vụ khoa học và công nghệ theo Mẫu số 01 Phụ lục II ban hành kèm theo Nghị định này;","b) Văn bản thông báo kết quả họp Hội đồng tuyển chọn hoặc giao trực tiếp nhiệm vụ khoa học và công nghệ trong Công an nhân dân của Cục Khoa học, chiến lược và lịch sử Công an;","c) Phiếu đăng ký tuyển chọn hoặc giao trực tiếp nhiệm vụ khoa học và công nghệ trong Công an nhân dân;","d) Lý lịch khoa học của cá nhân đăng ký thực hiện nhiệm vụ và tóm tắt hoạt động khoa học và công nghệ của đơn vị đăng ký chủ trì thực hiện nhiệm vụ khoa học và công nghệ trong Công an nhân dân.","5. Trình tự, thủ tục cấp phép nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh","a) Căn cứ văn bản thông báo kết quả họp Hội đồng tuyển chọn hoặc giao trực tiếp nhiệm vụ khoa học và công nghệ trong Công an nhân dân của Cục Khoa học, chiến lược và lịch sử Công an, đơn vị đăng ký chủ trì thực hiện nhiệm vụ khoa học và công nghệ lập hồ sơ đề nghị cấp phép nghiên cứu gửi Cục Cảnh sát điều tra tội phạm về ma túy;","b) Quy định tại điểm b, điểm c khoản 2; khoản 3 Điều 28 của Nghị định này;","6. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại, gia hạn, thu hồi Quyết định cấp phép nghiên cứu chất ma túy, tiền chất được thực hiện theo quy định tại khoản 4, khoản 5, khoản 6, khoản 7 Điều 28 của Nghị định này.","7. Biểu mẫu trong hoạt động nghiên cứu chất ma túy, tiền chất vì mục đích quốc phòng, an ninh","a) Sổ theo dõi các hoạt động nghiên cứu về chất ma túy, tiền chất (pha chế, xử lý) theo Mẫu số 08 Phụ lục II ban hành kèm theo Nghị định này;","b) Phiếu nhập/xuất kho chất ma túy, tiền chất và mẫu chất ma túy theo Mẫu số 09 Phụ lục II ban hành kèm theo Nghị định này;","c) Sổ theo dõi xuất, nhập, sử dụng, tồn kho chất ma túy, tiền chất và mẫu chất ma túy theo Mẫu số 10 Phụ lục II ban hành kèm theo Nghị định này;","đ) Các chứng từ liên quan đến việc mua bán chất ma túy, tiền chất phục vụ hoạt động nghiên cứu."]],["D",41,"Sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an chịu trách nhiệm tiếp nhận hồ sơ, thẩm định, cấp phép tiến hành hoạt động sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh.","2. Hồ sơ đề nghị cấp phép sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh, bao gồm:","a) Văn bản đề nghị cấp phép sản xuất chất ma túy, tiền chất, mẫu chất ma túy theo Mẫu số 03 Phụ lục II ban hành kèm theo Nghị định này;","b) Kế hoạch dự trù mẫu chất ma túy được Bộ trưởng Bộ Công an phê duyệt;","c) Kế hoạch sản xuất chất ma túy, tiền chất, mẫu chất ma túy trong đó nêu rõ tên chất ma túy, tiền chất cần sản xuất; hình thức đóng gói, khối lượng, hàm lượng/chất lượng chất ma túy, tiền chất; thời gian sản xuất, địa điểm sản xuất; kế hoạch, biện pháp đảm bảo an toàn và điều kiện bảo quản chất ma túy, tiền chất trong quá trình sản xuất.","3. Trình tự, thủ tục cấp phép sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh:","a) Căn cứ kế hoạch dự trù mẫu chất ma túy được Bộ trưởng Bộ công an phê duyệt, Viện Khoa học hình sự lập hồ sơ đề nghị cấp phép sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh gửi Cục Cảnh sát điều tra tội phạm về ma túy;","b) Quy định tại điểm b, điểm c khoản 3, khoản 4 Điều 29 của Nghị định này;","4. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại, gia hạn, thu hồi Giấy phép sản xuất chất ma túy, tiền chất, mẫu chất ma túy được thực hiện theo quy định tại khoản 5 Điều 29 của Nghị định này.","5. Chất ma túy, tiền chất, mẫu chất ma túy sau khi sản xuất phải nhập kho lưu mẫu chất ma túy quốc gia để phục vụ các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh.","6. Biểu mẫu trong hoạt động sản xuất chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh:","a) Quyết định của Bộ trưởng Bộ Công an phê duyệt nhu cầu sử dụng mẫu chất ma túy và kế hoạch dự trù mẫu chất ma túy theo Mẫu số 11 Phụ lục II ban hành kèm theo Nghị định này;","b) Kế hoạch sản xuất chất ma túy, tiền chất theo Mẫu số 12 Phụ lục II ban hành kèm theo Nghị định này;","c) Sổ theo dõi hoạt động sản xuất chất ma túy, tiền chất và mẫu chất ma túy theo Mẫu số 13 Phụ lục II ban hành kèm theo Nghị định này;","e) Sổ theo dõi xuất, nhập, sử dụng, tồn kho chất ma túy, tiền chất và mẫu chất ma túy theo Mẫu số 10 Phụ lục II ban hành kèm theo Nghị định này;","g) Phiếu nhập/xuất kho chất ma túy, tiền chất và mẫu chất ma túy theo Mẫu số 09 Phụ lục II ban hành kèm theo Nghị định này;","h) Các chứng từ liên quan đến việc mua bán chất ma túy, tiền chất phục vụ hoạt động sản xuất.","7. Các đơn vị hoạt động khoa học và công nghệ trực thuộc Bộ Công an khi được Bộ trưởng Bộ Công an phê duyệt Kế hoạch hoặc văn bản đề xuất về việc sản xuất chất ma túy, tiền chất để phục vụ nhiệm vụ hợp tác quốc tế, nghiên cứu, hướng dẫn quy trình và chuyển giao công nghệ; điều kiện, hồ sơ, thủ tục cấp phép, nội dung và thời hạn giấy phép sản xuất chất ma túy, tiền chất thực hiện theo quy định tại khoản 1, khoản 2, khoản 3, khoản 4 Điều 29 của Nghị định này. Các chất ma túy, tiền chất được sản xuất do đơn vị sản xuất tự bảo quản, sử dụng hoặc bàn giao cho đối tác, đơn vị thụ hưởng theo Kế hoạch được phê duyệt."]],["D",42,"Nhập khẩu, xuất khẩu chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an chịu trách nhiệm tiếp nhận hồ sơ, thẩm định, cấp phép tiến hành hoạt động nhập khẩu, xuất khẩu chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh.","2. Viện Khoa học hình sự, Bộ Công an là đơn vị duy nhất nhập khẩu, xuất khẩu hoặc ủy quyền nhập khẩu, xuất khẩu chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh.","3. Hồ sơ đề nghị cấp giấy phép nhập khẩu, xuất khẩu chất ma túy, tiền chất, mẫu chất ma túy túy vì mục đích quốc phòng, an ninh:","a) Văn bản đề nghị cấp phép nhập khẩu, xuất khẩu;","b) Giấy phép nhập khẩu của nước nhập khẩu đối với đề nghị cấp phép xuất khẩu;","c) Kế hoạch dự trù mẫu chất ma túy được Bộ trưởng Bộ Công an phê duyệt;","d) Tài liệu khác: văn bản ủy quyền nhập khẩu và giấy chứng nhận đăng ký kinh doanh của đối tác được ủy quyền nhập khẩu (khi có yêu cầu), văn bản chứng minh nguồn kinh phí hợp pháp, văn bản thông báo hàng viện trợ (nếu có);","Các tài liệu nêu trên nếu bằng tiếng nước ngoài thì phải kèm theo bản dịch tiếng Việt có công chứng (khi có yêu cầu).","4. Trình tự, thủ tục cấp giấy phép nhập khẩu, xuất khẩu chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh:","a) Căn cứ vào dự trù nhu cầu sử dụng mẫu chất ma túy đã được Bộ Công an phê duyệt, Viện Khoa học hình sự lập hồ sơ đề nghị cấp giấy phép nhập khẩu gửi Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an thẩm định;","b) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định, cơ quan cấp phép có trách nhiệm thẩm định và cấp giấy phép nhập khẩu;","Giấy phép nhập khẩu gồm 01 bản tiếng Việt và 01 bản tiếng Anh được gửi cho Viện Khoa học hình sự, Chi cục Hải quan nơi làm thủ tục nhập khẩu, Cục Hải quan.","c) Sau khi được cấp Giấy phép nhập khẩu, Viện Khoa học hình sự tiến hành các thủ tục nhập khẩu: Ký hợp đồng với đối tác được phê duyệt ủy thác nhập khẩu; phối hợp với đại diện đối tác viện trợ làm thủ tục nhập khẩu (nếu có).","d) Trong thời hạn 12 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định, Cục Cảnh sát điều tra tội phạm về ma túy thẩm định, thực hiện thông báo tiền xuất khẩu và cấp phép xuất khẩu. Trường hợp cơ quan có thẩm quyền của nước nhập khẩu không thông qua yêu cầu thông báo tiền xuất khẩu thì cơ quan cấp phép không cấp phép và thông báo bằng văn bản, nêu rõ lý do.","5. Chất ma túy, tiền chất và mẫu chất ma túy được nhập khẩu phải nhập kho, bảo quản tại kho lưu mẫu chất ma túy quốc gia hoặc bàn giao, phân phối cho các đơn vị sử dụng để phục vụ các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh.","6. Biểu mẫu trong hoạt động xuất khẩu, nhập khẩu chất ma túy, tiền chất và nhập khẩu mẫu chất ma túy vì mục đích quốc phòng, an ninh:","a) Sổ theo dõi hoạt động xuất, nhập khẩu chất ma túy, tiền chất và nhập khẩu mẫu chất ma túy theo Mẫu số 14 Phụ lục II ban hành kèm theo Nghị định này;","b) Các chứng từ liên quan đến việc xuất khẩu, nhập khẩu chất ma túy, tiền chất và nhập khẩu mẫu chất ma túy."]],["D",43,"Vận chuyển chất ma túy, tiền chất và giao nhận mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Vận chuyển chất ma túy, tiền chất","a) Các đơn vị cần vận chuyển chất ma túy, tiền chất vì mục đích quốc phòng, an ninh có trách nhiệm thực hiện đầy đủ các quy định về hoạt động vận chuyển và chịu sự theo dõi, kiểm tra, giám sát của cơ quan chức năng theo quy định tại Điều này, Điều 31 của Nghị định này và quy định của pháp luật có liên quan.","b) Trong trường hợp đơn vị tự thực hiện vận chuyển, cần cung cấp văn bản giao nhiệm vụ của người đứng đầu tổ chức cần vận chuyển, trong văn bản ghi rõ thông tin cá nhân của người vận chuyển, phương tiện vận chuyển.","Người vận chuyển khi làm nhiệm vụ phải mang theo văn bản giao nhiệm vụ của người đứng đầu tổ chức cần vận chuyển, giấy tờ tùy thân hợp lệ, phiếu xuất kho.","2. Giao nhận mẫu chất ma túy","a) Căn cứ nhu cầu sử dụng, đơn vị sử dụng mẫu chất ma túy gửi văn bản đề nghị đơn vị quản lý kho lưu mẫu chất ma túy quốc gia hoặc đơn vị quản lý kho lưu mẫu trung gian cung cấp mẫu chất ma túy;","b) Căn cứ vào giấy giới thiệu (hoặc văn bản giao nhiệm vụ) và văn bản đề nghị của đơn vị sử dụng mẫu chất ma túy, đại diện đơn vị quản lý kho lưu mẫu chất ma túy quốc gia hoặc đại diện đơn vị quản lý kho lưu mẫu chất ma túy trung gian cấp giấy xác nhận vận chuyển mẫu chất ma túy cho cá nhân được giao nhiệm vụ vận chuyển mẫu chất ma túy từ kho lưu mẫu chất ma túy quốc gia đến kho lưu mẫu chất ma túy trung gian hoặc từ kho lưu mẫu chất ma túy trung gian đến đơn vị sử dụng;","c) Khi giao, nhận mẫu chất ma túy phải lập biên bản, đại diện bên giao, đại diện bên nhận phải tiến hành kiểm tra, đối chiếu tên, số lượng, chủng loại, hàm lượng, số lô sản xuất và hạn sử dụng và ký xác nhận vào các chứng từ, sổ sách xuất, nhập kho;","d) Đơn vị nhận mẫu chất ma túy và vận chuyển từ kho lưu mẫu chất ma túy quốc gia đến kho lưu mẫu chất ma túy trung gian hoặc từ kho lưu mẫu chất ma túy trung gian đến đơn vị sử dụng phải bảo đảm an ninh, an toàn và chịu sự kiểm tra, giám sát theo quy định.","3. Biểu mẫu trong giao nhận mẫu chất ma túy vì mục đích quốc phòng, an ninh:","a) Giấy đề nghị cung cấp mẫu chất ma túy vì mục đích quốc phòng, an ninh theo Mẫu số 15 Phụ lục II ban hành kèm theo Nghị định này;","b) Giấy xác nhận vận chuyển mẫu chất ma túy vì mục đích quốc phòng, an ninh theo Mẫu số 16 Phụ lục II ban hành kèm theo Nghị định này;","c) Biên bản giao nhận mẫu chất ma túy theo Mẫu số 17 Phụ lục II ban hành kèm theo Nghị định này."]],["D",44,"Hoạt động bảo quản, phân phối, sử dụng chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Các đơn vị quy định tại khoản 3 Điều 39 của Nghị định này có trách nhiệm:","a) Xây dựng kế hoạch tổ chức thực hiện các hoạt động bảo quản, tồn trữ, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, mẫu chất ma túy đảm bảo tuyệt đối an toàn và phải chịu trách nhiệm trước pháp luật về việc nhầm lẫn, thất thoát các chất đó;","b) Chấp hành việc theo dõi, kiểm tra, giám sát của các cơ quan chức năng đối với các hoạt động bảo quản, tồn trữ, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, mẫu chất ma túy tại cơ quan, đơn vị.","2. Đơn vị chức năng thuộc Bộ Công an chịu trách nhiệm phối hợp với các cơ quan chức năng thuộc các bộ, ngành có liên quan tiến hành theo dõi, kiểm tra, giám sát các hoạt động bảo quản, tồn trữ, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, mẫu chất ma túy vì mục đích quốc phòng, an ninh đối với các đơn vị theo quy định tại khoản 1 của Điều này."]],["D",45,"Kho lưu mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Mẫu chất ma túy phải được lưu trữ và bảo quản tại các kho lưu mẫu chất ma túy quốc gia và kho lưu mẫu chất ma túy trung gian. Kho lưu mẫu chất ma túy quốc gia và kho lưu mẫu chất ma túy trung gian phải được bố trí riêng biệt (về công năng sử dụng), thuận tiện cho các hoạt động xuất, nhập kho, bảo quản, đảm bảo an ninh, an toàn phòng cháy, chữa cháy; có hệ thống chiếu sáng, thông gió, kiểm soát, theo dõi nhiệt độ, độ ẩm và thiết bị phòng độc. Kho lưu mẫu chất ma túy có diện tích tối thiểu là 15m2. Trong kho phải có dụng cụ, thiết bị để lưu trữ, bảo quản mẫu phù hợp với yêu cầu của từng loại mẫu như: giá để mẫu, tủ đựng mẫu, tủ mát hoặc tủ lạnh. Việc phân công quản lý kho lưu mẫu do Thủ trưởng đơn vị quản lý kho quyết định, có nội quy ra vào kho, đảm bảo an ninh, an toàn.","2. Kho lưu mẫu chất ma túy quốc gia đặt tại Viện Khoa học hình sự, Bộ Công an; là đơn vị tiếp nhận chất ma túy, tiền chất, mẫu chất ma túy từ hoạt động nhập khẩu mẫu chất ma túy và nghiên cứu, sản xuất chất ma túy, tiền chất; trực tiếp quản lý, bảo quản và phân phối cho các đơn vị sử dụng quy định tại khoản 3 Điều 39 của Nghị định này.","3. Kho lưu mẫu chất ma túy trung gian đặt tại các đơn vị được phép quản lý, sử dụng mẫu chất ma túy theo quy định tại khoản 3 Điều 39 của Nghị định này, là nơi tiếp nhận mẫu chất ma túy từ Viện Khoa học hình sự, Bộ Công an, bao gồm:","a) Kho lưu mẫu chất ma túy trung gian tại Công an cấp tỉnh do Phòng Kỹ thuật hình sự cấp tỉnh trực tiếp quản lý và thực hiện giám định, huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy và truy nguyên nguồn gốc ma túy;","b) Kho lưu mẫu chất ma túy trung gian tại các cơ quan chuyên trách phòng, chống tội phạm về ma túy; các cơ sở đào tạo người làm công tác phòng, chống tội phạm về ma túy; các đơn vị huấn luyện động vật nghiệp vụ để phát hiện ma túy thuộc lực lượng Công an, Bộ đội Biên phòng, Cảnh sát biển, Hải quan. Trong trường hợp không đủ điều kiện để xây dựng kho lưu mẫu trung gian, các đơn vị trên bố trí khu vực riêng trong kho chung của đơn vị để bảo quản. Khu vực riêng có két sắt, thiết bị, dụng cụ để lưu trữ, bảo quản mẫu phù hợp với yêu cầu từng loại mẫu.","4. Viện Khoa học hình sự, Bộ Công an tổ chức phân phối, bàn giao mẫu chất ma túy theo kế hoạch được phê duyệt, tiếp nhận mẫu chất ma túy không còn sử dụng của các đơn vị, tiến hành theo dõi, kiểm tra việc sử dụng tại các đơn vị và đánh giá chất lượng mẫu chất ma túy còn tồn trữ tại kho lưu mẫu chất ma túy trung gian để đề xuất lấy mẫu theo quy định tại Điều 46 của Nghị định này. Các đơn vị sử dụng khi không còn nhu cầu sử dụng mẫu chất ma túy phải bàn giao lại cho Viện Khoa học hình sự, Bộ Công an."]],["D",46,"Lấy mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Việc lấy mẫu chất ma túy là vật chứng từ các vụ án liên quan đến tội phạm ma túy để truy nguyên nguồn gốc ma túy được thực hiện theo quy trình giám định truy nguyên nguồn gốc ma túy.","2. Hằng năm hoặc khi có nhu cầu bổ sung mẫu chất ma túy phục vụ công tác giám định, huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy và huấn luyện động vật nghiệp vụ, Viện trưởng Viện Khoa học hình sự đề xuất Bộ trưởng Bộ Công an phê duyệt kế hoạch lấy mẫu chất ma túy là sản phẩm từ hoạt động nhập khẩu mẫu chất ma túy và nghiên cứu, sản xuất chất ma túy, tiền chất. Căn cứ kế hoạch dự trù mẫu chất ma túy được phê duyệt, Viện Khoa học hình sự tiến hành chuyển dạng, phân chia, đóng gói mẫu chất ma túy phù hợp với mục đích sử dụng của các đơn vị."]],["D",47,"Quy định về xử lý mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Xử lý mẫu chất ma túy:","a) Định kỳ hằng năm, Viện Khoa học hình sự, Bộ Công an tiến hành kiểm tra, đánh giá chất lượng mẫu chất ma túy còn tồn trữ tại các kho lưu mẫu chất ma túy trung gian và tự kiểm tra, đánh giá chất lượng mẫu chất ma túy còn tồn trữ tại kho lưu trữ mẫu chất ma túy quốc gia.","b) Trường hợp bị nhầm lẫn hoặc thất thoát mẫu chất ma túy, các đơn vị phải báo cáo ngay với cơ quan quản lý cấp trên trực tiếp. Khi nhận được báo cáo, cơ quan quản lý cấp trên trực tiếp phải tiên hành ngay việc thẩm tra, xác minh để có biện pháp xử lý thích hợp và gửi báo cáo về Bộ Công an (qua Viện Khoa học hình sự).","c) Khi mẫu chất ma túy tồn trữ nhiều hoặc bị giảm chất lượng sau khi đã sử dụng hoặc bị biến đổi do thời hạn bảo quản thì Viện trưởng Viện Khoa học hình sự phải có văn bản báo cáo Bộ trưởng Bộ Công an về tình trạng mẫu (ghi rõ tên, số lượng, nồng độ, hàm lượng, lý do và phương pháp xử lý) để xem xét và thành lập Hội đồng tiêu hủy.","d) Hội đồng tiêu hủy mẫu chất ma túy bao gồm: Lãnh đạo Viện Khoa học hình sự là Chủ tịch Hội đồng, thành viên gồm đại diện Viện kiểm sát nhân dân tối cao, Cục Cảnh sát điều tra tội phạm về ma túy, người phụ trách kho lưu trữ mẫu chất ma túy, lãnh đạo đơn vị chức năng về giám định ma túy, Viện Khoa học hình sự là ủy viên thư ký.","đ) Trình tự, thủ tục tiêu hủy mẫu chất ma túy thực hiện theo quy định của pháp luật tố tụng hình sự về tiêu hủy vật chứng và phải lập biên bản, chụp ảnh, lưu hồ sơ theo quy định tại Viện Khoa học hình sự, Bộ Công an.","2. Xử lý chất ma túy:","a) Chất ma túy hình thành trong hoạt động nghiên cứu, hợp tác nghiên cứu, sản xuất, hướng dẫn quy trình và chuyển giao công nghệ trong lực lượng Công an, khi có nhu cầu tiêu hủy, đơn vị chủ trì phối hợp với Cục Cảnh sát điều tra tội phạm về ma túy thành lập Hội đồng tiêu hủy và báo cáo lãnh đạo Bộ.","b) Hội đồng tiêu hủy chất ma túy bao gồm: lãnh đạo đơn vị chủ trì là Chủ tịch hội đồng, thành viên gồm cán bộ phụ trách chuyên môn của cơ quan chủ trì, Cục Cảnh sát điều tra tội phạm về ma túy, Viện Khoa học hình sự, Cục Khoa học, chiến lược và lịch sử Công an và đơn vị, cá nhân có liên quan khác (nếu có). Hội đồng tiêu hủy chất ma túy có nhiệm vụ tổ chức việc tiêu hủy, quyết định phương pháp tiêu hủy và giám sát việc tiêu hủy chất ma túy.","c) Đơn vị chủ trì đảm bảo không xảy ra thất thoát; tuân thủ các quy định của pháp luật về bảo vệ môi trường khi tiến hành tiêu hủy và lập biên bản tiêu hủy, chụp ảnh, lưu giữ hồ sơ theo quy định.","d) Trong thời hạn 03 ngày làm việc kể từ ngày kết thúc việc tiêu hủy chất ma túy, đơn vị chủ trì phải gửi biên bản tiêu hủy Cục Cảnh sát điều tra tội phạm về ma túy, Viện Khoa học hình sự, Cục Khoa học, chiến lược và lịch sử Công an để theo dõi."]],["D",48,"Lập dự trù, hồ sơ, chế độ báo cáo và kinh phí thực hiện việc nhập khẩu, lấy mẫu chất ma túy vì mục đích quốc phòng, an ninh",["1. Định kỳ hằng năm, các đơn vị được quản lý, sử dụng mẫu chất ma túy lập dự trù và gửi đăng ký số lượng mẫu chất ma túy về Viện Khoa học hình sự theo Mẫu số 18 Phụ lục II ban hành kèm theo Nghị đinh này trước ngày 15 tháng 01 để tổng hợp, đối chiếu số lượng tồn trữ và đề xuất Bộ trưởng Bộ Công an phê duyệt kế hoạch dự trù, phân phối mẫu chất ma túy và kế hoạch nhập khẩu, lấy mẫu chất ma túy vì mục đích quốc phòng, an ninh. Báo cáo đột xuất tới cơ quan quản lý trực tiếp trong thời hạn chậm nhất là 48 giờ kể từ khi phát hiện có sự cố hoặc nhầm lẫn, thất thoát các chất ma túy, tiền chất, mẫu chất ma túy hoặc khi có yêu cầu của cơ quan có thẩm quyền.","2. Đơn vị sử dụng mẫu chất ma túy phải mở sổ theo dõi việc sử dụng. Viện Khoa học hình sự mở sổ theo dõi nhập, xuất kho, giao nhận và sử dụng tại đơn vị và thực hiện chế độ báo cáo, thống kê theo quy định của Bộ Công an. Các tài liệu liên quan phải được lưu giữ, quản lý theo quy định.","a) Đối với mẫu chất ma túy phục vụ truy nguyên nguồn gốc phải thực hiện theo đúng quy định về giám định truy nguyên nguồn gốc. Lập biên bản hoặc sổ ghi đầy đủ quá trình sử dụng mẫu có chữ ký xác nhận của người tham gia phân tích mẫu và lãnh đạo quản lý trực tiếp;","b) Các phòng thí nghiệm giám định sử dụng mẫu chuẩn phục vụ giám định phải mở sổ theo dõi quá trình sử dụng mẫu có chữ ký xác nhận của người tham gia phân tích mẫu và lãnh đạo quản lý trực tiếp;","c) Các đơn vị sử dụng mẫu phục vụ huấn luyện nghiệp vụ, đào tạo, huấn luyện động vật nghiệp vụ phải lập biên bản ghi lại tình trạng và các quá trình sử dụng mẫu có chữ ký xác nhận của người trực tiếp sử dụng mẫu và lãnh đạo quản lý trực tiếp.","3. Định kỳ 6 tháng và 01 năm, các đơn vị sử dụng báo cáo tình hình sử dụng mẫu chất ma túy về Viện Khoa học hình sự, Bộ Công an trước ngày 15 tháng 7 và ngày 15 tháng 01 hằng năm theo Mẫu số 19 Phụ lục II ban hành kèm theo Nghị định này.","4. Viện Khoa học hình sự tổng hợp kết quả nhập khẩu, lấy mẫu, phân phối, sử dụng, tiêu hủy và tồn kho mẫu chất ma túy gửi báo cáo Bộ Công an, Viện Kiểm sát nhân dân tối cao và Tòa án nhân dân tối cao.","5. Viện Khoa học hình sự chủ trì phối hợp với Cục Cảnh sát điều tra tội phạm về ma túy và các đơn vị liên quan tập hợp nhu cầu sử dụng mẫu chất ma túy, xây dựng kế hoạch dự trù mẫu chất ma túy vì mục đích quốc phòng, an ninh để báo cáo Bộ trưởng Bộ Công an phê duyệt theo Mẫu số 11 Phụ lục II ban hành kèm theo Nghị định này.","6. Kinh phí thực hiện một số hoạt động liên quan đến ma túy vì mục đích quốc phòng, an ninh tại Bộ Công an, gồm: Kinh phí nghiên cứu, sản xuất, nhập khẩu, xuất khẩu chất ma túy, tiền chất; nhập khẩu, lấy mẫu, giao nhận, bảo quản mẫu chất ma túy; kinh phí xây dựng kho lưu mẫu chất ma túy quốc gia, kho lưu mẫu chất ma túy trung gian. Nguồn kinh phí này được bố trí trong dự toán ngân sách nhà nước hằng năm Bộ Công an giao cho Công an các đơn vị, địa phương và các nguồn kinh phí hợp pháp khác theo quy định của pháp luật.","7. Kinh phí thực hiện các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh tại Bộ Quốc phòng, Bộ Tài chính gồm: Xây dựng kho lưu mẫu chất ma túy trung gian; kinh phí đảm bảo các điều kiện bảo quản mẫu chất ma túy tại Bộ Quốc phòng, Bộ Tài chính. Nguồn kinh phí này được bố trí trong dự toán ngân sách nhà nước hằng năm của Bộ Quốc phòng, Bộ Tài chính và các nguồn kinh phí hợp pháp khác theo quy định của pháp luật."]],["D",49,"Trách nhiệm kiểm tra, giám sát, xử lý vi phạm",["1. Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an chủ trì phối hợp với các đơn vị liên quan theo dõi, kiểm tra, giám sát các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh; xử lý vi phạm theo thẩm quyền hoặc đề xuất cấp có thẩm quyền xử lý vi phạm các tổ chức, cá nhân (nếu có) trong quá trình tiến hành các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh theo quy định tại Nghị định này.","2. Các đơn vị có hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh chấp hành các quy định tại Mục 3 của Nghị định này; các quy định khác của pháp luật có liên quan và chịu sự theo dõi, kiểm tra, giám sát của các cơ quan có thẩm quyền."]],["M","Mục 4","LẬP HỒ SƠ VÀ CHẾ ĐỘ BÁO CÁO CÁC HOẠT ĐỘNG HỢP PHÁP LIÊN QUAN ĐẾN MA TÚY"],["D",50,"Lập hồ sơ",["1. Tổ chức, cá nhân khi tiến hành các hoạt động hợp pháp liên quan đến ma túy quy định tại khoản 1 Điều 13 của Luật Phòng, chống ma túy phải lập hồ sơ theo quy định của cơ quan quản lý chuyên ngành, trong đó phải đảm bảo bao gồm các nội dung sau:","a) Tổ chức, cá nhân có hoạt động nghiên cứu, giám định, sản xuất phải lưu trữ số liệu theo dõi số lượng, chất lượng, thời hạn sử dụng, quy trình sản xuất; số liệu về xuất, nhập, tồn kho; phiếu xuất, nhập kho;","b) Tổ chức, cá nhân có hoạt động mua bán, xuất khẩu, nhập khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập phải lưu trữ số liệu nhập, xuất, tồn kho và hóa đơn, chứng từ, tài liệu có liên quan đối với từng chất ma túy, tiền chất thuộc các Danh mục chất ma túy, tiền chất của Chính phủ.","2. Hồ sơ, chứng từ phải lưu giữ trong thời hạn theo quy định của cơ quan quản lý chuyên ngành. Hết thời hạn lưu giữ sổ sách, chứng từ, thủ trưởng đơn vị có trách nhiệm lập Hội đồng để tiến hành hủy sổ sách, chứng từ đó và phải lập biên bản."]],["D",51,"Chế độ báo cáo",["1. Bộ Công an, Bộ Công Thương, Bộ Y tế, Bộ Nông nghiệp và Môi trường, Bộ Quốc phòng, Ủy ban nhân dân cấp tỉnh chịu trách nhiệm tổng hợp tình hình hoạt động hợp pháp liên quan đến ma túy trong phạm vi, lĩnh vực được phân cấp, phân quyền (số lượng cấp phép, số vụ việc vi phạm, hình thức xử lý và các thông tin khác có liên quan) và thực hiện báo cáo định kỳ 6 tháng và 01 năm gửi Bộ Công an để tổng hợp, báo cáo Thủ tướng Chính phủ.","2. Bộ Tài chính chịu trách nhiệm tổng hợp tình hình nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh lãnh thổ Việt Nam chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc; thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản là tiền chất trên phạm vi toàn quốc (số lượng làm thủ tục hải quan, số vụ việc vi phạm, hình thức xử lý và các thông tin khác có liên quan) và thực hiện báo cáo định kỳ 6 tháng và 01 gửi Bộ Công an để tổng hợp, báo cáo Thủ tướng Chính phủ.","3. Tổ chức, cá nhân trong quá trình tiến hành các hoạt động hợp pháp liên quan đến ma túy đều phải thực hiện các báo cáo sau:","a) Báo cáo đột xuất tới cơ quan quản lý trực tiếp trong thời hạn chậm nhất là 24 giờ kể từ khi phát hiện có sự cố hoặc nhầm lẫn, thất thoát các chất ma túy, tiền chất hoặc khi có yêu cầu của cơ quan có thẩm quyền.","b) Báo cáo thường xuyên qua phần mềm cơ sở dữ liệu của Bộ Công an quy định tại điểm a khoản 3 Điều 53 của Nghị định này. Các tổ chức, cá nhân được Bộ Công an cấp tài khoản và mật khẩu riêng để truy cập và thực hiện khai báo, cập nhật thông tin về các hoạt động hợp pháp liên quan đến các chất ma túy, tiền chất trong thời hạn 07 ngày làm việc kể từ khi có nội dung phát sinh. Trường hợp không thực hiện hoặc thực hiện không đầy đủ thì bị xử lý theo quy định pháp luật."]],["D",52,"Lập dự trù",["1. Tổ chức lần đầu tiên thực hiện hoạt động nhập khẩu, xuất khẩu hoặc khi có sự thay đổi về nhu cầu nhập khẩu, xuất khẩu (so với năm liền trước) chất ma túy, tiền chất thuộc danh mục phải dự trù theo quy định của các Công ước quốc tế về kiểm soát ma túy, gửi đăng ký dự trù nhu cầu về cơ quan có thẩm quyền thuộc Bộ quản lý chuyên ngành.","2. Bộ Y tế, Bộ Công Thương, Bộ Quốc phòng, Bộ Nông nghiệp và Môi trường tổng hợp dự trù nhu cầu nhập khẩu, xuất khẩu chất ma túy, tiền chất quy định tại khoản 1 của Điều này theo mẫu dự trù của Ủy ban kiểm soát ma túy quốc tế Liên hợp quốc và gửi Bộ Công an trước ngày 31 tháng 3 hằng năm. Trường hợp nhu cầu vượt quá dự trù hoặc có thay đổi khác, các bộ thông báo bằng văn bản về Bộ Công an để thực hiện đăng ký bổ sung trước ngày 31 tháng 5 và trước ngày 30 tháng 9 của năm đăng ký.","3. Bộ Công an tổng hợp, rà soát, đối chiếu nhu cầu và kết quả nhập khẩu, xuất khẩu của năm trước, thực hiện việc đăng ký nhu cầu với Ủy ban kiểm soát ma túy quốc tế Liên hợp quốc và theo dõi, thực hiện thông báo tiền xuất khẩu với các nước theo quy định; đồng thời gửi Bộ Tài chính để phối hợp theo dõi."]],["M","Mục 5","PHỐI HỢP KIỀM SOÁT CÁC HOẠT ĐỘNG HỢP PHÁP LIÊN QUAN ĐẾN MA TÚY"],["D",53,"Nội dung và cơ chế phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy",["1. Phối hợp kiểm soát các hoạt động nghiên cứu, kiểm nghiệm, kiểm định, sản xuất, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất.","a) Bộ Công an chủ trì, phối hợp với các đơn vị, địa phương tiến hành theo dõi, kiểm tra, giám sát hoạt động nghiên cứu, sản xuất, vận chuyển chất ma túy, tiền chất theo quy định;","b) Bộ Công Thương, Bộ Y tế, Bộ Nông nghiệp và Môi trường, Bộ Tài chính và Bộ Quốc phòng trong phạm vi chức năng, nhiệm vụ và quyền hạn được giao có trách nhiệm chủ trì, phối hợp với Bộ Công an hướng dẫn, kiểm tra cơ quan chức năng của các địa phương tiến hành kiểm soát hoạt động bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc; thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất của các tổ chức có hoạt động sản xuất, nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập;","c) Ủy ban nhân dân cấp tỉnh trong phạm vi chức năng, nhiệm vụ và quyền hạn được giao có trách nhiệm chỉ đạo các cơ quan chức năng phối hợp thực hiện kiểm soát các hoạt động xuất khẩu, nhập khẩu, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất của các tổ chức, cá nhân có hoạt động hợp pháp liên quan đến ma túy trên địa bàn quản lý.","2. Phối hợp kiểm soát các hoạt động nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất.","a) Phối hợp kiểm soát trong thông báo tiền xuất khẩu đối với hoạt động nhập khẩu các tiền chất từ nước ngoài vào Việt Nam (áp dụng đối với hoạt động nhập khẩu từ các nước tham gia Điều 12 Công ước năm 1988 của Liên hợp quốc về chống buôn bán bất hợp pháp các chất ma túy và các chất hướng thần):","Trên cơ sở giấy phép nhập khẩu do các cơ quan có thẩm quyền cấp phép cấp gửi đến Bộ Công an hoặc thông tin giấy phép nhập khẩu trên dịch vụ công, trong thời hạn chậm nhất là 02 ngày làm việc, kể từ ngày nhận được thông báo của nước xuất khẩu, Bộ Công an có trách nhiệm trả lời nước xuất khẩu về tính hợp pháp của lô hàng.","Trong trường hợp Bộ Công an không nhận được giấy phép nhập khẩu đối với lô hàng được thông báo, Bộ Công an có trách nhiệm đề nghị nước xuất khẩu tạm dừng việc xuất khẩu lô hàng sang Việt Nam và gửi Bộ Tài chính để theo dõi;","b) Phối hợp kiểm soát trong thông báo tiền xuất khẩu đối với hoạt động xuất khẩu tiền chất từ Việt Nam ra nước ngoài (áp dụng đối với hoạt động xuất khẩu sang các nước tham gia Điều 12 Công ước năm 1988 của Liên hợp quốc về chống buôn bán bất hợp pháp các chất ma túy và các chất hướng thần), bao gồm cả dạng đơn chất và dạng phối hợp;","Trong thời hạn chậm nhất là 03 ngày làm việc, kể từ ngày nhận được đơn và hồ sơ đề nghị cấp giấy phép xuất khẩu hợp lệ, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi Bộ Công an những thông tin về tên, địa chỉ tổ chức đề nghị cấp phép xuất khẩu; tên gọi, hàm lượng, khối lượng tiền chất; phiếu an toàn hóa chất; tên, địa chỉ tổ chức nhập khẩu; tên cửa khẩu có hàng xuất khẩu đi qua để ra thông báo tiền xuất khẩu đối với lô hàng cho cơ quan chức năng của nước nhập khẩu.","Trong thời hạn chậm nhất là 02 ngày làm việc, kể từ ngày nhận được thông tin của cơ quan có thẩm quyền cấp phép, Bộ Công an có trách nhiệm thực hiện thông báo tiền xuất khẩu đối với lô hàng đề nghị cấp giấy phép xuất khẩu.","Trong thời hạn chậm nhất là 02 ngày làm việc, kể từ ngày nhận được ý kiến phản hồi của cơ quan chức năng nước nhập khẩu, Bộ Công an có trách nhiệm trả lời cơ quan cấp phép để quyết định cấp giấy phép hoặc không cấp giấy phép theo thẩm quyền và gửi Bộ Tài chính để theo dõi;","c) Phối hợp kiểm soát hoạt động nhập khẩu chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc; thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản, nguyên liệu làm thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản là chất ma túy, tiền chất từ nước ngoài vào Việt Nam;","Trên cơ sở báo cáo của Bộ Tài chính về số lượng nhập khẩu thực tế đối với các chất ma túy, tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc theo quy định tại khoản 2 Điều 51 của Nghị định này, Bộ Công an chủ trì, phối hợp với Bộ Công Thương, Bộ Y tế, Bộ Nông nghiệp và Môi trường, Bộ Quốc phòng tổ chức đánh giá kết quả nhập khẩu của năm và nhu cầu nhập khẩu các chất ma túy, tiền chất của năm tiếp theo để đăng ký dự trù với Ủy ban kiểm soát ma túy quốc tế Liên hợp quốc theo quy định.","d) Phối hợp kiểm soát hoạt động tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy, tiền chất.","Trong thời hạn chậm nhất là 03 ngày làm việc, kể từ ngày nhận được hồ sơ đề nghị cấp giấy phép tạm nhập, tái xuất, tạm xuất, tái nhập đối với chất ma túy, tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi Bộ Công an các thông tin về tên, địa chỉ doanh nghiệp đề nghị cấp phép; tên gọi, số lượng, hàm lượng chất ma túy, tiền chất; tên, địa chỉ tổ chức nhập khẩu, xuất khẩu; thời gian và tên cửa khẩu có hàng tạm nhập, tái xuất, tạm xuất, tái nhập đi qua để thực hiện thông báo tiền xuất khẩu;","Trong thời hạn chậm nhất là 02 ngày làm việc, kể từ ngày nhận được thông tin yêu cầu của cơ quan có thẩm quyền cấp phép, Bộ Công an có trách nhiệm thực hiện thông báo tiền xuất khẩu đối với lô hàng xin cấp giấy phép;","Trong thời hạn chậm nhất là 02 ngày làm việc, kể từ ngày nhận được ý kiến phản hồi của nước nhập khẩu, Bộ Công an có trách nhiệm trả lời cơ quan cấp phép để quyết định cấp giấy phép hoặc không cấp giấy phép tạm nhập, tái xuất, tạm xuất, tái nhập theo thẩm quyền và gửi Bộ Tài chính để theo dõi;","3. Phối hợp trao đổi thông tin về kiểm soát các hoạt động hợp pháp liên quan đến ma túy:","a) Bộ Công an là cơ quan đầu mối trao đổi thông tin về kiểm soát các hoạt động hợp pháp liên quan đến ma túy với các Bộ, ngành, địa phương, các nước liên quan và Ủy ban Kiểm soát ma túy quốc tế Liên hợp quốc qua Hệ thống cơ sở dữ liệu kiểm soát các hoạt động hợp pháp liên quan đến ma túy (sau đây gọi tắt là Hệ thống cơ sở dữ liệu) đặt tại Bộ Công an.","Hệ thống cơ sở dữ liệu do cơ quan chức năng thuộc Bộ Công an trực tiếp quản lý, vận hành, khai thác, xử lý và trao đổi thông tin với Bộ Công Thương, Bộ Nông nghiệp và Môi trường, Bộ Y tế, Bộ Tài chính, Bộ Quốc phòng, Ủy ban nhân dân cấp tỉnh và các tổ chức, cá nhân có hoạt động hợp pháp liên quan đến ma túy qua phần mềm cơ sở dữ liệu.","b) Bộ Công an có trách nhiệm thông báo cho các Bộ, ngành và các địa phương liên quan thông tin về phương thức, thủ đoạn hoạt động của tội phạm và những thông tin khác có liên quan trong quá trình kiểm soát các hoạt động hợp pháp liên quan đến ma túy để các Bộ, ngành và địa phương có biện pháp chủ động ngăn chặn, phòng ngừa hiệu quả;","c) Bộ Công thương, Bộ Nông nghiệp và Môi trường, Bộ Y tế, Bộ Tài chính, Bộ Quốc phòng và Ủy ban nhân dân cấp tỉnh có tài khoản và mật khẩu riêng do Bộ Công an cung cấp để truy cập và sử dụng phần mềm cơ sở dữ liệu trong phạm vi chức năng, nhiệm vụ và quyền hạn được giao:","Cập nhật thông tin về kiểm soát các hoạt động hợp pháp liên quan đến ma túy và kết quả xử lý vi phạm hành chính trong lĩnh vực được phân công cho Hệ thống cơ sở dữ liệu. Trong thời hạn 05 ngày làm việc, Cơ quan ra quyết định xử phạt hành chính gửi văn bản đến Bộ Công an, Công an cấp tỉnh và cập nhật phần mềm dữ liệu.","Kịp thời trao đổi thông tin với Bộ Công an để có biện pháp phối hợp phòng ngừa, ngăn chặn, xử lý hành vi vi phạm khi nhận được nguồn tin, tài liệu hoặc phát hiện những sai phạm trong công tác kiểm soát các hoạt động hợp pháp liên quan đến ma túy; cung cấp cổng kết nối chia sẻ các thông tin về hồ sơ cấp phép các hoạt động hợp pháp liên quan đến ma túy trong lĩnh vực công nghiệp.","Trong trường hợp được đề nghị phối hợp cung cấp thông tin, tài liệu để phục vụ công tác kiểm soát các hoạt động hợp pháp liên quan đến ma túy không thuộc phạm vi phần mềm cơ sở dữ liệu, các cơ quan có trách nhiệm thực hiện và thông báo cho cơ quan đề nghị. Nếu từ chối cung cấp thông tin, tài liệu cơ quan được đề nghị phải trả lời bằng văn bản và nêu rõ lý do.","d) Bộ Tài chính đảm bảo kết nối dữ liệu và vận hành của Hệ thống cơ sở dữ liệu với Cổng thông tin một cửa quốc gia để Bộ Công an truy cập, khai thác thông tin giấy phép xuất khẩu, nhập khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập đã được cấp; thông tin các lô hàng chất ma túy, tiền chất, chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất được thông quan.","4. Phối hợp theo dõi, kiểm tra, giám sát các hoạt động hợp pháp liên quan đến ma túy:","a) Bộ Công an chịu trách nhiệm chủ trì, phối hợp với Bộ Công Thương, Bộ Nông nghiệp và Môi trường, Bộ Y tế, Bộ Tài chính, Bộ Quốc phòng hướng dẫn, theo dõi, kiểm tra, giám sát các tổ chức, cá nhân và địa phương thực hiện các văn bản quy phạm pháp luật về kiểm soát các hoạt động hợp pháp liên quan đến ma túy nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó nhằm mục đích bất hợp pháp;","b) Các Bộ trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm tổ chức thực hiện nhiệm vụ được giao và thanh tra, kiểm tra việc thực hiện các quy định về kiểm soát các hoạt động hợp pháp liên quan đến ma túy của các tổ chức, cá nhân xử lý các hành vi vi phạm theo quy định của pháp luật theo thẩm quyền, chuyển Bộ Công an điều tra, xử lý những vụ vi phạm có dấu hiệu hình sự;","c) Ủy ban nhân dân cấp tỉnh trong phạm vi chức năng, nhiệm vụ và quyền hạn được giao có trách nhiệm chỉ đạo các cơ quan chức năng hướng dẫn, kiểm tra, giám sát các tổ chức, cá nhân thực hiện các quy định về kiểm soát các hoạt động hợp pháp liên quan đến ma túy nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó nhằm mục đích bất hợp pháp. Phát hiện, xử lý các hành vi vi phạm theo quy định của pháp luật theo thẩm quyền, chuyển Công an cấp tỉnh điều tra, xử lý những vụ vi phạm có dấu hiệu hình sự."]],["D",54,"Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy các cấp",["1. Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp trung ương.","a) Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp trung ương do Bộ Công an thành lập, quyết định ban hành quy chế và chỉ đạo hoạt động của Tổ;","b) Nhiệm vụ của Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp trung ương: Tổ chức tuyên truyền, hướng dẫn, tập huấn, đôn đốc, theo dõi, kiểm tra, giám sát các tổ chức, cá nhân , cá nhân, địa phương thực hiện các văn bản quy phạm pháp luật về kiểm soát các hoạt động hợp pháp liên quan đến ma túy nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó nhằm mục đích bất hợp pháp. Phát hiện, ngăn chặn và kiến nghị các cấp có thẩm quyền xử lý các hành vi vi phạm theo quy định của pháp luật.","2. Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp tỉnh.","a) Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp tỉnh do Ủy ban nhân dân cấp tỉnh thành lập và quyết định ban hành quy chế, chỉ đạo hoạt động;","b) Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp tỉnh có nhiệm vụ: Tổ chức tuyên truyền, hướng dẫn, tập huấn, theo dõi, kiểm tra, giám sát các tổ chức, cá nhân trên địa bàn các tỉnh, thành phố thực hiện các văn bản quy phạm pháp luật về kiểm soát các hoạt động hợp pháp liên quan đến ma túy nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó vào mục đích bất hợp pháp. Phát hiện, ngăn chặn và kiến nghị các cấp có thẩm quyền xử lý các hành vi vi phạm theo quy định của pháp luật."]],["C","Chương V","QUẢN LÝ NGƯỜI SỬ DỤNG TRÁI PHÉP CHẤT MA TÚY"],["D",55,"Đối tượng bị áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy",["Người có hành vi sử dụng trái phép chất ma túy mà không bị xử lý hình sự và không thuộc các trường hợp quy định tại khoản 5 Điều 24 của Luật Phòng, chống ma túy."]],["D",56,"Thực hiện xét nghiệm chất ma túy trong cơ thể",["1. Việc xét nghiệm chất ma túy trong cơ thể được thực hiện với những người quy định tại khoản 1 Điều 23 Luật Phòng, chống ma túy. Đối với trường hợp quy định tại điểm b khoản 1 Điều 23 Luật Phòng, chống ma túy được thực hiện khi có một trong các căn cứ sau đây:","a) Tin báo, tố giác của cá nhân, cơ quan, tổ chức đã được cơ quan có thẩm quyền tiến hành xác minh, làm rõ;","b) Thông tin, tài liệu trong các vụ vi phạm pháp luật;","c) Người có biểu hiện mất năng lực nhận thức hoặc kiểm soát hành vi nghi do sử dụng ma túy;","d) Trên người, phương tiện, nơi ở của người đó có dấu vết của chất ma túy hoặc dụng cụ, phương tiện sử dụng trái phép chất ma túy;","đ) Người điều khiển phương tiện có biểu hiện sử dụng chất kích thích nghi là ma túy;","e) Người có mặt tại các địa điểm có hành vi tổ chức, chứa chấp hoặc sử dụng trái phép chất ma túy nhưng không có lý do chính đáng.","g) Người tự khai báo hành vi sử dụng trái phép chất ma túy;","h) Người bị phát hiện quả tang sử dụng trái phép chất ma túy;","i) Những căn cứ khác theo quy định của pháp luật.","2. Cơ quan, người có thẩm quyền xét nghiệm chất ma túy trong cơ thể quy định tại khoản 2 Điều 23 của Luật Phòng, chống ma túy tiến hành xét nghiệm. Kết quả xét nghiệm chất ma túy trong cơ thể thực hiện theo Mẫu số 01 tại Phụ lục III ban hành kèm theo Nghị định này.","3. Công an cấp xã nơi quản lý người sử dụng trái phép chất ma túy thực hiện hoặc đề nghị cơ quan, người có chuyên môn thực hiện việc xét nghiệm chất ma túy trong cơ thể của người sử dụng trái phép chất ma túy trong thời hạn quản lý.","4. Hình thức lấy mẫu xét nghiệm chất ma túy trong cơ thể là lấy máu, lấy nước tiểu hoặc lấy các mẫu vật khác trên cơ thể.","5. Nơi lấy mẫu nước tiểu phải có buồng riêng cho nam giới, nữ giới. Việc lấy mẫu nước tiểu phải có cán bộ cùng giới giám sát.","6. Trường hợp lấy mẫu xét nghiệm người dưới 18 tuổi phải có sự chứng kiến của cha, mẹ hoặc người giám hộ hoặc người đại diện hợp pháp, trừ trường hợp lấy mẫu nước tiểu."]],["D",57,"Thu thập thông tin, tài liệu về người sử dụng trái phép chất ma túy",["1. Khi có kết quả xét nghiệm quy định tại khoản 2 Điều 56 Nghị định này là dương tính thì cơ quan Công an nơi phát hiện người sử dụng trái phép chất ma túy có trách nhiệm:","a) Thực hiện xác minh nơi cư trú của người sử dụng trái phép chất ma túy theo quy định tại Điều 58 của Nghị định này;","b) Gửi thông báo về hành vi sử dụng trái phép chất ma túy theo Mẫu số 02 tại Phụ lục III ban hành kèm theo Nghị định này cho Trưởng Công an cấp xã quy định tại khoản 5, khoản 6 Điều 58 của Nghị định này để tổ chức quản lý người sử dụng trái phép chất ma túy và lập Hồ sơ quản lý người sử dụng trái phép chất ma túy.","2. Thông báo về hành vi sử dụng trái phép chất ma túy theo Mẫu số 02 tại Phụ lục III ban hành kèm theo Nghị định này được gửi kèm các tài liệu sau đây:","a) Phiếu kết quả xét nghiệm chất ma túy trong cơ thể theo Mẫu số 01 tại Phụ lục III ban hành kèm theo Nghị định này;","b) Tài liệu, biên bản về hành vi sử dụng trái phép chất ma túy; tài liệu về những lần sử dụng trái phép chất ma túy trước đây hoặc cai nghiện của người vi phạm (nếu có);","c) Bản tường trình của người sử dụng trái phép chất ma túy theo Mẫu số 03 tại Phụ lục III ban hành kèm theo Nghị định."]],["D",58,"Xác minh nơi cư trú và gửi thông báo",["1. Trong thời hạn 24 giờ, kể từ khi có kết quả xét nghiệm dương tính với chất ma túy, cơ quan Công an trực tiếp phát hiện hành vi sử dụng trái phép chất ma túy có trách nhiệm xác minh nơi cư trú của người sử dụng trái phép chất ma túy.","Đối với các địa bàn là vùng miền núi, hải đảo, vùng xa xôi, hẻo lánh mà việc đi lại gặp khó khăn thì thời hạn xác minh nơi cư trú có thể kéo dài hơn nhưng không được quá 48 giờ, kể từ khi phát hiện người có hành vi sử dụng trái phép chất ma túy.","2. Tiêu chí xác định người có nơi cư trú ổn định:","a) Người có nơi cư trú ổn định là người hiện đang sinh sống tại nơi đăng ký thường trú hoặc tạm trú;","b) Trường hợp không xác định được nơi đăng ký thường trú, tạm trú thì nơi cư trú ổn định là nơi ở hiện tại theo quy định tại khoản 1 Điều 19 của Luật Cư trú và thời gian thường xuyên sinh sống từ 30 ngày trở lên, có xác nhận của Trưởng Công an cấp xã.","3. Tiêu chí xác định người không có nơi cư trú ổn định:","a) Người có đăng ký thường trú hoặc tạm trú nhưng không sinh sống tại nơi đăng ký thường trú hoặc tạm trú, có xác nhận của Trưởng Công an cấp xã nơi đăng ký thường trú hoặc tạm trú về việc người đó không sinh sống ở nơi đăng ký thường trú hoặc tạm trú và không biết người đó đang ở đâu;","b) Thành viên gia đình theo quy định của pháp luật về hôn nhân và gia đình cung cấp thông tin cho cơ quan chức năng không biết người đó hiện nay đang ở đâu, làm gì và cơ quan Công an tra cứu dữ liệu trong Cơ sở dữ liệu quốc gia về dân cư, Cơ sở dữ liệu về cư trú, hệ thống tàng thư hồ sơ cư trú, tàng thư căn cước công dân cũng không xác định được người đó đang ở đâu;","c) Người không có cả nơi thường trú, tạm trú và thời gian sinh sống ở nơi ở hiện tại dưới 30 ngày.","4. Việc xác minh nơi cư trú và trả lời xác minh về cư trú thực hiện theo quy định của pháp luật về cư trú và hướng dẫn của Bộ Công an.","5. Trường hợp người có hành vi sử dụng trái phép chất ma túy có nơi cư trú ổn định, trong thời hạn 24 giờ, kể từ khi có kết quả xác minh nơi cư trú, cơ quan Công an trực tiếp phát hiện hành vi sử dụng trái phép chất ma túy gửi thông báo về hành vi sử dụng trái phép chất ma túy theo Mẫu số 02 tại Phụ lục III ban hành kèm theo Nghị định này và các tài liệu liên quan cho Trưởng Công an dân cấp xã nơi người sử dụng trái phép chất ma túy cư trú ổn định.","6. Trường hợp người có hành vi sử dụng trái phép chất ma túy không có nơi cư trú ổn định, trong thời hạn 24 giờ, kể từ khi có kết quả xác minh nơi cư trú, cơ quan Công an trực tiếp phát hiện hành vi sử dụng trái phép chất ma túy gửi thông báo về hành vi sử dụng trái phép chất ma túy theo Mẫu số 02 tại Phụ lục III ban hành kèm theo Nghị định này và các tài liệu liên quan cho Trưởng Công an cấp xã nơi phát hiện hành vi sử dụng trái phép chất ma túy và Trưởng Công an cấp xã nơi người đó có đăng ký thường trú (nếu có)."]],["D",59,"Quyết định áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy và hồ sơ quản lý",["1. Trong thời hạn 24 giờ, kể từ khi nhận được thông báo về hành vi sử dụng trái phép chất ma túy, nếu người sử dụng trái phép chất ma túy thuộc trường hợp quy định tại Điều 55 của Nghị định này thì Trưởng Công an cấp xã có thẩm quyền quản lý quy định tại khoản 4, khoản 6 Điều 24 của Luật Phòng, chống ma túy ra quyết định và tổ chức quản lý người sử dụng trái phép chất ma túy.","Trường hợp người sử dụng trái phép chất ma túy đang trong thời hạn quản lý mà tiếp tục sử dụng trái phép chất ma túy, nếu không thuộc các trường hợp quy định tại khoản 5 Điều 24 của Luật Phòng, chống ma túy thì trong thời hạn 24 giờ, kể từ khi phát hiện hoặc nhận được thông báo về hành vi sử dụng trái phép chất ma túy, Trưởng Công an cấp xã nơi đang quản lý ra Quyết định quản lý mới.","2. Quyết định áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy thực hiện theo Mẫu số 04 tại Phụ lục III ban hành kèm theo Nghị định này, trong đó nêu rõ:","a) Tóm tắt hành vi sử dụng trái phép chất ma túy; kết quả xét nghiệm dương tính với chất ma túy trong cơ thể; kết quả xác định tình trạng nghiện là không nghiện (nếu có);","b) Phân công cán bộ công an cấp xã thực hiện quản lý cư trú; triệu tập; xét nghiệm chất ma túy trong cơ thể; phòng ngừa, ngăn chặn hành vi gây mất an ninh, trật tự của người sử dụng trái phép chất ma túy;","c) Phân công Tổ quản lý người sử dụng trái phép chất ma túy do cán bộ Công an cấp xã làm Tổ trưởng chịu trách nhiệm chung; đại diện thôn/bản/tổ dân phố làm Tổ phó thực hiện động viên, giáo dục; đại diện gia đình của người sử dụng trái phép chất ma túy hoặc người uy tín trong dòng họ hỗ trợ về tinh thần, đại diện tổ chức chính trị - xã hội (căn cứ vào nhân thân của người sử dụng trái phép chất ma túy) và nhân viên công tác xã hội (nếu có) tư vấn tâm lý, việc làm cho người bị quản lý.","3. Quyết định áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy được lưu tại hồ sơ quản lý, gửi cho người bị quản lý, các thành viên Tổ quản lý, Ủy ban nhân dân cấp xã nơi quản lý.","4. Hồ sơ quản lý người sử dụng trái phép chất ma túy bao gồm các tài liệu sau đây:","a) Quyết định áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy theo Mẫu số 04 tại Phụ lục III ban hành kèm theo Nghị định này;","b) Bản tóm tắt lý lịch người sử dụng trái phép chất ma túy theo Mẫu số 05 tại Phụ lục III ban hành kèm theo Nghị định này; kết quả xác minh nơi cư trú của người sử dụng trái phép chất ma túy;","c) Phiếu kết quả xét nghiệm chất ma túy trong cơ thể theo Mẫu số 01 tại Phụ lục III ban hành kèm theo Nghị định này; tài liệu, biên bản về hành vi sử dụng trái phép chất ma túy;","d) Tài liệu về những lần sử dụng trái phép chất ma túy trước đây hoặc cai nghiện (nếu có);","đ) Bản tường trình của người sử dụng trái phép chất ma túy theo Mẫu số 03 tại Phụ lục III ban hành kèm theo Nghị định này;","e) Kết quả xác định tình trạng nghiện (nếu có);","g) Các tài liệu khác thể hiện hoạt động quản lý người sử dụng trái phép chất ma túy trong thời gian quản lý."]],["D",60,"Cách tính thời hạn quản lý trong một số trường hợp",["1. Trường hợp người bị quản lý chuyển nơi cư trú thì thời hạn quản lý được tính tiếp từ khi có Quyết định áp dụng biện pháp quản lý người sử dụng trái phép chất ma túy mới của Trưởng Công an cấp xã nơi cư trú mới đến hết thời gian quản lý còn lại.","2. Trường hợp người sử dụng trái phép chất ma túy vắng mặt khỏi đơn vị hành chính cấp xã nơi đang quản lý mà vi phạm quy định về quản lý cư trú dẫn đến không xác định được nơi đến thì thời gian vắng mặt không được tính vào thời hạn quản lý."]],["D",61,"Nội dung quản lý",["1. Trong thời gian quản lý người sử dụng trái phép chất ma túy, Công an cấp xã chủ trì, cùng Tổ quản lý người sử dụng trái phép chất ma túy thực hiện những nội dung sau:","a) Công an cấp xã nơi quản lý người sử dụng trái phép chất ma túy kiểm tra tình hình cư trú của người đang trong thời hạn quản lý ít nhất 01 lần mỗi tháng;","b) Công an cấp xã tổ chức xét nghiệm chất ma túy trong cơ thể của người sử dụng trái phép chất ma túy đang trong thời hạn quản lý khi có các căn cứ tại khoản 1 Điều 56 của Nghị định này hoặc đột xuất theo kế hoạch chuyên đề;","c) Công an cấp xã phối hợp đại diện tổ chức chính trị - xã hội, gia đình người sử dụng trái phép chất ma túy thực hiện tư vấn về tâm lý, thay đổi thái độ của người sử dụng trái phép chất ma túy để họ có thái độ tích cực, chủ động tránh xa ma túy;","d) Công an cấp xã và các thành viên Tổ quản lý người sử dụng trái phép chất ma túy giáo dục về pháp luật phòng, chống ma túy, tác hại của ma túy, các nội dung khác tùy theo đặc điểm nhân thân;","đ) Đại diện thôn/bản/tổ dân phố, gia đình động viên, giúp đỡ để người sử dụng trái phép chất ma túy tham gia các hoạt động cộng đồng, hoạt động tự quản, hoạt động thể dục, thể thao nâng cao sức khỏe, kỹ năng sống, phòng ngừa các hành vi vi phạm pháp luật.","e) Nhân viên công tác xã hội (nếu có) tư vấn, giới thiệu việc làm cho người sử dụng trái phép chất ma túy trong thời gian quản lý.","2. Đối với người sử dụng trái phép chất ma túy dưới 18 tuổi thì ngoài việc tư vấn, động viên, giáo dục, giúp đỡ người sử dụng trái phép chất ma túy phải có sự tham gia của giáo viên nơi người đó đang học hoặc đội thiếu niên tiền phong, đoàn thanh niên."]],["D",62,"Quản lý người sử dụng trái phép chất ma túy trong trường hợp chuyển đi khỏi nơi cư trú",["1. Khi người sử dụng trái phép chất ma túy thay đổi nơi cư trú thì Công an cấp xã nơi chuyển đến phối hợp với Công an cấp xã chuyển đi để kiểm tra, xác minh thông tin.","Trong thời hạn 24 giờ, kể từ ngày người đó chuyển đến nơi cư trú mới, Trưởng Công an cấp xã nơi chuyển đi thông báo và chuyển hồ sơ quản lý người sử dụng trái phép chất ma túy theo Mẫu số 06 tại Phụ lục III ban hành kèm theo Nghị định này cho Công an cấp xã nơi người sử dụng trái phép chất ma túy chuyển đến tiếp tục quản lý.","2. Trưởng Công an cấp xã nơi chuyển đến ra Quyết định quản lý mới phân công cán bộ Công an cấp xã thực hiện quản lý và Tổ quản lý theo Mẫu số 04 tại Phụ lục III ban hành kèm theo Nghị định này.","3. Công an cấp xã có trách nhiệm thường xuyên cập nhật nơi cư trú của người sử dụng trái phép chất ma túy vào Cơ sở dữ liệu về cư trú, Cơ sở dữ liệu quốc gia về dân cư."]],["D",63,"Tạm đình chỉ, dừng, chấm dứt quản lý người sử dụng trái phép chất ma túy",["1. Trưởng Công an cấp xã nơi đang quản lý ra Quyết định tạm đình chỉ quản lý đối với người sử dụng trái phép chất ma túy bị tạm giữ, tạm giam theo quy định của Bộ luật Tố tụng hình sự theo Mẫu số 07 tại Phụ lục III ban hành kèm theo Nghị định này.","2. Trưởng Công an cấp xã nơi đang quản lý ra Quyết định dừng quản lý người sử dụng trái phép chất ma túy đối với các trường hợp quy định tại khoản 5 Điều 24 của Luật Phòng, chống ma túy theo Mẫu số 08 tại Phụ lục III ban hành kèm theo Nghị định này.","3. Trưởng Công an cấp xã nơi quản lý ra Quyết định chấm dứt quản lý người sử dụng trái phép chất ma túy trong trường hợp hết thời hạn quản lý mà không phát hiện người bị quản lý có hành vi sử dụng trái phép chất ma túy theo Mẫu số 09 tại Phụ lục III ban hành kèm theo Nghị định này.","4. Trong thời hạn 24 giờ, kể từ khi ra một trong các Quyết định theo quy định tại Điều này, Trưởng Công an cấp xã gửi Quyết định cho cơ quan, tổ chức, cá nhân quy định tại khoản 3 Điều 59 của Nghị định này."]],["D",64,"Công tác quản lý và lưu trữ hồ sơ, danh sách quản lý người sử dụng trái phép chất ma túy",["1. Công an cấp xã nơi ra Quyết định quản lý người sử dụng trái phép chất ma túy chịu trách nhiệm quản lý, lưu trữ hồ sơ của người sử dụng trái phép chất ma túy theo quy định của Bộ Công an.","2. Danh sách người sử dụng trái phép chất ma túy phải được cập nhật, bổ sung thường xuyên theo Mẫu số 10 tại Phụ lục III ban hành kèm theo Nghị định này."]],["D",65,"Kinh phí cho việc thực hiện biện pháp quản lý người sử dụng trái phép chất ma túy",["1. Kinh phí cho việc tổ chức xét nghiệm chất ma túy trong cơ thể theo quy định tại khoản 2 Điều 56 của Nghị định này gồm:","a) Chi phí công cụ xét nghiệm chất ma túy trong cơ thể;","b) Chi phí đưa người bị xét nghiệm chất ma túy trong cơ thể tới nơi thực hiện xét nghiệm;","c) Chi phí trả cho cơ quan chuyên môn thực hiện xét nghiệm chất ma túy trong cơ thể (nếu có).","2. Kinh phí cho việc xác định tình trạng nghiện đối với trường hợp quy định tại điểm c, đ khoản 1 Điều 31 Luật Phòng, chống ma túy gồm:","a) Chi phí đưa người được xác định tình trạng nghiện đến địa điểm xác định tình trạng nghiện;","b) Chi phí trả cơ sở y tế đủ điều kiện tiến hành xác định tình trạng nghiện.","3. Kinh phí trong quá trình quản lý người sử dụng trái phép chất ma túy gồm:","a) Chi phí đưa người sử dụng trái phép chất ma túy và hồ sơ liên quan về Công an cấp xã có thẩm quyền quản lý;","b) Chi phí hỗ trợ cho người không thuộc trường hợp hưởng lương từ ngân sách nhưng được phân công trực tiếp giúp đỡ người đang trong thời hạn quản lý quy định tại điểm c khoản 2 Điều 59 của Nghị định này;","c) Chi phí cho việc thực hiện các nội dung quản lý người sử dụng trái phép chất ma túy quy định tại Điều 61 của Nghị định này.","4. Kinh phí thực hiện các nội dung tại Điều này do ngân sách Nhà nước đảm bảo theo phân cấp của Luật Ngân sách nhà nước. Nội dung chi, mức chi đảm bảo không trùng lặp với các quy định hiện hành và các khoản kinh phí đã được ngân sách nhà nước bảo đảm.","5. Mức hỗ trợ người được phân công giúp đỡ quy định tại điểm b khoản 3 Điều này do Hội đồng nhân dân cấp tỉnh quyết định nhưng không thấp hơn 25% mức lương cơ sở."]],["C","Chương VI","CAI NGHIỆN MA TÚY"],["M","Mục 1","CƠ SỞ VẬT CHẤT, TRANG THIẾT BỊ, HOẠT ĐỘNG Y TẾ CỦA CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP, TRƯỜNG GIÁO DƯỠNG"],["D",66,"Điều kiện cơ sở vật chất, trang thiết bị của cơ sở cai nghiện ma túy công lập",["1. Cách tính diện tích đất cho cơ sở cai nghiện ma túy công lập dựa theo tiêu chuẩn đối với 01 người cai nghiện ma túy như sau:","a) Tối thiểu 80m2 ở khu vực thành thị;","b) Tối thiểu 100m2 ở khu vực nông thôn;","c) Tối thiểu 120m2 ở khu vực miền núi.","2. Cơ sở cai nghiện ma túy công lập phải bố trí các khu sau:","a) Khu hành chính, quản trị;","b) Khu thăm gặp, tiếp nhận;","c) Khu y tế và điều trị cắt cơn;","d) Khu quản lý người cai nghiện ma túy;","đ) Khu dạy văn hóa;","e) Khu giáo dục nghề nghiệp.","3. Thiết bị, công cụ hỗ trợ, phương tiện của cơ sở cai nghiện ma túy công lập gồm:","a) Thiết bị thực hiện các hoạt động tiếp nhận, phân loại người cai nghiện ma túy;","b) Thiết bị y tế thực hiện phục hồi sức khỏe; các hoạt động điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần, điều trị các bệnh lý khác;","c) Thiết bị thực hiện hoạt động giáo dục, tư vấn, phục hồi hành vi, nhân cách;","d)
