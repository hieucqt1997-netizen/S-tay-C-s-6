ghiện ma túy mà bị kết án phạt tù có thời hạn, sau khi chấp hành xong án phạt tù mà vẫn còn thời hạn cai nghiện ma túy hoặc thời hạn quản lý sau cai nghiện ma túy thì phải tiếp tục cai nghiện ma túy hoặc tiếp tục quản lý sau cai nghiện ma túy thời hạn còn lại.","2. Trong thời gian người nghiện ma túy cai nghiện ma túy tự nguyện tại gia đình, cộng đồng hoặc điều trị nghiện bằng thuốc thay thế mà không chấp hành việc áp dụng biện pháp giám sát điện tử thì bị áp dụng biện pháp đưa đi cai nghiện bắt buộc.","3. Trong thời gian người nghiện ma túy cai nghiện ma túy tự nguyện tại gia đình, cộng đồng hoặc điều trị nghiện bằng thuốc thay thế mà thực hiện một trong các hành vi thuộc trường hợp bị áp dụng biện pháp giáo dục tại xã, phường, đặc khu theo quy định của pháp luật về xử lý vi phạm hành chính thì ngoài việc xử lý theo quy định của pháp luật về xử lý vi phạm hành chính, Công an cấp xã nơi người đó cư trú lập biên bản, tổ chức kiểm điểm. Nếu tiếp tục vi phạm pháp luật mà không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự thì bị áp dụng biện pháp đưa đi cai nghiện bắt buộc.","4. Trong thời gian người nghiện ma túy cai nghiện ma túy tự nguyện tại gia đình, cộng đồng hoặc điều trị nghiện bằng thuốc thay thế mà vi phạm pháp luật không thuộc trường hợp bị xử lý theo quy định tại các khoản 1, 2 và 3 Điều này, ngoài việc xử lý theo quy định của pháp luật có liên quan thì thực hiện như sau:","a) Vi phạm lần đầu thì Công an cấp xã đang quản lý lập biên bản và tổ chức nhắc nhở;","b) Vi phạm lần thứ hai thì Công an cấp xã đang quản lý lập biên bản, tổ chức kiểm điểm;","c) Vi phạm lần thứ ba thì bị áp dụng biện pháp đưa đi cai nghiện bắt buộc."]],["D",48,"Lập danh sách, đưa ra khỏi danh sách người nghiện ma túy, người bị quản lý sau cai nghiện ma túy",["1. Công an cấp xã lập danh sách người nghiện ma túy và người bị quản lý sau cai nghiện ma túy cư trú tại địa phương.","2. Khi người nghiện ma túy, người bị quản lý sau cai nghiện ma túy thay đổi nơi cư trú thì Công an cấp xã nơi chuyển đi có trách nhiệm thông báo cho Công an cấp xã nơi chuyển đến trong thời hạn 24 giờ kể từ khi người đó chuyển khỏi địa phương để đưa vào danh sách và phối hợp quản lý.","3. Công an cấp xã đưa người nghiện ma túy ra khỏi danh sách người nghiện ma túy tại địa phương đối với các trường hợp sau đây:","a) Đã hoàn thành cai nghiện ma túy tự nguyện hoặc hoàn thành điều trị nghiện bằng thuốc thay thế;","b) Phải chấp hành án phạt tù; có quyết định đưa đi cơ sở giáo dục bắt buộc, trường giáo dưỡng, cơ sở cai nghiện;","c) Chuyển đến cư trú ở địa phương khác;","d) Chết hoặc bị Tòa án tuyên bố mất tích.","4. Công an cấp xã đưa người bị quản lý sau cai nghiện ma túy ra khỏi danh sách người bị quản lý sau cai nghiện ma túy tại địa phương đối với các trường hợp sau đây:","a) Đã chấp hành xong quyết định quản lý sau cai nghiện ma túy;","b) Phải chấp hành án phạt tù; thi hành quyết định đưa vào cơ sở giáo dục bắt buộc, trường giáo dưỡng; có kết quả xác định tình trạng nghiện là nghiện ma túy;","c) Chuyển đến cư trú ở địa phương khác;","d) Chết hoặc bị Tòa án tuyên bố mất tích."]],["C","Chương VI","QUẢN LÝ NHÀ NƯỚC VỀ PHÒNG, CHỐNG MA TÚY"],["D",49,"Nội dung quản lý nhà nước về phòng, chống ma túy",["1. Ban hành theo thẩm quyền hoặc trình cơ quan có thẩm quyền ban hành văn bản quy phạm pháp luật về phòng, chống ma túy.","2. Chỉ đạo nghiệp vụ, hướng dẫn việc áp dụng thống nhất các quy định của pháp luật về phòng, chống ma túy.","3. Đình chỉ, bãi bỏ theo thẩm quyền hoặc kiến nghị cấp có thẩm quyền bãi bỏ những quy định về phòng, chống ma túy trái với quy định của Luật này.","4. Quyết định phân bổ kinh phí, bảo đảm điều kiện cho hoạt động phòng, chống ma túy.","5. Xây dựng, quản lý cơ sở dữ liệu về phòng, chống ma túy.","6. Thống kê về phòng, chống ma túy; báo cáo Quốc hội về công tác phòng, chống ma túy.","7. Kiểm tra, thanh tra, khen thưởng, xử lý vi phạm pháp luật về phòng, chống ma túy.","8. Quản lý hệ thống tổ chức, biên chế, nhân lực; đào tạo, huấn luyện, bồi dưỡng nghiệp vụ về phòng, chống ma túy.","9. Tổ chức sơ kết, tổng kết, nghiên cứu khoa học về phòng, chống ma túy.","10. Hợp tác quốc tế về phòng, chống ma túy."]],["D",50,"Trách nhiệm quản lý nhà nước về phòng, chống ma túy",["1. Chính phủ thống nhất quản lý nhà nước về phòng, chống ma túy.","2. Bộ Công an là cơ quan đầu mối giúp Chính phủ thực hiện quản lý nhà nước về phòng, chống ma túy.","3. Các Bộ, cơ quan ngang Bộ, cơ quan thuộc Chính phủ trong phạm vi nhiệm vụ, quyền hạn có trách nhiệm thực hiện, phối hợp với cơ quan, tổ chức có liên quan trong phòng, chống ma túy.","4. Ủy ban nhân dân các cấp trong phạm vi nhiệm vụ, quyền hạn thực hiện quản lý nhà nước về phòng, chống ma túy tại địa phương."]],["C","Chương VII","HỢP TÁC QUỐC TẾ VỀ PHÒNG, CHỐNG MA TÚY"],["D",51,"Chính sách hợp tác quốc tế về phòng, chống ma túy",["Nước Cộng hòa xã hội chủ nghĩa Việt Nam thực hiện chính sách hợp tác quốc tế trong lĩnh vực phòng, chống ma túy trên nguyên tắc tôn trọng độc lập, chủ quyền quốc gia với các nước; khuyến khích tổ chức quốc tế, tổ chức, cá nhân nước ngoài hợp tác với cơ quan, tổ chức của Việt Nam hỗ trợ lẫn nhau về cơ sở vật chất, tăng cường năng lực pháp luật, thông tin, công nghệ, đào tạo và y tế cho hoạt động phòng, chống ma túy."]],["D",52,"Nguyên tắc trong hợp tác quốc tế về phòng, chống ma túy",["1. Nước Cộng hòa xã hội chủ nghĩa Việt Nam thực hiện điều ước quốc tế về phòng, chống ma túy và điều ước quốc tế khác có liên quan mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên trên nguyên tắc tôn trọng độc lập, chủ quyền, toàn vẹn lãnh thổ và các bên cùng có lợi; hợp tác với các nước, tổ chức quốc tế, tổ chức, cá nhân nước ngoài trong hoạt động phòng, chống ma túy.","2. Trên cơ sở điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên, quy định của Luật này và quy định khác của pháp luật có liên quan, thỏa thuận quốc tế đã ký kết, cơ quan có thẩm quyền của Việt Nam thực hiện chương trình hợp tác về phòng, chống ma túy với cơ quan có liên quan của các nước, tổ chức quốc tế, tổ chức, cá nhân nước ngoài."]],["D",53,"Chuyển giao hàng hóa có kiểm soát",["Nước Cộng hòa xã hội chủ nghĩa Việt Nam thực hiện yêu cầu chuyển giao hàng hóa có kiểm soát trên cơ sở điều ước quốc tế mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên để phát hiện và truy cứu trách nhiệm hình sự đối với người phạm tội về ma túy. Việc quyết định áp dụng và tiến hành biện pháp này thực hiện theo thỏa thuận giữa cơ quan có thẩm quyền của Việt Nam và của nước có liên quan."]],["C","Chương VIII","ĐIỀU KHOẢN THI HÀNH"],["D",54,"Sửa đổi, bổ sung, bãi bỏ một số điều của Luật Xử lý vi phạm hành chính số 15/2012/QH13 đã được sửa đổi, bổ sung một số điều theo Luật số 54/2014/QH13, Luật số 18/2017/QH14, Luật số 67/2020/QH14, Luật số 09/2022/QH15, Luật số 11/2022/QH15, Luật số 56/2024/QH15 và Luật số 88/2025/QH15",["1. Sửa đổi, bổ sung điểm a khoản 2 Điều 6 như sau:","“a) Thời hiệu áp dụng biện pháp giáo dục tại xã, phường, đặc khu là 01 năm kể từ ngày cá nhân thực hiện hành vi vi phạm quy định tại khoản 1 Điều 90; 06 tháng kể từ ngày cá nhân thực hiện hành vi vi phạm quy định tại khoản 2 Điều 90; 06 tháng kể từ ngày cá nhân thực hiện lần cuối một trong các hành vi vi phạm quy định tại các khoản 3, 4 và 6 Điều 90 của Luật này;”.","2. Sửa đổi, bổ sung một số khoản của Điều 90 như sau:","a) Sửa đổi, bổ sung khoản 7 như sau:","“7. Người quy định tại các khoản 1, 2, 3 và 4 Điều này mà không có nơi cư trú ổn định thì được giao cho cơ sở bảo trợ xã hội hoặc cơ sở trợ giúp trẻ em để quản lý, giáo dục trong thời gian chấp hành biện pháp giáo dục tại xã, phường, đặc khu.”;","b) Bãi bỏ khoản 5.","3. Sửa đổi, bổ sung Điều 95 như sau:","“Điều 95. Biện pháp đưa đi cai nghiện bắt buộc","Đưa đi cai nghiện bắt buộc là biện pháp xử lý hành chính áp dụng đối với người có hành vi vi phạm quy định tại Luật Phòng, chống ma túy để cai nghiện ma túy, lao động, học văn hóa, học nghề dưới sự quản lý của cơ sở cai nghiện ma túy công lập.”.","4. Sửa đổi, bổ sung khoản 2 Điều 113 như sau:","“2. Trong thời gian được hoãn hoặc được tạm đình chỉ chấp hành quyết định đưa vào trường giáo dưỡng, đưa vào cơ sở giáo dục bắt buộc mà người đó tiếp tục có hành vi vi phạm đã bị xử lý hoặc có căn cứ cho rằng người đó bỏ trốn thì Tòa án nhân dân khu vực đã ra quyết định hoãn hoặc tạm đình chỉ hủy bỏ quyết định đó và ra quyết định buộc chấp hành quyết định đưa vào trường giáo dưỡng, quyết định đưa vào cơ sở giáo dục bắt buộc.”.","5. Bổ sung điểm c vào sau điểm b khoản 1 Điều 124 như sau:","“c) Bị yêu cầu xét nghiệm chất ma túy trong cơ thể.”.","6. Sửa đổi, bổ sung khoản 2 và khoản 3 Điều 131 như sau:","“2. Đối với người không có nơi cư trú ổn định hoặc có nơi cư trú ổn định nhưng gia đình không đồng ý quản lý, việc quản lý trong thời gian làm thủ tục xem xét, quyết định áp dụng biện pháp đưa vào trường giáo dưỡng, đưa vào cơ sở giáo dục bắt buộc được cơ quan, người có thẩm quyền lập hồ sơ giao cho cơ quan Công an cấp xã nơi người bị đề nghị áp dụng biện pháp đưa vào trường giáo dưỡng, đưa vào cơ sở giáo dục bắt buộc cư trú hoặc có hành vi vi phạm tổ chức quản lý.","3. Thời hạn quản lý được tính từ khi lập hồ sơ cho đến khi người có thẩm quyền đưa đối tượng đi áp dụng biện pháp xử lý hành chính theo quyết định của Tòa án.”.","7. Sửa đổi, bổ sung khoản 1 Điều 140 như sau:","“1. Quản lý tại gia đình là biện pháp thay thế xử lý vi phạm hành chính áp dụng đối với người chưa thành niên thuộc đối tượng quy định tại khoản 3 và khoản 4 Điều 90 của Luật này khi có đủ các điều kiện sau đây:","a) Đã tự nguyện khai báo, thành thật hối lỗi về hành vi vi phạm của mình;","b) Có môi trường sống thuận lợi cho việc thực hiện biện pháp này;","c) Cha mẹ hoặc người giám hộ có đủ điều kiện thực hiện việc quản lý và tự nguyện nhận trách nhiệm quản lý tại gia đình.”.","8. Thay thế cụm từ “đưa vào cơ sở cai nghiện bắt buộc” bằng cụm từ “đưa đi cai nghiện bắt buộc” tại khoản 3 Điều 2, tên Điều 115, khoản 2 Điều 116 và khoản 9 Điều 119; thay thế cụm từ “Trưởng cơ sở cai nghiện bắt buộc, cơ quan, đơn vị” bằng cụm từ “Cơ quan, đơn vị” tại khoản 4 Điều 101; thay thế cụm từ “Trưởng cơ sở cai nghiện bắt buộc” bằng cụm từ “Trưởng cơ sở cai nghiện ma túy công lập” tại khoản 1 Điều 115; thay thế cụm từ “cơ sở cai nghiện bắt buộc” bằng cụm từ “đưa đi cai nghiện bắt buộc” tại điểm c khoản 1 Điều 122; thay thế cụm từ “cơ sở cai nghiện bắt buộc” bằng cụm từ “cơ sở cai nghiện ma túy công lập” tại khoản 5 Điều 122.","9. Bãi bỏ cụm từ “và Điều 118” tại điểm a khoản 2 Điều 102; bãi bỏ cụm từ “, đưa vào cơ sở cai nghiện bắt buộc” tại khoản 2 Điều 105, Điều 106, khoản 3 Điều 111, khoản 3 Điều 112, tên Điều, khoản 1 và khoản 3 Điều 113, khoản 2 Điều 114, khoản 1, khoản 2, điểm b khoản 5 Điều 131 và tên Điều, khoản 1, khoản 4 Điều 132; bãi bỏ cụm từ “và đưa vào cơ sở cai nghiện bắt buộc” tại Điều 107; bãi bỏ cụm từ “và quyết định áp dụng biện pháp đưa vào cơ sở cai nghiện bắt buộc” tại khoản 2 Điều 108; bãi bỏ cụm từ “, quyết định đưa vào cơ sở cai nghiện bắt buộc” tại tên Điều và khoản 3 Điều 110; bãi bỏ cụm từ “hoặc quyết định đưa vào cơ sở cai nghiện bắt buộc” tại khoản 1 Điều 110; bãi bỏ cụm từ “, cơ sở cai nghiện bắt buộc” tại khoản 1 và khoản 2 Điều 110, tên Điều, khoản 1 và khoản 2 Điều 111, Điều 112, khoản 2 và khoản 3 Điều 114, điểm b khoản 1 Điều 124 và khoản 2 Điều 132; bãi bỏ cụm từ “, Trưởng cơ sở cai nghiện bắt buộc” tại khoản 3 Điều 112, khoản 2 Điều 114 và Điều 117; bãi bỏ cụm từ “và Trưởng cơ sở cai nghiện bắt buộc” tại khoản 2 Điều 132.","10. Bãi bỏ khoản 16 Điều 2, điểm d khoản 2 Điều 6, Điều 96, khoản 2 Điều 101, Điều 103, Điều 104 và Điều 118."]],["D",55,"Hiệu lực thi hành",["1. Luật này có hiệu lực thi hành từ ngày 01 tháng 7 năm 2026.","2. Luật Phòng, chống ma túy số 73/2021/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 81/2025/QH15 hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành."]],["D",56,"Điều khoản chuyển tiếp",["1. Người đang thực hiện cai nghiện ma túy khi Luật này có hiệu lực thi hành thì tiếp tục thực hiện cai nghiện ma túy đến hết thời hạn theo quy định của Luật Phòng, chống ma túy số 73/2021/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 81/2025/QH15, Nghị quyết số 190/2025/QH15 quy định về xử lý một số vấn đề liên quan đến sắp xếp tổ chức bộ máy nhà nước và bị quản lý sau cai nghiện ma túy theo quy định của Luật này.","2. Người đang trong thời gian lập hồ sơ cai nghiện trước ngày Luật này có hiệu lực thi hành mà sau ngày Luật này có hiệu lực thi hành mới có quyết định cai nghiện thì việc cai nghiện ma túy thực hiện theo quy định của Luật này.","3. Hoạt động hợp pháp liên quan đến ma túy, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất đã được cấp phép, cho phép trước ngày Luật này có hiệu lực thi hành thì tiếp tục thực hiện đến hết thời hạn được cấp phép, cho phép.","4. Cơ sở cai nghiện ma túy đã được cấp phép hoạt động trước ngày Luật này có hiệu lực thì tiếp tục thực hiện theo quy định của Luật Phòng, chống ma túy số 73/2021/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 81/2025/QH15 đến hết thời hạn cấp phép.","5. Trường hợp đã tiếp nhận hồ sơ cấp phép hoạt động của cơ sở cai nghiện ma túy trước ngày Luật này có hiệu lực thi hành thì việc cấp phép thực hiện theo quy định của Luật Phòng, chống ma túy số 73/2021/QH14 đã được sửa đổi, bổ sung một số điều theo Luật số 81/2025/QH15 và Nghị quyết số 190/2025/QH15."]]]},"nd163":{"short":"NĐ 163/2026","full":"Nghị định 163/2026/NĐ-CP quy định chi tiết và hướng dẫn thi hành một số điều của Luật Phòng, chống ma túy","note":"Chính phủ ban hành","items":[["C","Chương I","NHỮNG QUY ĐỊNH CHUNG"],["D",1,"Phạm vi điều chỉnh",["Nghị định này quy định chi tiết khoản 5 Điều 11, khoản 4 Điều 12, khoản 2 Điều 14, khoản 2 Điều 15, khoản 3 Điều 18, khoản 9 Điều 24, khoản 2 Điều 28, khoản 4 Điều 29, khoản 10 Điều 32, khoản 6 Điều 33, khoản 5 Điều 34, khoản 7 Điều 35, khoản 7 Điều 36, khoản 8 Điều 42 của Luật Phòng, chống ma túy; biện pháp để tổ chức, hướng dẫn thi hành Điều 17, Điều 19, Điều 20, khoản 2 Điều 21, Điều 23, khoản 6 Điều 31, Điều 37, Điều 38, Điều 39, khoản 2 Điều 45, điểm d khoản 2 Điều 46 của Luật Phòng, chống ma túy về công tác phối hợp của các cơ quan chuyên trách phòng, chống tội phạm về ma túy; kiểm soát các hoạt động hợp pháp liên quan đến ma túy; biện pháp giám sát điện tử; công tác quản lý người sử dụng trái phép chất ma túy; công tác cai nghiện ma túy và quản lý sau cai nghiện ma túy."]],["D",2,"Đối tượng áp dụng",["Nghị định này áp dụng đối với các cơ quan, tổ chức, cá nhân có liên quan đến công tác phối hợp phòng, chống ma túy; kiểm soát các hoạt động hợp pháp liên quan đến ma túy; quản lý người sử dụng trái phép chất ma túy; cai nghiện ma túy và quản lý sau cai nghiện ma túy."]],["D",3,"Nguyên tắc thực hiện",["1. Công tác phối hợp của các cơ quan chuyên trách phòng, chống tội phạm về ma túy; kiểm soát các hoạt động hợp pháp liên quan đến ma túy, quản lý người sử dụng trái phép chất ma túy, cai nghiện ma túy và quản lý sau cai nghiện ma túy phải tuân thủ Luật Phòng, chống ma túy, Nghị định này và quy định của văn bản quy phạm pháp luật có liên quan.","2. Công tác phối hợp của các cơ quan chuyên trách phòng, chống tội phạm về ma túy phải đảm bảo các nguyên tắc sau:","a) Trên cơ sở chức năng, nhiệm vụ và quyền hạn của từng bộ, ngành, địa phương, các cơ quan chuyên trách phòng, chống tội phạm về ma túy thực hiện các hoạt động phối hợp đảm bảo sự đoàn kết, hiệp đồng, hỗ trợ lẫn nhau;","b) Mỗi khu vực, địa bàn do một cơ quan chịu trách nhiệm chính, chủ trì trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy; các cơ quan khác có trách nhiệm phối hợp theo chức năng, nhiệm vụ;","c) Việc trao đổi thông tin tội phạm, thực hiện các biện pháp nghiệp vụ đảm bảo kịp thời, chính xác, đúng quy định bảo vệ bí mật nhà nước;","d) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân là nòng cốt trong các hoạt động phối hợp giữa các cơ quan chuyên trách trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy trên phạm vi toàn quốc.","3. Kiểm soát các hoạt động hợp pháp liên quan đến ma túy phải đảm bảo các nguyên tắc sau:","a) Các hoạt động hợp pháp liên quan đến ma túy theo quy định tại khoản 1 Điều 13 của Luật Phòng, chống ma túy phải được kiểm soát chặt chẽ theo từng ngành, lĩnh vực, địa phương và phải kiểm soát đến sản phẩm cuối cùng;","b) Cơ quan quản lý nhà nước có thẩm quyền trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình có trách nhiệm quản lý các hoạt động thuộc lĩnh vực chuyên ngành và phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy.","4. Công tác quản lý người sử dụng trái phép chất ma túy phải đảm bảo các nguyên tắc sau:","a) Công tác quản lý người sử dụng trái phép chất ma túy phải được tiến hành công khai, khách quan và đúng quy định của pháp luật;","b) Tôn trọng, đảm bảo quyền và lợi ích hợp pháp của người sử dụng trái phép chất ma túy và gia đình của họ;","c) Việc hỗ trợ, giám sát xã hội, phối hợp động viên người sử dụng trái phép chất ma túy chấm dứt việc sử dụng ma túy phải có sự tham gia của gia đình, cơ quan, tổ chức hoặc cộng đồng nơi người sử dụng trái phép chất ma túy cư trú, công tác, làm việc, học tập;","d) Thông tin, tài liệu về người sử dụng trái phép chất ma túy được cập nhật thường xuyên, chính xác;","đ) Các cơ quan chức năng phải phối hợp chặt chẽ trong quá trình quản lý người sử dụng trái phép chất ma túy theo đúng chức năng, thẩm quyền và trách nhiệm được phân công, tuân thủ đúng trình tự, thủ tục và thời hạn giải quyết công việc;","e) Nghiêm cấm lợi dụng việc quản lý người sử dụng trái phép chất ma túy để xâm phạm quyền, lợi ích hợp pháp của công dân.","5. Công tác cai nghiện ma túy, quản lý sau cai nghiện ma túy phải đảm bảo các nguyên tắc sau:","a) Tôn trọng quyền, nghĩa vụ của người đang cai nghiện ma túy, người bị quản lý sau cai nghiện ma túy;","b) Bảo đảm bí mật cá nhân của người đang cai nghiện ma túy, người bị quản lý sau cai nghiện ma túy; chỉ cung cấp thông tin liên quan cho cá nhân, cơ quan, tổ chức có thẩm quyền.","6. Công tác áp dụng biện pháp giám sát điện tử phải đảm bảo các nguyên tắc sau:","a) Biện pháp giám sát điện tử phải được tiến hành công khai, khách quan và theo đúng quy định của pháp luật;","b) Tôn trọng, đảm bảo quyền và lợi ích hợp pháp của người bị áp dụng biện pháp giám sát điện tử;","c) Nghiêm cấm lợi dụng việc áp dụng biện pháp giám sát điện tử để xâm phạm quyền, lợi ích hợp pháp của công dân.","7. Việc thực hiện các nội dung tại khoản 4, khoản 5, khoản 6 Điều này phải bảo đảm phù hợp với đặc điểm vùng miền, điều kiện kinh tế - xã hội, phong tục, tập quán của đồng bào dân tộc thiểu số, miền núi; tôn trọng quyền tự do tín ngưỡng, tôn giáo theo quy định của pháp luật; bảo đảm sự tham gia của gia đình, cộng đồng; phát huy vai trò giám sát của Nhân dân thông qua Ủy ban Mặt trận Tổ quốc Việt Nam và các tổ chức thành viên theo quy định của pháp luật."]],["D",4,"Giải thích từ ngữ",["Trong Nghị định này, những từ ngữ dưới đây được hiểu như sau:","1. Sản xuất chất ma túy là hoạt động tạo ra chất ma túy từ cây có chứa chất ma túy, tiền chất, hóa chất hoặc từ chất ma túy khác dưới mọi hình thức, cách thức, phương pháp; bao gồm cả quá trình tinh chế, pha trộn, pha chế, bào chế, chuyển dạng chất ma túy và không bao gồm việc trồng cây có chứa chất ma túy.","2. Sản xuất tiền chất là hoạt động tạo ra tiền chất từ cây có chứa tiền chất, hóa chất hoặc từ tiền chất khác dưới mọi hình thức, cách thức, phương pháp.","3. Huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy là các hoạt động đào tạo, tập huấn, hướng dẫn, bồi dưỡng, tư vấn nghiệp vụ cho người làm công tác phòng, chống ma túy; huấn luyện động vật nghiệp vụ và các hoạt động khác về cách thức, phương pháp, dấu hiệu nhận biết chất ma túy, tiền chất.","4. Truy nguyên nguồn gốc ma túy là quá trình áp dụng các phương pháp sinh hóa, hóa lý, vật lý để xác định trạng thái, bản chất nguyên liệu, phương pháp, cách thức điều chế chất ma túy; chữ viết, hình ảnh, logo trên nhãn mác, bao bì để xác định nguồn gốc nơi sản xuất các chất ma túy nhằm phục vụ công tác phòng, chống tội phạm về ma túy.","5. Dịch vụ cai nghiện ma túy là hoạt động do tổ chức, cá nhân đủ điều kiện thực hiện một hoặc nhiều giai đoạn cai nghiện theo quy định của Luật Phòng, chống ma túy và Nghị định này nhằm hỗ trợ người nghiện ma túy cai nghiện ma túy tự nguyện tại gia đình, cộng đồng và cơ sở cai nghiện ma túy tư nhân.","6. Hợp đồng dịch vụ cai nghiện ma túy là thỏa thuận giữa tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy với người nghiện ma túy hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi về việc cung cấp, sử dụng dịch vụ cai nghiện ma túy tự nguyện.","7. Không đăng ký cai nghiện tự nguyện hoặc không đăng ký điều trị nghiện bằng thuốc thay thế là việc người nghiện ma túy, cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi, trong thời hạn 24 giờ kể từ khi được cơ quan có thẩm quyền xác định, thông báo là nghiện ma túy mà không đăng ký cai nghiện tự nguyện hoặc không đăng ký điều trị nghiện bằng thuốc thay thế theo quy định của pháp luật. Trường hợp do sự kiện bất khả kháng không thể thực hiện đúng thời hạn trên thì thời hạn được tính lại kể từ thời điểm sự kiện bất khả kháng chấm dứt theo quyết định của cơ quan có thẩm quyền.","8. Không thực hiện cai nghiện tự nguyện hoặc không thực hiện điều trị nghiện bằng thuốc thay thế là việc người nghiện ma túy từ đủ 12 tuổi trở lên, trong thời hạn 02 ngày làm việc kể từ ngày có quyết định cai nghiện tự nguyện, quyết định điều trị nghiện bằng thuốc thay thế của cơ quan có thẩm quyền mà không thực hiện cai nghiện, điều trị nghiện theo đăng ký. Trường hợp do sự kiện bất khả kháng không thể thực hiện đúng thời hạn trên thì thời hạn được tính lại kể từ thời điểm sự kiện bất khả kháng chấm dứt theo quyết định của cơ quan có thẩm quyền.","9. Tự ý chấm dứt cai nghiện ma túy là việc người đang trong thời gian cai nghiện ma túy tự nguyện mà không tuân thủ các quy định chuyên môn về cai nghiện ma túy hoặc tự ý rời khỏi cơ sở cai nghiện ma túy từ 02 ngày làm việc trở lên mà không có lý do chính đáng.","10. Tự ý chấm dứt điều trị nghiện bằng thuốc thay thế hoặc bị chấm dứt điều trị nghiện bằng thuốc thay thế là các trường hợp theo quy định của Chính phủ về điều trị nghiện bằng thuốc thay thế.","11. Tái nghiện là trường hợp người đã hoàn thành cai nghiện ma túy hoặc hoàn thành điều trị nghiện bằng thuốc thay thế được cơ quan có thẩm quyền xác định là nghiện ma túy."]],["C","Chương II","PHỐI HỢP CỦA CÁC CƠ QUAN CHUYÊN TRÁCH PHÒNG, CHỐNG TỘI PHẠM VỀ MA TÚY"],["D",5,"Các cơ quan chuyên trách phòng, chống tội phạm về ma túy",["1. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân bao gồm: Cục Cảnh sát điều tra tội phạm về ma túy, Bộ Công an; Phòng Cảnh sát điều tra tội phạm về ma túy Công an cấp tỉnh.","2. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng bao gồm: Cục Phòng, chống ma túy và tội phạm, Bộ Tư lệnh Bộ đội Biên phòng; Đoàn đặc nhiệm phòng, chống ma túy và tội phạm thuộc Cục Phòng, chống ma túy và tội phạm; Phòng Nghiệp vụ và Đội Đặc nhiệm phòng, chống ma túy và tội phạm thuộc Ban chỉ huy Bộ đội Biên phòng; Đội Phòng, chống ma túy và tội phạm thuộc Đồn Biên phòng; Ban Phòng, chống ma túy và tội phạm thuộc Ban Chỉ huy Biên phòng cửa khẩu cảng; Đội Phòng, chống ma túy và tội phạm thuộc Hải đoàn Biên phòng.","3. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Cảnh sát biển Việt Nam bao gồm: Cục Nghiệp vụ và pháp luật; Đoàn đặc nhiệm phòng, chống tội phạm ma túy; Phòng Phòng chống tội phạm, vi phạm thuộc Bộ Tư lệnh Vùng Cảnh sát biển; Ban Phòng chống tội phạm, vi phạm thuộc Hải đoàn Cảnh sát biển.","4. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Hải quan bao gồm: Chi cục Điều tra chống buôn lậu thuộc Cục Hải quan, Bộ Tài chính; Chi cục Hải quan tỉnh, liên khu vực."]],["D",6,"Phối hợp tham mưu, chỉ đạo",["1. Các cơ quan chuyên trách phòng, chống tội phạm về ma túy phối hợp nghiên cứu, báo cáo, tham mưu cấp có thẩm quyền các chủ trương, biện pháp tăng cường phối hợp trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy.","2. Đề xuất sửa đổi, bổ sung cơ chế, chính sách pháp luật khi phát sinh những vấn đề mới trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy theo thẩm quyền hoặc báo cáo cấp có thẩm quyền sửa đổi, bổ sung, ban hành mới đảm bảo yêu cầu quản lý nhà nước về phòng, chống ma túy.","3. Phối hợp triển khai và tổ chức thực hiện hiệu quả các nhiệm vụ công tác theo lĩnh vực phụ trách."]],["D",7,"Phối hợp tuyên truyền, vận động Nhân dân",["Các cơ quan chuyên trách phòng, chống tội phạm về ma túy trao đổi, thống nhất để tham mưu cấp ủy, chính quyền các cấp tổ chức tuyên truyền, nâng cao nhận thức cho Nhân dân về pháp luật phòng, chống ma túy, phương thức, thủ đoạn hoạt động của tội phạm về ma túy, hậu quả và tác hại của ma túy; biên soạn tài liệu, xây dựng, triển khai kế hoạch tuyên truyền, vận động Nhân dân tích cực tham gia phòng ngừa, phát hiện, tố giác và đấu tranh với tội phạm, tệ nạn ma túy."]],["D",8,"Phối hợp trao đổi thông tin",["1. Nội dung thông tin, tài liệu trao đổi giữa các cơ quan chuyên trách phòng, chống tội phạm về ma túy gồm:","a) Tình hình tội phạm về ma túy trên thế giới; chính sách, pháp luật của các nước về vấn đề ma túy; thông tin tội phạm về ma túy có liên quan đến Việt Nam do các nước và tổ chức quốc tế trao đổi; tình hình tội phạm về ma túy tại khu vực biên giới, cửa khẩu và trên biển;","b) Kết quả công tác phòng ngừa, đấu tranh với tội phạm về ma túy của từng cơ quan; kết quả xử lý tin báo, tố giác tội phạm về ma túy ở khu vực biên giới, cửa khẩu và trên biển; dự báo xu hướng, tình hình tội phạm về ma túy; phương thức, thủ đoạn, quy luật hoạt động của các đối tượng phạm tội; các tổ chức, đường dây, ổ nhóm, các tuyến, địa bàn trọng điểm, phức tạp về ma túy; các đối tượng truy nã về ma túy;","c) Quy trình, quy chế công tác, kinh nghiệm và các biện pháp giải quyết khó khăn, vướng mắc trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy của các cơ quan chuyên trách;","d) Tiến bộ khoa học, kỹ thuật, công nghệ có thể áp dụng phục vụ công tác phòng, chống tội phạm về ma túy;","đ) Các loại chất ma túy mới và các văn bản quy phạm pháp luật trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy;","e) Thông tin, tài liệu khác theo đề nghị khi có yêu cầu.","2. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân, Bộ đội Biên phòng, Cảnh sát biển, Hải quan có trách nhiệm thông báo, chia sẻ kịp thời các thông tin, tài liệu về hoạt động của tội phạm về ma túy có liên quan đến khu vực, địa bàn do lực lượng khác chủ trì để phối hợp giải quyết."]],["D",9,"Phối hợp thực hiện các biện pháp nghiệp vụ",["1. Các cơ quan chuyên trách phòng, chống tội phạm về ma túy phối hợp tổ chức lực lượng, phương tiện và áp dụng các biện pháp nghiệp vụ để phòng ngừa, đấu tranh với tội phạm về ma túy; trao đổi nghiệp vụ để điều tra, xử lý vụ án, vụ việc theo yêu cầu.","2. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan phối hợp với cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân thực hiện các biện pháp nghiệp vụ tại các khu vực, địa bàn quản lý:","a) Tại những tuyến, địa bàn trọng điểm, phức tạp về ma túy, cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân chủ động phối hợp với các cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan có kế hoạch triển khai các biện pháp nghiệp vụ tập trung giải quyết;","b) Khi cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân có yêu cầu phối hợp thực hiện công tác nghiệp vụ trinh sát ở khu vực biên giới, cửa khẩu và trên biển thì cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan có trách nhiệm phối hợp trao đổi thông tin và hỗ trợ triển khai thực hiện;","c) Khi cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển, Hải quan thực hiện các biện pháp nghiệp vụ phòng, chống tội phạm về ma túy ở nội địa liên quan đến khu vực biên giới, cửa khẩu và trên biển thì cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân có trách nhiệm phối hợp trao đổi thông tin và hỗ trợ triển khai thực hiện."]],["D",10,"Phối hợp đấu tranh chuyên án và điều tra, xử lý các vụ án, vụ việc cụ thể",["1. Các cơ quan chuyên trách phòng, chống tội phạm về ma túy phối hợp xác lập, đấu tranh chuyên án trong các trường hợp sau:","a) Đối với các chuyên án ma túy do cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển, Hải quan xác lập đấu tranh mà có đối tượng liên quan đến địa bàn nội địa thì cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân chủ động phối hợp, thực hiện theo yêu cầu và tiếp nhận kịp thời hồ sơ, vật chứng liên quan để điều tra, xử lý theo quy định của pháp luật;","b) Đối với các chuyên án ma túy do cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân xác lập đấu tranh mà có đối tượng liên quan đến khu vực biên giới, cửa khẩu và trên biển thì cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan phối hợp, thực hiện theo yêu cầu;","c) Đối với những chuyên án ma túy phức tạp, đối tượng có liên quan đến nhiều địa phương, hoạt động xuyên quốc gia, có tính quốc tế thì các cơ quan phối hợp thành lập Ban chuyên án chung để đấu tranh, khám phá. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc lực lượng nào phát hiện thì đồng chủ trì với cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân, các cơ quan còn lại phối hợp tham gia; thẩm quyền phê duyệt thành lập Ban chuyên án chung là cấp trên một cấp của đơn vị xác lập chuyên án; thành lập Ban Chỉ đạo chuyên án gồm: lực lượng Công an là Trưởng ban chỉ đạo, lực lượng Bộ đội Biên phòng, Cảnh sát biển, Hải quan là thành viên; Ban Chỉ đạo chuyên án là cấp trên một cấp của Ban chuyên án;","d) Trường hợp cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển, Hải quan tại địa bàn, khu vực quản lý của mình, khi phát hiện thông tin, tài liệu có căn cứ xác lập chuyên án thì chủ trì, phối hợp với cơ quan chuyên trách phòng, chống tội phạm về ma túy khác xác lập chuyên án để đấu tranh.","2. Các cơ quan chuyên trách phối hợp trong quá trình điều tra tội phạm và xử lý vi phạm pháp luật về ma túy theo quy định của pháp luật:","a) Trường hợp cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân có yêu cầu thực hiện các hoạt động nghiệp vụ điều tra tội phạm về ma túy ở khu vực biên giới, cửa khẩu và trên biển thì cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan có trách nhiệm phối hợp, tạo điều kiện hỗ trợ cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân hoàn thành nhiệm vụ;","b) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân có trách nhiệm hỗ trợ, tạo điều kiện thuận lợi cho cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan khi các cơ quan này có yêu cầu phối hợp điều tra, xử lý về tội phạm và vi phạm pháp luật về ma túy trong nội địa; khi nhận được yêu cầu của cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan về việc truy bắt đối tượng, truy tìm phương tiện, vật chứng có liên quan đến tội phạm, vi phạm pháp luật về ma túy từ biên giới, cửa khẩu hoặc trên biển vào nội địa, cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân có trách nhiệm triển khai ngay lực lượng phối hợp bắt giữ, truy tìm. Sau khi bắt giữ được đối tượng, truy tìm được phương tiện, vật chứng thì khẩn trương thông báo và bàn giao hồ sơ, đối tượng, vật chứng, phương tiện cho cơ quan yêu cầu để tiếp tục điều tra theo quy định của pháp luật;","c) Sau khi kết thúc điều tra, xử lý các vụ án, vụ việc, các cơ quan thông báo kết quả phối hợp với nhau và thống nhất tổ chức tổng kết rút kinh nghiệm.","3. Trong trường hợp cần thiết, cơ quan chuyên trách phòng, chống tội phạm về ma túy chủ trì, đề xuất thành lập Tổ công tác phối hợp liên ngành; các cơ quan chuyên trách phòng, chống tội phạm về ma túy khác cử cán bộ tham gia."]],["D",11,"Các nội dung phối hợp khác",["1. Các cơ quan chuyên trách phòng, chống tội phạm về ma túy trong phạm vi chức năng, nhiệm vụ, quyền hạn của mình có trách nhiệm phối hợp, hỗ trợ lẫn nhau trong công tác huấn luyện nghiệp vụ phòng, chống tội phạm về ma túy; phối hợp thực hiện hoặc đề xuất cấp có thẩm quyền xem xét khen thưởng cho các tập thể, cá nhân có thành tích xuất sắc trong công tác phối hợp phòng, chống tội phạm về ma túy.","2. Phối hợp thực hiện công tác hợp tác quốc tế trong phòng ngừa, đấu tranh với tội phạm về ma túy."]],["D",12,"Hình thức phối hợp",["1. Trao đổi, cung cấp thông tin, tài liệu, tình hình liên quan đến nội dung phối hợp giữa các cơ quan chuyên trách phòng, chống tội phạm về ma túy thông qua các hình thức phù hợp, đảm bảo đúng quy định bảo vệ bí mật nhà nước.","2. Triển khai các kế hoạch tuyên truyền, vận động nhân dân tham gia phòng, chống ma túy.","3. Tuần tra kiểm soát liên ngành; xây dựng và triển khai các kế hoạch nghiệp vụ, xác lập chuyên án chung phối hợp đấu tranh với tội phạm về ma túy trên các tuyến, địa bàn trọng điểm.","4. Tổ chức các cuộc họp giao ban định kỳ, hội nghị, hội thảo, tọa đàm về các vấn đề liên quan đến nội dung phối hợp giữa các cơ quan.","5. Tổ chức đào tạo, tập huấn, bồi dưỡng nghiệp vụ công tác phòng, chống tội phạm về ma túy.","6. Báo cáo định kỳ hoặc đột xuất; tổ chức giao ban nghiệp vụ và sơ kết, tổng kết việc phối hợp theo quy định tại Nghị định này."]],["D",13,"Chế độ giao ban, báo cáo và thống kê",["1. Chế độ giao ban","a) Các cơ quan chuyên trách phòng, chống tội phạm về ma túy thực hiện chế độ giao ban định kỳ như sau:","Cấp trung ương: Luân phiên chủ trì tổ chức giao ban định kỳ mỗi năm một lần.","Cấp tỉnh: Luân phiên chủ trì tổ chức giao ban định kỳ 6 tháng một lần.","b) Sau hội nghị giao ban định kỳ, các đơn vị báo cáo kết quả hội nghị lên cấp trên trực tiếp để theo dõi, chỉ đạo, đồng thời thông báo cho cấp dưới thuộc quyền để quán triệt, thực hiện;","c) Trong trường hợp đột xuất hoặc khi có tình hình phức tạp xảy ra, các cơ quan chuyên trách phòng, chống tội phạm về ma túy phải chủ động thông báo cho nhau bằng các hình thức phù hợp, đảm bảo đúng quy định bảo vệ bí mật nhà nước.","2. Chế độ báo cáo, thống kê","Định kỳ 6 tháng, 1 năm, các cơ quan chuyên trách phòng, chống tội phạm về ma túy báo cáo tình hình, kết quả và thống kê số liệu về công tác phối hợp giữa các cơ quan chuyên trách phòng, chống tội phạm về ma túy lên cấp trên trực tiếp. Đối với các chuyên án, vụ án và vụ việc vi phạm pháp luật về ma túy do các cơ quan phối hợp giải quyết thì đơn vị chủ trì có trách nhiệm thống kê ban đầu và thông báo, trao đổi cho các đơn vị phối hợp biết.","Cơ quan chuyên trách phòng, chống tội phạm về ma túy cấp trung ương có trách nhiệm tổng hợp báo cáo chung và gửi báo cáo về Bộ Công an để tập hợp, báo cáo Thủ tướng Chính phủ.","Thời điểm gửi báo cáo và thời gian tính số liệu thống kê được thực hiện theo quy định của Chính phủ về chế độ báo cáo của cơ quan hành chính Nhà nước."]],["C","Chương III","BIỆN PHÁP GIÁM SÁT ĐIỆN TỬ"],["D",14,"Thiết bị giám sát điện tử",["Thiết bị giám sát điện tử là thiết bị giám sát định vị viễn thông đáp ứng các quy chuẩn kỹ thuật quốc gia, được đeo trên cơ thể để xác định vị trí của người bị giám sát, do Bộ Công an trang cấp."]],["D",15,"Đối tượng và thời hạn áp dụng biện pháp giám sát điện tử",["1. Đối với người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang điều trị nghiện bằng thuốc thay thế hoặc người đang bị quản lý sau cai nghiện ma túy từ đủ 18 tuổi trở lên:","a) Người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang bị quản lý sau cai nghiện ma túy bị áp dụng biện pháp giám sát điện tử trong thời gian cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, quản lý sau cai nghiện ma túy.","b) Người đang điều trị nghiện bằng thuốc thay thế bị áp dụng biện pháp giám sát điện tử trong thời hạn 02 năm kể từ ngày quyết định áp dụng biện pháp giám sát điện tử có hiệu lực thi hành.","2. Đối với người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang điều trị nghiện bằng thuốc thay thế hoặc người đang bị quản lý sau cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi:","a) Người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang điều trị nghiện bằng thuốc thay thế hoặc người đang bị quản lý sau cai nghiện ma túy có nơi cư trú ổn định nhưng được cha mẹ, người giám hộ, người đại diện hợp pháp đề nghị áp dụng biện pháp giám sát điện tử thì bị áp dụng biện pháp giám sát điện tử trong thời hạn 01 năm kể từ ngày quyết định áp dụng biện pháp giám sát điện tử có hiệu lực thi hành hoặc đến khi hết thời hạn cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; điều trị nghiện bằng thuốc thay thế; quản lý sau cai nghiện đối với trường hợp thời gian cai nghiện, điều trị nghiện bằng thuốc thay thế, quản lý sau cai nghiện còn ít hơn 01 năm kể từ ngày ra quyết định áp dụng biện pháp giám sát điện tử.","Việc đề nghị áp dụng biện pháp giám sát điện tử được thực hiện theo Mẫu số 01 tại Phụ lục I ban hành kèm theo Nghị định này.","b) Người đang bị quản lý sau cai nghiện ma túy không có nơi cư trú ổn định bị áp dụng biện pháp giám sát điện tử trong thời gian quản lý sau cai nghiện."]],["D",16,"Quyết định áp dụng biện pháp giám sát điện tử",["1. Trưởng Công an cấp xã nơi lập danh sách quản lý người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang bị quản lý sau cai nghiện ma túy và người đang điều trị nghiện bằng thuốc thay thế căn cứ vào đối tượng và thời hạn giám sát điện tử quy định tại Điều 15 của Nghị định này để ra quyết định áp dụng biện pháp giám sát điện tử.","2. Thời hạn ra quyết định áp dụng biện pháp giám sát điện tử:","a) Trưởng Công an cấp xã ra quyết định áp dụng biện pháp giám sát điện tử đối với người quy định tại điểm a, điểm b khoản 1; điểm b khoản 2 Điều 15 của Nghị định này trong thời hạn 12 giờ kể từ khi Công an cấp xã ra quyết định cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; nhận được thông báo tiếp nhận điều trị của cơ sở điều trị nghiện bằng thuốc thay thế hoặc nhận được quyết định quản lý sau cai nghiện ma túy của Chủ tịch Ủy ban nhân dân cấp xã.","b) Trưởng Công an cấp xã ra quyết định áp dụng biện pháp giám sát điện tử trong thời hạn 24 giờ kể từ khi nhận được văn bản đề nghị của cha mẹ, người giám hộ, người đại diện hợp pháp quy định tại điểm a khoản 2 Điều 15 của Nghị định này hoặc tài liệu về hành vi vi phạm đối với người quy định tại khoản 6 Điều 25 của Nghị định này.","3. Quyết định áp dụng biện pháp giám sát điện tử thực hiện theo Mẫu số 02 tại Phụ lục I ban hành kèm theo Nghị định này. Đối với người hoàn thành cai nghiện tại cơ sở cai nghiện, trường giáo dưỡng, Trưởng Công an cấp xã ra quyết định áp dụng biện pháp giám sát điện tử đề nghị cơ sở cai nghiện ma túy công lập, trường giáo dưỡng, Công an cấp xã nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở thi hành Quyết định áp dụng biện pháp giám sát điện tử trước khi người hoàn thành cai nghiện ma túy ra khỏi cơ sở cai nghiện ma túy, trường giáo dưỡng.","4. Trưởng Công an cấp xã có thể ủy quyền cho Phó trưởng Công an cấp xã thực hiện quyền quy định tại khoản 1, khoản 2 Điều này."]],["D",17,"Quy trình thi hành quyết định áp dụng biện pháp giám sát điện tử",["1. Trong thời hạn 24 giờ kể từ khi Quyết định áp dụng biện pháp giám sát điện tử có hiệu lực thi hành, cán bộ Công an cấp xã được giao nhiệm vụ thực hiện giám sát điện tử có trách nhiệm thi hành quyết định áp dụng biện pháp giám sát điện tử và tiến hành đeo thiết bị giám sát lên cơ thể người bị giám sát. Việc thi hành Quyết định áp dụng biện pháp giám sát điện tử được lập thành biên bản theo Mẫu số 03 tại Phụ lục I ban hành kèm theo Nghị định này.","2. Cán bộ Công an có trách nhiệm tổ chức thi hành Quyết định áp dụng biện pháp giám sát điện tử phải thông báo cho người bị giám sát; cha mẹ, người giám hộ hoặc người đại diện hợp pháp của người bị giám sát từ đủ 12 tuổi đến dưới 18 tuổi về Quyết định áp dụng biện pháp giám sát điện tử; các quy định liên quan đến biện pháp giám sát điện tử và yêu cầu người bị giám sát ký cam kết thực hiện biện pháp giám sát điện tử theo Mẫu số 04 tại Phụ lục I ban hành kèm theo Nghị định này.","3. Quyết định áp dụng biện pháp giám sát điện tử được gửi cho người bị giám sát điện tử và gia đình của họ; cha mẹ, người giám hộ hoặc người đại diện hợp pháp của người bị giám sát từ đủ 12 tuổi đến dưới 18 tuổi; cán bộ Công an cấp xã thực hiện việc giám sát điện tử và người có trách nhiệm tổ chức thi hành Quyết định áp dụng biện pháp giám sát điện tử.","4. Người hoàn thành cai nghiện ma túy tại cơ sở cai nghiện ma túy, trường giáo dưỡng thi hành Quyết định áp dụng biện pháp giám sát điện tử tại cơ sở cai nghiện ma túy, trường giáo dưỡng. Theo đề nghị của Công an cấp xã nơi ra Quyết định áp dụng biện pháp giám sát điện tử, cơ sở cai nghiện ma túy công lập, trường giáo dưỡng, Công an cấp xã nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở có trách nhiệm thi hành Quyết định áp dụng biện pháp giám sát điện tử trước khi người hoàn thành cai nghiện ma túy ra khỏi cơ sở cai nghiện ma túy, trường giáo dưỡng và thông báo cho Công an cấp xã nơi ra Quyết định để thực hiện việc giám sát điện tử."]],["D",18,"Nội dung, quy trình giám sát điện tử",["1. Nội dung giám sát điện tử bao gồm:","a) Thực hiện đeo thiết bị giám sát điện tử;","b) Xử lý các cảnh báo của thiết bị giám sát điện tử;","c) Giáo dục, tư vấn người bị giám sát điện tử;","d) Xử lý các hành vi vi phạm trong thực hiện giám sát điện tử;","đ) Tháo thiết bị giám sát điện tử và đeo lại thiết bị giám sát điện tử trong trường hợp tháo tạm thời; thay đổi vị trí đeo thiết bị giám sát điện tử; tạm dừng áp dụng biện pháp giám sát điện tử;","e) Tháo thiết bị giám sát điện tử khi người bị áp dụng biện pháp giám sát điện tử được miễn phần thời gian còn lại, chấm dứt giám sát điện tử;","g) Thay thiết bị giám sát điện tử, phụ kiện kèm theo thiết bị cho người bị giám sát trong trường hợp thiết bị giám sát điện tử, phụ kiện kèm theo bị hư hỏng;","h) Quản lý, thu hồi thiết bị giám sát điện tử, khắc phục, xử lý sự cố kỹ thuật.","2. Quy trình thực hiện các nội dung quy định tại khoản 1 điều này thực hiện theo quy định của Bộ Công an."]],["D",19,"Tháo tạm thời, thay đổi vị trí đeo, thay thế thiết bị giám sát điện tử",["1. Người bị giám sát điện tử được tháo tạm thời thiết bị giám sát điện tử trong các trường hợp:","a) Vì mục đích khám bệnh, chữa bệnh theo yêu cầu của cơ sở khám bệnh, chữa bệnh;","b) Đi ra ngoài lãnh thổ Việt Nam bằng đường hàng không;","c) Đi ra ngoài lãnh thổ Việt Nam từ 07 ngày trở lên;","d) Bị tạm giữ hình sự, tạm giam.","Người quy định tại điểm a, điểm b, điểm c khoản 1 Điều này phải làm đơn đề nghị tháo tạm thời thiết bị giám sát điện tử gửi Công an cấp xã theo Mẫu số 05 tại Phụ lục I ban hành kèm theo Nghị định này.","Công an cấp xã nơi thực hiện biện pháp giám sát điện tử tiến hành tháo tạm thời thiết bị giám sát điện tử đối với những người quy định tại khoản này. Trường hợp người quy định tại điểm a khoản này phải khám bệnh, chữa bệnh khẩn cấp tại địa điểm ngoài phạm vi cư trú có thể đề nghị Công an cấp xã nơi khám bệnh, chữa bệnh tiến hành tháo tạm thời thiết bị giám sát điện tử. Công an cấp xã sau khi thực hiện tháo tạm thời thiết bị giám sát điện tử phải báo cho Công an cấp xã nơi thực hiện biện pháp giám sát điện tử biết.","Người thi hành quyết định tạm giữ hình sự, tạm giam trong trường hợp quy định tại điểm d khoản 1 Điều này phải có văn bản đề nghị tháo tạm thời thiết bị giám sát điện tử gửi Công an cấp xã nơi thực hiện giám sát điện tử theo Mẫu số 06 tại Phụ lục I ban hành kèm theo Nghị định này. Trường hợp địa điểm thi hành quyết định tạm giữ hình sự, tạm giam ở ngoài phạm vi địa bàn của Công an cấp xã nơi đang thực hiện việc giám sát điện tử, để bảo đảm yêu cầu công tác, Cơ quan thi hành quyết định tạm giữ hình sự, tạm giam có thể đề nghị Công an cấp xã nơi thi hành quyết định tạm giữ, tạm giam tiến hành tháo tạm thời thiết bị giám sát điện tử và báo cho Công an cấp xã nơi thực hiện biện pháp giám sát điện tử biết.","Khi hoàn thành việc khám bệnh, chữa bệnh; đi nước ngoài trở về Việt Nam; chấp hành xong quyết định tạm giữ hình sự, tạm giam trở về cộng đồng, người bị giám sát điện tử phải liên hệ ngay với Công an cấp xã nơi tháo tạm thời thiết bị giám sát điện tử để đeo lại thiết bị giám sát điện tử và tiếp tục thực hiện biện pháp giám sát điện tử nếu quyết định áp dụng biện pháp giám sát điện tử còn thời hạn.","2. Việc tháo tạm thời thiết bị giám sát điện tử phải lập biên bản theo Mẫu số 07 tại Phụ lục I ban hành kèm theo Nghị định này.","Việc đeo lại thiết bị giám sát điện tử đối với người được tháo tạm thời phải lập biên bản theo Mẫu số 08 tại Phụ lục I ban hành kèm theo Nghị định này.","3. Người bị giám sát điện tử có thể làm đơn đề nghị Công an cấp xã thay đổi vị trí đeo thiết bị giám sát điện tử theo Mẫu số 05 tại Phụ lục I ban hành kèm theo Nghị định này nếu thời gian đeo thiết bị giám sát điện tử tại một vị trí đã từ đủ 01 tháng trở lên hoặc theo yêu cầu của cơ sở khám bệnh, chữa bệnh cần phải thay đổi vị trí đeo đối với người đó. Việc thay đổi vị trí đeo thiết bị giám sát điện tử phải được lập biên bản theo Mẫu số 09 tại Phụ lục I ban hành kèm theo Nghị định này.","4. Khi xác định thiết bị giám sát điện tử, phụ kiện kèm theo thiết bị bị hỏng, gặp sự cố kỹ thuật, cán bộ Công an cấp xã tiến hành thay thế thiết bị giám sát điện tử, phụ kiện kèm theo thiết bị cho người bị giám sát, bảo đảm thiết bị và phụ kiện kèm theo hoạt động bình thường. Việc thay thế thiết bị giám sát điện tử, phụ kiện kèm theo thiết bị cho người bị giám sát phải được lập thành biên bản theo Mẫu số 10 tại Phụ lục I ban hành kèm theo Nghị định này."]],["D",20,"Tạm dừng, miễn chấp hành thời gian còn lại, chấm dứt áp dụng biện pháp giám sát điện tử",["1. Trưởng Công an cấp xã ra Quyết định tạm dừng áp dụng biện pháp giám sát điện tử theo Mẫu số 11 tại Phụ lục I ban hành kèm theo Nghị định này trong các trường hợp sau:","a) Người bị giám sát điện tử phải chấp hành án phạt tù;","b) Người bị giám sát điện tử phải thi hành quyết định đưa vào cơ sở giáo dục bắt buộc, trường giáo dưỡng.","2. Việc thi hành Quyết định tạm dừng áp dụng biện pháp giám sát điện tử phải được lập biên bản theo Mẫu số 12 tại Phụ lục I ban hành kèm theo Nghị định này. Khi người quy định tại điểm a, điểm b khoản 1 Điều này trở về địa phương, nếu thời hạn áp dụng biện pháp giám sát điện tử vẫn còn thì phải tiếp tục đeo thiết bị giám sát điện tử. Việc đeo lại thiết bị giám sát điện tử đối với người này phải được lập biên bản theo Mẫu số 08 tại Phụ lục I ban hành kèm theo Nghị định này.","3. Trưởng Công an cấp xã xem xét ra quyết định miễn áp dụng biện pháp giám sát điện tử đối với thời gian còn lại của quyết định áp dụng biện pháp giám sát điện tử theo Mẫu số 13 tại Phụ lục I ban hành kèm theo Nghị định này đối với:","a) Người bị áp dụng biện pháp giám sát điện tử quy định tại khoản 1 Điều 15 Nghị định này sau khi thực hiện quyết định áp dụng biện pháp giám sát điện tử được 01 năm mà trong quá trình thực hiện quyết định áp dụng biện pháp giám sát điện tử không có hành vi vi phạm quy định về giám sát điện tử tại khoản 1 Điều 24 của Nghị định này hoặc các hành vi vi phạm pháp luật khác;","b) Người bị áp dụng biện pháp giám sát điện tử quy định tại khoản 2 Điều 15 Nghị định này sau khi thực hiện quyết định áp dụng biện pháp giám sát điện tử được 06 tháng mà trong quá trình thực hiện quyết định áp dụng biện pháp giám sát điện tử không có hành vi vi phạm quy định về giám sát điện tử tại khoản 1 Điều 24 của Nghị định này hoặc các hành vi vi phạm pháp luật khác.","Việc thi hành quyết định miễn áp dụng biện pháp giám sát điện tử đối với thời gian còn lại của quyết định áp dụng biện pháp giám sát điện tử phải được lập thành biên bản theo Mẫu số 14 tại Phụ lục I ban hành kèm theo Nghị định này.","4. Trưởng Công an cấp xã ra Quyết định chấm dứt áp dụng biện pháp giám sát điện tử theo Mẫu số 15 tại Phụ lục I ban hành kèm theo Nghị định này trong các trường hợp sau:","a) Hết thời hạn giám sát theo Quyết định áp dụng biện pháp giám sát điện tử;","b) Người bị giám sát điện tử đi cai nghiện tại cơ sở cai nghiện, trường giáo dưỡng;","c) Người bị giám sát điện tử không còn thực hiện cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; điều trị nghiện ma túy bằng thuốc thay thế hoặc quản lý sau cai nghiện ma túy;","d) Người bị giám sát điện tử chết hoặc bị Tòa án tuyên bố mất tích.","Việc thi hành Quyết định chấm dứt áp dụng biện pháp giám sát điện tử phải được lập biên bản theo Mẫu số 16 tại Phụ lục I ban hành kèm theo Nghị định này.","5. Quyết định tạm dừng, miễn áp dụng biện pháp giám sát điện tử đối với thời gian còn lại, chấm dứt áp dụng biện pháp giám sát điện tử được gửi cho người bị giám sát điện tử và gia đình của họ; cha mẹ, người giám hộ hoặc người đại diện hợp pháp của người bị giám sát từ đủ 12 tuổi đến dưới 18 tuổi; cán bộ Công an cấp xã được phân công thực hiện biện pháp giám sát điện tử.","6. Công an cấp xã liên lạc với người bị giám sát điện tử để thông báo quyết định, thi hành quyết định và lập biên bản thi hành quyết định đối với các trường hợp quy định tại khoản 1, khoản 3, khoản 4 Điều này.","7. Trưởng Công an cấp xã có thể ủy quyền cho Phó trưởng Công an cấp xã thực hiện quyền quy định tại khoản 1, khoản 3, khoản 4 Điều này."]],["D",21,"Xử lý trường hợp người bị giám sát điện tử vắng mặt hoặc thay đổi nơi cư trú",["1. Khi người bị giám sát điện tử vắng mặt tại nơi cư trú, Công an cấp xã đang giám sát điện tử phối hợp với Công an cấp xã nơi đến để trao đổi thông tin và phối hợp thực hiện giám sát, quản lý.","2. Khi người bị giám sát điện tử thay đổi nơi cư trú, Công an cấp xã nơi chuyển đi bàn giao việc giám sát điện tử cho Công an cấp xã nơi chuyển đến trong thời hạn 24 giờ kể từ thời điểm người bị giám sát điện tử hoàn thành thủ tục thay đổi nơi cư trú theo quy định để tiếp tục thực hiện giám sát, quản lý. Trưởng Công an cấp xã nơi người bị giám sát chuyển đến ra quyết định phân công cán bộ tiếp nhận và thực hiện biện pháp giám sát điện tử đối với thời hạn còn lại theo quyết định áp dụng biện pháp giám sát điện tử của Trưởng Công an cấp xã nơi đối tượng chuyển đi theo Mẫu số 17 tại Phụ lục I ban hành kèm theo Nghị định này."]],["D",22,"Trách nhiệm của các cơ quan, tổ chức trong thực hiện biện pháp giám sát điện tử",["1. Bộ Công an có trách nhiệm quản lý, vận hành, theo dõi hoạt động của hệ thống giám sát điện tử trên phạm vi toàn quốc.","2. Công an cấp tỉnh có trách nhiệm quản lý, theo dõi hoạt động của hệ thống giám sát điện tử trên phạm vi cấp tỉnh.","3. Công an cấp xã có trách nhiệm quản lý, sử dụng thiết bị giám sát điện tử trên phạm vi cấp xã; ra quyết định và trực tiếp thực hiện biện pháp giám sát điện tử đối với người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang bị quản lý sau cai nghiện ma túy và người đang điều trị nghiện bằng thuốc thay thế cư trú trên địa bàn.","4. Cơ sở cai nghiện ma túy, trường giáo dưỡng có trách nhiệm tổ chức thi hành Quyết định áp dụng biện pháp giám sát điện tử theo quy định tại khoản 4 Điều 17 của Nghị định này.","5. Các cơ quan, tổ chức thực hiện việc kiểm soát an ninh không bắt buộc người bị giám sát điện tử phải tháo thiết bị giám sát điện tử nếu việc đeo thiết bị không ảnh hưởng đến an ninh, an toàn."]],["D",23,"Quyền và nghĩa vụ của người bị giám sát điện tử",["1. Quyền của người bị giám sát điện tử:","a) Được phổ biến, quán triệt về quy định, chế tài xử lý đối với hành vi vi phạm về biện pháp giám sát điện tử;","b) Được tư vấn, hướng dẫn về tính năng, tác dụng và cách sử dụng thiết bị giám sát điện tử;","c) Đề nghị Công an cấp xã tháo tạm thời, thay đổi vị trí đeo thiết bị giám sát điện tử trên cơ thể theo quy định tại Điều 19 của Nghị định này;","2. Nghĩa vụ của người bị giám sát điện tử:","a) Chấp hành quyết định áp dụng biện pháp giám sát điện tử của cơ quan có thẩm quyền;","b) Cam kết tuân thủ quy định giám sát điện tử;","c) Trong thời hạn 24 giờ kể từ khi phát hiện thiết bị giám sát điện tử hư hỏng; phụ kiện kèm theo thiết bị giám sát điện tử bị hư hỏng, mất thì phải báo cho Công an cấp xã để xử lý;","d) Đền bù thiệt hại vật chất đối với thiết bị, phụ kiện kèm theo nếu việc hư hỏng, mất thiết bị, phụ kiện kèm theo do lỗi của người bị giám sát."]],["D",24,"Các hành vi vi phạm quy định về giám sát điện tử",["1. Các hành vi vi phạm quy định về giám sát điện tử bao gồm:","a) Phá hủy, tác động làm ảnh hưởng đến hoạt động bình thường của thiết bị giám sát điện tử và các phụ kiện kèm theo;","b) Không chấp hành việc đeo thiết bị giám sát điện tử;","c) Tự ý tháo thiết bị giám sát điện tử;","d) Cố ý để thiết bị giám sát điện tử hết pin trong thời hạn 24 giờ mà không có lý do chính đáng;","đ) Sau khi hết thời gian tháo tạm thời thiết bị giám sát điện tử, tạm dừng áp dụng biện pháp giám sát điện tử theo quy định mà không trình diện Công an cấp xã trong vòng 24 giờ để được đeo lại thiết bị giám sát điện tử theo quy định.","2. Trường hợp thiết bị không hoạt động hoặc hoạt động không bình thường do có sự kiện bất khả kháng, trở ngại khách quan hoặc lỗi kỹ thuật của thiết bị và người bị giám sát đã thông báo cho Công an cấp xã trong thời hạn 24 giờ kể từ khi sự kiện bất khả kháng, trở ngại khách quan kết thúc thì không bị coi là vi phạm biện pháp giám sát điện tử."]],["D",25,"Xử lý vi phạm trong thực hiện biện pháp giám sát điện tử",["1. Công an cấp xã lập biên bản vi phạm theo Mẫu số 18 tại Phụ lục I ban hành kèm theo Nghị định này đối với trường hợp vi phạm quy định tại khoản 1 Điều 24 của Nghị định này để làm căn cứ xử lý vi phạm.","2. Các trường hợp vi phạm điểm a khoản 1 Điều 24 Nghị định này nếu không thuộc trường hợp bị xử lý hình sự thì bị xử lý theo khoản 2 Điều 47 của Luật Phòng, chống ma túy.","3. Các trường hợp vi phạm điểm b, điểm c khoản 1 Điều 24 Nghị định này bị lập biên bản vi phạm và tổ chức nhắc nhở đối với lần đầu. Nếu không khắc phục trong vòng 24 giờ kể từ khi lập biên bản vi phạm hoặc vi phạm từ lần thứ 2 sẽ bị lập biên bản về hành vi không chấp hành việc áp dụng biện pháp giám sát điện tử và bị xử lý theo khoản 2 Điều 47 của Luật Phòng, chống ma túy.","4. Các trường hợp vi phạm điểm d, điểm đ khoản 1 Điều 24 Nghị định này bị lập biên bản vi phạm và tổ chức nhắc nhở đối với 02 lần đầu. Nếu không khắc phục trong vòng 24 giờ kể từ khi lập biên bản hoặc vi phạm lần thứ 3 sẽ bị lập biên bản về hành vi không chấp hành việc áp dụng biện pháp giám sát điện tử và bị xử lý theo khoản 2 Điều 47 của Luật Phòng, chống ma túy.","5. Người bị quản lý sau cai nghiện ma túy không chấp hành việc áp dụng biện pháp giám sát điện tử thì bị xử phạt về hành vi chống lại hoặc cản trở việc quản lý sau cai nghiện ma túy theo quy định của pháp luật xử lý hành chính.","6. Trường hợp người điều trị nghiện bằng thuốc thay thế từ đủ 18 tuổi trở lên có hành vi vi phạm quy định về giám sát điện tử tại khoản 1 Điều 24 của Nghị định này thì Trưởng Công an cấp xã ra quyết định giám sát mới thay cho quyết định đang thực hiện với thời hạn giám sát là 02 năm kể từ ngày ra quyết định giám sát mới.","7. Đối với người có hành vi vi phạm quy định tại điểm a, điểm c khoản 1 Điều 24, ngoài việc bị xử lý theo quy định tại khoản 2, khoản 3 Điều này, người vi phạm còn phải có nghĩa vụ đền bù thiệt hại vật chất thực tế đối với thiết bị và phụ kiện kèm theo."]],["D",26,"Điều kiện bảo đảm cho biện pháp giám sát điện tử",["Nhà nước bảo đảm điều kiện thực hiện biện pháp giám sát điện tử gồm:","1. Kinh phí trang bị hệ thống và thiết bị giám sát điện tử;","2. Kinh phí bảo dưỡng, duy trì hoạt động, sửa chữa hệ thống và thiết bị giám sát điện tử."]],["C","Chương IV","KIỂM SOÁT CÁC HOẠT ĐỘNG HỢP PHÁP LIÊN QUAN ĐẾN MA TÚY"],["D",27,"Cơ quan có thẩm quyền cho phép các hoạt động hợp pháp liên quan đến ma túy",["1. Bộ Công an cho phép cơ quan, tổ chức được tiến hành các hoạt động sau:","a) Nghiên cứu các chất ma túy, tiền chất thuộc các Danh mục chất ma túy và tiền chất do Chính phủ quy định (trừ các chất ma túy, tiền chất được sử dụng trong lĩnh vực y tế, nông nghiệp và môi trường thuộc phạm vi quản lý của Bộ Y tế, Bộ Nông nghiệp và Môi trường; các tiền chất được sử dụng trong lĩnh vực công nghiệp, quốc phòng thuộc phạm vi quản lý của Bộ Công Thương, Bộ Quốc phòng);","b) Sản xuất, nhập khẩu, xuất khẩu các chất ma túy, tiền chất thuộc các Danh mục chất ma túy và tiền chất do Chính phủ quy định (trừ các chất ma túy, tiền chất được sử dụng trong lĩnh vực y tế, nông nghiệp và môi trường thuộc phạm vi quản lý của Bộ Y tế, Bộ Nông nghiệp và Môi trường; các tiền chất được sử dụng trong lĩnh vực công nghiệp, quốc phòng thuộc phạm vi quản lý của Bộ Công Thương, Bộ Quốc phòng);","c) Vận chuyển các chất ma túy, tiền chất thuộc các Danh mục chất ma túy, tiền chất do Chính phủ quy định;","d) Quá cảnh lãnh thổ Việt Nam các chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy;","đ) Các hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh.","2. Bộ Nông nghiệp và Môi trường hoặc Ủy ban nhân dân cấp tỉnh cho phép tổ chức, cá nhân được:","a) Nghiên cứu, kiểm nghiệm, sản xuất, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất.","b) Nhập khẩu, xuất khẩu thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất.","3. Bộ Công Thương hoặc Ủy ban nhân dân cấp tỉnh cho phép tổ chức, cá nhân được:","a) Nghiên cứu, kiểm nghiệm, sản xuất, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi tiền chất công nghiệp;","b) Nhập khẩu, xuất khẩu tiền chất công nghiệp;","c) Tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy, tiền chất thuộc các Danh mục chất ma túy và tiền chất do Chính phủ quy định; thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc; thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất.","4. Bộ Y tế hoặc Ủy ban nhân dân cấp tỉnh cho phép các cơ quan, tổ chức, cá nhân được:","a) Nghiên cứu, kiểm nghiệm, sản xuất, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc;","b) Nhập khẩu, xuất khẩu thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc;","c) Nhập khẩu chất chuẩn thuộc danh mục dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phục vụ nghiên cứu, kiểm nghiệm thuốc.","5. Bộ Quốc phòng cho phép các đơn vị được chỉ định tiến hành hoạt động nhập khẩu, xuất khẩu, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý tiền chất thuộc các Danh mục tiền chất do Chính phủ quy định (trừ các tiền chất thuộc phạm vi quản lý của Bộ Công an) sử dụng trong lĩnh vực quốc phòng. Điều kiện, tiêu chuẩn đối với các hoạt động nêu trên được thực hiện theo các quy định hiện hành trong lĩnh vực quốc phòng nhằm đáp ứng yêu cầu đặc thù, cấp bách cho quốc phòng.","6. Bộ Công an có trách nhiệm quản lý nhà nước về lĩnh vực giám định kỹ thuật hình sự; chỉ đạo các đơn vị chức năng tổ chức thực hiện trình tự, thủ tục giám định chất ma túy, tiền chất theo quy định của Luật Giám định tư pháp, Bộ luật Tố tụng hình sự, các văn bản quy phạm pháp luật có liên quan và quy định tại Mục 3 Chương IV của Nghị định này."]],["M","Mục 1","KIỂM SOÁT CÁC HOẠT ĐỘNG NGHIÊN CỨU, SẢN XUẤT, VẬN CHUYỂN CHẤT MA TÚY, TIỀN CHẤT"],["D",28,"Kiểm soát hoạt động nghiên cứu chất ma túy, tiền chất",["1. Hồ sơ đề nghị cấp phép nghiên cứu chất ma túy, tiền chất:","a) Văn bản đề nghị cấp phép nghiên cứu theo Mẫu số 01 Phụ lục II ban hành kèm theo Nghị định này;","b) Bản sao Giấy chứng nhận đăng ký hoạt động khoa học và công nghệ của tổ chức nghiên cứu hoặc văn bản chứng minh tư cách pháp nhân của tổ chức;","c) Bản sao có chứng thực kế hoạch nghiên cứu (hoặc kết quả họp hội đồng tư vấn tuyển chọn hoặc văn bản giao trực tiếp nhiệm vụ khoa học và công nghệ) được cấp có thẩm quyền phê duyệt;","d) Các tài liệu khác: danh sách, nhiệm vụ của những người tham gia nghiên cứu kèm lý lịch khoa học (nếu có); tài liệu chứng minh tính hợp pháp của chất ma túy, tiền chất (tên, địa chỉ tổ chức cung cấp chất ma túy, tiền chất); biện pháp đảm bảo an toàn hóa chất và điều kiện bảo quản chất ma túy, tiền chất; biện pháp xử lý tồn dư chất ma túy, tiền chất trong quá trình nghiên cứu.","2. Trình tự, thủ tục cấp phép nghiên cứu chất ma túy, tiền chất","a) Tổ chức khoa học và công nghệ được thành lập theo quy định của Luật Khoa học, công nghệ và đổi mới sáng tạo khi có kế hoạch nghiên cứu chất ma túy, tiền chất (hoặc kết quả họp hội đồng tư vấn tuyển chọn hoặc văn bản giao trực tiếp nhiệm vụ khoa học và công nghệ) được cơ quan có thẩm quyền phê duyệt theo quy định tại điểm a khoản 1 Điều 27 của Nghị định này chuẩn bị 01 bộ hồ sơ đề nghị cấp phép theo quy định tại khoản 1 Điều này, gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến về Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy);","b) Trường hợp hồ sơ chưa đầy đủ và hợp lệ, trong vòng 05 ngày làm việc kể từ ngày tiếp nhận hồ sơ, cơ quan có thẩm quyền cấp phép có văn bản yêu cầu tổ chức sửa đổi, bổ sung hồ sơ. Trường hợp hết thời hạn yêu cầu sửa đổi, bổ sung hồ sơ hoặc hồ sơ sửa đổi, bổ sung không đáp ứng yêu cầu, cơ quan có thẩm quyền cấp phép ban hành văn bản từ chối cấp phép và nêu rõ lý do;","c) Trong thời hạn 30 ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép thẩm định hồ sơ, trong trường hợp cần thiết thực hiện đánh giá thực tế tại tổ chức và ban hành Quyết định cấp phép.","3. Quyết định cấp phép nghiên cứu chất ma túy, tiền chất theo Mẫu số 02 Phụ lục II ban hành kèm theo Nghị định này. Thời hạn cấp phép nghiên cứu được xác định theo hồ sơ đề nghị cấp phép nghiên cứu nhưng tối đa không quá 02 năm và được gia hạn một lần tối đa không quá 01 năm.","4. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại Quyết định cấp phép nghiên cứu chất ma túy, tiền chất","a) Trường hợp Quyết định cấp phép bị mất, sai sót, hư hỏng hoặc có thay đổi về thông tin của tổ chức, tổ chức lập 01 bộ hồ sơ đề nghị điều chỉnh, cấp lại Quyết định cấp phép; gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến về Bộ Công an;","b) Hồ sơ đề nghị điều chỉnh, cấp lại Quyết định bao gồm: Văn bản đề nghị điều chỉnh, cấp lại Quyết định cấp phép nghiên cứu, trong đó nêu rõ nội dung, lý do điều chỉnh, cấp lại; tài liệu xác nhận các nội dung điều chỉnh;","c) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép kiểm tra, cấp lại Quyết định cấp phép cho tổ chức. Trường hợp từ chối điều chỉnh, cấp lại, cơ quan có thẩm quyền cấp phép trả lời bằng văn bản và nêu rõ lý do;","d) Thời hạn của Quyết định cấp lại bằng thời hạn còn lại của Quyết định đã cấp.","đ) Trường hợp có thay đổi về địa điểm, quy mô, chủng loại, quy trình sản xuất chất ma túy, tiền chất thì tổ chức lập 01 bộ hồ sơ đề nghị, bao gồm: công văn đề nghị, tài liệu chứng minh sự thay đổi và gửi cơ quan có thẩm quyền cấp phép. Cơ quan cấp phép tiến hành thẩm định các nội dung điều chỉnh, đánh giá thực tế tại tổ chức và cấp lại Giấy chứng nhận theo trình tự, thủ tục như cấp mới Giấy chứng nhận.","5. Hồ sơ, trình tự, thủ tục gia hạn Quyết định cấp phép nghiên cứu chất ma túy, tiền chất:","a) Quyết định cấp phép được gia hạn trong trường hợp hết thời hạn nhưng kế hoạch nghiên cứu chưa thực hiện được hoặc chưa thực hiện xong;","b) Trước khi Quyết định cấp phép hết hạn tối thiểu 03 ngày làm việc, tổ chức có nhu cầu gia hạn phải lập 01 bộ hồ sơ đề nghị gia hạn Quyết định cấp phép gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến về Bộ Công an;","c) Hồ sơ đề nghị gia hạn bao gồm: Văn bản đề nghị gia hạn, trong đó nêu rõ lý do, thời gian đề nghị gia hạn; Báo cáo tình hình, kết quả hoạt động nghiên cứu đã thực hiện đến thời điểm đề nghị gia hạn;","d) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép kiểm tra, gia hạn Quyết định cho tổ chức. Trường hợp từ chối gia hạn, cơ quan có thẩm quyền cấp phép trả lời bằng văn bản và nêu rõ lý do;","đ) Không gia hạn nghiên cứu đối với các trường hợp thay đổi mục đích nghiên cứu, loại chất, hàm lượng, khối lượng, biện pháp đảm bảo an toàn và điều kiện bảo quản chất ma túy, tiền chất; kế hoạch, biện pháp xử lý tồn dư chất ma túy, tiền chất.","6. Quyết định cấp phép nghiên cứu bị thu hồi trong những trường hợp sau đây:","a) Tổ chức không thực hiện đúng các nội dung được cấp phép;","b) Tổ chức tự chấm dứt hoạt động nghiên cứu và có văn bản đề nghị thu hồi gửi cơ quan cấp phép;","c) Giấy chứng nhận đăng ký doanh nghiệp hoặc giấy tờ có giá trị pháp lý tương đương bị thu hồi hoặc tổ chức giải thể, phá sản theo quy định của pháp luật;","d) Hồ sơ đề nghị cấp, cấp lại, điều chỉnh, gia hạn có thông tin gian dối hoặc có giấy tờ giả mạo;","đ) Quyết định cấp phép được cấp không đúng thẩm quyền, đối tượng hoặc có nội dung trái quy định của pháp luật;","e) Mua, bán, mượn, cho mượn, thuê, cho thuê, cầm cố, sửa chữa Quyết định cấp phép;","g) Vi phạm các quy định về phòng, chống ma túy, quản lý hóa chất, bảo vệ môi trường và các quy định pháp luật khác có liên quan.","7. Thủ tục thu hồi Quyết định cấp phép nghiên cứu","a) Trong thời hạn 10 ngày làm việc kể từ ngày nhận được đề nghị thu hồi Quyết định nghiên cứu hoặc kể từ ngày nhận được kết luận thanh tra, kiểm tra trong đó có kiến nghị thu hồi Quyết định nghiên cứu; hoặc phát hiện các trường hợp vi phạm quy định tại khoản 6 Điều này, Bộ Công an xem xét, thu hồi Quyết định cấp phép nghiên cứu chất ma túy, tiền chất.","b) Trong thời hạn 05 ngày làm việc kể từ ngày nhận được Quyết định thu hồi, tổ chức bị thu hồi phải nộp lại bản gốc Quyết định cấp phép nghiên cứu chất ma túy, tiền chất đến Bộ Công an;","c) Trong thời hạn không quá 03 ngày làm việc, Quyết định thu hồi được gửi đến tổ chức bị thu hồi Quyết định, Ủy ban nhân dân cấp tỉnh, Công an cấp tỉnh nơi tổ chức thực hiện nghiên cứu, bảo quản chất ma túy để phối hợp theo dõi, giám sát;","d) Khi nhận được Quyết định thu hồi Quyết định cấp phép nghiên cứu, tổ chức phải dừng ngay hoạt động nghiên cứu; trường hợp gây thiệt hại cho tổ chức, cá nhân khác hoặc gây thiệt hại đến môi trường thì phải bồi thường thiệt hại theo quy định của pháp luật.","8. Hoạt động nghiên cứu chất ma túy, tiền chất theo quy định của Điều này phải được theo dõi, kiểm tra, giám sát chặt chẽ từ khi có Quyết định cấp phép đến khi hoàn thành hoạt động nghiên cứu.","a) Tổ chức được cấp phép nghiên cứu phải thực hiện đúng nội dung Quyết định cấp phép và phải báo cáo bằng văn bản cho cơ quan có thẩm quyền cấp phép về kết quả nghiên cứu, khối lượng chất ma túy, tiền chất đã sản xuất và sử dụng; tồn dư chất ma túy, tiền chất và biện pháp, kết quả xử lý ngay khi hoàn thành quá trình nghiên cứu;","b) Trong thời hạn chậm nhất là 03 ngày làm việc kể từ ngày cấp giấy phép, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi Quyết định cấp phép nghiên cứu chất ma túy, tiền chất đến Công an cấp tỉnh và Ủy ban nhân dân cấp tỉnh nơi tiến hành hoạt động nghiên cứu để các đơn vị trên phối hợp theo dõi, kiểm tra, giám sát;","c) Trường hợp phát hiện vi phạm, đề nghị các cơ quan, tổ chức, cá nhân thông báo ngay cho lực lượng Công an nơi phát hiện vi phạm và cơ quan có thẩm quyền cấp phép để phối hợp ngăn chặn, xử lý theo quy định của pháp luật."]],["D",29,"Kiểm soát hoạt động sản xuất chất ma túy, tiền chất",["1. Điều kiện chung về sản xuất chất ma túy, tiền chất:","a) Nhà xưởng/phòng thí nghiệm, trang thiết bị đáp ứng tiêu chuẩn, phù hợp với quy mô, quy trình sản xuất;","b) Bố trí kho/khu vực lưu giữ, bảo quản riêng các chất ma túy, tiền chất đáp ứng các điều kiện đảm bảo an ninh, an toàn hóa chất, phòng cháy chữa cháy, phòng chống thất thoát;","c) Có trang thiết bị, phương tiện ứng cứu sự cố phù hợp với các đặc tính nguy hiểm của hóa chất và khối lượng hóa chất tồn trữ tại nơi sản xuất;","d) Tài liệu chuyên môn kỹ thuật theo nguyên tắc, tiêu chuẩn, quy chuẩn kỹ thuật phù hợp với tính chất, quy mô và công nghệ sản xuất, lưu trữ chất ma túy, tiền chất.","đ) Người phụ trách chuyên môn và người trực tiếp tham gia hoạt động sản xuất phải có bằng cấp phù hợp chuyên ngành hóa học, ngành dược.","2. Hồ sơ đề nghị cấp phép sản xuất chất ma túy, tiền chất","a) Văn bản đề nghị cấp giấy phép sản xuất chất ma túy, tiền chất theo Mẫu số 03 Phụ lục II ban hành kèm theo Nghị định này;","b) Bản sao văn bản chứng minh tư cách pháp nhân của tổ chức đề nghị cấp phép;","c) Tài liệu về cơ sở vật chất: bản vẽ/hình ảnh tổng thể mặt bằng nhà xưởng, kho chứa, trang thiết bị sản xuất;","d) Tài liệu chuyên môn, kỹ thuật: Thuyết minh quy trình sản xuất chất ma túy, tiền chất; biện pháp bảo đảm an toàn hóa chất; phương án kiểm soát, phòng chống thất thoát hóa chất;","đ) Bản sao có chứng thực văn bằng, chứng chỉ của người phụ trách chuyên môn và người trực tiếp tham gia hoạt động sản xuất.","3. Trình tự, thủ tục cấp phép sản xuất chất ma túy, tiền chất","a) Tổ chức được cơ quan có thẩm quyền chỉ định hoặc cho phép thực hiện hoạt động sản xuất chất ma túy, tiền chất tại điểm b khoản 1 Điều 27 của Nghị định này chuẩn bị 01 bộ hồ sơ đề nghị cấp phép theo quy định tại khoản 2 Điều này, gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến về Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy);","b) Trường hợp hồ sơ chưa đầy đủ và hợp lệ, trong vòng 05 ngày làm việc kể từ ngày tiếp nhận hồ sơ, cơ quan có thẩm quyền cấp phép có văn bản yêu cầu tổ chức sửa đổi, bổ sung hồ sơ. Trường hợp hết thời hạn yêu cầu sửa đổi, bổ sung hồ sơ hoặc hồ sơ sửa đổi, bổ sung không đáp ứng yêu cầu, cơ quan có thẩm quyền cấp phép ban hành văn bản từ chối cấp phép và nêu rõ lý do;","c) Trong thời hạn 30 ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan có thẩm quyền cấp phép thẩm định hồ sơ; thực hiện đánh giá thực tế tại tổ chức (nếu cần thiết) và cấp giấy phép sản xuất chất ma túy, tiền chất;","d) Tùy trường hợp cụ thể, cơ quan có thẩm quyền cấp phép đánh giá về quy mô, khối lượng, mục đích sản xuất; loại chất ma túy, tiền chất được sản xuất để quyết định hồ sơ, điều kiện cấp phép đối với tổ chức có hoạt động sản xuất phải thực hiện theo quy định của văn bản quy phạm pháp luật đối với thuốc phải kiểm soát đặc biệt và/hoặc hóa chất cần kiểm soát đặc biệt. Cơ quan cấp phép phối hợp với đơn vị chức năng thuộc Bộ Công Thương, Bộ Y tế để thẩm định hồ sơ và trong trường hợp cần thiết thực hiện đánh giá thực tế tại tổ chức xin cấp phép trước khi cấp Giấy phép sản xuất.","4. Giấy phép sản xuất chất ma túy, tiền chất theo Mẫu số 04 Phụ lục II Nghị định này. Thời hạn cấp phép sản xuất được xác định theo hồ sơ đề nghị cấp phép sản xuất nhưng tối đa không quá 02 năm và được gia hạn một lần tối đa không quá 01 năm. Trong thời hạn chậm nhất là 03 ngày làm việc kể từ ngày cấp giấy phép, cơ quan có thẩm quyền cấp phép có trách nhiệm gửi giấy phép sản xuất chất ma túy, tiền chất đến Công an cấp tỉnh và Ủy ban nhân dân cấp tỉnh nơi tiến hành hoạt động sản xuất để phối hợp theo dõi, kiểm tra, giám sát.","5. Hồ sơ, trình tự, thủ tục điều chỉnh, cấp lại, gia hạn, thu hồi Giấy phép sản xuất chất ma túy, tiền chất thực hiện như đối với Quyết định cấp phép nghiên cứu được quy định tại khoản 4, khoản 5, khoản 6, khoản 7 Điều 28 của Nghị định này.","6. Hoạt động sản xuất chất ma túy, tiền chất phải được kiểm tra, giám sát chặt chẽ từ khi được cấp phép đến khi sản phẩm hoàn thành theo quy trình:","a) Tổ chức có hoạt động sản xuất phải thực hiện đúng nội dung theo giấy phép được cấp và chịu sự theo dõi, kiểm tra, giám sát của các cơ quan có thẩm quyền;","b) Công an cấp tỉnh và Ủy ban nhân dân cấp tỉnh nơi tiến hành hoạt động sản xuất phối hợp theo dõi, kiểm tra, giám sát hoạt động sản xuất theo quy định của pháp luật;","c) Trường hợp phát hiện vi phạm, đề nghị các cơ quan, tổ chức, cá nhân thông báo ngay cho lực lượng Công an nơi phát hiện vi phạm và cơ quan có thẩm quyền cấp phép để phối hợp ngăn chặn, xử lý theo quy định của pháp luật.","7. Hoạt động sản xuất tiền chất công nghiệp thực hiện theo quy định của pháp luật về hóa chất cần kiểm soát đặc biệt.","8. Hoạt động sản xuất thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất; nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc thực hiện theo quy định của pháp luật về thuốc, nguyên liệu làm thuốc phải kiểm soát đặc biệt."]],["D",30,"Kiểm soát hoạt động sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất",["1. Hồ sơ, trình tự, thủ tục cho phép sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất","a) Tổ chức, cá nhân khi tiến hành các hoạt động sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất quy định tại điểm a khoản 2 Điều 27 của Nghị định này gửi 01 bộ hồ sơ trực tiếp hoặc gửi qua đường bưu điện hoặc trực tuyến đến Ủy ban nhân dân cấp tỉnh;","b) Hồ sơ, trình tự, thủ tục cho phép sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất thực hiện theo quy định của pháp luật về quản lý thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản có chứa chất tiền chất và quy định tại Điều này;","c) Trường hợp sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất cùng trên dây chuyền sản xuất đã được cấp Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản, tổ chức, cá nhân lập 01 bộ hồ sơ bao gồm: Văn bản đề nghị của tổ chức sản xuất kèm theo bản sao Giấy chứng nhận đủ điều kiện sản xuất đã được cấp; danh sách các chất ma túy, tiền chất là nguyên liệu để sản xuất thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản kèm tài liệu thuyết minh về quy trình sản xuất; và gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến đến Cơ quan có thẩm quyền cấp phép;","d) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ hợp lệ, cơ quan cấp phép thẩm định và cấp Giấy chứng nhận đủ điều kiện sản xuất đối với dây chuyền sản xuất thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất; trường hợp từ  chối, cơ quan cấp phép trả lời bằng văn bản nêu rõ lý do.","2. Trình tự, thủ tục điều chỉnh, cấp lại Giấy chứng nhận đủ điều kiện sản xuất thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất:","a) Trường hợp Giấy chứng nhận bị mất, sai sót, hư hỏng hoặc có thay đổi về thông tin của tổ chức thì tổ chức lập 01 bộ hồ sơ đề nghị điều chỉnh, cấp lại Giấy chứng nhận và gửi trực tiếp hoặc qua dịch vụ bưu chính hoặc trực tuyến đến Cơ quan có thẩm quyền cấp phép;","b) Hồ sơ đề nghị điều chỉnh, cấp lại Giấy chứng nhận bao gồm: Văn bản đề nghị điều chỉnh, cấp lại Giấy chứng nhận trong đó nêu rõ nội dung, lý do điều chỉnh, cấp lại; tài liệu xác nhận các nội dung thay đổi;","c) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận đủ hồ sơ theo quy định, cơ quan cấp phép tiến hành thẩm định và cấp lại Giấy chứng nhận.","d) Trường hợp có thay đổi về địa điểm, quy mô, loại sản phẩm có chứa chất ma túy, tiền chất, quy trình sản xuất thì tổ chức lập 01 bộ hồ sơ đề nghị, bao gồm: công văn đề nghị, tài liệu chứng minh sự thay đổi và gửi cơ quan có thẩm quyền cấp phép. Cơ quan cấp phép tiến hành thẩm định các nội dung điều chỉnh, đánh giá thực tế tại tổ chức và cấp lại Giấy chứng nhận theo trình tự, thủ tục như cấp mới Giấy chứng nhận.","3. Hoạt động sản xuất thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất phải được theo dõi, giám sát chặt chẽ theo quy định tại điểm a, điểm c khoản 6 Điều 29 của Nghị định này."]],["D",31,"Kiểm soát hoạt động vận chuyển chất ma túy, tiền chất",["1. Hồ sơ đề nghị cấp giấy phép vận chuyển chất ma túy, tiền chất","a) Đơn đề nghị cấp giấy phép vận chuyển chất ma túy, tiền chất có các nội dung sau: tên, địa chỉ tổ chức giao và tổ chức nhận chất ma túy; mục đích vận chuyển; tên gọi, mã CAS và mã số hàng hóa, số lượng, hàm lượng chất ma túy; thời gian, hành trình, phương tiện vận chuyển;","b) Bản sao văn bản chứng minh tư cách pháp nhân của tổ chức đề nghị cấp phép và tổ chức thực hiện vận chuyển;","c) Bản sao có chứng thực hợp đồng vận chuyển giữa tổ chức đề nghị cấp phép vận chuyển với tổ chức thực hiện vận chuyển;","d) Bản sao có chứng thực giấy phép xuất khẩu, nhập khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy (trường hợp vận chuyển từ kho lưu trữ, bảo quản đến cửa khẩu hoặc ngược lại để thực hiện thủ tục hải quan); hoặc giấy tờ hợp lệ chứng minh nguồn gốc, xuất xứ hợp pháp của chất ma túy, tiền chất cần vận chuyển.","2. Trình tự, thủ tục cấp giấy phép vận chuyển chất ma túy, tiền chất","a) Tổ chức cần vận chuyển chất ma túy, tiền chất theo quy định tại điểm c khoản 1 Điều 27 của Nghị định này chuẩn bị 01 bộ hồ sơ đề nghị cấp phép theo quy định tại khoản 1 Điều này gửi trực tiếp hoặc qua đường bưu điện hoặc trực tuyến về Bộ Công an (Cục Cảnh sát điều tra tội phạm về ma túy);","b) Trường hợp hồ sơ chưa đầy đủ và hợp lệ, trong vòng 03 ngày làm việc kể từ ngày tiếp nhận hồ sơ, cơ quan có thẩm quyền cấp phép có văn bản yêu cầu tổ chức sửa đổi, bổ sung hồ sơ. Trường hợp hết thời hạn yêu cầu sửa đổi, bổ sung hồ sơ hoặc hồ sơ sửa đổi, bổ sung không đáp ứng yêu cầu, cơ quan có thẩm quyền cấp phép ban hành văn bản từ chối cấp phép và nêu rõ lý do;","c) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ theo quy định, cơ quan có thẩm quyền cấp phép thẩm định và cấp giấy phép vận chuyển;","3. Nội dung giấy phép ghi rõ thông tin tên, địa chỉ tổ chức giao và tổ chức nhận chất ma túy; mục đích vận chuyển; tên gọi, mã CAS và mã số hàng hóa, số lượng, hàm lượng chất ma túy; thời gian, hành trình, phương tiện vận chuyển.","Giấy phép vận chuyển được cấp cho từng lần vận chuyển và có giá trị trong thời hạn ghi trên giấy phép nhưng không quá 06 tháng.","4. Trình tự, thủ tục gia hạn và cấp lại giấy phép vận chuyển chất ma túy","a) Trước khi giấy phép hết hạn tối thiểu 03 ngày làm việc, tổ chức cần vận chuyển gửi đơn đề nghị cơ quan cấp phép gia hạn, trong đó nêu rõ lý do, thời gian đề nghị gia hạn;","b) Trường hợp giấy phép bị mất hoặc có thay đổi về thời gian, hành trình, phương tiện vận chuyển, tổ chức cần vận chuyển gửi đơn đề nghị cơ quan cấp phép cấp lại giấy phép kèm theo giấy phép đã được cấp;","c) Trong thời hạn 03 ngày làm việc, kể từ ngày nhận được đơn đề nghị của tổ chức cần vận chuyển, cơ quan cấp phép tiến hành xem xét và cấp phép gia hạn hoặc cấp lại giấy phép vận chuyển.","5. Việc vận chuy
