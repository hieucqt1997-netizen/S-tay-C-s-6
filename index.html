n cấp và cấp văn bằng chứng chỉ theo quy định của Bộ Giáo dục và Đào tạo."]],["D",116,"Chế độ học nghề",["1. Người cai nghiện ma túy được tham gia đào tạo nghề trình độ sơ cấp theo quy định của Luật Giáo dục nghề nghiệp.","2. Cơ sở cai nghiện ma túy được phép tổ chức hoạt động giáo dục nghề nghiệp hoặc phối hợp với cơ sở hoạt động giáo dục nghề nghiệp để tổ chức đào tạo các nghề trình độ sơ cấp cho người cai nghiện ma túy theo quy định của pháp luật về giáo dục nghề nghiệp hiện hành.."]],["D",117,"Chế độ lao động trị liệu",["1. Thời gian lao động trị liệu của người cai nghiện ma túy không quá 08 giờ trong một ngày và không quá 48 giờ trong một tuần.","2. Cơ sở cai nghiện ma túy công lập tổ chức lao động trị liệu hoặc phối hợp với người sử dụng lao động để tổ chức lao động trị liệu phải bảo đảm theo đúng quy định của pháp luật về lao động và pháp luật về an toàn, vệ sinh lao động; người cai nghiện phải đăng ký với cơ sở cai nghiện và được hưởng kết quả của lao động trị liệu theo quy định."]],["D",118,"Quản lý, sử dụng kết quả lao động trị liệu của người cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập",["1. Quản lý kết quả lao động trị liệu của người cai nghiện tại cơ sở cai nghiện ma túy công lập","a) Cơ sở cai nghiện ma túy công lập phải mở đầy đủ hệ thống sổ sách kế toán và hạch toán kế toán các khoản thu, chi tài chính phát sinh, báo cáo tài chính được thực hiện theo chế độ kế toán.","b) Các khoản chi phí hợp lý bao gồm: Chi phí vật tư, nguyên liệu; tiền công thuê lao động bên ngoài (nếu có), chi phí điện, nước; hỗ trợ bổ sung, khấu hao tài sản cố định phục vụ quá trình tổ chức lao động trị liệu và các chi phí khác phục vụ trực tiếp cho hoạt động tổ chức lao động trị liệu của người cai nghiện ma túy.","2. Kết quả lao động của người cai nghiện ma túy từ phần chênh lệch thu lớn hơn chi trong hoạt động tổ chức lao động sau khi trừ các khoản chi phí hợp lý, được sử dụng cho các nội dung sau:","a) Trích 30% chi bổ sung định mức ăn, uống của người cai nghiện ma túy;","b) Trích 20% chi hỗ trợ phục vụ sinh hoạt;","c) Trích 20% chi cho người cai nghiện ma túy để gửi cơ sở cai nghiện quản lý và được nhận lại sau khi chấp hành xong biện pháp đưa đi cai nghiện bắt buộc;","d) Trích 30% để thực hiện các hoạt động văn hóa, văn nghệ, thể dục thể thao và khen thưởng cho người cai nghiện ma túy."]],["D",119,"Chế độ sinh hoạt văn hóa, văn nghệ, vui chơi giải trí của người cai nghiện ma túy",["1. Ngoài giờ học văn hóa, học nghề và lao động trị liệu theo quy định của pháp luật, cơ sở cai nghiện ma túy công lập phải tổ chức các hoạt động văn hóa, văn nghệ, thể dục, thể thao, đọc sách, báo, xem truyền hình và các hoạt động vui chơi giải trí khác cho người cai nghiện ma túy. Căn cứ tình hình thực tế và điều kiện cụ thể của đơn vị, cơ sở cai nghiện ma túy có thể mời chuyên gia về lĩnh vực văn hóa, nghệ thuật, thể thao để hướng dẫn, huấn luyện, đào tạo người cai nghiện ma túy có năng khiếu trong các lĩnh vực này.","2. Mỗi cơ sở cai nghiện ma túy công lập được thành lập một thư viện; mỗi phân phân khu của cơ sở cai nghiện ma túy công lập được thành lập một phòng đọc sách, báo, khu vui chơi, nhà luyện tập thể dục, thể thao, sân thể thao để người cai nghiện ma túy rèn luyện thể lực.","3. Ngoài thời gian tham gia các hoạt động giáo dục, học tập, lao động trị liệu, sinh hoạt chung, người cai nghiện ma túy theo tôn giáo được sử dụng kinh sách in, được xuất bản, phát hành hợp pháp mỗi tuần một lần. Người cai nghiện ma túy theo tôn giáo đăng ký với cán bộ cơ sở cai nghiện ma túy công lập việc sử dụng kinh sách, bày tỏ niềm tin tín ngưỡng, tôn giáo cá nhân tại địa điểm, thời gian do Trưởng cơ sở cai nghiện ma túy công lập quy định và không làm ảnh hưởng đến người khác. Cơ sở cai nghiện ma túy công lập có trách nhiệm quản lý kinh sách trước khi cho người cai nghiện ma túy sử dụng."]],["D",120,"Chế độ thăm gặp thân nhân, liên lạc, nhận tiền của người cai nghiện",["1. Chế độ gặp thân nhân","Người cai nghiện được thăm gặp thân nhân tại phòng thăm gặp của Cơ sở cai nghiện ma túy công lập, một tuần một lần, mỗi lần không quá 02 giờ và tối đa không quá 03 thân nhân. Trường hợp gặp lâu hơn phải được Trưởng Cơ sở cai nghiện ma túy công lập đồng ý và tối đa không quá 04 giờ.","2. Chế độ liên lạc của người cai nghiện","a) Người cai nghiện được gửi thư và nhận thư qua đường bưu chính; thư được kiểm duyệt trước khi nhận, gửi; người cai nghiện không được gửi, nhận thư nếu nội dung không phù hợp, không đúng với thuần phong mỹ tục, không mang tính chất giáo dục;","b) Người cai nghiện được liên lạc bằng điện thoại hoặc kết nối hình ảnh, âm thanh bằng phương tiện điện tử với thân nhân ở trong nước, có sự giám sát của cán bộ cơ sở cai nghiện ma túy công lập và tự chịu chi phí mỗi tháng không quá 04 lần, mỗi lần không quá 15 phút. Trường hợp người cai nghiện có nhu cầu trao đổi với thân nhân để giải quyết những vấn đề liên quan đến quyền và lợi ích chính đáng của người cai nghiện hoặc vì công tác giáo dục thì Trưởng cơ sở cai nghiện ma túy công lập quyết định cho tăng thêm số lần, thời gian liên lạc với thân nhân, số lần tăng thêm không quá 02 lần/1 tháng và thời gian liên lạc tăng thêm không quá 30 phút. Trước khi liên lạc với thân nhân, người cai nghiện phải đăng ký nội dung cuộc gọi theo quy định của cơ sở cai nghiện ma túy công lập, trường hợp cán bộ cơ sở cai nghiện ma túy công lập phát hiện nội dung liên lạc không đúng với nội dung người cai nghiện đã đăng ký sẽ bị chấm dứt liên lạc.","3. Người cai nghiện được nhận quà là tiền Việt Nam đồng do thân nhân gửi khi đến thăm gặp hoặc qua bưu điện. Cán bộ làm nhiệm vụ tổ chức thăm gặp tiếp nhận, chuyển vào Sổ lưu ký người cai nghiện; đối với tiền gửi qua bưu điện thì Trưởng cơ sở cai nghiện ma túy công lập có trách nhiệm cử cán bộ đến bưu điện nhận tiền và làm thủ tục lưu ký theo quy định, vào sổ theo dõi, quản lý, đồng thời thông báo cho người cai nghiện được nhận tiền biết. Tiền lưu ký của người cai nghiện được sử dụng mua lương thực, thực phẩm, hàng hóa và các đồ dùng thiết yếu khác tại căng tin của cơ sở cai nghiện ma túy công lập; thanh toán tiền gửi thư, liên lạc điện thoại; gửi về cho thân nhân hoặc nhận lại (nếu còn) khi chấp hành xong quyết định;"]],["D",121,"Chế độ chịu tang",["1. Khi bố, mẹ (gồm cả bên vợ hoặc chồng), vợ hoặc chồng, con chết thì người cai nghiện được phép về để chịu tang. Thời gian về chịu tang tối đa là 05 ngày, không bao gồm thời gian đi đường và được tính vào thời hạn chấp hành quyết định.","2. Trình tự thủ tục giải quyết chế độ chịu tang:","a) Gia đình người cai nghiện làm đơn đề nghị cho người cai nghiện về chịu tang, kèm theo Giấy chứng tử của thân nhân quy định tại khoản 1 Điều này hoặc có xác nhận của Trưởng công an cấp xã nơi tổ chức tang lễ; gửi Trưởng Cơ sở cai nghiện ma túy công lập.","Nội dung đơn bao gồm: họ tên, số căn cước hoặc các giấy tờ chứng minh khác, nơi cư trú, mối quan hệ với người cai nghiện, thời gian đề nghị cho người cai nghiện được về chịu tang và cam kết quản lý, giám sát không để người cai nghiện sử dụng ma túy trái phép hoặc có hành vi vi phạm pháp luật khác trong thời gian về chịu tang theo Mẫu số 48 Phụ lục V ban hành kèm theo Nghị định này.","b) Trong thời hạn 24 giờ kể từ khi nhận đơn theo quy định tại Khoản 1 Điều này, Trưởng cơ sở cai nghiện ma túy công lập có trách nhiệm xem xét, quyết định việc cho người cai nghiện về chịu tang.","Quyết định cho phép về chịu tang phải gồm các nội dung: họ tên, thời gian được về chịu tang; trách nhiệm của gia đình trong việc đón, đưa trả về cơ sở cai nghiện, quản lý người cai nghiện trong thời gian về chịu tang. Quyết định được gửi cho gia đình người cai nghiện, Ủy ban nhân dân cấp xã nơi người đó cư trú để phối hợp quản lý và lưu trong hồ sơ người cai nghiện theo Mẫu số 49 Phụ lục V ban hành kèm theo Nghị định này.","3. Gia đình người cai nghiện có trách nhiệm đón người cai nghiện về và bàn giao người cai nghiện lại cho Cơ sở cai nghiện ma túy công lập khi hết thời gian chịu tang, mọi chi phí đưa, đón người cai nghiện do gia đình người cai nghiện chi trả. Việc giao và nhận người cai nghiện giữa cơ sở cai nghiện ma túy công lập với gia đình phải được lập thành biên bản Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này, lưu hồ sơ của người cai nghiện.","4. Cơ sở cai nghiện phải kiểm tra sức khỏe, tình trạng sử dụng ma túy khi tiếp nhận người cai nghiện. Trường hợp quá thời hạn được phép về chịu tang mà người cai nghiện không trở lại cơ sở cai nghiện ma túy công lập thì Trưởng Cơ sở cai nghiện ma túy công lập ra quyết định truy tìm theo quy định tại Điều 109 của Nghị định này."]],["D",122,"Giải quyết trường hợp người cai nghiện ma túy chết trong thời gian chấp hành quyết định tại cơ sở cai nghiện ma túy công lập",["1. Trong thời gian đang chấp hành quyết định, nếu người cai nghiện ma túy bị chết thì Trưởng cơ sở cai nghiện ma túy công lập thông báo bằng văn bản cho cơ quan điều tra, Viện Kiểm sát nhân dân khu vực nơi cơ sở cai nghiện ma túy công lập trú đóng, cơ quan y tế gần nhất và thân nhân người cai nghiện ma túy để lập biên bản xác nhận nguyên nhân chết.","Trong trường hợp người cai nghiện ma túy chết không có thân nhân hoặc sau 24 giờ kể từ khi thông báo mà thân nhân của người cai nghiện ma túy chết không có mặt thì tiến hành lập biên bản theo quy định.","2. Cơ sở cai nghiện ma túy công lập có trách nhiệm thông báo ngay cho thân nhân người cai nghiện ma túy chết biết để mai táng. Trường hợp không có thân nhân hoặc thân nhân không đến trong thời hạn 24 giờ thì Trưởng cơ sở cai nghiện ma túy công lập có trách nhiệm tổ chức mai táng người cai nghiện ma túy và kinh phí mai táng do Nhà nước bảo đảm."]],["D",123,"Hết thời hạn chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc",["1. Chậm nhất 30 ngày trước khi hết thời hạn chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc, Trưởng Cơ sở cai nghiện ma túy công lập có trách nhiệm thông báo cho Tòa án nhân dân khu vực nơi ra quyết định, Công an cấp xã nơi cư trú đối với người có nơi cư trú ổn định hoặc Công an cấp xã nơi người nghiện ma túy không có nơi cư trú ổn định đăng ký nơi cư trú sau khi hoàn thành cai nghiện, đại diện gia đình của người nghiện ma túy từ đủ 18 tuổi trở lên; cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi biết ngày người cai nghiện hết thời hạn chấp hành biện pháp cai nghiện bắt buộc theo Mẫu số 51 Phụ lục V ban hành kèm theo Nghị định này.","2. Trong thời hạn 24 giờ, trước khi người cai nghiện ma túy hoàn thành cai nghiện ma túy tự nguyện Trưởng cơ sở cai nghiện ma túy công lập có trách nhiệm:","a) Cấp giấy xác nhận hoàn thành cai nghiện ma túy theo Mẫu số 50 Phụ lục V ban hành kèm theo Nghị định này và gửi bản sao cho Tòa án nhân dân khu vực đã ra quyết định, Ủy ban nhân dân và Công an cấp xã nơi cư trú đối với người có nơi cư trú ổn định hoặc Công an cấp xã nơi người nghiện ma túy không có nơi cư trú ổn định đăng ký nơi cư trú sau khi hoàn thành cai nghiện, người cai nghiện ma túy từ đủ 18 tuổi trở lên; cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi.","b) Thông báo và trao quyết định quản lý sau cai cho người hoàn thành cai nghiện ma túy và được lập biên bản giao nhận quyết định theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này.","3. Người chấp hành xong quyết định được nhận lại tiền và đồ vật gửi lưu ký, các văn bằng, chứng chỉ học văn hóa, học nghề (nếu có); được cấp tiền tàu xe, tiền ăn khi đi đường và một bộ quần áo thường."]],["D",124,"Thủ tục chuyển người chấp hành xong biện pháp cai nghiện bắt buộc vào cơ sở bảo trợ xã hội",["1. Chậm nhất 15 ngày trước khi hết thời hạn đưa đi cai nghiện bắt buộc, Trưởng Cơ sở cai nghiện ma túy công lập lập hồ sơ đề nghị đưa đối tượng vào cơ sở bảo trợ xã hội trên địa bàn cơ sở cai nghiện ma túy đặt trụ sở đối với các đối tượng sau:","a) Người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi không có nơi cư trú ổn định thì sau khi hết thời hạn chấp hành biện pháp đưa đi cai nghiện bắt buộc được đưa đi cơ sở bảo trợ xã hội.","b) Người nghiện ma túy từ đủ 18 tuổi trở lên không xác định được nơi cư trú và không còn khả năng lao động thì sau khi hết hạn chấp hành cai nghiện tại cơ sở cai nghiện ma túy công lập được đưa đi cơ sở bảo trợ xã hội.","2. Hồ sơ, thủ tục đề nghị đưa người chấp hành xong biện pháp cai nghiện bắt buộc vào cơ sở bảo trợ xã hội gồm:","a) Giấy xác nhận hoàn thành cai nghiện ma túy;","b) Tài liệu chứng minh thuộc đối tượng quy định tại khoản 6 Điều 35 và khoản 6 Điều 36 của Luật Phòng, chống ma túy;","c) Công văn đề nghị của Trưởng cơ sở cai nghiện ma túy công lập.","3. Trưởng cơ sở cai nghiện ma túy công lập tổ chức đưa người vào cơ sở bảo trợ xã hội.","4. Thời gian ở tại cơ sở bảo trợ xã hội được tính vào thời hạn quản lý sau cai nghiện ma túy."]],["D",125,"Chế độ khen thưởng, kỷ luật",["1. Trong thời gian chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc, người cai nghiện ma túy hoàn thành tốt kết quả cai nghiện, học tập, rèn luyện thì được khen thưởng đột xuất hoặc khen thưởng định kỳ.","2. Trong thời gian chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc, người cai nghiện ma túy vi phạm nội quy của cơ sở cai nghiện ma túy tùy theo tính chất và mức độ vi phạm sẽ bị kỷ luật bằng một trong các hình thức kỷ luật chính:","a) Phê bình;","b) Cảnh cáo;","c) Đưa vào quản lý tại khu dành riêng đối với người có hành vi vi phạm nội quy của cơ sở cai nghiện ma túy.","3. Bộ trưởng Bộ Công an quy định nội quy, quy chế của cơ sở cai nghiện ma túy công lập."]],["M","Mục 13","CHẾ ĐỘ ĐỐI VỚI NGƯỜI TỪ ĐỦ 12 TUỔI ĐẾN DƯỚI 18 TUỔI ĐƯA ĐI CAI NGHIỆN BẮT BUỘC TẠI CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP, TRƯỜNG GIÁO DƯỠNG"],["D",126,"Chế độ đối với người từ đủ 12 tuổi đến dưới 18 tuổi đưa đi cai nghiện bắt buộc tại cơ sở cai nghiện ma túy công lập",["Các chế độ: quản lý; ăn và trang phục đồ dùng sinh hoạt cá nhân; chế độ cai nghiện ma túy; khám bệnh, chữa bệnh; học văn hóa; học nghề; lao động trị liệu; sử dụng kết quả lao động trị liệu; thăm gặp thân nhân, liên lạc và nhận quà; chế độ chịu tang; khen thưởng, kỷ luật đối với người từ đủ 12 tuổi đến dưới 18 tuổi được thực hiện như đối tượng bị áp dụng biện pháp đưa đi cai nghiện bắt buộc quy định tại Mục 12 Chương VI của Nghị định này."]],["D",127,"Chế độ học văn hóa tại cơ sở cai nghiện ma túy công lập",["1. Người từ đủ 12 tuổi đến dưới 18 tuổi bị đưa đi cai nghiện bắt buộc được học văn hóa theo chương trình của Bộ Giáo dục và Đào tạo. Người cai nghiện ma túy chưa phổ cập giáo dục tiểu học và giáo dục trung học cơ sở có nghĩa vụ học tập để thực hiện phổ cập giáo dục và hoàn thành giáo dục bắt buộc; đối với những người cai nghiện chưa học hết chương trình trung học cơ sở, trung học phổ thông thì tùy theo khả năng, điều kiện thực tế của cơ sở cai nghiện và nhu cầu của người cai nghiện để tổ chức học theo chương trình giáo dục phổ thông hoặc giáo dục thường xuyên cấp trung học cơ sở, chương trình giáo dục thường xuyên cấp trung học phổ thông theo quy định của Bộ Giáo dục và Đào tạo.","2. Cơ sở cai nghiện ma túy công lập báo cáo Giám đốc Công an cấp tỉnh để phối hợp với các cơ sở giáo dục có liên quan tổ chức việc học tập, kiểm tra, đánh giá, thi, xác nhận học bạ và cấp giấy chứng nhận hoàn thành chương trình, cấp bằng tốt nghiệp theo quy định của Bộ Giáo dục và Đào tạo."]],["D",128,"Chế độ lao động trị liệu tại cơ sở cai nghiện ma túy công lập",["1. Người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi khi tham gia lao động trị liệu theo quy trình cai nghiện do cơ sở cai nghiện ma túy tổ chức, thì thời gian lao động trị liệu như sau:","a) Đối với người từ đủ 12 tuổi đến dưới 15 tuổi thì thời gian lao động không quá 04 giờ trong một ngày và không quá 20 giờ trong một tuần.","b) Đối với người từ đủ 15 tuổi đến dưới 18 tuổi thì thời gian lao động không quá 06 giờ trong một ngày và không quá 30 giờ trong một tuần.","2. Khi tổ chức lao động trị liệu, cơ sở cai nghiện có trách nhiệm bố trí công việc, nơi làm việc cho người cai nghiện từ đủ 12 tuổi đến dưới 18 tuổi bảo đảm theo đúng quy định của pháp luật về lao động đối với người chưa thành niên và pháp luật về an toàn, vệ sinh lao động."]],["D",129,"Chế độ đối với người từ đủ 12 tuổi đến dưới 18 tuổi đưa đi cai nghiện bắt buộc tại trường giáo dưỡng",["1. Người từ đủ 12 tuổi đến dưới 18 tuổi đưa đi cai nghiện bắt buộc tại trường giáo dưỡng được hưởng chế độ như người bị áp dụng biện pháp xử lý hành chính đưa vào trường giáo dưỡng.","2. Hết thời hạn chấp hành quyết định đưa đi cai nghiện bắt buộc đối với người nghiện từ đủ 12 tuổi đến dưới 18 tuổi tại Trường giáo dưỡng được thực hiện như đối tượng bị áp dụng biện pháp đưa đi cai nghiện bắt buộc quy định tại Điều 123 của Nghị định này.","3. Thủ tục chuyển người từ đủ 12 tuổi đến dưới 18 tuổi chấp hành quyết định đưa đi cai nghiện bắt buộc tại Trường giáo dưỡng vào cơ sở bảo trợ xã hội được thực hiện như đối tượng bị áp dụng biện pháp đưa đi cai nghiện bắt buộc quy định tại Điều 124 của Nghị định này."]],["M","Mục 14","ĐIỀU KIỆN BẢO ĐẢM, CHẾ ĐỘ CHÍNH SÁCH ĐỐI VỚI CÔNG TÁC CAI NGHIỆN MA TÚY"],["D",130,"Điều kiện bảo đảm cho việc tổ chức cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Căn cứ số lượng người cai nghiện tự nguyện, Chủ tịch Ủy ban nhân dân cấp xã phân công ít nhất 01 người để thực hiện nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 59 Phụ lục V ban hành kèm theo Nghị định này.","2. Kinh phí đầu tư, cải tạo, nâng cấp cơ sở vật chất, mua sắm trang thiết bị cho điểm tiếp nhận đăng ký cai nghiện tự nguyện thuộc Công an cấp xã do ngân sách nhà nước bảo đảm và được dự toán ngân sách hằng năm của Bộ Công an.","3. Kinh phí đầu tư, cải tạo, nâng cấp cơ sở vật chất, mua sắm trang thiết bị cho đơn vị sự nghiệp công lập cung cấp dịch vụ cai nghiện ma túy tại gia đình, cộng đồng do ngân sách địa phương bảo đảm theo phân cấp của Luật Ngân sách nhà nước và các nguồn kinh phí hợp pháp khác theo quy định.","4. Kinh phí lập, xác định tình trạng nghiện đối với tự nguyện xác định tình trạng nghiện và người đăng ký cai nghiện ma túy tự nguyện; xét duyệt hồ sơ đăng ký cai nghiện tự nguyện tại gia đình, cộng đồng; hỗ trợ người được giao nhiệm vụ tư vấn tâm lý, xã hội, người được giao quản lý, hỗ trợ người cai nghiện tại gia đình, cộng đồng và các khoản kinh phí khác phục vụ cho việc tổ chức cai nghiện ma túy tự nguyện tại gia đình, cộng đồng do ngân sách nhà nước bảo đảm theo phân cấp của Luật Ngân sách nhà nước. Người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, người bị quản lý sau cai nghiện ma túy tại cấp xã được hưởng thù lao hàng tháng. Mức thù lao tối đa là 0,6 (không phẩy sáu) lần mức lương cơ sở hiện hành;","5. Nội dung chi, mức chi quy định tại Khoản 4 Điều này theo hướng dẫn của Bộ trưởng Bộ Tài chính."]],["D",131,"Chế độ hỗ trợ người cai nghiện ma túy tự nguyện",["1. Người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, tại cơ sở cai nghiện ma túy tư nhân khi hoàn thành ít nhất 03 giai đoạn theo quy định tại Điều 84, Điều 85 và Điều 86 của Nghị định này thì được nhà nước hỗ trợ một lần kinh phí cai nghiện, mức tối thiểu bằng mức lương cơ sở hiện hành.","2. Người cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được nhà nước bảo đảm hưởng chế độ như người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc, người bị áp dụng biện pháp xử lý hành chính đưa vào trường giáo dưỡng.","3. Nguồn kinh phí thực hiện chế độ, chính sách đối với người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, cơ sở cai nghiện ma túy tư nhân do ngân sách địa phương bảo đảm theo phân cấp của Luật Ngân sách nhà nước và các nguồn kinh phí hợp pháp khác theo quy định.","Trường hợp cai nghiện ma túy tự nguyện tại gia đình, cộng đồng thực hiện tối đa 03 giai đoạn quy định tại Điều 84, Điều 85 và Điều 86 của Nghị định này tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được nhà nước bảo đảm hưởng chế độ như người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc, người bị áp dụng biện pháp xử lý hành chính đưa vào trường giáo dưỡng và được dự toán ngân sách hằng năm của Bộ Công an.","4. Nội dung chi, mức chi quy định tại Điều này theo hướng dẫn của Bộ trưởng Bộ Tài chính."]],["D",132,"Điều kiện bảo đảm cho việc áp dụng biện pháp đưa đi cai nghiện bắt buộc",["1. Kinh phí do ngân sách nhà nước bảo đảm và được dự toán ngân sách hằng năm của Bộ Công an gồm:","a) Kinh phí bảo đảm cho đầu tư xây dựng cơ sở vật chất, mua sắm trang thiết bị, phương tiện, tổ chức hoạt động của cơ sở cai nghiện ma túy công lập, trường giáo dưỡng;","b) Kinh phí lập hồ sơ; quản lý người nghiện ma túy trong thời gian lập hồ sơ; đưa người nghiện ma túy đi cai nghiện bắt buộc; điều chuyển người cai nghiện ma túy giữa các cơ sở cai nghiện ma túy công lập, trường giáo dưỡng; truy tìm người nghiện ma túy bỏ trốn.","c) Kinh phí xác định tình trạng nghiện ma túy đối với người bị đề nghị xác định tình trạng nghiện ma túy tại cơ sở y tế đủ điều kiện xác định tình trạng nghiện thuộc Công an nhân dân.","d) Kinh phí tổ chức cai nghiện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng;","đ) Kinh phí tổ chức đưa người từ đủ 18 tuổi trở lên không xác định được nơi cư trú và không còn khả năng lao động, người từ đủ 12 tuổi đến dưới 18 tuổi không có nơi cư trú ổn định sau khi hết thời hạn chấp hành cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng vào cơ sở bảo trợ xã hội.","e) Kinh phí quần áo, đồ sung sinh hoạt của người cai nghiện ma túy, trang phục của người lao động hợp đồng.","2. Cơ sở cai nghiện ma túy công lập, trường giáo dưỡng:","a) Được trực tiếp nhận sự giúp đỡ về vật chất, chuyên môn, kỹ thuật của Ủy ban nhân dân địa phương, các cơ quan nhà nước, các tổ chức, cá nhân ở trong và ngoài nước theo quy định của pháp luật;","b) Được tham gia hợp tác với các cơ quan, doanh nghiệp, tổ chức, cá nhân trong nước tổ chức lao động, đào tạo nghề cho người cai nghiện ma túy theo quy định của pháp luật để tạo nguồn kinh phí hỗ trợ người nghiện ma túy trong quá trình cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","3. Các khoản kinh phí quy định tại Điều này bảo đảm không trùng lặp với các khoản kinh phí đã được ngân sách nhà nước bảo đảm."]],["D",133,"Chế độ đối với người lao động hợp đồng tại các cơ sở cai nghiện ma túy công lập",["1. Người lao động hợp đồng làm việc tại các cơ sở cai nghiện công lập được hưởng trợ cấp đặc thù, phụ cấp ưu đãi theo nghề theo quy định của pháp luật hiện hành.","2. Người lao động hợp đồng trong cơ sở cai nghiện ma túy công lập được cấp trang phục thống nhất để thực hiện nhiệm vụ cai nghiện ma túy, bao gồm:","a) Quần áo thu đông 2 bộ/02 năm;","b) Quần áo xuân hè 2 bộ/01 năm;","c) Áo khoác ngoài mùa đông đối với các tỉnh từ thành phố Đà Nẵng trở ra phía Bắc 01 bộ/02 năm;","d) Áo sơ mi 02 cái/01 năm;","đ) Giày da 01 đôi/01 năm;","e) Bít tất 02 đôi/ 01 năm.","g) Mũ kêpi 01 cái/02 năm;","h) Thắt lưng da 01 cái/02 năm;","i) Cà vạt 01 cái/01 năm.","k) Áo mưa 01 cái/02 năm;","l) Biển tên 01 cái/cấp lần đầu (trường hợp bị hư hỏng, mất thì được cấp lại):","m) Bộ cấp hiệu 01 bộ/cấp lần đầu (trường hợp bị hư hỏng, mất thì được cấp lại):","3. Bộ trưởng Bộ Công an quy định mẫu trang phục của người lao động hợp đồng.","4. Các định mức quy định tại khoản 2 Điều này là mức tối thiểu do Bộ Công an cấp. Căn cứ vào điều kiện cụ thể của từng địa phương, Ủy ban nhân dân cấp tỉnh trình Hội đồng nhân dân cùng cấp hỗ trợ bổ sung định mức cho phù hợp."]],["C","Chương VII","QUẢN LÝ SAU CAI NGHIỆN MA TÚY"],["D",134,"Quyết định quản lý sau cai nghiện ma túy tại nơi cư trú",["1. Trong thời hạn 02 ngày làm việc kể từ nhận được thông báo về thời gian hoàn thành cai nghiện ma túy theo quy định tại khoản 2 Điều 93, khoản 2 Điều 94, khoản 1 Điều 97, khoản 1 Điều 123 của Nghị định này, Trưởng công an cấp xã gửi văn bản đề nghị theo Mẫu số 52 Phụ lục V ban hành kèm theo Nghị định này đến Chủ tịch Ủy ban nhân dân cùng cấp. Chủ tịch Ủy ban nhân dân cùng cấp ra Quyết định quản lý sau cai nghiện ma túy tại nơi cư trú theo Mẫu số 53 Phụ lục V ban hành kèm theo Nghị định này.","2. Quyết định quản lý sau cai nghiện tại nơi cư trú phải ghi rõ ngày, tháng, năm ký quyết định; họ, tên, chức vụ của người ký quyết định; họ, tên, ngày, tháng, năm sinh, nghề nghiệp, nơi cư trú của người bị quản lý sau cai nghiện; phân công nhiệm vụ của các tổ chức, cá nhân trong việc hỗ trợ người sau cai nghiện ma túy, thời hạn và nơi thi hành quyết định, cơ quan có trách nhiệm thi hành quyết định.","3. Quyết định phải gửi cho người sau cai nghiện ma túy từ đủ 18 tuổi trở lên, cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người sau cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi, Trưởng cơ sở cai nghiện ma túy công lập, Hiệu trưởng trường giáo dưỡng, người đứng đầu cơ sở cai nghiện ma túy tư nhân, tổ chức, cá nhân được giao hỗ trợ người sau cai nghiện ma túy, Trưởng Công an cấp xã."]],["D",135,"Hồ sơ quản lý sau cai nghiện ma túy",["Công an cấp xã mở hồ sơ và quản lý hồ sơ người sau cai nghiện bao gồm:","1. Quyết định quản lý sau cai nghiện ma túy;","2. 01 bản sao Giấy xác nhận hoàn thành cai nghiện ma túy, điều trị nghiện bằng thuốc thay thế;","3. Tóm tắt lý lịch theo Mẫu số 33 Phụ lục V ban hành kèm theo Nghị định này.","4. Tài liệu thể hiện nội dung quản lý gồm: biên bản tư vấn, giúp đỡ, phòng, chống tái nghiện ma túy; quản lý cư trú; xét nghiệm chất ma túy trong cơ thể; cam kết không sử dụng trái phép chất ma túy;","5. Tài liệu thể hiện nội dung hỗ trợ xã hội gồm: Tư vấn hỗ trợ học nghề; tư vấn và kết quả vay vốn; hỗ trợ tìm việc làm và các tài liệu thể hiện sự tham gia hoạt động xã hội hòa nhập cộng đồng (nếu có);","6. Quyết định của Công an cấp xã đưa người bị quản lý sau cai nghiện ma túy ra khỏi danh sách người bị quản lý sau cai nghiện ma túy tại địa phương (nếu có) theo Mẫu số 57 Phụ lục V ban hành kèm theo Nghị định này","7. Các tài liệu khác thể hiện quá trình quản lý sau cai nghiện ma túy (nếu có);"]],["D",136,"Chế độ quản lý sau cai nghiện ma túy",["1. Quản lý cư trú đối với người sau cai nghiện ma túy:","a) Người bị quản lý sau cai nghiện ma túy khi vắng mặt tại nơi cư trú phải báo cáo với Công an cấp xã, nói rõ lý do vắng mặt, thời gian vắng mặt. Trường hợp không báo cáo thì thời gian vắng mặt không được trừ vào thời hạn quản lý sau cai nghiện ma túy. Các hành vi vi phạm trong thời gian vắng mặt được xác định là vi phạm trong thời hạn quản lý sau cai nghiện ma túy.","b) Khi người bị quản lý sau cai nghiện ma túy thay đổi nơi cư trú thì Công an cấp xã nơi chuyển đi có trách nhiệm thông báo cho Công an cấp xã nơi chuyển đến trong thời hạn 24 giờ kể từ khi người đó chuyển khỏi địa phương để đưa vào danh sách và phối hợp quản lý theo Mẫu số 54 Phụ lục V ban hành kèm theo Nghị định này.","2. Tư vấn, giúp đỡ, phòng, chống tái nghiện ma túy:","a) Người bị quản lý sau cai nghiện ma túy được giúp đỡ, phòng, chống tái nghiện ma túy trong thời gian quản lý sau cai nghiện ma túy;","b) Người bị quản lý sau cai nghiện ma túy được tư vấn, trợ giúp về tâm lý; hướng dẫn làm thủ tục đăng ký cư trú, cấp căn cước, cấp phiếu lý lịch tư pháp; hướng dẫn chấp hành pháp luật, nghĩa vụ công dân; hỗ trợ kinh phí, cho vay vốn, học nghề, tìm kiếm, giới thiệu việc làm; hỗ trợ các điều kiện cần thiết khác giúp người sau cai nghiện ổn định cuộc sống, hòa nhập cộng đồng, phòng, chống tái nghiện;","c) Tổ chức xét nghiệm chất ma túy đối với người sau cai nghiện ma túy.","3. Căn cứ vào điểm a, b và c Khoản 2 Điều này và điều kiện thực tế của địa phương, Công an cấp xã đề nghị Chủ tịch Ủy ban nhân dân cùng cấp quyết định phân công Tổ quản lý, hỗ trợ xã hội sau cai nghiện ma túy tại nơi cư trú do Công an cấp xã làm Tổ trưởng và thành viên của các phòng, ban, tổ chức đoàn thể cấp xã theo Mẫu số 55 Phụ lục V ban hành kèm theo Nghị định này."]],["D",137,"Chính sách hỗ trợ đối với người sau cai nghiện ma túy",["1. Người bị quản lý sau cai nghiện ma túy tại nơi cư trú từ đủ 12 tuổi đến dưới 18 tuổi khi tiếp tục đi học ở các bậc học phổ thông tại các cơ sở giáo dục thuộc hệ thống giáo dục quốc dân được miễn, giảm học phí, hỗ trợ chi phí học tậptheo quy định của Chính phủ quy định về chính sách học phí, miễn, giảm, hỗ trợ học phí, hỗ trợ chi phí học tập và giá dịch vụ trong lĩnh vực giáo dục, đào tạo.","Thủ tục miễn, giảm, hỗ trợ học phí, hỗ trợ chi phí học tập được thực hiện theo quy định của Chính phủ quy định về chính sách học phí, miễn, giảm, hỗ trợ học phí, hỗ trợ chi phí học tập và giá dịch vụ trong lĩnh vực giáo dục, đào tạo.","2. Người sau cai nghiện ma túy khi tham gia đào tạo nghề nghiệp được hưởng chính sách hỗ trợ đào tạo theo quy định của pháp luật về đào tạo nghề trình độ sơ cấp.","3. Người sau cai nghiện ma túy được vay vốn tạo việc làm; được ưu tiên đăng ký tham gia chính sách việc làm công theo quy định của pháp luật về chính sách hỗ trợ tạo việc làm.","4. Căn cứ tình hình kinh tế - xã hội, chính quyền địa phương có chính sách hỗ trợ đối với người sau cai nghiện ma túy."]],["D",138,"Hết thời hạn quản lý sau cai nghiện ma túy",["Trước 03 ngày làm việc, khi hết thời hạn quản lý sau cai nghiện ma túy Công an cấp xã tham mưu Chủ tịch Ủy ban nhân dân cùng cấp cấp giấy xác nhận đã chấp hành xong quyết định quản lý sau cai nghiện tại nơi cư trú theo Mẫu số 56 Phụ lục V ban hành kèm theo Nghị định này và đưa người bị quản lý ra khỏi danh sách quản lý sau cai nghiện ma túy tại nơi cư trú."]],["D",139,"Điều kiện bảo đảm cho việc quản lý sau cai nghiện ma túy",["1. Kinh phí bảo đảm cho lập hồ sơ, tổ chức quản lý sau cai nghiện tại nơi cư trú; kinh phí xét nghiệm chất ma túy và xác định tình trạng nghiện cho người đang trong thời hạn quản lý sau cai; kinh phí thực hiện các chính sách hỗ trợ xã hội đối với người sau cai nghiện và các khoản kinh phí khác phục vụ cho việc quản lý sau cai nghiện do ngân sách nhà nước bảo đảm theo phân cấp của Luật Ngân sách nhà nước.","2. Nội dung chi, mức chi tại khoản 1 Điều này thực hiện theo hướng dẫn của Bộ trưởng Bộ Tài chính."]],["C","Chương VIII","TRÁCH NHIỆM CỦA CƠ QUAN"],["D",140,"Bộ Công an",["1. Chỉ đạo cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân chủ động phối hợp chặt chẽ với các cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển và Hải quan thực hiện các hoạt động phòng ngừa, đấu tranh, ngăn chặn, điều tra, xử lý tội phạm về ma túy.","2. Chủ trì, phối hợp với các bộ, cơ quan ngang bộ, cơ quan thuộc Chính phủ, Ủy ban nhân dân cấp tỉnh thống nhất quản lý nhà nước về kiểm soát các hoạt động hợp pháp liên quan đến ma túy.","a) Tổng hợp kế hoạch, kết quả thực hiện kế hoạch tổng thể dài hạn và hằng năm về kiểm soát các hoạt động hợp pháp liên quan đến ma túy của các bộ, ngành, địa phương, báo cáo Thủ tướng Chính phủ;","b) Hướng dẫn, đôn đốc, kiểm tra các cơ quan, tổ chức, cá nhân, địa phương thực hiện các văn bản quy phạm pháp luật về kiểm soát các hoạt động hợp pháp liên quan đến ma túy trong phạm vi lĩnh vực và địa bàn quản lý nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó vào mục đích bất hợp pháp;","3. Ban hành và đề xuất Chính phủ ban hành, sửa đổi, bổ sung các văn bản thuộc thẩm quyền của Bộ Công an về kiểm soát các hoạt động hợp pháp liên quan đến ma túy và tổ chức thực hiện.","4. Xây dựng và tổ chức thực hiện quy chế, kế hoạch, tổ chức đào tạo, bồi dưỡng cán bộ và thực hiện thống kê nhà nước về nhập khẩu mẫu, lấy mẫu, quản lý và sử dụng mẫu các chất ma túy.","5. Thực hiện nhiệm vụ quản lý nhà nước các hoạt động theo quy định tại khoản 1, khoản 6 Điều 27 của Nghị định này; thực hiện thống kê nhà nước, hợp tác quốc tế về kiểm soát các hoạt động hợp pháp liên quan đến ma túy; quản lý, vận hành Phần mềm và cơ sở dữ liệu kiểm soát các hoạt động hợp pháp liên quan đến ma túy bảo đảm kết nối các đơn vị, bộ, ngành, tổ chức, cá nhân có hoạt động liên quan; là đầu mối quốc gia thực hiện thông báo tiền xuất khẩu, báo cáo, trao đổi thông tin với các tổ chức quốc tế và cơ quan có thẩm quyền các nước về phòng, chống ma túy; là cơ quan thường trực của Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp trung ương và hướng dẫn, kiểm tra Tổ Công tác liên ngành phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy cấp tỉnh thực hiện nhiệm vụ theo quy định tại Nghị định này.","6. Chỉ đạo lực lượng Công an các cấp thực hiện và phối hợp với cơ quan, tổ chức có liên quan phát hiện, quản lý người sử dụng trái phép chất ma túy; thực hiện công tác cai nghiện ma túy và quản lý sau cai.","7. Tổ chức thực hiện việc giám sát điện tử đối với người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang điều trị nghiện bằng thuốc thay thế; người đang bị quản lý sau cai nghiện ma túy.","8. Ban hành theo thẩm quyền hoặc trình cơ quan nhà nước có thẩm quyền ban hành văn bản quy phạm pháp luật về cai nghiện ma túy và quản lý sau cai nghiện ma túy. Chỉ đạo Công an các địa phương tổ chức thực hiện công tác cai nghiện ma túy tại gia đình, cộng đồng; cai nghiện ma túy tại cơ sở cai nghiện tự nguyện; biện pháp đưa đi cai nghiện bắt buộc;","9. Thường xuyên đôn đốc, kiểm tra, thanh tra việc tổ chức thực hiện công tác cai nghiện ma túy tại gia đình, cộng đồng; cai nghiện ma túy tại cơ sở cai nghiện tự nguyện; biện pháp đưa đi cai nghiện bắt buộc, bảo đảm theo đúng quy định của pháp luật;","10. Thành lập, giải thể và tổ chức hoạt động của cơ sở cai nghiện ma túy công lập; hướng dẫn thành lập, giải thể và tổ chức hoạt động của cơ sở cai nghiện ma túy tư nhân; ban hành tiêu chuẩn xây dựng Cơ sở cai nghiện ma túy; hướng dẫn việc tổ chức cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, cai nghiện ma túy tại cơ sở cai nghiện ma túy và quản lý sau cai nghiện ma túy;","11. Phối hợp với Tòa án nhân dân tối cao, Bộ Y tế, Bộ Giáo dục và Đào tạo và các bộ, ngành khác có liên quan, Ủy ban nhân dân cấp tỉnh, các cơ quan, tổ chức thực hiện công tác cai nghiện và quản lý sau cai nghiện ma túy.","12. Xây dựng ứng dụng khoa học công nghệ vào công tác cai nghiện ma túy và quản lý sau cai;","13. Thực hiện chế độ thống kê, thông tin, báo cáo về cai nghiện, quản lý sau cai nghiện ma túy theo quy định của pháp luật;","14. Xây dựng, quản lý, vận hành Phần mềm và cơ sở dữ liệu kiểm soát các hoạt động hợp pháp liên quan đến ma túy;","15. Hợp tác quốc tế trong lĩnh vực cai nghiện và quản lý sau cai nghiện ma túy theo quy định của pháp luật."]],["D",141,"Bộ Quốc phòng",["1. Chỉ đạo cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng chủ trì thực hiện các hoạt động phòng ngừa; ngăn chặn ma túy thẩm lậu vào Việt Nam; kịp thời phát hiện, bắt giữ tội phạm về ma túy xảy ra ở khu vực biên giới theo quy định của pháp luật; thường xuyên phối hợp chặt chẽ với các cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân, Cảnh sát biển, Hải quan trong công tác phòng ngừa, đấu tranh với tội phạm về ma túy.","2. Chỉ đạo cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Cảnh sát Biển Việt Nam chủ trì thực hiện các hoạt động phòng ngừa, đấu tranh, ngăn chặn, điều tra, xử lý tội phạm về ma túy trên biển; phối hợp chặt chẽ với các cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Hải quan, Công an và chính quyền địa phương, cơ quan, tổ chức có liên quan thực hiện các hoạt động phòng, ngừa, đấu tranh với tội phạm về ma túy.","3. Thực hiện nhiệm vụ quản lý nhà nước các hoạt động quy định tại khoản 5 Điều 27 và thực hiện quy định về phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này.","4. Phối hợp với cơ quan có thẩm quyền của các quốc gia để phát hiện, ngăn chặn các hành vi mua bán, vận chuyển trái phép các chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất qua biên giới theo quy định của pháp luật."]],["D",142,"Bộ Tài chính",["1. Chỉ đạo cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Hải quan chủ trì, phối hợp với các cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân, Bộ đội Biên phòng và Cảnh sát biển trong kiểm tra, kiểm soát, phát hiện và phối hợp với các lực lượng chức năng xử lý các hành vi vi phạm pháp luật, tội phạm về ma túy trong địa bàn hoạt động của Hải quan.","2. Trên cơ sở đề xuất của các Bộ, ngành, địa phương, Bộ Tài chính chủ trì cân đối, đề xuất, trình các cấp có thẩm quyền bố trí kinh phí phòng, chống ma túy cho các bộ, ngành, địa phương theo quy định của pháp luật về ngân sách nhà nước, về đầu tư công và các pháp luật liên quan. Riêng các nhiệm vụ về khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số bố trí từ nguồn ngân sách nhà nước cho lĩnh vực khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số theo quy định, Bộ Tài chính tổng hợp trình các cấp có thẩm quyền trên cơ sở đề xuất của Bộ Khoa học và công nghệ.","3. Chỉ đạo cơ quan Hải quan thực hiện thủ tục hải quan, chế độ kiểm tra, giám sát hải quan đối với các hoạt động nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, vận chuyển quá cảnh lãnh thổ Việt Nam chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc và thuốc thú y có chứa chất ma túy, tiền chất theo quy định của pháp luật Hải quan; thực hiện quy định về phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này.","4. Ban hành các văn bản quy định, hướng dẫn quản lý và sử dụng kinh phí sự nghiệp từ ngân sách nhà nước thực hiện quản lý người sử dụng trái phép chất ma túy, xác định tình trạng nghiện ma túy, chế độ áp dụng biện pháp đưa đi cai nghiện bắt buộc, công tác cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, cơ sở cai nghiện ma túy, trường giáo dưỡng và công tác quản lý sau cai nghiện ma túy."]],["D",143,"Bộ Y tế",["1. Thực hiện nhiệm vụ quản lý nhà nước các hoạt động theo quy định tại khoản 4 Điều 27 cảu Nghị định này và thực hiện quy định phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này.","2. Chỉ đạo, hướng dẫn cơ quan y tế tại địa phương thực hiện phối hợp tiếp nhận, phân loại; tổ chức điều trị, cắt cơn, giải độc, điều trị các rối loạn tâm thần, điều trị các bệnh lý khác trong thực hiện biện pháp cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","3. Nghiên cứu các bài thuốc và phương pháp cai nghiện ma túy.","4. Phối hợp với Bộ Công an hướng dẫn việc phòng, chống dịch bệnh, khám, chữa bệnh và khám sức khỏe định kỳ cho người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc."]],["D",144,"Bộ Công Thương",["Thực hiện nhiệm vụ quản lý nhà nước các hoạt động theo quy định tại khoản 3 Điều 27 và thực hiện quy định phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này."]],["D",145,"Bộ Nông nghiệp và Môi trường",["1. Thực hiện nhiệm vụ quản lý nhà nước các hoạt động theo quy định tại khoản 2 Điều 27 và thực hiện quy định phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này.","2. Ban hành và đề xuất Chính phủ ban hành, sửa đổi, bổ sung các văn bản thuộc thẩm quyền của Bộ Nông nghiệp và Môi trường về kiểm soát các hoạt động hợp pháp liên quan đến thuốc thú y và nguyên liệu làm thuốc thú y có chứa chất ma túy, tiền chất; thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất và tổ chức thực hiện."]],["D",146,"Bộ Giáo dục và Đào tạo",["1. Chủ trì, phối hợp với Bộ Công an hướng dẫn các cơ sở cai nghiện trong việc tổ chức dạy và học văn hóa; hoạt động giáo dục nghề nghiệp hoặc phối hợp với cơ sở hoạt động giáo dục nghề nghiệp để tổ chức đào tạo các nghề trình độ sơ cấp cho đối tượng cai nghiện ma túy.","2. Chỉ đạo Sở Giáo dục và Đào tạo hướng dẫn các đơn vị liên quan tổ chức dạy học, kiểm tra đánh giá, thi, xác nhận học bạ và cấp giấy chứng nhận hoàn thành chương trình, cấp bằng tốt nghiệp cho người cai nghiện theo quy định, thực hiện chính sách miễn, giảm, hỗ trợ học phí, hỗ trợ chi phí học tập và giá dịch vụ trong lĩnh vực giáo dục, đào tạo đối với người sau cai nghiện ma tuý theo quy định."]],["D",147,"Bộ Dân tộc và Tôn giáo",["1. Chỉ đạo cơ quan chuyên môn về tín ngưỡng tôn giáo các cấp, trong phạm vi chức năng, nhiệm vụ được giao, phối hợp với cơ quan chuyên môn về cai nghiện ma túy và các cơ quan liên quan cùng cấp hướng dẫn, kiểm tra các tổ chức, cá nhân tôn giáo tham gia hoạt động cai nghiện ma túy theo quy định của pháp luật.","2. Phối hợp với các địa phương tuyên truyền, phổ biến giáo dục pháp luật, vận động đồng bào dân tộc thiểu số, chức sắc, chức việc, nhà tu hành, người có uy tín tham gia công tác phòng, chống ma túy, cai nghiện ma túy và tái hòa nhập cộng đồng."]],["D",148,"Ủy ban nhân dân cấp tỉnh",["1. Thực hiện nhiệm vụ quản lý nhà nước các hoạt động theo quy định tại khoản 2, khoản 3, khoản 4 Điều 27 theo lĩnh vực được phân cấp, phân quyền trong phạm vi địa phương và thực hiện quy định phối hợp kiểm soát các hoạt động hợp pháp liên quan đến ma túy tại Nghị định này.","2. Chỉ đạo các cơ quan trực thuộc thực hiện công tác phòng, chống ma túy trên địa bàn.","3. Chỉ đạo, hướng dẫn, đôn đốc, kiểm tra các cơ quan, tổ chức, cá nhân trên địa bàn thực hiện các văn bản quy phạm pháp luật về kiểm soát các hoạt động hợp pháp liên quan đến ma túy trong phạm vi lĩnh vực và địa bàn quản lý nhằm phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó vào mục đích bất hợp pháp; thực hiện quản lý nhà nước về phòng, chống ma túy.","4. Hỗ trợ các điều kiện về cơ sở vật chất, trang thiết bị và nhân sự cho các Cơ sở cai nghiện ma túy công lập; chỉ đạo Ủy ban nhân dân cấp xã bảo đảm điều kiện về cơ sở vật chất, trang thiết bị và nhân sự để tổ chức cai nghiện ma túy tự nguyện tại gia đình và cộng đồng theo quy định tại Nghị định này và các quy định pháp luật có liên quan khác. Xây dựng cơ chế, chính sách hỗ trợ, thu hút người vào làm việc tại các Cơ sở cai nghiện ma túy công lập; chính sách khuyến khích tổ chức, cá nhân tham gia công tác cai nghiện ma túy tự nguyện, đào tạo nghề, tạo việc làm cho người sau cai nghiện ma túy.","5. Chỉ đạo các cơ quan chuyên môn tổ chức tập huấn, bồi dưỡng nghiệp vụ cho đội ngũ công chức, viên chức, người lao động làm công tác cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, quản lý sau cai nghiện ma túy; chỉ đạo các cơ sở bảo trợ xã hội trong việc tiếp nhận đối tượng không xác định được nơi cư trú là người chưa thành niên hoặc người ốm yếu không còn khả năng lao động khi chấp hành xong biện pháp đưa đi cai nghiện bắt buộc.","6. Thường xuyên hướng dẫn, chỉ đạo Ủy ban nhân dân cấp xã và các cơ quan chức năng có liên quan của địa phương thực hiện công tác cai nghiện tự nguyện tại gia đình, cộng đồng và quản lý sau cai nghiện ma túy; giải quyết kịp thời các khiếu nại, tố cáo trong việc tổ chức cai nghiện, quản lý sau cai nghiện ma túy theo quy định của pháp luật; tạo điều kiện thuận lợi cho các cơ sở cai nghiện hoạt động trên địa bàn và có chính sách hỗ trợ những người đã chấp hành xong quyết định đưa đi cai nghiện bắt buộc tìm việc làm, sớm ổn định cuộc sống, hòa nhập cộng đồng.","7. Xử lý kỷ luật kịp thời, nghiêm minh đối với người có sai phạm trong việc tổ chức thực hiện công tác cai nghiện tự nguyện tại gia đình, cộng đồng và quản lý sau cai nghiện ma túy thuộc phạm vi quản lý.","8. Hằng năm, căn cứ vào tình hình thực tế của ngân sách địa phương, bố trí kinh phí hỗ trợ cho công an cùng cấp đối với việc tổ chức thực hiện áp dụng biện pháp đưa đi cai nghiện bắt buộc, công tác cai nghiện tự nguyện tại gia đình, cộng đồng và quản lý sau cai nghiện ma túy."]],["C","Chương IX","TỔ CHỨC THỰC HIỆN"],["D",149,"Kinh phí thực hiện",["Kinh phí thực hiện các hoạt động phối hợp của các cơ quan chuyên trách phòng, chống tội phạm về ma túy; kiểm soát các hoạt động hợp pháp liên quan đến ma túy, được bố trí trong dự toán chi thường xuyên của các bộ, cơ quan trung ương và các địa phương theo quy định của pháp luật về ngân sách nhà nước."]],["D",150,"Hiệu lực thi hành",["1. Nghị định này có hiệu lực thi hành kể từ ngày 01 tháng 7 năm 2026.","2. Thời điểm áp dụng trang phục của người cai nghiện ma túy và người lao động hợp đồng tại cơ sở cai nghiện ma túy công lập được áp dụng từ ngày 01 tháng 06 năm 2027.","3. Các văn bản sau đây hết hiệu lực thi hành kể từ ngày Nghị định này có hiệu lực thi hành:","a) Nghị định số 105/2021/NĐ-CP ngày 04 tháng 12 năm 2021 của Chính phủ quy định chi tiết và hướng dẫn thi hành một số Điều của Luật phòng, chống ma túy;","b) Nghị định số 116/2021/NĐ-CP ngày 21 tháng 12 năm 2021 của Chính phủ quy định chi tiết một số Điều của Luật phòng, chống ma túy, Luật Xử lý vi phạm hành chính về cai nghiện ma túy và quản lý sau cai nghiện ma túy;","c) Khoản 1 Điều 2 và Điều 20 của Nghị định số 184/2025/NĐ-CP ngày 01 tháng 7 năm 2025 của Chính phủ quy định phân định thẩm quyền khi thực hiện chính quyền địa phương 02 cấp và sửa đổi, bổ sung một số điều của các Nghị định của Chính phủ trong lĩnh vực an ninh, trật tự;","d) Điểm g Khoản 4 Điều 48 Nghị định này có hiệu lực kể từ ngày 01 tháng 01 năm 2027;","đ) Thông tư số 34/2025/TT-BCA ngày 6 tháng 5 năm 2025 quy định một số hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh;","e) Nội dung liên quan đến áp dụng biện pháp xử lý hành chính đưa vào cơ sở cai nghiện bắt buộc và biện pháp đưa vào cơ sở cai nghiện bắt buộc đối với người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi quy định tại Thông tư liên tịch số 03/2025/TTLT-BCA-VKSNDTC-TANDTC ngày 01 tháng 3 năm 2025 của Bộ trưởng Bộ Công an, Viện trưởng Viện kiểm sát nhân dân tối cao, Chánh án Tòa án nhân dân tối cao quy định về xử lý một số vấn đề liên quan đến áp dụng các biện pháp xử lý hành chính đưa vào trường giáo dưỡng, cơ sở giáo dục bắt buộc, cơ sở cai nghiện bắt buộc và biện pháp đưa vào cơ sở cai nghiện bắt buộc đối với người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi khi sắp xếp tổ chức bộ máy nhà nước.","4. Trong trường hợp các quy định được dẫn chiếu tại Nghị định được sửa đổi, bổ sung, thay thế thì áp dụng theo các văn bản sửa đổi, bổ sung, thay thế."]],["D",151,"Điều khoản chuyển tiếp",["1. Người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; người đang điều trị nghiện bằng thuốc thay thế hoặc người đang bị quản lý sau cai nghiện ma túy từ trước ngày 01 tháng 7 năm 2026 thì vẫn bị áp dụng biện pháp giám sát điện tử theo quy định tại Điều 15 của Nghị định này. Việc xác định độ tuổi của người bị áp dụng biện pháp giám sát điện tử để làm căn cứ ra quyết định áp dụng biện pháp giám sát điện tử được tính đến thời điểm Công an cấp xã ra quyết định áp dụng biện pháp giám sát điện tử.","2. Các tổ chức, cá nhân có hoạt động hợp pháp liên quan đến thức ăn chăn nuôi, thức ăn thủy sản và nguyên liệu làm thức ăn chăn nuôi, thức ăn thủy sản có chứa tiền chất thực hiện các quy định tại Nghị định này kể từ ngày 01 tháng 01 năm 2027.","3. Hồ sơ xin cấp giấy phép hoạt động cho cơ sở cai nghiện tư nhân đã nộp trước khi Nghị định này có hiệu lực thì tiếp tục thực hiện theo quy định của Nghị định số 116/2021/NĐ-CP ngày 21 tháng 12 năm 2021 của Chính phủ quy định chi tiết một số Điều của Luật phòng, chống ma túy, Luật Xử lý vi phạm hành chính về cai nghiện ma túy và quản lý sau cai nghiện ma túy; trừ trường hợp cơ quan, tổ chức, cá nhân đã nộp hồ sơ có yêu cầu thực hiện theo quy định của Nghị định này.","4. Giấy phép hoạt động đã được cấp cho cơ sở cai nghiện tư nhân trước khi Nghị định này có hiệu lực thì còn giá trị cho đến hết thời hạn của giấy phép. Sau khi hết thời hạn, cơ sở cai nghiện tư nhân phải thực hiện việc cấp giấy phép hoạt động theo quy định của Nghị định này.","5. Kinh phí thu được từ kết quả lao động trị liệu còn tại cơ sở cai nghiện ma túy công lập từ 01 tháng 7 năm 2026 trở về trước được dùng để thực hiện các hoạt động văn hóa, văn nghệ, thể dục thể thao và khen thưởng cho người cai nghiện ma túy.","6. Người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi đang cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập trước khi Nghị định này có hiệu lực mà thời gian cai nghiện còn lại ít hơn 06 tháng thì tiếp tục cai nghiện tại cơ sở cai nghiện ma túy công lập đến hết thời hạn cai nghiện ma túy."]],["D",152,"Trách nhiệm thi hành",["Các Bộ trưởng, Thủ trưởng cơ quan ngang bộ, Thủ trưởng cơ quan thuộc Chính phủ, Chủ tịch Ủy ban nhân dân cấp tỉnh và tổ chức, cá nhân có liên quan chịu trách nhiệm hướng dẫn và thi hành Nghị định này./."]]]},"tt79":{"short":"TT 79/2026","full":"Thông tư 79/2026/TT-BCA về vị trí việc làm, nhân sự, quy trình cai nghiện, chế độ người cai nghiện tại cơ sở công lập","note":"Bộ trưởng Bộ Công an ban hành 05/6/2026; hiệu lực 01/7/2026","items":[["C","Chương I","QUY ĐỊNH CHUNG"],["D",1,"Phạm vi điều chỉnh",["Thông tư này hướng dẫn và quy định về các nội dung: khung danh mục vị trí việc làm, điều kiện nhân sự, quy trình cai nghiện ma túy và chế độ của người cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng; trang phục của lao động hợp đồng tại cơ sở cai nghiện ma túy công lập."]],["D",2,"Đối tượng áp dụng",["Thông tư này áp dụng đối với:","1. Cơ sở cai nghiện ma túy công lập.","2. Trường giáo dưỡng.","3. Cán bộ, chiến sĩ tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","4. Lao động hợp đồng tại cơ sở cai nghiện ma túy công lập.","5. Người cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng và gia đình của người cai nghiện ma túy.","6. Các cơ quan, tổ chức, cá nhân có liên quan khác."]],["D",3,"Chế độ của người cai nghiện ma túy tại trường giáo dưỡng, khu quản lý người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi tại cơ sở cai nghiện ma túy công lập",["Chế độ của người cai nghiện ma túy tại trường giáo dưỡng, khu quản lý người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi tại cơ sở cai nghiện ma túy công lập được thực hiện theo quy định về chế độ của học sinh tại trường giáo dưỡng theo quy định của Chính phủ và Bộ Công an về chế độ áp dụng biện pháp xử lý hành chính đưa vào trường giáo dưỡng và cơ sở giáo dục bắt buộc."]],["D",4,"Thời hạn, quy trình cai nghiện ma túy trong trường giáo dưỡng",["1. Thời hạn cai nghiện ma túy tại trường giáo dưỡng thực hiện theo quy định tại khoản 1 Điều 29 của Luật Phòng, chống ma túy năm 2025.","2. Trường giáo dưỡng thực hiện quy trình cai nghiện ma túy đối với người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi theo quy định tại Chương III Thông tư này."]],["D",5,"Hệ thống quản lý cơ sở cai nghiện thông minh",["1. Hệ thống quản lý cơ sở cai nghiện thông minh gồm:","a) Phần mềm quản lý cơ sở cai nghiện được kết nối, đồng bộ với cơ sở dữ liệu quốc gia về dân cư; cơ sở dữ liệu người nghiện ma túy và người bị quản lý sau cai nghiện ma túy.","b) Hệ thống trang thiết bị công nghệ phục vụ công tác cai nghiện, quản lý, giám sát, điều hành; tăng cường khả năng kiểm soát, phòng ngừa vi phạm và bảo đảm an ninh, an toàn tại cơ sở cai nghiện ma túy.","2. Triển khai hệ thống quản lý cơ sở cai nghiện thông minh là hoạt động chuyển đổi số trong lĩnh vực cai nghiện ma túy; việc thực hiện phải bảo đảm tính công khai, minh bạch, thống nhất theo các quy định tại Thông tư này."]],["C","Chương II","KHUNG DANH MỤC VỊ TRÍ VIỆC LÀM, ĐIỀU KIỆN NHÂN SỰ CỦA CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP, TRƯỜNG GIÁO DƯỠNG"],["D",6,"Khung danh mục vị trí việc làm tại cơ sở cai nghiện ma túy công lập",["1. Trưởng cơ sở; Phó Trưởng cơ sở; Tổ trưởng; Phó Tổ trưởng.","2. Tham mưu, hành chính, tổng hợp; tổ chức cán bộ; kế hoạch tài chính; văn thư; thủ quỹ; tiếp nhận, quản lý, lưu trữ, báo cáo, số hóa hồ sơ người cai nghiện ma túy; tiếp dân; căng tin; sửa chữa, bảo trì đối với: hệ thống cấp điện, cấp, thoát nước, phương tiện và các máy móc, thiết bị khác; cấp dưỡng cho cán bộ, chiến sĩ, lao động hợp đồng và người cai nghiện ma túy; vệ sinh khu vực sử dụng chung, chăm sóc vườn hoa, cây cảnh; lái xe ô tô, lái phương tiện thủy nội địa đối với các cơ sở cai nghiện ma túy có địa bàn đảo (phục vụ công tác chung).","3. Quản lý người cai nghiện ma túy và giáo dục, dạy nghề.","4. Cán bộ, nhân viên y tế gồm: Bác sĩ, dược sĩ, y tá, y sĩ, điều dưỡng, phục hồi chức năng, kỹ thuật viên y tế và chuyên môn khác phù hợp."]],["D",7,"Điều kiện nhân sự tại cơ sở cai nghiện ma túy công lập",["1. Chỉ huy cơ sở cai nghiện ma túy công lập, cán bộ, chiến sĩ và lao động hợp đồng làm công tác quản lý người cai nghiện ma túy và giáo dục, dạy nghề; cán bộ, nhân viên y tế phải có chứng chỉ hoặc chứng nhận tham gia các khóa đào tạo, tập huấn, bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy do cơ quan, tổ chức có thẩm quyền cấp theo khung chương trình do Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy ban hành.","2. Người phụ trách chuyên môn thực hiện giai đoạn điều trị cắt cơn, giải độc, rối loạn tâm thần và các bệnh lý khác là bác sĩ, có chứng chỉ hành nghề khám bệnh, chữa bệnh chuyên khoa tâm thần hoặc đa khoa hoặc chuyên khoa nội hoặc chuyên khoa y học cổ truyền. Trường hợp bác sĩ có chứng chỉ hành nghề khám bệnh, chữa bệnh đa khoa hoặc chuyên khoa nội hoặc chuyên khoa y học cổ truyền phải được đào tạo, bồi dưỡng kiến thức chuyên môn xác định tình trạng nghiện, điều trị cắt cơn, giải độc, rối loạn tâm thần tại cơ sở có chức năng đào tạo."]],["D",8,"Khung danh mục vị trí việc làm và điều kiện nhân sự của trường giáo dưỡng",["1. Khung danh mục vị trí việc làm của trường giáo dưỡng thực hiện theo quy định của Bộ trưởng Bộ Công an.","2. Cán bộ, chiến sĩ và lao động hợp đồng của trường giáo dưỡng làm công tác cai nghiện ma túy phải có chứng chỉ hoặc chứng nhận tham gia các khóa đào tạo, tập huấn, bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy do cơ quan, tổ chức có thẩm quyền cấp theo khung chương trình của Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy ban hành.","Người phụ trách chuyên môn thực hiện giai đoạn điều trị cắt cơn, giải độc, rối loạn tâm thần và các bệnh lý khác là bác sĩ tại trường giáo dưỡng phải đáp ứng điều kiện của khoản 2 Điều 7 Thông tư này."]],["C","Chương III","QUY TRÌNH CAI NGHIỆN MA TÚY TẠI CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP"],["D",9,"Giai đoạn tiếp nhận, phân loại",["1. Nội dung và biện pháp thực hiện","a) Tổ Tham mưu, tổng hợp chủ trì, phối hợp với Tổ Quản lý người cai nghiện ma túy và giáo dục, dạy nghề tiếp nhận, kiểm tra hồ sơ của người cai nghiện ma túy, đối chiếu người được tiếp nhận với các thông tin trong hồ sơ để bảo đảm đúng người cai nghiện ma túy và lập hồ sơ người cai nghiện ma túy để quản lý, lưu trữ. Đối với hồ sơ của người cai nghiện ma túy bắt buộc thực hiện theo quy định về công tác hồ sơ của Bộ Công an; đối với hồ sơ của người cai nghiện ma túy tự nguyện thực hiện theo Mẫu số 01 Phụ lục I ban hành kèm theo Thông tư này;","b) Tổ Y tế chủ trì, phối hợp với Tổ Quản lý người cai nghiện ma túy và giáo dục, dạy nghề tiến hành thu thập thông tin cá nhân của người cai nghiện ma túy gồm: độ tuổi, giới tính, tình trạng sức khỏe, loại ma túy sử dụng, mức độ sử dụng, trình độ học vấn, nghề nghiệp và các vấn đề khác về bản thân, gia đình người cai nghiện ma túy.","2. Tổ Quản lý người cai nghiện ma túy và giáo dục, dạy nghề chủ trì, phối hợp với Tổ Tham mưu, tổng hợp cung cấp thông tin về chương trình, phương pháp cai nghiện cho người cai nghiện ma túy; phối hợp với Tổ Y tế phân loại đối tượng và tư vấn xây dựng kế hoạch cai nghiện ma túy, gồm:","a) Thông tin, tư vấn về phương pháp, chương trình cai nghiện ma túy; giải đáp các thắc mắc cho người cai nghiện ma túy;","b) Kiểm tra người (nam kiểm tra nam, nữ kiểm tra nữ), đồ dùng cá nhân; lưu giữ tài sản cá nhân (nếu có) theo quy định và cấp phát đồ dùng, tư trang cá nhân theo chế độ cho người cai nghiện ma túy, chụp ảnh hoàn thiện hồ sơ. Lập biên bản giao, nhận ghi rõ tình trạng sức khỏe; số lượng tài liệu, hồ sơ; tư trang, đồ dùng cá nhân của người bị đưa đi cơ sở cai nghiện ma túy công lập;","c) Phổ biến nội quy của cơ sở cai nghiện ma túy;","d) Tư vấn cho người cai nghiện ma túy, gia đình người cai nghiện ma túy về phương pháp cai nghiện, vai trò, trách nhiệm của gia đình trong suốt quá trình người nghiện cai nghiện ma túy thực hiện cai nghiện. Tư vấn các biểu hiện của hội chứng cai khi cắt cơn, diễn biến, biểu hiện tâm lý trong các giai đoạn, những nguy cơ có thể xảy ra; tư vấn thuốc hỗ trợ điều trị theo từng giai đoạn;","đ) Xếp phòng, phân khu người cai nghiện ma túy theo từng nhóm: nhân thân tốt, thời gian nghiện ma túy; có tiền án, tiền sự; nghiện lâu năm, tái nghiện; bệnh truyền nhiễm để tổ chức theo dõi, quản lý;","e) Phân loại người cai nghiện ma túy và tư vấn xây dựng kế hoạch cai nghiện ma túy;","g) Thông báo bằng văn bản cho Công an cấp xã nơi người đó đăng ký cai nghiện ma túy tự nguyện khi người cai nghiện ma túy sử dụng dịch vụ hoặc tự ý chấm dứt việc sử dụng dịch vụ tại cơ sở cai nghiện ma túy.","3. Cập nhật thông tin ban đầu của người cai nghiện ma túy vào hệ thống cơ sở dữ liệu, số hóa hồ sơ, quản lý danh sách người cai nghiện ma túy; thêm mới, chỉnh sửa, cập nhật và theo dõi các thông tin liên quan đến người cai nghiện ma túy; quản lý, lưu trữ và xuất các biểu mẫu nghiệp vụ liên quan đến quá trình tiếp nhận, quản lý người cai nghiện ma túy trên phần mềm quản lý cơ sở cai nghiện ma túy."]],["D",10,"Giai đoạn điều trị cắt cơn, giải độc, rối loạn tâm thần và các bệnh lý khác",["1. Nội dung và phương pháp thực hiện","a) Khám, lập hồ sơ bệnh án đối với người cai nghiện ma túy theo Mẫu số 02 Phụ lục I ban hành kèm theo Thông tư này; chú ý các dấu hiệu rối loạn tâm thần, bệnh nhiễm trùng cơ hội, bệnh truyền nhiễm.","Căn cứ vào các biểu hiện, triệu chứng trong hội chứng cai, trạng thái cai và các biểu hiện rối loạn tâm thần; tình trạng sức khỏe người cai nghiện ma túy, xác định loại ma túy đã từng sử dụng, khai thác về liều lượng, mức độ phụ thuộc của người cai nghiện ma túy để xây dựng phác đồ cắt cơn, giải độc, điều trị các rối loạn tâm thần, xây dựng phác đồ điều trị cho phù hợp với người cai nghiện ma túy theo quy định, hướng dẫn của Bộ Y tế.","Hằng ngày, cán bộ, nhân viên y tế khám, ra y lệnh về thuốc, chế độ chăm sóc, theo dõi, ăn uống và ghi diễn biến vào bệnh án điều trị đối với người cai nghiện ma túy theo quy định. Việc cấp phát và giám sát sử dụng thuốc đối với người cai nghiện ma túy phải được thực hiện chặt chẽ, đúng quy định;","b) Tư vấn tâm lý đối với người cai nghiện ma túy trước khi điều trị cắt cơn, giải độc. Nắm bắt, nhận định diễn biến tâm lý và các vấn đề người cai nghiện ma túy gặp phải; các bệnh nhiễm trùng cơ hội, bệnh truyền nhiễm để đưa ra các biện pháp tư vấn tâm lý giúp người cai nghiện ma túy yên tâm, giải tỏa tâm lý, giảm bớt áp lực và phối hợp trong điều trị. Việc tư vấn tâm lý cho người cai nghiện thực hiện trong suốt quá trình điều trị giúp người cai nghiện ma túy nhanh chóng hồi phục;","c) Thực hiện phác đồ điều trị theo các quy định, hướng dẫn chuyên môn của Bộ Y tế. Kết hợp sử dụng thuốc với các biện pháp tâm lý và các biện pháp vật lý trị liệu phục hồi chức năng; kết hợp điều trị cắt cơn, giải độc với điều trị rối loạn tâm thần và các bệnh cơ hội khác.","Tư vấn, giải thích với thân nhân người cai nghiện ma túy về các bệnh lý phát sinh trong quá trình cai nghiện tại cơ sở cai nghiện ma túy để phối hợp khám và điều trị chuyên khoa đối với các bệnh lý khác (nếu có);","d) Cán bộ, nhân viên y tế thực hiện việc khám, chữa bệnh theo đúng quy trình chuyên môn, phạm vi hoạt động chuyên môn, nếu vượt quá khả năng chuyên môn thì thực hiện chuyển người bệnh đến cơ sở y tế phù hợp theo quy định.","2. Tạo lập, quản lý bệnh án điện tử của người cai nghiện ma túy; theo dõi quá trình điều trị cắt cơn, giải độc và điều trị các bệnh lý liên quan; theo dõi quá trình khám, chẩn đoán và điều trị bệnh của người cai nghiện trong suốt thời gian cai nghiện; quản lý hồ sơ y tế và lịch sử điều trị của người cai nghiện ma túy trên phần mềm quản lý cơ sở cai nghiện ma túy."]],["D",11,"Giai đoạn giáo dục, tư vấn, phục hồi hành vi, nhân cách",["1. Nội dung và phương pháp thực hiện","a) Tổ chức học nội quy, quy định của cơ sở cai nghiện ma túy; thực hiện chào cờ và học tập đội ngũ, trật tự nội vụ, chính trị, pháp luật, bổ túc văn hóa, kỹ năng sống và các chuyên đề phù hợp khác.","Chào cờ Tổ quốc: Tổ chức cho người cai nghiện ma túy học hát Quốc ca và nghi lễ chào cờ Tổ quốc bảo đảm thực hiện mỗi tuần/lần vào sáng thứ Hai. Số lượng người cai nghiện ma túy tham gia lễ chào cờ Tổ quốc mỗi lần do Trưởng cơ sở cai nghiện ma túy quyết định. Cán bộ của cơ sở cai nghiện ma túy có chuyên môn, kinh nghiệm hoặc phối hợp với Phòng Công tác chính trị và Phòng Cảnh sát Cơ động hướng dẫn cho người cai nghiện ma túy học hát Quốc ca và nghi lễ chào cờ Tổ quốc.","Học tập đội ngũ và trật tự nội vụ: Tổ chức cho người cai nghiện ma túy nắm vững các động tác cơ bản, rèn luyện tính kỷ luật và tinh thần tập thể, xây dựng tác phong nhanh nhẹn, nghiêm túc và tạo thói quen sinh hoạt có tổ chức, nề nếp. Mỗi lớp học có sĩ số từ 10 người trở lên, do một cán bộ phụ trách chính và một cán bộ trợ giảng đảm nhiệm. Cán bộ cơ sở cai nghiện ma túy có chuyên môn, kinh nghiệm hoặc phối hợp với Phòng Công tác chính trị và Phòng Cảnh sát Cơ động hướng dẫn cho người cai nghiện ma túy học tập đội ngũ và trật tự nội vụ.","Học chính trị: Mỗi lớp học có sĩ số từ 15 người cai nghiện ma túy trở lên. Nội dung, chương trình học tập phải bảo đảm tính thiết thực, dễ hiểu, phương pháp sinh động và phù hợp với đối tượng, đồng thời bảo đảm tính hiệu quả và thiết thực trong việc giáo dục, cải tạo người cai nghiện ma túy. Giảng viên là cán bộ cơ sở cai nghiện ma túy có kinh nghiệm công tác từ 05 năm trở lên và có trình độ Trung cấp lý luận chính trị. Cơ sở cai nghiện ma túy có thể phối hợp với các đơn vị chức năng của Công an cấp tỉnh hoặc có quy chế phối hợp với trung tâm giáo dục chính trị trên địa bàn để tổ chức thực hiện.","Học pháp luật: Mỗi lớp học có sĩ số từ 15 người cai nghiện ma túy trở lên. Giảng viên là cán bộ của cơ sở cai nghiện ma túy có chuyên môn và kinh nghiệm giảng dạy, có trợ giảng hỗ trợ thảo luận nhóm. Cơ sở cai nghiện ma túy có thể ký kết hợp đồng hoặc có quy chế phối hợp với các cơ sở giáo dục đóng trên địa bàn hoặc các trường Công an nhân dân để tổ chức thực hiện.","Học kỹ năng sống: Mỗi lớp học có sĩ số từ 15 người cai nghiện ma túy trở lên; ngoài tổ chức giảng dạy theo chương trình, thời gian thực hành chiếm 60% tổng thời lượng. Ngoài ra, người cai nghiện ma túy phải duy trì sinh hoạt nhóm hằng tuần trong suốt quá trình cai nghiện. Giảng viên là cán bộ của cơ sở cai nghiện ma túy có chuyên môn và kinh nghiệm hướng dẫn, có trợ giảng hỗ trợ thực hành. Cơ sở cai nghiện ma túy có thể ký kết hợp đồng hoặc có quy chế phối hợp với các cơ sở giáo dục, các trung tâm có chức năng đào tạo kỹ năng sống hoặc các chuyên gia tâm lý để tổ chức thực hiện.","Bổ túc văn hóa: Tùy thuộc khả năng và điều kiện thực tế, cơ sở cai nghiện ma túy xây dựng chương trình dạy học cho người cai nghiện ma túy theo chương trình xóa mù chữ của Bộ Giáo dục và Đào tạo. Thời gian học được phân bổ vào buổi sáng, buổi chiều và thời gian tự học vào buổi tối. Cán bộ, lao động hợp đồng của cơ sở cai nghiện ma túy có chuyên môn để giảng dạy văn hóa, xóa mù chữ hoặc phối hợp với các trường tiểu học, trung học cơ sở trên địa bàn thực hiện.","Rèn luyện thể chất: Được triển khai sau giai đoạn cắt cơn, giải độc nhằm bảo đảm an toàn và phục hồi sức khỏe cho người cai nghiện ma túy. Việc tập luyện được cá thể hóa theo thể trạng, giới tính và mức độ nghiện; bắt đầu với cường độ thấp, tăng dần theo thời gian.","Trong quá trình thực hiện giai đoạn giáo dục, tư vấn, phục hồi hành vi, nhân cách cần tiếp tục điều trị phối hợp các bệnh lý kèm theo (nếu có) theo quy trình, phạm vi hoạt động chuyên môn, nếu vượt quá khả năng chuyên môn thì chuyển đến cơ sở khám bệnh, chữa bệnh có cấp chuyên môn, kỹ thuật theo quy định.","Nội dung, chương trình, tài liệu học văn hóa, chính trị, pháp luật, kỹ năng sống, học tập đội ngũ, trật tự nội vụ và các nội dung khác theo tài liệu của Nhà nước và Bộ Công an ban hành. Việc đánh giá kết quả học tập tại các cơ sở cai nghiện ma túy dựa trên ba tiêu chí: kiểm tra giữa khóa (30%), bài tập tình huống (30%) và kiểm tra cuối khóa (40%). Lấy kết quả học tập để làm căn cứ đánh giá, phân loại người cai nghiện ma túy;","b) Tổ chức các hoạt động trị liệu tâm lý nhằm điều trị các rối loạn tâm thần, nâng cao kỹ năng sống, giá trị sống, tư duy tích cực, kỹ năng tự quản lý bản thân cho người cai nghiện ma túy:","Tư vấn cá nhân: Tìm hiểu tâm tư, nguyện vọng, các vấn đề người cai nghiện ma túy đang gặp phải cần tham vấn, tư vấn; xây dựng nội dung trị liệu và thực hiện trị liệu tâm lý phù hợp với từng vấn đề của người cai nghiện ma túy đang gặp phải (có tư tưởng tiêu cực, lo lắng, vi phạm quy chế, kích động, chống đối...); khai thác, chia sẻ, lắng nghe ý kiến người cai nghiện ma túy để tư vấn giúp người cai nghiện ma túy yên tâm cai nghiện ma túy. Nắm bắt tâm tư, nguyện vọng, tình cảm để giúp người cai nghiện ma túy xóa bỏ sự cô độc, mặc cảm nhằm điều trị các rối loạn tâm thần, nâng cao kỹ năng sống, tư duy tích cực, kỹ năng tự quản lý bản thân cho người cai nghiện ma túy.","Thời gian tư vấn cá nhân: Tùy từng vấn đề cần trị liệu của người cai nghiện ma túy, cơ sở cai nghiện ma túy có trách nhiệm phân công cán bộ và bố trí thời gian hợp lý để thực hiện, tối thiểu 45 phút/lần, tối đa không quá 02 lần/tuần. Thời gian thực hiện tư vấn có thể kéo dài trong suốt quá trình cai nghiện ma túy.","Tư vấn nhóm: Xây dựng kế hoạch trị liệu tâm lý theo nhóm và triển khai thực hiện để từng người cai nghiện ma túy được tham gia, nâng cao khả năng tương tác, giảm bớt sự căng thẳng, lo âu và nhận ra được giá trị của bản thân.","Tổ chức người cai nghiện ma túy thành từng nhóm; tại mỗi nhóm, người cai nghiện ma túy có thể bày tỏ những tâm tư, vướng mắc, lo âu để mọi người trong nhóm cùng trao đổi, thảo luận, tìm cách giúp đỡ, xóa bỏ sự cô độc, mặc cảm, thúc đẩy sự tôn trọng lẫn nhau, sự cởi mở và chia sẻ giữa mọi người. Hoạt động này được duy trì thường xuyên (hằng ngày, hằng tuần, hằng tháng). Tổ chức sinh hoạt, giao lưu tổ, nhóm đối với người cai nghiện ma túy: Sinh hoạt, giao lưu về các chủ đề đạo đức, trách nhiệm với gia đình và xã hội, về tác hại của nghiện ma túy.","Thời gian tư vấn nhóm: Cơ sở cai nghiện ma túy có trách nhiệm phân công cán bộ và bố trí thời gian hợp lý để thực hiện tối thiểu 60 phút/lần, tối đa không quá 02 lần/tuần;","c) Kết hợp học tập, lao động trị liệu với tư vấn, khuyến khích người cai nghiện ma túy tham gia các hoạt động lao động sinh hoạt hằng ngày như: dọn vệ sinh môi trường, cảnh quan, phòng ở, nhà xưởng, trồng cây, cắt tỉa cây cảnh, cắt tóc, nấu ăn và các hoạt động khác phù hợp với điều kiện thực tế của cơ sở cai nghiện ma túy;","d) Tổ chức thực hiện các hoạt động văn hóa, thể thao, các chương trình sinh hoạt tập thể, trò chơi vận động cho người cai nghiện ma túy chào mừng các ngày lễ, Tết trong năm như: Tổ chức giải thể thao nội bộ cho người cai nghiện ma túy tại các khu quản lý; giữa cán bộ, lao động hợp đồng với người cai nghiện ma túy. Hoạt động trò chơi, giao lưu văn nghệ, thể thao giữa cán bộ, chiến sĩ, lao động hợp đồng, người cai nghiện ma túy tại cơ sở với các đơn vị khác. Tổ chức các hội thi tìm hiểu về chủ đề lịch sử, văn hóa, xã hội; công tác cai nghiện ma túy, kiến thức pháp luật và các vấn đề khác. Tổ chức hoạt động vui chơi, thể thao sau thời gian lao động trị liệu, học tập vào cuối buổi chiều trong ngày như: Bóng đá, bóng chuyền, đá cầu... Tổ chức các hoạt động văn hóa khác như: đọc sách, báo …","Căn cứ điều kiện thực tế, Trưởng cơ sở cai nghiện ma túy quyết định tổ chức các hoạt động văn hóa, văn nghệ, thể dục, thể thao, các chương trình sinh hoạt tập thể, trò chơi vận động cho người cai nghiện ma túy cho phù hợp, bảo đảm đời sống thể chất, tinh thần của người cai nghiện ma túy.","2. Quản lý các chương trình giáo dục, tư vấn và phục hồi hành vi, nhân cách dành cho người cai nghiện ma túy; theo dõi quá trình tham gia, kết quả học tập, đánh giá và quá trình phục hồi hành vi, nhân cách của người cai nghiện ma túy trên phần mềm quản lý cơ sở cai nghiện ma túy."]],["D",12,"Giai đoạn lao động trị liệu, học nghề",["1. Nội dung và phương pháp thực hiện:","a) Tổ chức các hoạt động lao động trị liệu nhằm giúp người cai nghiện ma túy cải thiện về sức khỏe thể chất, tâm trí, tăng cường ý thức tổ chức, kỷ luật trong lao động, nâng cao tinh thần tự lập và giúp người cai nghiện ma túy nhận thức được giá trị của lao động, trong đó tập trung thực hiện các nội dung sau:","Tiến hành phân nhóm để tổ chức lao động trị liệu phù hợp với sức khỏe, độ tuổi, giới tính giúp người cai nghiện ma túy hiểu được giá trị của lao động và tìm lại kỹ năng lao động. Cơ sở cai nghiện ma túy bố trí cho người cai nghiện ma túy tham gia lao động trị liệu thông qua trồng trọt, chăn nuôi, chăm sóc vườn cây cảnh, vệ sinh khuôn viên cơ sở cai nghiện ma túy.","Căn cứ vào điều kiện và tình hình thực tế, cơ sở cai nghiện ma túy ký kết hợp đồng với các tổ chức, cá nhân cung cấp thiết bị, nguyên liệu để sản xuất, gia công những mặt hàng phù hợp với người cai nghiện ma túy tại cơ sở cai nghiện ma túy theo đúng quy định của pháp luật.","Theo dõi, đánh giá kết quả học tập, lao động trị liệu để mỗi người cai nghiện ma túy đều hưởng thành quả lao động phù hợp với kết quả lao động trị liệu của bản thân. Thời gian lao động trị liệu và kết quả lao động của người cai nghiện ma túy được thực hiện theo quy định của pháp luật;","b) Tổ chức các hoạt động hướng nghiệp, giáo dục nghề nghiệp phù hợp với điều kiện thực tế tại cơ sở cai nghiện ma túy:","Căn cứ vào số lượng, sức khỏe, độ tuổi, giới tính, trình độ, thời gian, nguyện vọng của người cai nghiện ma túy, cơ sở cai nghiện ma túy lập danh sách người cai nghiện ma túy tham gia học nghề và liên kết với các cơ sở giáo dục nghề nghiệp trên địa bàn để đào tạo các nghề: chăn nuôi, trồng trọt, gốm, mộc, xây dựng, cơ khí, nấu ăn, nghiệp vụ khách sạn, điện, sửa chữa ô tô, xe máy và các nghề khác phù hợp. Thời gian học nghề áp dụng cho người cai nghiện ma túy còn đủ thời gian cai nghiện từ 03 tháng trở lên.","Cơ sở cai nghiện ma túy chủ động phối hợp với các cơ sở sản xuất, kinh doanh trên địa bàn để tổ chức các hoạt động hướng nghiệp, tư vấn việc làm cho người cai nghiện ma túy. Đồng thời, có quy chế phối hợp để các cơ sở sản xuất, kinh doanh tiếp nhận người sau khi hoàn thành chương trình cai nghiện ma túy vào làm việc;","c) Tổ chức khám sức khỏe định kỳ cho người cai nghiện ma túy 01 lần/năm. Hồ sơ, quy trình và nội dung khám sức khỏe định kỳ được thực hiện theo quy định của Bộ Y tế; tiếp tục điều trị các bệnh lý kèm theo (nếu có) theo quy trình, phạm vi hoạt động chuyên môn, nếu quá khả năng chuyên môn thì chuyển tuyến theo quy định.","2. Quản lý các chương trình lao động trị liệu, hoạt động lao động và học nghề của người cai nghiện ma túy trong cơ sở cai nghiện ma túy; theo dõi quá trình tham gia, chấm công, đánh giá kết quả lao động trị liệu và kết quả học nghề của người cai nghiện ma túy trên phần mềm quản lý cơ sở cai nghiện ma túy."]],["D",13,"Giai đoạn chuẩn bị tái hòa nhập cộng đồng",["1. Nội dung và phương pháp thực hiện","a) Đánh giá kết quả thực hiện kế hoạch cai nghiện theo các mục tiêu: đánh giá tình trạng sức khỏe thể chất, tâm thần của người cai nghiện ma túy; đánh giá kết quả giáo dục, tư vấn phục hồi hành vi, nhân cách; lao động trị liệu, học nghề; đánh giá, chuẩn bị tái hòa nhập;","b) Xác định nơi cư trú của người cai nghiện ma túy để chuẩn bị thực hiện biện pháp quản lý sau cai nghiện ma túy; tư vấn các biện pháp phòng, chống tái nghiện cho người cai nghiện ma túy; kỹ năng từ chối sử dụng ma túy khi tái hòa nhập cộng đồng.","Chậm nhất trong 30 ngày trước khi hết thời gian cai nghiện, cơ sở cai nghiện ma túy gửi thông báo cho Công an cấp xã nơi cư trú đối với người có nơi cư trú ổn định hoặc Công an cấp xã nơi người nghiện ma túy không có nơi cư trú ổn định đăng ký nơi cư trú sau khi hoàn thành cai nghiện, đại diện gia đình của người cai nghiện ma túy từ đủ 18 tuổi trở lên; cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi biết ngày người cai nghiện hết thời hạn cai nghiện ma túy.","Cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện cho người cai nghiện ma túy tự nguyện hoặc giấy xác nhận đã chấp hành xong Quyết định đưa đi cai nghiện bắt buộc cho người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc.","Đối với người từ đủ 12 tuổi đến dưới 18 tuổi đã chấp hành xong quyết định mà không có gia đình đến đón thì cơ sở cai nghiện ma túy có trách nhiệm đưa về bàn giao tại gia đình hoặc Ủy ban nhân dân cấp xã nơi người sau cai nghiện cư trú.","Trường hợp người nghiện ma túy sau khi chấp hành xong biện pháp đưa đi cai nghiện bắt buộc ốm yếu không có khả năng lao động, không xác định được nơi cư trú; người từ đủ 12 tuổi đến dưới 18 tuổi đã hoàn thành cai nghiện ma túy mà không rõ cha, mẹ, không có nơi nương tựa hoặc không xác định được nơi cư trú thì Trưởng cơ sở cai nghiện ma túy có trách nhiệm phối hợp với đơn vị chức năng hoàn chỉnh hồ sơ, thủ tục chuyển người chấp hành xong biện pháp đưa đi cai nghiện bắt buộc vào cơ sở bảo trợ xã hội theo quy định của pháp luật.","Công an cấp xã nơi cư trú của người đã hoàn thành cai nghiện ma túy rà soát, hướng dẫn làm thủ tục cấp các loại giấy tờ cá nhân để người đã hoàn thành cai nghiện có điều kiện thuận lợi tái hòa nhập cộng đồng;","c) Cung cấp thông tin về biện pháp quản lý sau cai nghiện tại cộng đồng và các chính sách hỗ trợ vay vốn để học nghề, tạo việc làm, sản xuất kinh doanh.","Hướng dẫn người đã hoàn thành cai nghiện ma túy đến Công an cấp xã nơi cư trú để trình diện và thực hiện quản lý sau cai nghiện ma túy; chấp hành các quy định trong thời gian bị quản lý sau cai nghiện ma túy.","Tư vấn các chính sách hỗ trợ hòa nhập cộng đồng của Nhà nước đối với người sau cai nghiện ma túy, các mô hình quản lý, hỗ trợ hòa nhập cộng đồng cho người sau cai nghiện ma túy; giới thiệu, cung cấp thông tin, địa chỉ dịch vụ công tác xã hội, nhóm sinh hoạt cộng đồng tại địa phương cho người sau cai nghiện ma túy;","d) Phổ biến chính sách, pháp luật, thông tin về tình hình kinh tế - xã hội, thị trường lao động; tư vấn, giáo dục kỹ năng sống, trợ giúp về tâm lý, hỗ trợ các thủ tục pháp lý nhằm trang bị kiến thức cần thiết, nâng cao khả năng tự giải quyết những khó khăn, vướng mắc của người cai nghiện ma túy, các biện pháp phòng, chống tái nghiện; kỹ năng từ chối sử dụng ma túy khi tái hòa nhập cộng đồng; hướng dẫn, tư vấn, điều trị, dự phòng các bệnh lý (nếu có);","đ) Hướng dẫn người cai nghiện ma túy xây dựng kế hoạch tái hòa nhập cộng đồng. Kế hoạch cần xác định mục tiêu, nguyện vọng của người cai nghiện ma túy, hoàn cảnh thực tế, các nguồn lực hỗ trợ, năng lực bản thân của người cai nghiện ma túy, chọn việc làm phù hợp với sức khỏe và kỹ năng lao động của bản thân;","2. Quản lý kết quả thực hiện kế hoạch cai nghiện của người cai nghiện ma túy trước khi rời cơ sở cai nghiện; quản lý thông tin chuẩn bị tái hòa nhập cộng đồng; hỗ trợ theo dõi quá trình hoàn thành cai nghiện và kết thúc thời gian quản lý tại cơ sở; chia sẻ thông tin với cơ quan chức năng tại địa phương để phục vụ công tác quản lý sau cai trên phần mềm quản lý cơ sở cai nghiện ma túy."]],["C","Chương IV","NỘI QUY CỦA CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP"],["D",14,"Quy định người cai nghiện ma túy phải nghiêm chỉnh chấp hành",["1. Về hiệu lệnh, thời gian","a) Chấp hành nghiêm chỉnh và tuyệt đối tuân theo mệnh lệnh, hiệu lệnh, hướng dẫn, chỉ dẫn của cán bộ cơ sở cai nghiện ma túy;","b) Chấp hành đúng quy định về thời gian học tập, lao động, sinh hoạt, văn hóa, văn nghệ, thể dục, thể thao, vui chơi, giải trí;","c) Khi có hiệu lệnh tập hợp, phải nhanh chóng xếp hàng theo tổ và không gây mất trật tự;","d) Chấp hành việc điểm danh khi sinh hoạt tại khu đăng ký thăm gặp, khu y tế và khu lao động.","2. Về lễ tiết","a) Khi giao tiếp, người cai nghiện ma túy phải dùng tiếng Việt (trừ người chưa biết tiếng Việt);","b) Gọi là “cán bộ” xưng “tôi” đối với cán bộ; gọi “quý khách” xưng “tôi” đối với khách đến thăm hoặc làm việc tại cơ sở cai nghiện ma túy. Gọi “anh” hoặc “chị” xưng “tôi” đối với người cai nghiện ma túy khác; ngoài cách xưng hô nêu trên, tùy theo từng lứa tuổi, người cai nghiện ma túy xưng hô với nhau phù hợp với phong tục, truyền thống văn hóa Việt Nam;","c) Phải “vâng”, “dạ”, “thưa” khi nói chuyện, biết nói lời “cảm ơn”, “xin lỗi” đúng lúc; phải trả lời “có” khi nghe gọi tên mình;","d) Khi gặp cán bộ hoặc khách đến thăm, làm việc tại cơ sở cai nghiện ma túy, người cai nghiện ma túy phải hạ mũ, nón cầm ở tay phải, đứng nghiêm giữ khoảng cách 03 mét và nói “chào cán bộ” hoặc “chào quý khách”; trường hợp đang sinh hoạt theo tổ thì tùy theo trường hợp cụ thể ở khu học tập, lao động, học nghề... tổ trưởng hạ mũ, nón cầm ở tay phải, đứng nghiêm, hô cả tổ đứng nghiêm hoặc ngồi tại chỗ, thay mặt tổ để chào, báo cáo cán bộ hoặc quý khách;","đ) Khi ra vào cổng, nếu đi theo tổ thì đi thành hàng đôi, hạ mũ, nón cầm ở tay phải đối với hàng đi bên phải, cầm ở tay trái đối với hàng đi bên trái; tổ trưởng báo cáo rõ tên tổ, số người của tổ với cán bộ có trách nhiệm.","3. Về trật tự nội vụ","a) Ăn, ngủ đúng giờ, đúng nơi quy định và không gây mất trật tự;","b) Giữ gìn vệ sinh cá nhân; giữ gìn vệ sinh phòng ở và các khu vực khác của cơ sở cai nghiện ma túy; được đem theo đồ dùng sinh hoạt cá nhân cần thiết vào phòng ở theo quy định; đồ dùng sinh hoạt cá nhân phải được gấp, xếp gọn gàng, ngăn nắp để đúng nơi quy định;","c) Người cai nghiện ma túy là nam giới để tóc ngắn gọn gàng, không để râu, ria. Người cai nghiện ma túy là nữ giới để tóc gọn gàng;","d) Thực hiện phòng bệnh, khám bệnh, chữa bệnh theo hướng dẫn của cán bộ cơ sở cai nghiện ma túy.","4. Về trang phục","a) Mặc trang phục được cấp phát chỉnh tề, gọn gàng, sạch sẽ, đi giày hoặc dép trong các trường hợp: Tham gia các lớp học tập, lao động, học nghề; tham gia các hoạt động văn hóa, văn nghệ, thể dục, thể thao, sinh hoạt tập thể; ra, vào cổng, thăm gặp người thân hoặc tiếp xúc với người ngoài; các hoạt động khác của cơ sở cai nghiện ma túy;","b) Giữ quần, áo sạch sẽ, không cho mượn, không được tẩy xóa, sửa chữa, viết, vẽ, in, dán lên quần, áo được cấp.","5. Về học tập, lao động, học nghề, tham gia hoạt động văn hóa, văn nghệ, thể dục, thể thao, vui chơi, giải trí","a) Tích cực, tự giác, chăm chỉ, nghiêm túc tham gia học tập, lao động, học nghề, các hoạt động văn hóa, văn nghệ, thể dục, thể thao, vui chơi, giải trí và các hoạt động khác do cơ sở cai nghiện ma túy tổ chức;","b) Chấp hành nghiêm chỉnh kỷ luật, an toàn, vệ sinh lao động;","c) Dụng cụ lao động, học nghề khi sử dụng xong phải cất giữ đúng nơi quy định.","6. Về bảo vệ, giữ gìn tài sản","a) Phải có ý thức bảo vệ, giữ gìn tài sản của cơ sở cai nghiện ma túy, tập thể, cá nhân và người khác;","b) Khi hết thời hạn chấp hành quyết định ở cơ sở cai nghiện ma túy, người cai nghiện ma túy phải bàn giao lại cho cơ sở cai nghiện ma túy những dụng cụ, tài sản, trang phục được giao quản lý;","c) Nếu gây thiệt hại về tài sản của cơ sở cai nghiện ma túy hoặc của người khác thì xử lý theo quy định của pháp luật."]],["D",15,"Những hành vi bị nghiêm cấm",["Người cai nghiện ma túy được xem là có hành vi bị nghiêm cấm nếu không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự, khi thuộc một trong các trường hợp sau đây:","1. Bỏ trốn; tổ chức, lôi kéo, dụ dỗ, ép buộc, khuyến khích hoặc giúp người cai nghiện ma túy khác bỏ trốn dưới mọi hình thức.","2. Tàng trữ hoặc đưa đồ vật, chất cấm vào cơ sở cai nghiện ma túy quy định tại Điều 16 của Thông tư này.","3. Tự sát, tự gây thương tích cho bản thân, hủy hoại thân thể hoặc giúp người khác tự sát, tự gây thương tích; quan hệ tình dục và các quan hệ không lành mạnh khác.","4. Gây rối trật tự, đe dọa, đánh đập, xâm hại đến sức khỏe, danh dự, nhân phẩm, tài sản của người khác; xâm phạm tài sản của cơ sở cai nghiện ma túy.","5. Chống đối, cản trở hoặc không chấp hành mệnh lệnh và sự hướng dẫn của cán bộ cơ sở cai nghiện ma túy.","6. Sử dụng rượu, bia, đồ uống có cồn, thuốc lá, thuốc lá điện tử, thuốc lá nung nóng, thuốc lào, xì gà các loại và các chất kích thích khác.","7. Đánh bạc, tổ chức đánh bạc dư
