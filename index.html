<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Sổ tay bỏ túi: đầu trang xanh lục đậm ngành, nội dung trên nền giấy sáng, thanh tab cố định đáy cho ngón cái */
  --bg:#f3f5f1; --card:#ffffff; --soft:#e9eee7; --line:#d5ddd2;
  --ink:#16231b; --muted:#5a695f; --head:#123b2a; --head-ink:#f2f6f0;
  --accent:#b3261e; --gold:#a07800; --link:#1d5f97;
  --good:#1f7a3f; --good-bg:#e2f2e7; --info:#1d5f97; --info-bg:#e3eef8; --warn:#8f5c00; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe4e2;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fs:16px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1511; --card:#16201a; --soft:#1c2921; --line:#2b3a30;
    --ink:#e3ebe5; --muted:#9bb0a2; --head:#0b2219; --head-ink:#e3ebe5;
    --accent:#ef6b62; --gold:#d8b24c; --link:#82bdf0;
    --good:#73d095; --good-bg:#173323; --info:#82bdf0; --info-bg:#14273a; --warn:#e8b45c; --warn-bg:#33280f; --bad:#f28b83; --bad-bg:#391a17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1511; --card:#16201a; --soft:#1c2921; --line:#2b3a30;
  --ink:#e3ebe5; --muted:#9bb0a2; --head:#0b2219; --head-ink:#e3ebe5;
  --accent:#ef6b62; --gold:#d8b24c; --link:#82bdf0;
  --good:#73d095; --good-bg:#173323; --info:#82bdf0; --info-bg:#14273a; --warn:#e8b45c; --warn-bg:#33280f; --bad:#f28b83; --bad-bg:#391a17;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--fs)/1.55 var(--font);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
h1{font-size:1.25em} h2{font-size:1.08em} h3{font-size:1em}
p{margin:.5em 0}
ul,ol{margin:.4em 0;padding-left:1.25em} li{margin:.25em 0}
a{color:var(--link)}
.wrap{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:calc(10px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:10px}
header.top .seal{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;flex:none;border:2px solid var(--gold)}
header.top .tt{flex:1;min-width:0}
header.top .tt b{display:block;font-size:15px;line-height:1.2}
header.top .tt span{font-size:12px;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:inherit;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.ib:active{background:rgba(255,255,255,.12)}
main{flex:1;padding:14px 14px calc(86px + var(--safe-b))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px;margin-bottom:12px}
.search input{border:0;background:none;flex:1;padding:9px 0;min-width:0;outline:none;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-height:84px}
.tile b{font-size:.95em;line-height:1.3}
.tile span{font-size:.8em;color:var(--muted)}
.tile .ico{align-self:flex-start;min-width:30px;padding:0 4px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.sec-t{font-size:.78em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 4px 8px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.list a,.list button.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);background:none;width:100%;text-align:left;cursor:pointer}
.list a:last-child,.list button.row:last-child{border-bottom:0}
.list .num{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--muted);flex:none}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-weight:600;font-size:.97em;line-height:1.35}
.list .tx span{display:block;font-size:.8em;color:var(--muted);line-height:1.35}
.chev{color:var(--muted);flex:none}
.fact{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.fact .v{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.fact .k{font-size:.9em}
.law{display:inline-block;font-size:.76em;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 7px;margin-top:2px}
.art h1{margin:4px 0 4px}
.art .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.art h2{margin:18px 0 6px;font-size:1.02em;color:var(--head)}
:root[data-theme="dark"] .art h2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .art h2{color:var(--gold)}}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:9px 12px;border-radius:8px;margin:10px 0;font-size:.92em}
.note.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.note.info{border-left-color:var(--info);background:var(--info-bg)}
table{border-collapse:collapse;width:100%;font-size:.88em;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.88em;background:var(--soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0}
.tw table td:first-child,.tw table th:first-child{padding-left:10px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 10px 40px;margin:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--head);color:var(--head-ink);display:grid;place-items:center;font-weight:700;font-size:.85em}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13px;top:32px;bottom:0;width:2px;background:var(--line)}
.steps li b{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--good)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82em;font-weight:700;white-space:nowrap}
.t-tot{background:var(--good-bg);color:var(--good)} .t-kha{background:var(--info-bg);color:var(--info)} .t-tb{background:var(--warn-bg);color:var(--warn)} .t-kem{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.full{width:100%}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.stepper{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.stepper:last-child{border-bottom:0}
.stepper .lb{flex:1;font-size:.88em;line-height:1.35}
.stepper .lb small{display:block;color:var(--muted);font-size:.85em}
.stepper .ct{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper .ct button{width:38px;height:38px;border:0;background:var(--soft);font-size:18px;font-weight:700;cursor:pointer}
.stepper .ct output{width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9em}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.result{position:sticky;bottom:calc(66px + var(--safe-b));background:var(--head);color:var(--head-ink);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:10px;z-index:3}
.result .big{font-size:1.8em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:.88em;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sched{list-style:none;padding:0;margin:0}
.sched li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 10px;border-radius:8px;margin:0;font-size:.92em}
.sched li .t{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.sched li.now{background:var(--good-bg)}
.sched li.now .t{color:var(--good)}
.q-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font-size:.95em;line-height:1.4}
.q-opt.ok{border-color:var(--good);background:var(--good-bg)}
.q-opt.no{border-color:var(--bad);background:var(--bad-bg)}
.prog{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:.85em;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
.hit mark{background:var(--warn-bg);color:inherit;padding:0 1px;border-radius:2px}
.vb p{margin:.45em 0}.vb p.k{margin-top:.8em}.vb p.pt{padding-left:1.1em}.vb p.k b.kn{color:var(--accent)}.vb .crumb{font-size:.8em;color:var(--muted);margin-bottom:6px}.vb h1{font-size:1.15em}.vb .flash{background:var(--warn-bg);border-radius:6px;transition:background 2s}
.lawlink{text-decoration:none}
.quick{display:grid;grid-template-columns:1fr 92px auto;gap:8px;align-items:end}
.quick select,.quick input{font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:44px;width:100%}
details.ch{border-bottom:1px solid var(--line)}details.ch:last-child{border-bottom:0}details.ch summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:.92em;list-style:none}details.ch summary::-webkit-details-marker{display:none}details.ch summary span{display:block;font-weight:400;color:var(--muted);font-size:.85em}details.ch .mh{padding:6px 14px;font-size:.8em;font-weight:600;color:var(--muted);background:var(--soft)}details.ch a{display:block;padding:9px 14px 9px 22px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.92em}details.ch a b{color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.star{font-size:20px;color:var(--gold)}
.kbd{font-variant-numeric:tabular-nums;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:700px){ main{padding-top:20px} }
</style>
</head>

<script type="application/json" id="vbdata">{"luat":{"short":"Luật PCMT 2025","full":"Luật Phòng, chống ma túy số 120/2025/QH15","note":"Quốc hội thông qua 10/12/2025; hiệu lực 01/7/2026","items":[["C","Chương I","NHỮNG QUY ĐỊNH CHUNG"],["D",1,"Phạm vi điều chỉnh",["Luật này quy định về phòng, chống ma túy; quản lý người sử dụng trái phép chất ma túy; cai nghiện ma túy; trách nhiệm của cá nhân, gia đình, cơ quan, tổ chức trong phòng, chống ma túy; quản lý nhà nước và hợp tác quốc tế về phòng, chống ma túy."]],["D",2,"Giải thích từ ngữ",["Trong Luật này, các từ ngữ dưới đây được hiểu như sau:","1. Chất ma túy là chất gây nghiện, chất hướng thần được quy định trong danh mục chất ma túy do Chính phủ ban hành.","2. Chất gây nghiện là chất kích thích hoặc ức chế thần kinh, dễ gây tình trạng nghiện đối với người sử dụng.","3. Chất hướng thần là chất kích thích hoặc ức chế thần kinh hoặc gây ảo giác, nếu sử dụng nhiều lần có thể dẫn tới tình trạng nghiện đối với người sử dụng.","4. Tiền chất là hóa chất thường được sử dụng trong quá trình điều chế, sản xuất chất ma túy được quy định trong danh mục tiền chất do Chính phủ ban hành.","5. Cây có chứa chất ma túy là cây thuốc phiện, cây côca, cây cần sa và các loại cây khác có chứa chất ma túy do Chính phủ quy định.","6. Phòng, chống ma túy là phòng ngừa, ngăn chặn, đấu tranh chống tội phạm và tệ nạn ma túy; kiểm soát các hoạt động hợp pháp liên quan đến ma túy.","7. Tệ nạn ma túy là việc sử dụng trái phép chất ma túy, nghiện ma túy và các hành vi vi phạm pháp luật về ma túy mà chưa đến mức hoặc không bị truy cứu trách nhiệm hình sự.","8. Kiểm soát các hoạt động hợp pháp liên quan đến ma túy là việc cho phép, theo dõi, kiểm tra, giám sát các hoạt động hợp pháp liên quan đến ma túy và phòng ngừa, ngăn chặn việc lợi dụng các hoạt động đó vào mục đích khác.","9. Người sử dụng trái phép chất ma túy là người có hành vi sử dụng chất ma túy mà không được sự cho phép của người hoặc cơ quan chuyên môn có thẩm quyền và xét nghiệm chất ma túy trong cơ thể có kết quả dương tính.","10. Xét nghiệm chất ma túy trong cơ thể là việc thực hiện các kỹ thuật chuyên môn nhằm xác định chất ma túy trong cơ thể thông qua mẫu nước tiểu, mẫu máu hoặc các mẫu vật khác của cơ thể người.","11. Người nghiện ma túy là người sử dụng chất ma túy, thuốc gây nghiện, thuốc hướng thần và bị lệ thuộc vào các chất này.","12. Cai nghiện ma túy là quá trình thực hiện các hoạt động hỗ trợ về y tế, tâm lý, xã hội, giúp người nghiện ma túy dừng sử dụng chất ma túy, thuốc gây nghiện, thuốc hướng thần; phục hồi thể chất, tinh thần, nâng cao nhận thức, thay đổi hành vi để chấm dứt việc sử dụng trái phép các chất này."]],["D",3,"Chính sách của Nhà nước về phòng, chống ma túy",["1. Thực hiện đồng bộ các biện pháp phòng, chống ma túy, kết hợp với phòng, chống HIV/AIDS và các tệ nạn xã hội khác.","2. Tăng cường hoạt động tuyên truyền, giáo dục về công tác phòng, chống ma túy; khuyến khích tổ chức, cá nhân tham gia tuyên truyền, giáo dục phòng, chống ma túy.","3. Ưu tiên nguồn lực phòng, chống ma túy cho khu vực biên giới, hải đảo, vùng đồng bào dân tộc thiểu số và miền núi, vùng có điều kiện kinh tế - xã hội khó khăn, vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn và địa bàn phức tạp về ma túy theo quy định của Chính phủ.","4. Bảo vệ, hỗ trợ cá nhân, gia đình, cơ quan, tổ chức tham gia phòng, chống ma túy.","5. Quản lý chặt chẽ người sử dụng trái phép chất ma túy, người nghiện ma túy; khuyến khích người nghiện ma túy tự nguyện cai nghiện ma túy, điều trị nghiện bằng thuốc thay thế; khuyến khích cá nhân, gia đình, cơ quan, tổ chức tham gia, hỗ trợ hoạt động cai nghiện ma túy, quản lý sau cai nghiện ma túy.","6. Cán bộ, chiến sĩ thuộc cơ quan chuyên trách phòng, chống tội phạm về ma túy, người làm công tác cai nghiện ma túy trong các cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được hưởng chế độ, chính sách ưu đãi phù hợp với tính chất nhiệm vụ, địa bàn hoạt động theo quy định của Chính phủ.","7. Bảo đảm kinh phí cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng; hỗ trợ kinh phí cai nghiện ma túy ngoài công lập, kinh phí quản lý người sử dụng trái phép chất ma túy, kinh phí quản lý sau cai nghiện ma túy.","8. Tổ chức, cá nhân trong nước và nước ngoài đầu tư vào hoạt động cai nghiện ma túy hỗ trợ quản lý sau cai nghiện ma túy, phòng, chống tái nghiện ma túy, sử dụng lao động là người nghiện ma túy, người đã chấp hành xong quyết định cai nghiện ma túy được miễn, giảm tiền thuê đất, thuế thu nhập doanh nghiệp theo quy định của pháp luật.","9. Khuyến khích nghiên cứu khoa học, phát triển công nghệ và ứng dụng công nghệ cao trong phòng, chống ma túy.","10. Khen thưởng cá nhân, tổ chức, cơ quan có thành tích trong phòng, chống ma túy."]],["D",4,"Nguồn tài chính cho phòng, chống ma túy",["1. Ngân sách nhà nước.","2. Nguồn tài trợ, viện trợ, đầu tư, tặng cho của tổ chức, cá nhân trong nước và nước ngoài.","3. Chi trả của người nghiện ma túy, gia đình của họ.","4. Các nguồn tài chính hợp pháp khác."]],["D",5,"Các hành vi bị nghiêm cấm",["1. Trồng cây có chứa chất ma túy, hướng dẫn trồng cây có chứa chất ma túy.","2. Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất, tàng trữ, vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, xử lý, trao đổi, xuất khẩu, nhập khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh trái phép chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất.","3. Chiếm đoạt chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất.","4. Giao nhận, quản lý, kiểm soát, lưu giữ, cấp phát, bảo quản chất ma túy, tiền chất trái quy định của pháp luật; cho phép người sử dụng chất ma túy, thuốc gây nghiện hoặc thuốc hướng thần trái quy định của pháp luật.","5. Sử dụng, tổ chức sử dụng trái phép chất ma túy; cưỡng bức, lôi kéo người khác sử dụng trái phép chất ma túy; chứa chấp, hỗ trợ việc sử dụng trái phép chất ma túy.","6. Sản xuất, tàng trữ, vận chuyển, mua bán phương tiện, dụng cụ dùng vào việc sản xuất hoặc sử dụng trái phép chất ma túy.","7. Cản trở việc xét nghiệm chất ma túy trong cơ thể, xác định tình trạng nghiện ma túy, quản lý người sử dụng trái phép chất ma túy, cai nghiện ma túy, quản lý sau cai nghiện ma túy.","8. Trả thù hoặc cản trở người thực thi nhiệm vụ phòng, chống ma túy, người tham gia phòng, chống ma túy.","9. Lợi dụng chức vụ, quyền hạn, nghề nghiệp để vi phạm pháp luật về phòng, chống ma túy.","10. Hướng dẫn sản xuất, sử dụng trái phép chất ma túy; quảng cáo, tiếp thị chất ma túy.","11. Kỳ thị người sử dụng trái phép chất ma túy, người cai nghiện ma túy, người sau cai nghiện ma túy."]],["C","Chương II","TRÁCH NHIỆM PHÒNG, CHỐNG MA TÚY"],["D",6,"Trách nhiệm của cá nhân, gia đình và cộng đồng",["1. Tuyên truyền, giáo dục thành viên trong gia đình, người thân về tác hại của ma túy và thực hiện quy định của pháp luật về phòng, chống ma túy; quản lý, ngăn chặn thành viên trong gia đình vi phạm pháp luật về phòng, chống ma túy.","2. Thực hiện đúng chỉ định của người có thẩm quyền về sử dụng thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, thuốc thú y có chứa chất ma túy, tiền chất.","3. Hợp tác với cơ quan chức năng trong đấu tranh với tội phạm và tệ nạn ma túy; quản lý người sử dụng trái phép chất ma túy; tham gia hỗ trợ hoạt động cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, cai nghiện ma túy tại cơ sở cai nghiện ma túy và điều trị nghiện bằng thuốc thay thế; theo dõi, giúp đỡ người sau cai nghiện ma túy hòa nhập cộng đồng; phòng, chống tái nghiện ma túy.","4. Cung cấp kịp thời thông tin về tội phạm, tệ nạn ma túy và việc trồng cây có chứa chất ma túy cho cơ quan công an hoặc cơ quan nhà nước có thẩm quyền; tham gia xóa bỏ cây có chứa chất ma túy do chính quyền địa phương tổ chức."]],["D",7,"Trách nhiệm của cơ quan nhà nước",["1. Tổ chức phòng, chống ma túy trong cơ quan, đơn vị; phòng ngừa, ngăn chặn cán bộ, công chức, viên chức, người lao động thuộc quyền quản lý và cán bộ, chiến sĩ thuộc lực lượng vũ trang nhân dân vi phạm pháp luật về phòng, chống ma túy; tuyên truyền, vận động nhân dân phát hiện, tố giác, đấu tranh với tội phạm và tệ nạn ma túy.","2. Tổ chức thực hiện chủ trương của Đảng, chính sách của Nhà nước về quy hoạch, phát triển kinh tế - xã hội để thay thế việc trồng cây có chứa chất ma túy tại các vùng xóa bỏ cây có chứa chất ma túy."]],["D",8,"Trách nhiệm của cơ sở giáo dục",["1. Tổ chức thực hiện chương trình giáo dục về phòng, chống ma túy; phổ biến, giáo dục pháp luật về phòng, chống ma túy cho học sinh, sinh viên, học viên; quản lý chặt chẽ, ngăn chặn học sinh, sinh viên, học viên vi phạm pháp luật về phòng, chống ma túy.","2. Phối hợp với gia đình, cơ quan, tổ chức và chính quyền địa phương để quản lý, giáo dục học sinh, sinh viên, học viên về phòng, chống ma túy.","3. Phối hợp với cơ quan, tổ chức, cá nhân có thẩm quyền tổ chức xét nghiệm chất ma túy trong cơ thể khi cần thiết để phát hiện học sinh, sinh viên, học viên sử dụng trái phép chất ma túy."]],["D",9,"Trách nhiệm của cơ quan báo chí, truyền thông",["Cơ quan báo chí, truyền thông có trách nhiệm phối hợp với cơ quan, tổ chức có liên quan tuyên truyền chủ trương, chính sách, pháp luật về phòng, chống ma túy."]],["D",10,"Trách nhiệm của Mặt trận Tổ quốc Việt Nam, các tổ chức thành viên của Mặt trận và tổ chức khác",["1. Tổ chức và phối hợp với cơ quan có thẩm quyền tuyên truyền, phổ biến kiến thức, pháp luật về phòng, chống ma túy trong nhân dân; vận động nhân dân tham gia phòng, chống ma túy và thực hiện các phong trào phòng, chống ma túy.","2. Phòng ngừa, ngăn chặn người của tổ chức mình và mọi công dân vi phạm pháp luật về phòng, chống ma túy.","3. Phối hợp với chính quyền địa phương các cấp, cơ quan có thẩm quyền vận động người nghiện ma túy thực hiện biện pháp cai nghiện ma túy, điều trị nghiện bằng thuốc thay thế; quản lý người sử dụng trái phép chất ma túy; tham gia cảm hóa, giáo dục, dạy nghề, tìm việc làm và giúp đỡ người sau cai nghiện ma túy hòa nhập cộng đồng; phòng, chống tái nghiện ma túy."]],["D",11,"Cơ quan chuyên trách phòng, chống tội phạm về ma túy",["1. Cơ quan chuyên trách phòng, chống tội phạm về ma túy bao gồm:","a) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân;","b) Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển Việt Nam và Hải quan Việt Nam.","2. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Công an nhân dân trong phạm vi nhiệm vụ, quyền hạn chủ trì, phối hợp với cơ quan, tổ chức có liên quan thực hiện các hoạt động phòng ngừa, ngăn chặn và đấu tranh chống tội phạm về ma túy.","3. Cơ quan chuyên trách phòng, chống tội phạm về ma túy thuộc Bộ đội Biên phòng, Cảnh sát biển Việt Nam, Hải quan Việt Nam trong phạm vi nhiệm vụ, quyền hạn chủ trì, phối hợp với cơ quan công an, cơ quan, tổ chức khác có liên quan thực hiện các hoạt động phòng ngừa, ngăn chặn và đấu tranh chống tội phạm về ma túy tại khu vực hoặc địa bàn quản lý, kiểm soát.","4. Trên cùng một địa bàn khi phát hiện hành vi vi phạm pháp luật liên quan đến nhiệm vụ, quyền hạn của nhiều cơ quan thì cơ quan phát hiện trước có trách nhiệm xử lý theo thẩm quyền do pháp luật quy định; trường hợp vụ việc không thuộc thẩm quyền của mình thì chuyển giao hồ sơ, người, tang vật vi phạm pháp luật cho cơ quan có thẩm quyền chủ trì giải quyết.","5. Chính phủ quy định việc phối hợp của các cơ quan chuyên trách phòng, chống tội phạm về ma túy."]],["D",12,"Biện pháp giám sát điện tử",["1. Giám sát điện tử là biện pháp sử dụng thiết bị điện tử để quản lý, giám sát đối với:","a) Người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","b) Người đang điều trị nghiện bằng thuốc thay thế;","c) Người đang bị quản lý sau cai nghiện ma túy.","2. Trưởng Công an cấp xã có thẩm quyền áp dụng biện pháp giám sát điện tử.","3. Trách nhiệm của người bị áp dụng biện pháp giám sát điện tử:","a) Chấp hành quyết định áp dụng biện pháp giám sát điện tử;","b) Không tự ý tháo gỡ, phá hủy hoặc có tác động gây rối loạn hoạt động của thiết bị giám sát điện tử;","c) Thông báo ngay cho Công an cấp xã khi phát hiện thiết bị giám sát điện tử bị hư hỏng.","4. Chính phủ quy định chi tiết về thiết bị, đối tượng; quy định điều kiện, thời hạn, trình tự, thủ tục, xử lý vi phạm trong việc áp dụng biện pháp giám sát điện tử."]],["C","Chương III","KIỂM SOÁT CÁC HOẠT ĐỘNG HỢP PHÁP LIÊN QUAN ĐẾN MA TÚY"],["D",13,"Các hoạt động hợp pháp liên quan đến ma túy",["1. Hoạt động hợp pháp liên quan đến ma túy là hoạt động được cơ quan quản lý nhà nước có thẩm quyền cho phép, bao gồm:","a) Nghiên cứu, giám định, kiểm nghiệm, kiểm định, sản xuất chất ma túy (không bao gồm trồng cây có chứa chất ma túy), tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất;","b) Vận chuyển, bảo quản, tồn trữ, mua bán, phân phối, sử dụng, xử lý, trao đổi chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất;","c) Nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất.","2. Hoạt động hợp pháp liên quan đến ma túy quy định tại khoản 1 Điều này được kiểm soát chặt chẽ theo quy định của Luật này và quy định khác của pháp luật có liên quan."]],["D",14,"Kiểm soát hoạt động nghiên cứu, giám định, sản xuất chất ma túy, tiền chất",["1. Hoạt động nghiên cứu, giám định, sản xuất chất ma túy (không bao gồm trồng cây có chứa chất ma túy), tiền chất phải được cơ quan nhà nước có thẩm quyền theo dõi, kiểm tra, giám sát.","2. Chính phủ quy định cơ quan có thẩm quyền cho phép; trình tự, thủ tục cho phép; việc theo dõi, kiểm tra, giám sát hoạt động quy định tại khoản 1 Điều này."]],["D",15,"Kiểm soát hoạt động vận chuyển chất ma túy, tiền chất",["1. Cơ quan, tổ chức, cá nhân đã được cơ quan nhà nước có thẩm quyền cho phép thì được vận chuyển chất ma túy, tiền chất; khi thực hiện việc vận chuyển phải đóng gói, niêm phong theo quy định của cơ quan có thẩm quyền; chịu trách nhiệm về số lượng, chất lượng, có biện pháp bảo vệ an toàn, không để bị thất thoát trong quá trình vận chuyển và chịu sự theo dõi, kiểm tra, giám sát của cơ quan nhà nước có thẩm quyền.","2. Chính phủ quy định chi tiết Điều này."]],["D",16,"Kiểm soát hoạt động liên quan đến thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc",["Việc kiểm soát hoạt động liên quan đến thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc thực hiện theo quy định của pháp luật về dược, trừ hoạt động quy định tại điểm b khoản 1 và khoản 2 Điều 18 của Luật này."]],["D",17,"Kiểm soát hoạt động liên quan đến thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất",["Việc kiểm soát hoạt động liên quan đến thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất thực hiện theo quy định của Chính phủ."]],["D",18,"Kiểm soát hoạt động nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc",["1. Các hoạt động sau đây phải được cơ quan có thẩm quyền cho phép:","a) Nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập chất ma túy, tiền chất;","b) Tạm nhập, tái xuất, tạm xuất, tái nhập thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc.","2. Hoạt động quá cảnh lãnh thổ Việt Nam chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc phải theo đúng hành trình đã ghi trong giấy phép quá cảnh. Cơ quan, tổ chức thực hiện việc quá cảnh phải làm thủ tục, chịu sự kiểm soát của cơ quan Hải quan và cơ quan có thẩm quyền của Việt Nam.","3. Chính phủ quy định chi tiết Điều này."]],["D",19,"Lập hồ sơ, báo cáo các hoạt động hợp pháp liên quan đến ma túy",["Cơ quan, tổ chức, cá nhân khi tiến hành hoạt động quy định tại khoản 1 Điều 13 của Luật này có trách nhiệm lập hồ sơ, báo cáo và trao đổi, chia sẻ thông tin theo quy định của Chính phủ."]],["D",20,"Kiểm soát hoạt động hợp pháp liên quan đến ma túy vì mục đích quốc phòng, an ninh",["Hoạt động nghiên cứu, giám định, sản xuất, vận chuyển, tồn trữ, bảo quản, sử dụng, nhập khẩu, xuất khẩu, tạm nhập, tái xuất, tạm xuất, tái nhập, quá cảnh chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất vì mục đích quốc phòng, an ninh thực hiện theo quy định của Chính phủ."]],["D",21,"Kiểm soát thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất vì mục đích sơ cứu, cấp cứu trong cuộc hành trình, du lịch quốc tế, điều trị bệnh cho bản thân người nhập cảnh, xuất cảnh, quá cảnh",["1. Việc mang theo thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất dự phòng cho việc sơ cứu, cấp cứu trên tàu thủy, tàu bay, tàu hỏa, ô tô hoặc các phương tiện vận tải khác trong cuộc hành trình, du lịch quốc tế không bị coi là mang hàng xuất khẩu, nhập khẩu, quá cảnh lãnh thổ Việt Nam.","Người chỉ huy, người điều khiển phương tiện vận tải có trách nhiệm khai báo với cơ quan Hải quan của Việt Nam; báo cáo, giải trình việc quản lý, sử dụng số lượng thuốc, áp dụng các biện pháp an toàn thích hợp để ngăn chặn việc sử dụng không đúng mục đích hoặc vận chuyển trái phép các thuốc đó và chịu sự kiểm soát của cơ quan có thẩm quyền của Việt Nam.","2. Việc mang theo thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất để điều trị bệnh cho bản thân người nhập cảnh, xuất cảnh hoặc quá cảnh lãnh thổ Việt Nam thực hiện theo quy định của Chính phủ và chịu sự kiểm soát của cơ quan có thẩm quyền của Việt Nam."]],["D",22,"Xử lý chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất thu giữ trong vụ việc vi phạm pháp luật",["Chất ma túy, tiền chất, thuốc gây nghiện, thuốc hướng thần, thuốc tiền chất, nguyên liệu làm thuốc là dược chất gây nghiện, dược chất hướng thần, tiền chất dùng làm thuốc, thuốc thú y, thức ăn chăn nuôi, thức ăn thủy sản có chứa chất ma túy, tiền chất bị thu giữ trong các vụ án hình sự, vụ việc vi phạm hành chính được xử lý theo quy định của pháp luật về tố tụng hình sự, pháp luật về xử lý vi phạm hành chính."]],["C","Chương IV","QUẢN LÝ NGƯỜI SỬ DỤNG TRÁI PHÉP CHẤT MA TÚY"],["D",23,"Xét nghiệm chất ma túy trong cơ thể",["1. Xét nghiệm chất ma túy trong cơ thể được thực hiện đối với người thuộc trường hợp sau đây:","a) Người bị phát hiện sử dụng trái phép chất ma túy;","b) Người mà cơ quan, người có thẩm quyền có căn cứ cho rằng có hành vi sử dụng trái phép chất ma túy;","c) Đang trong thời hạn quản lý người sử dụng trái phép chất ma túy;","d) Người đang cai nghiện ma túy;","đ) Người đang điều trị nghiện bằng thuốc thay thế;","e) Người đang trong thời hạn quản lý sau cai nghiện ma túy.","2. Người đứng đầu cơ sở cai nghiện ma túy, cơ sở điều trị nghiện bằng thuốc thay thế; người có thẩm quyền xử phạt vi phạm hành chính đối với hành vi sử dụng trái phép chất ma túy tiến hành xét nghiệm chất ma túy theo thẩm quyền hoặc đề nghị cơ quan, người có chuyên môn xét nghiệm chất ma túy trong cơ thể đối với người thuộc các trường hợp quy định tại khoản 1 Điều này.","Trường hợp người bị yêu cầu xét nghiệm chất ma túy trong cơ thể không chấp hành thì người có thẩm quyền xử phạt vi phạm hành chính đối với hành vi sử dụng trái phép chất ma túy có quyền áp dụng biện pháp áp giải người vi phạm theo thủ tục hành chính đến địa điểm xét nghiệm để tiến hành xét nghiệm chất ma túy trong cơ thể.","Trường hợp có kết quả xét nghiệm dương tính với chất ma túy thì gửi ngay kết quả đến Trưởng Công an cấp xã nơi người có kết quả xét nghiệm dương tính với chất ma túy cư trú, trừ trường hợp người đó đang cai nghiện ma túy trong cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","Trường hợp người sử dụng trái phép chất ma túy không có nơi cư trú ổn định thì thực hiện theo quy định tại Điều 31 của Luật này.","3. Nhà nước bảo đảm kinh phí xét nghiệm chất ma túy trong cơ thể đối với các trường hợp quy định tại khoản 1 Điều này."]],["D",24,"Quản lý, giáo dục của cơ quan, cá nhân có thẩm quyền đối với người sử dụng trái phép chất ma túy",["1. Quản lý người sử dụng trái phép chất ma túy là biện pháp phòng ngừa nhằm giúp người sử dụng trái phép chất ma túy không tiếp tục sử dụng trái phép chất ma túy, phòng ngừa người sử dụng trái phép chất ma túy thực hiện hành vi vi phạm pháp luật.","Quản lý người sử dụng trái phép chất ma túy không phải là biện pháp xử lý hành chính.","2. Thời hạn quản lý người sử dụng trái phép chất ma túy là 01 năm kể từ ngày ra quyết định quản lý.","3. Ủy ban nhân dân cấp xã thực hiện quản lý, giáo dục người sử dụng trái phép chất ma túy tại địa phương.","4. Trưởng Công an cấp xã có trách nhiệm trực tiếp giúp Ủy ban nhân dân cấp xã thực hiện quản lý người sử dụng trái phép chất ma túy và có các nhiệm vụ, quyền hạn sau đây:","a) Ra quyết định và tổ chức quản lý người sử dụng trái phép chất ma túy trong thời hạn 24 giờ kể từ khi nhận được kết quả xét nghiệm dương tính với chất ma túy của người cư trú tại địa phương;","b) Quản lý cư trú; triệu tập; xét nghiệm chất ma túy trong cơ thể; phòng ngừa, ngăn chặn hành vi gây mất an ninh, trật tự của người sử dụng trái phép chất ma túy;","c) Phối hợp với các cơ quan, tổ chức, đoàn thể, cá nhân tư vấn, động viên, giáo dục, giúp đỡ người sử dụng trái phép chất ma túy để họ không tiếp tục sử dụng trái phép chất ma túy.","5. Trong thời hạn quản lý, Trưởng Công an cấp xã ra quyết định dừng quản lý người sử dụng trái phép chất ma túy trong các trường hợp sau đây:","a) Người sử dụng trái phép chất ma túy được xác định là người nghiện ma túy;","b) Người sử dụng trái phép chất ma túy bị áp dụng biện pháp xử lý hành chính đưa vào cơ sở giáo dục bắt buộc, đưa vào trường giáo dưỡng; biện pháp xử lý chuyển hướng giáo dục tại trường giáo dưỡng;","c) Người sử dụng trái phép chất ma túy phải chấp hành án phạt tù;","d) Người sử dụng trái phép chất ma túy chết hoặc bị Tòa án tuyên bố mất tích;","đ) Trường hợp quy định tại khoản 7 Điều này.","6. Đối với người sử dụng trái phép chất ma túy không có nơi cư trú ổn định, sau khi xác định tình trạng nghiện kết luận người đó không nghiện ma túy thì Ủy ban nhân dân cấp xã, Trưởng Công an cấp xã nơi phát hiện người sử dụng trái phép chất ma túy quản lý người sử dụng trái phép chất ma túy và phối hợp với Ủy ban nhân dân cấp xã, Trưởng Công an cấp xã nơi người sử dụng trái phép chất ma túy đăng ký thường trú thực hiện việc quản lý phù hợp theo quy định tại các khoản 2, 3, 4 và 5 Điều này.","Quyết định quản lý người sử dụng trái phép chất ma túy được gửi ngay cho Ủy ban nhân dân cấp xã, Trưởng Công an cấp xã nơi người sử dụng trái phép chất ma túy đăng ký thường trú để phối hợp quản lý.","7. Đối với người sử dụng trái phép chất ma túy bị tạm giữ, tạm giam theo quy định của Bộ luật Tố tụng hình sự thì Trưởng Công an cấp xã ra quyết định tạm đình chỉ quản lý. Trường hợp thời hạn tạm giữ, tạm giam dài hơn thời hạn quản lý người sử dụng trái phép chất ma túy còn lại thì Trưởng Công an cấp xã quyết định dừng việc quản lý. Trường hợp thời hạn tạm giữ, tạm giam ngắn hơn thời hạn quản lý người sử dụng trái phép chất ma túy còn lại thì tiếp tục thực hiện việc quản lý cho đến hết thời hạn quản lý.","8. Công an cấp xã định kỳ báo cáo Ủy ban nhân dân cấp xã hoặc báo cáo theo yêu cầu về công tác quản lý người sử dụng trái phép chất ma túy.","9. Chính phủ quy định chi tiết Điều này."]],["D",25,"Trách nhiệm của người sử dụng trái phép chất ma túy",["1. Cung cấp đầy đủ, chính xác thông tin về chất ma túy, hành vi sử dụng trái phép chất ma túy của mình cho Công an cấp xã hoặc cơ quan, người có thẩm quyền khác.","2. Có mặt theo giấy triệu tập và theo yêu cầu của Công an cấp xã, Ủy ban nhân dân cấp xã trong thời gian quản lý.","3. Cam kết chấp hành nghiêm chỉnh quy định của pháp luật.","4. Trường hợp vắng mặt tại nơi cư trú phải báo cáo Công an cấp xã; thông báo với Công an cấp xã nơi đang cư trú trước khi thay đổi nơi cư trú; trình diện Công an cấp xã nơi cư trú mới trong thời hạn 24 giờ.","5. Thực hiện trách nhiệm khác theo quy định của Luật này và quy định của pháp luật có liên quan."]],["D",26,"Trách nhiệm của gia đình, cơ quan, tổ chức, cá nhân trong quản lý người sử dụng trái phép chất ma túy",["1. Gia đình người sử dụng trái phép chất ma túy có trách nhiệm sau đây:","a) Quản lý, giáo dục người sử dụng trái phép chất ma túy; ngăn chặn hành vi sử dụng trái phép chất ma túy;","b) Cung cấp thông tin về hành vi sử dụng trái phép chất ma túy của người sử dụng trái phép chất ma túy cho Công an cấp xã;","c) Ngăn chặn người sử dụng trái phép chất ma túy có hành vi gây mất an ninh, trật tự;","d) Phối hợp với cơ quan có thẩm quyền đưa người sử dụng trái phép chất ma túy đi xét nghiệm chất ma túy trong cơ thể.","2. Cơ quan, tổ chức, cá nhân nơi người sử dụng trái phép chất ma túy làm việc, sinh sống có trách nhiệm sau đây:","a) Động viên, giúp đỡ, giáo dục người sử dụng trái phép chất ma túy; ngăn chặn hành vi sử dụng trái phép chất ma túy;","b) Phối hợp với gia đình, cơ quan có thẩm quyền tổ chức việc đưa người sử dụng trái phép chất ma túy đi xét nghiệm chất ma túy trong cơ thể."]],["D",27,"Lập danh sách người sử dụng trái phép chất ma túy",["1. Công an cấp xã lập danh sách người sử dụng trái phép chất ma túy cư trú tại địa phương.","2. Khi người sử dụng trái phép chất ma túy thay đổi nơi cư trú thì Công an cấp xã nơi chuyển đi có trách nhiệm thông báo cho Công an cấp xã nơi chuyển đến trong thời hạn 24 giờ kể từ khi người đó chuyển khỏi địa phương để đưa vào danh sách và tiếp tục quản lý.","3. Công an cấp xã đưa ra khỏi danh sách người sử dụng trái phép chất ma túy trong các trường hợp sau đây:","a) Người sử dụng trái phép chất ma túy không có hành vi sử dụng trái phép chất ma túy trong thời gian quản lý quy định tại khoản 2 Điều 24 của Luật này;","b) Người sử dụng trái phép chất ma túy thuộc trường hợp dừng quản lý quy định tại khoản 5 Điều 24 của Luật này;","c) Người sử dụng trái phép chất ma túy chuyển đến cư trú ở địa phương khác."]],["C","Chương V","CAI NGHIỆN MA TÚY"],["D",28,"Cơ sở cai nghiện ma túy",["1. Cơ sở cai nghiện ma túy được thành lập để thực hiện cai nghiện cho người nghiện ma túy, bao gồm:","a) Cơ sở cai nghiện ma túy công lập thực hiện cai nghiện ma túy cho người từ đủ 18 tuổi trở lên;","b) Trường giáo dưỡng, cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi;","c) Cơ sở cai nghiện ma túy tư nhân thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi trở lên.","2. Chính phủ quy định điều kiện về cơ sở vật chất, trang thiết bị tại cơ sở cai nghiện ma túy quy định tại điểm a và điểm b khoản 1 Điều này; quy định về tiêu chí thành lập, trình tự, thủ tục cấp, cấp lại, thu hồi giấy phép hoạt động và điều kiện về cơ sở vật chất, trang thiết bị, nhân sự, chế độ quản lý tại cơ sở cai nghiện ma túy tư nhân.","3. Bộ trưởng Bộ Công an quyết định thành lập, giải thể cơ sở cai nghiện ma túy công lập, trường giáo dưỡng; quy định điều kiện về nhân sự và chế độ quản lý tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","4. Giám đốc Công an cấp tỉnh cấp, cấp lại, đình chỉ, thu hồi giấy phép hoạt động đối với cơ sở cai nghiện ma túy tư nhân trong địa bàn quản lý."]],["D",29,"Thời hạn, quy trình cai nghiện ma túy",["1. Thời hạn cai nghiện ma túy đối với người cai nghiện ma túy lần đầu là 24 tháng, đối với người cai nghiện ma túy từ lần thứ hai trở lên là 36 tháng.","2. Quy trình cai nghiện ma túy bao gồm các giai đoạn sau đây:","a) Tiếp nhận, phân loại;","b) Điều trị cắt cơn, giải độc, rối loạn tâm thần và các bệnh lý khác;","c) Giáo dục, tư vấn, phục hồi hành vi, nhân cách;","d) Lao động trị liệu, học nghề;","đ) Chuẩn bị tái hòa nhập cộng đồng.","3. Người cai nghiện ma túy phải thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại khoản 1 và khoản 2 Điều này.","4. Chính phủ quy định chi tiết khoản 2 và khoản 3 Điều này."]],["D",30,"Hình thức cai nghiện ma túy",["1. Cai nghiện ma túy tự nguyện bao gồm:","a) Cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại khoản 1 và khoản 2 Điều 29 của Luật này;","b) Cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng, cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi phải thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại khoản 1 và khoản 2 Điều 29 của Luật này;","c) Cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại Điều 29 của Luật này;","d) Cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân thực hiện ít nhất đủ 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật này, thời hạn và các giai đoạn còn lại phải tiếp tục thực hiện tại gia đình, cộng đồng.","2. Cai nghiện ma túy bắt buộc bao gồm:","a) Cai nghiện ma túy bắt buộc tại cơ sở cai nghiện ma túy công lập cho người từ đủ 18 tuổi trở lên thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại khoản 1 và khoản 2 Điều 29 của Luật này;","b) Cai nghiện ma túy bắt buộc tại trường giáo dưỡng, cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi thực hiện đầy đủ thời hạn, quy trình cai nghiện ma túy quy định tại khoản 1 và khoản 2 Điều 29 của Luật này."]],["D",31,"Xác định tình trạng nghiện ma túy",["1. Xác định tình trạng nghiện ma túy được thực hiện đối với người thuộc trường hợp sau đây:","a) Người tự nguyện xác định tình trạng nghiện ma túy;","b) Người đăng ký cai nghiện ma túy tự nguyện đối với trường hợp chưa có giấy xác định tình trạng nghiện hoặc có giấy xác định tình trạng nghiện nhưng đã quá 06 tháng;","c) Đang trong thời hạn quản lý người sử dụng trái phép chất ma túy quy định tại khoản 2 Điều 24 của Luật này mà bị phát hiện sử dụng trái phép chất ma túy, nếu không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự;","d) Người đang trong thời hạn quản lý sau cai nghiện ma túy bị phát hiện sử dụng trái phép chất ma túy, nếu không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự;","đ) Người sử dụng trái phép chất ma túy không có nơi cư trú ổn định, không thuộc trường hợp quy định tại điểm c và điểm d khoản này.","2. Công an cấp xã nơi phát hiện người thuộc trường hợp quy định tại khoản 1 Điều này lập hồ sơ đề nghị cơ sở y tế có thẩm quyền xác định tình trạng nghiện ma túy.","3. Cơ quan chuyên trách phòng, chống tội phạm về ma túy quy định tại khoản 1 Điều 11 của Luật này trong quá trình điều tra, thụ lý các vụ việc vi phạm pháp luật mà phát hiện trường hợp quy định tại các điểm c, d và đ khoản 1 Điều này thì cơ quan đang thụ lý lập hồ sơ đề nghị cơ sở y tế có thẩm quyền xác định tình trạng nghiện ma túy và thực hiện như sau:","a) Trường hợp xác định nghiện ma túy thì chuyển người nghiện ma túy và các tài liệu có liên quan đến Công an cấp xã nơi phát hiện người sử dụng trái phép chất ma túy hoặc Công an cấp xã nơi phát hiện hành vi sử dụng trái phép chất ma túy đối với người không có nơi cư trú ổn định;","b) Trường hợp xác định không nghiện ma túy thì thông báo và chuyển các tài liệu có liên quan đến Công an cấp xã để thực hiện quản lý người sử dụng trái phép chất ma túy theo quy định tại Điều 24 của Luật này.","4. Khi có kết quả xác định tình trạng nghiện ma túy, cơ sở y tế có trách nhiệm gửi ngay kết quả đến cơ quan đề nghị, người được xác định tình trạng nghiện ma túy; cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi.","5. Người được đề nghị xác định tình trạng nghiện ma túy có quyền và trách nhiệm sau đây:","a) Được bảo đảm danh dự, nhân phẩm; hỗ trợ đi lại, ăn ở, điều trị hội chứng cai và các bệnh kèm theo trong thời gian xác định tình trạng nghiện ma túy;","b) Chấp hành nội quy, quy chế của cơ sở xác định tình trạng nghiện ma túy; khai báo trung thực với nhân viên y tế về tiền sử sử dụng ma túy, các biểu hiện của việc sử dụng ma túy.","6. Người từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi quy định tại điểm a và điểm b khoản 1 Điều này khi nhận được kết quả xác định là nghiện ma túy có trách nhiệm đăng ký cai nghiện ma túy tự nguyện hoặc đăng ký điều trị nghiện bằng thuốc thay thế với Công an cấp xã nơi cư trú.","Người từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi quy định tại điểm đ khoản 1 Điều này khi nhận được kết quả xác định là nghiện ma túy có trách nhiệm đăng ký cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng hoặc cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi với Công an cấp xã nơi phát hiện hành vi sử dụng trái phép chất ma túy.","7. Chính phủ quy định cơ sở y tế đủ điều kiện xác định tình trạng nghiện ma túy; hồ sơ, trình tự, thủ tục xác định tình trạng nghiện ma túy.","8. Bộ trưởng Bộ Y tế quy định tiêu chuẩn chẩn đoán và quy trình chuyên môn để xác định tình trạng nghiện ma túy.","9. Nhà nước bảo đảm kinh phí xác định tình trạng nghiện ma túy đối với trường hợp quy định tại khoản 1 Điều này."]],["D",32,"Cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Cai nghiện ma túy tự nguyện tại gia đình, cộng đồng là việc người nghiện ma túy tự nguyện đăng ký cai nghiện tại gia đình, cộng đồng với sự hỗ trợ chuyên môn của tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy, sự phối hợp, trợ giúp của gia đình, cộng đồng và chịu sự quản lý của Ủy ban nhân dân cấp xã, Công an cấp xã.","2. Thời hạn cai nghiện ma túy tự nguyện tại gia đình, cộng đồng được tính như sau:","a) Trường hợp người cai nghiện ma túy thực hiện cai nghiện đầy đủ thời hạn, quy trình quy định tại Điều 29 của Luật này thì thời hạn được tính kể từ ngày Công an cấp xã lập biên bản tiếp nhận đăng ký cai nghiện ma túy;","b) Trường hợp người cai nghiện ma túy thực hiện cai nghiện tại cơ sở cai nghiện ma túy tư nhân mà đã hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật này nhưng chưa hoàn thành thời hạn, quy trình quy định tại khoản 1 và khoản 2 Điều 29 của Luật này, thì thời hạn cai nghiện còn lại được tính kể từ ngày Công an cấp xã lập biên bản tiếp nhận đăng ký cai nghiện ma túy. Trong trường hợp này, người cai nghiện ma túy phải tiếp tục thực hiện cai nghiện ma túy tại gia đình, cộng đồng theo thời gian, quy trình còn lại cho đến khi đủ thời hạn, quy trình quy định tại khoản 1 và khoản 2 Điều 29 của Luật này.","3. Người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng khi hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật này được hỗ trợ kinh phí.","4. Người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng có trách nhiệm đăng ký cai nghiện ma túy với Công an cấp xã và cam kết bằng văn bản về việc chấp hành nghiêm chỉnh các biện pháp quản lý, giám sát. Trường hợp người cai nghiện ma túy là người từ đủ 12 tuổi đến dưới 18 tuổi thì văn bản cam kết có xác nhận của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ.","5. Trưởng Công an cấp xã có nhiệm vụ, quyền hạn sau đây:","a) Lập biên bản tiếp nhận đăng ký cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","b) Thực hiện quản lý cư trú; triệu tập; giám sát điện tử; xét nghiệm chất ma túy trong cơ thể; phòng ngừa, ngăn chặn hành vi gây mất an ninh, trật tự của người đang cai nghiện ma túy tại gia đình, cộng đồng;","c) Cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","d) Định kỳ báo cáo Ủy ban nhân dân cấp xã hoặc báo cáo theo yêu cầu về công tác quản lý người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","6. Giám đốc Công an cấp tỉnh có trách nhiệm sau đây:","a) Chỉ đạo, hướng dẫn, kiểm tra công tác cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","b) Tiếp nhận đăng ký và công bố danh sách tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","c) Thông báo cho Ủy ban nhân dân cấp xã, Công an cấp xã danh sách tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","7. Chủ tịch Ủy ban nhân dân cấp tỉnh có trách nhiệm sau đây:","a) Giao nhiệm vụ cho các đơn vị sự nghiệp công lập thuộc thẩm quyền trên địa bàn cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","b) Bố trí kinh phí hỗ trợ công tác cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","8. Cơ sở cai nghiện ma túy, tổ chức, cá nhân đủ điều kiện cung cấp một hoặc nhiều giai đoạn cai nghiện theo quy trình cai nghiện ma túy quy định tại khoản 2 Điều 29 của Luật này được cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng và có trách nhiệm sau đây:","a) Tiếp nhận và tổ chức thực hiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng;","b) Thực hiện đúng quy trình chuyên môn nghiệp vụ theo quy định của cơ quan có thẩm quyền;","c) Trong thời hạn 24 giờ kể từ khi người cai nghiện ma túy sử dụng dịch vụ, tự ý chấm dứt việc sử dụng dịch vụ hoặc hoàn thành dịch vụ phải thông báo cho Công an cấp xã nơi người đó cư trú.","9. Tổ chức, cá nhân có đủ điều kiện thì được đăng ký cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng với Giám đốc Công an cấp tỉnh.","10. Chính phủ quy định chi tiết Điều này."]],["D",33,"Cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân",["1. Người cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân khi hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật này được hỗ trợ kinh phí.","2. Thời hạn cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân được tính kể từ ngày cơ sở cai nghiện ma túy lập biên bản tiếp nhận.","3. Người cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy tư nhân đã thực hiện đầy đủ thời hạn, quy trình quy định tại khoản 1 và khoản 2 Điều 29 của Luật này thì thực hiện như sau:","a) Cơ sở cai nghiện ma túy tư nhân cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện cho người cai nghiện ma túy và gửi bản sao cho Công an cấp xã nơi người hoàn thành cai nghiện ma túy cư trú trong thời hạn 24 giờ;","b) Người đã hoàn thành cai nghiện ma túy phải đến trình diện, nộp giấy xác nhận theo quy định tại điểm a khoản này cho Công an cấp xã nơi cư trú trong thời hạn 02 ngày kể từ ngày nhận được giấy xác nhận quy định tại điểm a khoản này.","4. Người cai nghiện ma túy không thực hiện đầy đủ các giai đoạn tại cơ sở cai nghiện ma túy tư nhân thì phải hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật này, thời gian, quy trình còn lại quy định tại khoản 1 và khoản 2 Điều 29 của Luật này được tiếp tục thực hiện tại gia đình, cộng đồng. Đối với trường hợp này thực hiện như sau:","a) Cơ sở cai nghiện ma túy tư nhân cấp giấy xác nhận thời gian, quy trình người cai nghiện ma túy đã thực hiện tại cơ sở đó cho người cai nghiện ma túy và trong thời hạn 24 giờ gửi thông báo về việc cai nghiện ma túy cho Công an cấp xã nơi người cai nghiện cư trú;","b) Người cai nghiện ma túy phải đến trình diện, nộp giấy xác nhận quy định tại điểm a khoản này và đăng ký tiếp tục cai nghiện tại gia đình, cộng đồng với Công an cấp xã theo quy định tại điểm b khoản 2 Điều 32 của Luật này trong thời hạn 02 ngày kể từ khi nhận được giấy xác nhận quy định tại điểm a khoản này.","5. Trường hợp người cai nghiện ma túy tự ý chấm dứt cai nghiện tại cơ sở cai nghiện ma túy tư nhân mà không thuộc trường hợp quy định tại khoản 4 Điều này thì cơ sở cai nghiện ma túy tư nhân phải thông báo trong thời hạn 24 giờ và phối hợp với Công an cấp xã nơi người cai nghiện cư trú lập hồ sơ đưa người cai nghiện ma túy đi cai nghiện bắt buộc.","6. Chính phủ quy định chi tiết Điều này."]],["D",34,"Cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng",["1. Người nghiện ma túy có nguyện vọng cai nghiện ma túy thì đăng ký với Công an cấp xã để đi cai nghiện tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng. Trường hợp người nghiện ma túy không có nơi cư trú ổn định phải thực hiện đăng ký cai nghiện tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","2. Hồ sơ đăng ký cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng bao gồm:","a) Lý lịch của người đăng ký đi cai nghiện;","b) Đơn xin đi cai nghiện tự nguyện của người nghiện ma túy; trường hợp người nghiện ma túy chưa đủ 18 tuổi thì phải có ý kiến của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ;","c) Xác nhận tình trạng nghiện ma túy của cơ sở y tế có thẩm quyền hoặc xác nhận của cơ sở đang điều trị nghiện bằng thuốc thay thế;","d) Văn bản của Trưởng Công an cấp xã đề nghị xem xét đưa vào cơ sở cai nghiện ma túy công lập, trường giáo dưỡng;","đ) Các tài liệu khác có liên quan (nếu có).","3. Giám đốc Công an cấp tỉnh quyết định đưa người nghiện ma túy đi cai nghiện tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","4. Cơ sở cai nghiện ma túy công lập, trường giáo dưỡng có trách nhiệm cấp giấy xác nhận hoàn thành cai nghiện ma túy cho người cai nghiện ma túy.","5. Chính phủ quy định chi tiết Điều này."]],["D",35,"Áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc",["1. Người nghiện ma túy từ đủ 18 tuổi trở lên bị áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc theo quy định của Luật Xử lý vi phạm hành chính nếu không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự, khi thuộc một trong các trường hợp sau đây:","a) Không đăng ký, không thực hiện hoặc tự ý chấm dứt cai nghiện ma túy tự nguyện, trừ trường hợp quy định tại khoản 4 Điều 33 của Luật này;","b) Trong thời gian cai nghiện ma túy tự nguyện bị phát hiện sử dụng trái phép chất ma túy;","c) Người nghiện ma túy không đăng ký, không thực hiện hoặc tự ý chấm dứt điều trị nghiện bằng thuốc thay thế hoặc bị chấm dứt điều trị nghiện bằng thuốc thay thế do vi phạm quy định về điều trị nghiện;","d) Trong thời gian quản lý sau cai nghiện ma túy mà xác định nghiện ma túy;","đ) Trường hợp quy định tại khoản 3 Điều 36 và các khoản 2, 3 và 4 Điều 47 của Luật này.","2. Không áp dụng biện pháp đưa đi cai nghiện bắt buộc đối với các trường hợp sau đây:","a) Người không có năng lực trách nhiệm hành chính;","b) Người đang mang thai có chứng nhận của cơ sở khám bệnh, chữa bệnh đủ điều kiện theo quy định pháp luật;","c) Phụ nữ hoặc người duy nhất đang nuôi con nhỏ dưới 36 tháng tuổi được Ủy ban nhân dân cấp xã nơi người đó cư trú xác nhận.","3. Hồ sơ đề nghị áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc được lập kể từ khi có kết quả xác định tình trạng nghiện ma túy hoặc tự ý chấm dứt điều trị nghiện bằng thuốc thay thế đến khi Tòa án ra quyết định. Việc lập hồ sơ thực hiện như sau:","a) Đối với người nghiện ma túy có nơi cư trú ổn định thì Trưởng Công an cấp xã nơi người đó cư trú lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc. Đối với người nghiện ma túy không có nơi cư trú ổn định thì Trưởng Công an cấp xã nơi phát hiện hành vi vi phạm pháp luật lần cuối lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc;","b) Hồ sơ đề nghị gồm có: bản tóm tắt lý lịch, biên bản vi phạm, xác nhận tình trạng nghiện ma túy của cơ sở y tế có thẩm quyền hoặc xác nhận của cơ sở đang điều trị nghiện bằng thuốc thay thế, văn bản của Trưởng Công an cấp xã đề nghị xem xét áp dụng biện pháp đưa đi cai nghiện bắt buộc và các tài liệu khác có liên quan (nếu có).","Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc phải được đánh số bút lục và được lưu trữ theo quy định của pháp luật về lưu trữ;","c) Sau khi hoàn thành hồ sơ đề nghị, Công an cấp xã lập hồ sơ phải thông báo bằng văn bản cho người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc hoặc người đại diện hợp pháp của họ về việc lập hồ sơ. Những người này có quyền đọc hồ sơ và ghi chép các nội dung cần thiết trong thời hạn 03 ngày làm việc kể từ ngày nhận được thông báo;","d) Trong thời hạn 01 ngày làm việc, kể từ ngày hết thời hạn đọc hồ sơ quy định tại điểm c khoản này, Trưởng Công an cấp xã quyết định và chuyển hồ sơ đề nghị Tòa án nhân dân khu vực áp dụng biện pháp đưa đi cai nghiện bắt buộc.","4. Thời hiệu áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc là 03 tháng kể từ ngày người nghiện ma túy thực hiện lần cuối hành vi vi phạm quy định tại khoản 1 Điều này; trường hợp người nghiện ma túy cố tình trốn tránh, cản trở việc áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc thì thời hiệu được tính lại kể từ thời điểm chấm dứt hành vi trốn tránh, cản trở đó.","5. Cơ sở cai nghiện ma túy công lập có trách nhiệm cấp giấy xác nhận hoàn thành cai nghiện ma túy cho người cai nghiện ma túy và gửi bản sao cho gia đình người đó, Tòa án nhân dân khu vực nơi đã ra quyết định, Ủy ban nhân dân cấp xã, Công an cấp xã nơi người đó cư trú.","6. Người nghiện ma túy không xác định được nơi cư trú và không còn khả năng lao động thì sau khi hết hạn chấp hành cai nghiện tại cơ sở cai nghiện ma túy công lập được đưa vào cơ sở bảo trợ xã hội.","7. Chính phủ quy định chi tiết các khoản 1, 2, 3, 5 và 6 Điều này.","8. Tòa án nhân dân khu vực quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc, Ủy ban Thường vụ Quốc hội quy định trình tự, thủ tục Tòa án nhân dân xem xét, quyết định việc áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc."]],["D",36,"Cai nghiện ma túy bắt buộc cho người từ đủ 12 tuổi đến dưới 18 tuổi",["1. Người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi bị đưa đi cai nghiện bắt buộc nếu không thuộc trường hợp bị xử lý theo quy định của pháp luật về hình sự khi thuộc một trong các trường hợp sau đây:","a) Không đăng ký, không thực hiện hoặc tự ý chấm dứt cai nghiện ma túy tự nguyện, trừ trường hợp quy định tại khoản 4 Điều 33 của Luật này;","b) Trong thời gian cai nghiện ma túy tự nguyện bị phát hiện sử dụng trái phép chất ma túy;","c) Người nghiện ma túy không đăng ký, không thực hiện hoặc tự ý chấm dứt điều trị nghiện bằng thuốc thay thế hoặc bị chấm dứt điều trị nghiện bằng thuốc thay thế do vi phạm quy định về điều trị nghiện;","d) Trong thời gian quản lý sau cai nghiện mà xác định nghiện ma túy;","đ) Trường hợp quy định tại các khoản 2, 3 và 4 Điều 47 của Luật này.","2. Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi được lập từ khi có kết quả xác định tình trạng nghiện ma túy hoặc tự ý chấm dứt điều trị nghiện bằng thuốc thay thế đến khi Tòa án ra quyết định. Việc lập hồ sơ thực hiện như sau:","a) Đối với người nghiện ma túy có nơi cư trú ổn định thì Trưởng Công an cấp xã nơi người đó cư trú lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc. Đối với người nghiện ma túy không có nơi cư trú ổn định thì Trưởng Công an cấp xã nơi phát hiện hành vi vi phạm pháp luật lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc;","b) Hồ sơ đề nghị gồm có: bản tóm tắt lý lịch; biên bản vi phạm; xác nhận tình trạng nghiện ma túy của cơ sở y tế có thẩm quyền hoặc xác nhận của cơ sở điều trị nghiện bằng thuốc thay thế; bản tường trình của người nghiện ma túy hoặc của người đại diện hợp pháp của họ; ý kiến của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ; văn bản của Trưởng Công an cấp xã đề nghị xem xét áp dụng biện pháp đưa đi cai nghiện bắt buộc và các tài liệu khác có liên quan (nếu có).","Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc phải được đánh số bút lục và được lưu trữ theo quy định của pháp luật về lưu trữ;","c) Sau khi hoàn thành hồ sơ đề nghị, Công an cấp xã nơi lập hồ sơ phải thông báo bằng văn bản cho người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc và cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ. Những người này có quyền đọc hồ sơ và ghi chép các nội dung cần thiết trong thời hạn 03 ngày làm việc kể từ ngày nhận được thông báo;","d) Trong thời hạn 01 ngày làm việc, kể từ ngày hết thời hạn đọc hồ sơ quy định tại điểm c khoản này, Trưởng Công an cấp xã quyết định việc chuyển hồ sơ đề nghị Tòa án nhân dân khu vực áp dụng biện pháp đưa đi cai nghiện bắt buộc.","3. Thời hiệu áp dụng biện pháp đưa đi cai nghiện bắt buộc là 03 tháng kể từ ngày người nghiện ma túy thực hiện lần cuối hành vi quy định tại khoản 1 Điều này; trường hợp người nghiện ma túy cố tình trốn tránh, cản trở việc áp dụng biện pháp đưa đi cai nghiện bắt buộc thì thời hiệu được tính lại kể từ thời điểm chấm dứt hành vi trốn tránh, cản trở đó.","Trường hợp tại thời điểm người nghiện ma túy chấm dứt hành vi trốn tránh, cản trở mà đã đủ 18 tuổi trở lên thì Tòa án quyết định áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc quy định tại khoản 8 Điều 35 của Luật này.","4. Người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi thực hiện việc cai nghiện bắt buộc tại trường giáo dưỡng hoặc cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi. Khi người nghiện ma túy đủ 18 tuổi, nếu thời gian cai nghiện còn lại từ đủ 03 tháng trở lên thì chuyển sang thực hiện việc cai nghiện bắt buộc tại cơ sở cai nghiện ma túy công lập.","5. Trường giáo dưỡng hoặc cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi có trách nhiệm cấp giấy xác nhận hoàn thành cai nghiện ma túy cho người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và gửi bản sao cho cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ, Tòa án nhân dân khu vực nơi đã ra quyết định, Ủy ban nhân dân cấp xã, Công an cấp xã nơi người đó cư trú.","6. Người nghiện ma túy không có nơi cư trú ổn định thì sau khi hết thời hạn chấp hành biện pháp đưa đi cai nghiện bắt buộc được đưa vào cơ sở bảo trợ xã hội.","7. Chính phủ quy định chi tiết các khoản 1, 2, 4, 5 và 6 Điều này.","8. Việc đưa người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi đi cai nghiện bắt buộc do Tòa án nhân dân khu vực quyết định và không phải là biện pháp xử lý hành chính, Ủy ban Thường vụ Quốc hội quy định trình tự, thủ tục Tòa án nhân dân xem xét, quyết định việc đưa người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi đi cai nghiện bắt buộc quy định tại Điều này."]],["D",37,"Quản lý người nghiện ma túy trong thời gian lập hồ sơ đưa đi cai nghiện bắt buộc",["1. Công an cấp xã nơi lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc quyết định giao người bị đề nghị cho cơ sở cai nghiện ma túy công lập, trường giáo dưỡng nơi gần nhất để quản lý trong thời gian lập hồ sơ đề nghị.","2. Người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc trong thời gian quản lý hưởng chế độ như người bị áp dụng cai nghiện ma túy bắt buộc. Thời gian quản lý được trừ vào thời gian cai nghiện ma túy."]],["D",38,"Thi hành quyết định đưa đến cơ sở cai nghiện ma túy",["1. Trưởng Công an cấp xã có trách nhiệm tổ chức thi hành quyết định đưa người nghiện ma túy đi cai nghiện ma túy của Tòa án, Giám đốc Công an cấp tỉnh.","2. Giám đốc Công an cấp tỉnh có nhiệm vụ, quyền hạn sau đây:","a) Quyết định cơ sở cai nghiện ma túy công lập thuộc thẩm quyền quản lý tiếp nhận người cai nghiện ma túy tự nguyện, bắt buộc;","b) Điều chuyển người cai nghiện ma túy giữa các cơ sở cai nghiện ma túy công lập thuộc thẩm quyền quản lý;","c) Tổ chức đưa người cai nghiện ma túy đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng;","d) Quyết định truy tìm đối với người phải chấp hành quyết định nhưng chưa đưa đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng bỏ trốn.","3. Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy có nhiệm vụ, quyền hạn sau đây:","a) Quyết định cơ sở cai nghiện ma túy công lập tiếp nhận người cai nghiện ma túy tự nguyện, bắt buộc trên phạm vi toàn quốc;","b) Điều chuyển người cai nghiện ma túy giữa các cơ sở cai nghiện ma túy công lập không thuộc cùng một tỉnh, thành phố.","4. Cục trưởng Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng có nhiệm vụ, quyền hạn sau đây:","a) Quyết định trường giáo dưỡng tiếp nhận người đủ 12 tuổi đến dưới 18 tuổi cai nghiện ma túy tự nguyện, bắt buộc;","b) Điều chuyển người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi giữa các trường giáo dưỡng.","5. Thời hạn tổ chức thi hành quyết định đi cai nghiện là 24 giờ; thời hạn ra quyết định cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người cai nghiện ma túy tự nguyện, bắt buộc và tổ chức đưa người đi cai nghiện tự nguyện, bắt buộc là 24 giờ."]],["D",39,"Hoãn, miễn, tạm đình chỉ chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện ma túy",["1. Người phải chấp hành quyết định nhưng chưa đưa đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được hoãn chấp hành quyết định trong trường hợp đang ốm nặng có xác nhận của cơ sở khám bệnh, chữa bệnh đang điều trị hoặc cơ sở khám bệnh, chữa bệnh từ cấp cơ bản trở lên hoặc trong trường hợp gia đình đang có khó khăn đặc biệt được Chủ tịch Ủy ban nhân dân cấp xã nơi người đó cư trú xác nhận.","Khi điều kiện hoãn chấp hành quyết định không còn thì quyết định được tiếp tục thi hành.","2. Người phải chấp hành quyết định nhưng chưa đưa đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được miễn chấp hành quyết định trong các trường hợp sau đây:","a) Mắc bệnh hiểm nghèo có chứng nhận của cơ sở khám bệnh, chữa bệnh đang điều trị hoặc cơ sở khám bệnh, chữa bệnh từ cấp cơ bản trở lên;","b) Trong thời gian hoãn chấp hành quyết định quy định tại khoản 1 Điều này mà người đó không còn nghiện ma túy;","c) Đang mang thai có chứng nhận của cơ sở khám bệnh, chữa bệnh đủ điều kiện theo quy định pháp luật.","3. Trong trường hợp người đang chấp hành quyết định tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng bị ốm nặng mà được đưa về gia đình điều trị thì được tạm đình chỉ chấp hành quyết định và thời gian điều trị được tính vào thời hạn chấp hành quyết định. Sau khi sức khỏe phục hồi mà thời hạn chấp hành còn lại từ 03 tháng trở lên thì người đó phải tiếp tục chấp hành quyết định. Đối với người mắc bệnh hiểm nghèo, phụ nữ mang thai thì được miễn chấp hành phần thời gian còn lại.","4. Tòa án nhân dân khu vực, Giám đốc Công an cấp tỉnh có thẩm quyền xem xét, quyết định việc hoãn hoặc miễn chấp hành quyết định theo quy định tại khoản 1 và khoản 2 Điều này trên cơ sở đơn đề nghị của người phải chấp hành quyết định hoặc đơn đề nghị của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người phải chấp hành quyết định từ đủ 12 tuổi đến dưới 18 tuổi. Quyết định miễn hoặc hoãn chấp hành quyết định phải được gửi cho Công an cấp xã nơi đã lập hồ sơ đề nghị và người phải chấp hành quyết định hoặc cha, mẹ, người giám hộ, người đại diện hợp pháp của người phải chấp hành quyết định từ đủ 12 tuổi đến dưới 18 tuổi.","Tòa án nhân dân khu vực, Giám đốc Công an cấp tỉnh có thẩm quyền xem xét, quyết định việc tạm đình chỉ hoặc miễn chấp hành quyết định quy định tại khoản 3 Điều này trên cơ sở đề nghị của Hiệu trưởng trường giáo dưỡng, người đứng đầu cơ sở cai nghiện ma túy công lập. Quyết định tạm đình chỉ hoặc miễn chấp hành quyết định được gửi cho Công an cấp xã, trường giáo dưỡng hoặc cơ sở cai nghiện ma túy công lập đã đề nghị và Công an cấp xã nơi người đó cư trú, người phải chấp hành quyết định hoặc cha, mẹ, người giám hộ, người đại diện hợp pháp của người phải chấp hành quyết định từ đủ 12 tuổi đến dưới 18 tuổi.","5. Người phải chấp hành quyết định ốm nặng, mắc bệnh hiểm nghèo mà không xác định được nơi cư trú thuộc trường hợp được tạm đình chỉ hoặc miễn chấp hành quyết định thì được đưa về cơ sở y tế tại địa phương nơi trường giáo dưỡng, cơ sở cai nghiện ma túy công lập đóng trụ sở để điều trị.","6. Người được hoãn, miễn, tạm đình chỉ chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc có trách nhiệm trình diện với Công an cấp xã nơi họ cư trú.","Trong thời gian được hoãn hoặc được tạm đình chỉ chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc mà có căn cứ cho rằng người đó bỏ trốn thì Tòa án nhân dân khu vực đã ra quyết định hoãn hoặc tạm đình chỉ hủy quyết định đó và ra quyết định buộc chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc. Quyết định buộc chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc được gửi cho Công an cấp xã nơi đã lập hồ sơ đề nghị."]],["D",40,"Áp dụng biện pháp cai nghiện ma túy, quản lý người sử dụng trái phép chất ma túy đối với người Việt Nam bị nước ngoài trục xuất về nước do có hành vi sử dụng trái phép chất ma túy, nghiện ma túy; người nước ngoài nghiện ma túy sinh sống tại Việt Nam",["1. Người Việt Nam bị nước ngoài trục xuất về Việt Nam do có hành vi sử dụng trái phép chất ma túy, nghiện ma túy khi về nước phải tiến hành xác định tình trạng nghiện ma túy. Trường hợp được xác định là nghiện ma túy thì người đó phải thực hiện các biện pháp cai nghiện ma túy; trường hợp xác định không nghiện ma túy thì thực hiện quản lý người sử dụng trái phép chất ma túy theo quy định của Luật này.","2. Người nước ngoài nghiện ma túy sinh sống tại Việt Nam có trách nhiệm đăng ký thực hiện cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy theo quy định của Luật này và phải chi trả toàn bộ các khoản chi phí liên quan đến cai nghiện. Trường hợp không thực hiện cai nghiện ma túy tự nguyện thì người đó bị xử lý theo quy định của pháp luật."]],["D",41,"Cai nghiện ma túy cho người bị tạm giam, phạm nhân",["1. Nhà nước áp dụng biện pháp cai nghiện thích hợp đối với người nghiện ma túy là người bị tạm giam, phạm nhân.","2. Giám thị trại giam, Giám thị trại tạm giam, Trưởng phân trại tạm giam, Trưởng nhà tạm giữ phối hợp chặt chẽ với cơ sở y tế tại địa phương để thực hiện quy định tại khoản 1 Điều này."]],["D",42,"Quản lý, hỗ trợ sau cai nghiện ma túy tại nơi cư trú",["1. Người đã hoàn thành cai nghiện ma túy tự nguyện, người đã hoàn thành điều trị nghiện bằng thuốc thay thế, người từ đủ 12 tuổi đến dưới 18 tuổi đã chấp hành xong quyết định đưa đi cai nghiện bắt buộc chịu sự quản lý sau cai nghiện ma túy trong thời hạn 01 năm kể từ ngày hoàn thành việc cai nghiện hoặc chấp hành xong quyết định.","2. Người đã chấp hành xong quyết định áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc chịu sự quản lý sau cai nghiện ma túy trong thời hạn 02 năm kể từ ngày chấp hành xong quyết định.","3. Trường hợp người nghiện ma túy không có nơi cư trú ổn định sau khi hoàn thành cai nghiện ma túy phải đăng ký với cơ sở cai nghiện ma túy công lập về nơi cư trú để thực hiện quản lý sau cai nghiện ma túy. Cơ sở cai nghiện ma túy công lập có trách nhiệm thông báo với Công an cấp xã nơi người đó đăng ký cư trú để thực hiện quản lý sau cai nghiện ma túy.","4. Nội dung quản lý sau cai nghiện ma túy bao gồm:","a) Danh sách người bị quản lý sau cai nghiện ma túy;","b) Tư vấn, giúp đỡ, phòng, chống tái nghiện ma túy;","c) Quản lý cư trú; triệu tập; giám sát điện tử; xét nghiệm chất ma túy trong cơ thể; phòng ngừa, ngăn chặn hành vi gây mất an ninh, trật tự.","5. Hỗ trợ xã hội trong thời gian quản lý sau cai nghiện ma túy bao gồm:","a) Hỗ trợ học văn hóa đối với người từ đủ 12 tuổi đến dưới 18 tuổi;","b) Hỗ trợ học nghề, vay vốn, tìm việc làm và tham gia các hoạt động xã hội để hòa nhập cộng đồng.","6. Chủ tịch Ủy ban nhân dân cấp xã ra quyết định và thực hiện quản lý, hỗ trợ xã hội sau cai nghiện ma túy.","7. Trưởng Công an cấp xã thực hiện nhiệm vụ sau đây:","a) Lập danh sách người bị quản lý sau cai nghiện ma túy; quản lý cư trú; triệu tập; giám sát điện tử; xét nghiệm chất ma túy trong cơ thể; phòng ngừa, ngăn chặn hành vi gây mất an ninh, trật tự;","b) Theo dõi, phát hiện, ngăn chặn hành vi sử dụng trái phép chất ma túy.","8. Chính phủ quy định hồ sơ, trình tự, thủ tục, chế độ quản lý và chính sách hỗ trợ cho người bị quản lý sau cai nghiện ma túy."]],["D",43,"Biện pháp can thiệp giảm tác hại đối với người sử dụng trái phép chất ma túy và người nghiện ma túy",["1. Biện pháp can thiệp giảm tác hại đối với người sử dụng trái phép chất ma túy và người nghiện ma túy là biện pháp làm giảm tác hại liên quan đến hành vi sử dụng trái phép chất ma túy gây ra cho bản thân, gia đình và cộng đồng.","2. Biện pháp can thiệp giảm tác hại đối với người sử dụng trái phép chất ma túy và người nghiện ma túy bao gồm:","a) Điều trị nghiện bằng thuốc thay thế;","b) Các biện pháp khác theo quy định của Chính phủ."]],["D",44,"Trách nhiệm của gia đình người nghiện ma túy, cộng đồng",["1. Gia đình người nghiện ma túy có trách nhiệm sau đây:","a) Hỗ trợ người nghiện ma túy trong quá trình cai nghiện ma túy, sau cai nghiện ma túy và hòa nhập cộng đồng;","b) Phối hợp với cơ quan, người có thẩm quyền trong việc lập hồ sơ áp dụng biện pháp cai nghiện ma túy; phối hợp với cơ quan, tổ chức, đơn vị có liên quan hỗ trợ người nghiện ma túy trong quá trình cai nghiện ma túy, quản lý sau cai nghiện ma túy và hòa nhập cộng đồng.","2. Cộng đồng nơi người nghiện ma túy cư trú có trách nhiệm sau đây:","a) Động viên, giúp đỡ người nghiện ma túy;","b) Phối hợp với cơ quan, tổ chức, đơn vị có liên quan hỗ trợ người nghiện ma túy trong quá trình cai nghiện ma túy, quản lý sau cai nghiện ma túy và hòa nhập cộng đồng."]],["D",45,"Quyền và nghĩa vụ của người cai nghiện ma túy",["1. Được bảo đảm kinh phí hoặc hỗ trợ kinh phí cai nghiện ma túy theo quy định của Luật này.","2. Được hưởng kết quả lao động trị liệu của mình theo quy định của Chính phủ.","3. Thực hiện đúng, đầy đủ các quy định về cai nghiện ma túy và tuân thủ hướng dẫn của cơ quan chuyên môn.","4. Nộp chi phí liên quan đến cai nghiện ma túy theo quy định của Luật này.","5. Các quyền và nghĩa vụ khác theo quy định của pháp luật."]],["D",46,"Quyền và nghĩa vụ của cơ sở cai nghiện ma túy",["1. Cơ sở cai nghiện ma túy có quyền sau đây:","a) Tiếp nhận người nghiện ma túy vào cai nghiện ma túy phù hợp với khả năng tiếp nhận của cơ sở cai nghiện;","b) Người đứng đầu cơ sở cai nghiện ma túy được quyết định áp dụng các biện pháp theo quy định của pháp luật để quản lý, giáo dục, cai nghiện cho người cai nghiện ma túy;","c) Thực hiện thu, chi, quản lý tài chính liên quan đến cai nghiện ma túy theo quy định của pháp luật;","d) Được hưởng chế độ ưu đãi theo quy định của pháp luật.","2. Cơ sở cai nghiện ma túy có nghĩa vụ sau đây:","a) Tuân thủ các quy định về xác định tình trạng nghiện ma túy, quy trình cai nghiện ma túy, quản lý người đang trong thời gian lập hồ sơ đề nghị đưa vào cơ sở cai nghiện ma túy;","b) Tôn trọng tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản của người cai nghiện ma túy, người được đề nghị xác định tình trạng nghiện ma túy và người đang trong thời gian lập hồ sơ đề nghị đưa vào cơ sở cai nghiện ma túy;","c) Bảo đảm quyền của người nghiện ma túy trong thời gian cai nghiện và cấp giấy xác nhận hoàn thành cai nghiện ma túy hoặc hoàn thành các giai đoạn cai nghiện ma túy theo quy định của Luật này và quy định khác của pháp luật có liên quan;","d) Tổ chức lao động trị liệu cho người cai nghiện ma túy theo các hình thức do cơ quan có thẩm quyền quyết định; sử dụng kết quả lao động trị liệu để phục vụ cho người nghiện ma túy theo quy định của Chính phủ;","đ) Người đứng đầu cơ sở cai nghiện ma túy quyết định truy tìm đối với người đang cai nghiện ma túy bỏ trốn khỏi cơ sở cai nghiện;","e) Người đứng đầu cơ sở cai nghiện ma túy có nghĩa vụ bảo đảm điều kiện hoạt động của cơ sở cai nghiện ma túy, niêm yết công khai chi phí cai nghiện ma túy tại cơ sở theo quy định của pháp luật;","g) Phòng, chống thẩm lậu ma túy vào cơ sở;","h) Cơ sở cai nghiện ma túy bố trí các khu hoặc phòng riêng cho người cai nghiện ma túy là nữ giới, người mắc bệnh truyền nhiễm nhóm A, nhóm B; đối với người có sự khác nhau giữa giới tính thực tế trên cơ thể và giới tính ghi trong hồ sơ, lý lịch thì được quản lý tại phòng riêng trong khu vực theo giới tính thực tế trên cơ thể.","Cơ sở cai nghiện ma túy tư nhân còn phải bố trí các khu hoặc phòng riêng khi tiếp nhận người cai nghiện ma túy là người từ đủ 12 tuổi đến dưới 18 tuổi;","i) Trong thời hạn 24 giờ kể từ khi người cai nghiện ma túy được tiếp nhận, tự ý chấm dứt việc cai nghiện, hoàn thành quy trình cai nghiện hoặc hoàn thành một số giai đoạn cai nghiện, cơ sở cai nghiện ma túy tư nhân phải thông báo cho Công an cấp xã nơi cơ sở cai nghiện ma túy tư nhân có trụ sở.","Trong thời hạn 24 giờ kể từ khi người cai nghiện ma túy trốn khỏi cơ sở cai nghiện thì cơ sở cai nghiện ma túy công lập, trường giáo dưỡng phải thông báo cho Công an cấp xã nơi lập hồ sơ đề nghị đưa người nghiện ma túy đi cai nghiện."]],["D",47,"Xử lý trường hợp vi phạm nghĩa vụ của người cai nghiện ma túy, người đang bị quản lý sau cai nghiện ma túy hoặc người điều trị nghiện bằng thuốc thay thế",["1. Người đang trong thời hạn cai nghiện ma túy, đang trong thời hạn quản lý sau cai n
