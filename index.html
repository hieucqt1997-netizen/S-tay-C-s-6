 Thiết bị thực hiện hoạt động lao động trị liệu, giáo dục nghề nghiệp;","đ) Thiết bị, phương tiện bảo vệ cá nhân trong lao động trị liệu, học nghề;","e) Thiết bị, vũ khí, công cụ hỗ trợ phục vụ việc quản lý, bảo đảm an ninh, an toàn tại cơ sở cai nghiện ma túy;","g) Thiết bị dùng chung cho cơ sở cai nghiện ma túy.","4. Cơ sở cai nghiện ma túy công lập đủ điều kiện thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi phải có thêm các khu sau:","a) Khu dạy văn hóa;","b) Khu quản lý người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi.","5. Điều kiện cơ sở vật chất, trang thiết bị cụ thể của cơ sở cai nghiện ma túy công lập thực hiện theo quy định của Bộ trưởng Bộ Công an."]],["D",67,"Điều kiện trang thiết bị phục vụ cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi của trường giáo dưỡng",["Trường giáo dưỡng thực hiện cai nghiện ma túy cho người từ đủ 12 tuổi đến dưới 18 tuổi phải đáp ứng điều kiện trang thiết bị thực hiện công tác cai nghiện ma túy theo quy định tại khoản 3 Điều 66 Nghị định này và có khu riêng quản lý người cai nghiện ma túy."]],["D",68,"Tổ Y tế trong cơ sở cai nghiện ma túy công lập",["1. Tổ Y tế của cơ sở cai nghiện ma túy công lập thực hiện các nhiệm vụ:","a) Xác định tình trạng nghiện ma túy;","b) Điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần và các bệnh lý khác;","c) Khám bệnh, chữa bệnh và hỗ trợ phục hồi sức khỏe thể chất, tâm thần, các chức năng khác cho người cai nghiện ma túy;","d) Phòng, chống dịch bệnh.","2. Tổ Y tế của cơ sở cai nghiện ma túy công lập được cấp phép hoạt động theo quy định của pháp luật về người hành nghề khám bệnh, chữa bệnh và cơ sở khám bệnh, chữa bệnh thuộc lực lượng vũ trang nhân dân."]],["D",69,"Phòng, chống dịch bệnh và điều trị bệnh tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng",["1. Cơ quan y tế cấp xã nơi đặt trụ sở của cơ sở cai nghiện ma túy công lập, trường giáo dưỡng có trách nhiệm phối hợp xử lý trường hợp phát sinh dịch bệnh hoặc điều trị bệnh vượt khả năng chuyên môn của cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","2. Trường hợp cần thiết hoặc ngoài khả năng xử lý của cơ quan y tế cấp xã thì cơ sở cai nghiện ma túy công lập, trường giáo dưỡng báo cáo Công an cấp tỉnh nơi đặt trụ sở của cơ sở cai nghiện ma túy công lập, trường giáo dưỡng; Công an cấp tỉnh có trách nhiệm đề nghị Sở Y tế phối hợp giải quyết vấn đề phòng, chống dịch bệnh và điều trị bệnh."]],["M","Mục 2","TRÌNH TỰ THỦ TỤC THÀNH LẬP; CẤP, CẤP LẠI; THU HỒI GIẤY PHÉP HOẠT ĐỘNG; ĐIỀU KIỆN VỀ CƠ SỞ VẬT CHẤT, TRANG THIẾT BỊ, NHÂN SỰ, CHẾ ĐỘ QUẢN LÝ TẠI CƠ SỞ CAI NGHIỆN MA TÚY TƯ NHÂN"],["D",70,"Tiêu chí thành lập cơ sở cai nghiện ma túy tư nhân",["1. Được thành lập, tổ chức, hoạt động theo quy định của pháp luật.","2. Có đủ điều kiện về cơ sở vật chất, trang thiết bị, nhân sự theo quy định tại Điều 71 và Điều 72 của Nghị định này.","3. Có phương án tài chính bảo đảm duy trì các hoạt động cai nghiện ma túy của cơ sở cai nghiện ma túy tư nhân theo Mẫu số 01 Phụ lục V ban hành kèm theo Nghị định này."]],["D",71,"Điều kiện về cơ sở vật chất, trang thiết bị của cơ sở cai nghiện ma túy tư nhân",["1. Cơ sở vật chất:","a) Khu y tế và điều trị cắt cơn: Phòng làm việc, phòng đặt thiết bị, kho thuốc, phòng khám, phòng điều trị các bệnh thông thường và bệnh truyền nhiễm, phòng cấp cứu; phòng điều trị cắt cơn có diện tích tối thiểu 05 m2/người cắt cơn và có công trình vệ sinh khép kín;","b) Khu quản lý người cai nghiện ma túy phải đáp ứng theo quy định tại điểm h khoản 2 Điều 46 của Luật Phòng, chống ma túy và phải bố trí: nhà ở của người cai nghiện ma túy có diện tích phòng ở tối thiểu 04 m2/người; nhà sinh hoạt chung; nhà ăn của người cai nghiện ma túy; khu rèn luyện thể chất, thể dục thể thao cho người cai nghiện ma túy;","c) Khu dạy văn hóa (nếu tiếp nhận người cai nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi) hoặc liên kết dạy văn hóa;","d) Khu giáo dục nghề nghiệp hoặc liên kết giáo dục nghề nghiệp;","đ) Có đủ điện, nước, thiết bị phòng cháy, chữa cháy, hệ thống xử lý nước thải, chất thải.","2. Trang thiết bị phục vụ hoạt động cai nghiện ma túy đáp ứng theo quy định tại Phụ lục IV ban hành kèm theo Nghị định này và phải đáp ứng tiêu chuẩn, quy chuẩn kỹ thuật theo quy định của pháp luật."]],["D",72,"Điều kiện về nhân sự của cơ sở cai nghiện ma túy tư nhân",["1. Người đứng đầu cơ sở cai nghiện ma túy tư nhân có bằng tốt nghiệp từ cao đẳng trở lên và có chứng chỉ hoặc chứng nhận đào tạo bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy do cơ quan, tổ chức có thẩm quyền cấp.","2. Người phụ trách chuyên môn về y tế phải đáp ứng điều kiện theo quy định tại khoản 5 Điều 85 của Nghị định này.","3. Nhân viên y tế, nhân viên tư vấn làm việc tại cơ sở cai nghiện ma túy tư nhân phải có trình độ chuyên môn từ trung cấp trở lên phù hợp với vị trí việc làm tại khoản 5 Điều 84, khoản 5 Điều 85, khoản 5 Điều 86, khoản 6 Điều 88 của Nghị định này.","4. Người làm việc tại cơ sở cai nghiện ma túy tư nhân phải có lý lịch rõ ràng, không thuộc trường hợp bị cấm hành nghề hoặc bị cấm thực hiện công việc liên quan đến cai nghiện ma túy theo quy định của pháp luật."]],["D",73,"Hồ sơ, trình tự thực hiện thủ tục cấp giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân",["1. Hồ sơ đề nghị cấp giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân gồm:","a) Văn bản đề nghị cấp giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân theo Mẫu số 02 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 bản sao quyết định thành lập, cho phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp;","Trường hợp cơ sở cai nghiện ma túy tư nhân đã cung cấp mã số doanh nghiệp trong văn bản đề nghị tại điểm a khoản 1 Điều này thì không phải nộp 01 bản sao theo quy định tại điểm này.","c) Tài liệu chứng minh bảo đảm đủ các tiêu chí, điều kiện cơ sở vật chất, thiết bị quy định tại Điều 70, Điều 71 và Điều 72 của Nghị định này;","d) 01 bản chính danh sách nhân viên theo Mẫu số 03 Phụ lục V ban hành kèm theo Nghị định này, kèm theo bản sao văn bằng, chứng chỉ; 01 bản tóm tắt lý lịch của người đứng đầu hoặc người đại diện hợp pháp theo Mẫu số 04 Phụ lục V ban hành kèm theo Nghị định này, 01 bản sao chứng chỉ hoặc chứng nhận đào tạo bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy của người đứng đầu cơ sở cai nghiện ma túy tư nhân.","2. Trình tự thực hiện:","a) Cơ sở cai nghiện ma túy tư nhân gửi trực tiếp, qua bưu điện hoặc phương thức điện tử 01 bộ hồ sơ quy định tại Khoản 1 Điều này đến Công an cấp tỉnh nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở. Trường hợp gửi hồ sơ theo phương thức điện tử thì phải lưu giữ bản gốc của hồ sơ và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của hồ sơ.","Cơ sở cai nghiện ma túy tư nhân được sử dụng thông tin trong cơ sở dữ liệu để thay thế giấy tờ là thành phần hồ sơ thủ tục hành chính theo quy định của Chính phủ cắt giảm, đơn giản hóa thủ tục hành chính dựa trên dữ liệu.","b) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ, Công an cấp tỉnh nơi có cơ sở cai nghiện ma túy tư nhân đặt trụ sở thẩm định hồ sơ, các điều kiện hoạt động và quyết định cấp giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân. Trường hợp không cấp giấy phép hoạt động phải trả lời bằng văn bản, nêu rõ lý do và cơ sở cai nghiện ma túy tư nhân được bổ sung hồ sơ trong trường hợp Công an cấp tỉnh thẩm định chưa đạt.","3. Giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân theo Mẫu số 05 Phụ lục V ban hành kèm theo Nghị định này."]],["D",74,"Hồ sơ, trình tự thực hiện thủ tục cấp lại giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân",["1. Các trường hợp cấp lại giấy phép hoạt động của cơ sở cai nghiện ma túy tư nhân gồm:","a) Thay đổi người đứng đầu;","b) Thay đổi địa điểm trụ sở;","c) Giấy phép hoạt động bị mất, hỏng.","2. Hồ sơ đề nghị cấp lại giấy phép hoạt động gồm văn bản đề nghị cấp lại giấy phép hoạt động theo Mẫu số 02 Phụ lục V ban hành kèm theo Nghị định này và bổ sung các tài liệu như sau:","a) Trường hợp thay đổi người đứng đầu: 01 bản tóm tắt lý lịch của người đứng đầu cơ sở cai nghiện ma túy tư nhân theo Mẫu số 04 Phụ lục V ban hành kèm theo Nghị định này và các văn bằng, chứng chỉ theo quy định tại Điều 72 của Nghị định này;","b) Trường hợp thay đổi địa điểm trụ sở: Tài liệu chứng minh bảo đảm đủ các điều kiện cơ sở vật chất, trang thiết bị tại trụ sở mới theo quy định tại Điều 71 của Nghị định này;","c) Trường hợp giấy phép hoạt động bị mất, hỏng thì phải nêu rõ lý do mất, hỏng trong văn bản đề nghị cấp lại giấy phép hoạt động.","3. Trình tự thực hiện:","a) Cơ sở cai nghiện ma túy tư nhân gửi trực tiếp, qua bưu điện hoặc phương thức điện tử 01 bộ hồ sơ quy định tại Khoản 2 Điều này đến Công an cấp tỉnh nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở. Trường hợp gửi hồ sơ theo phương thức điện tử thì phải lưu giữ bản gốc của hồ sơ và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của hồ sơ;","b) Trong thời hạn 05 ngày làm việc kể từ ngày nhận đủ hồ sơ, Công an cấp tỉnh nơi có cơ sở cai nghiện ma túy tư nhân đặt trụ sở thẩm định hồ sơ và quyết định cấp lại giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân. Trường hợp không cấp giấy phép hoạt động, phải trả lời bằng văn bản, nêu rõ lý do và cơ sở cai nghiện ma túy tư nhân được bổ sung hồ sơ trong trường hợp Công an cấp tỉnh thẩm định chưa đạt."]],["D",75,"Đình chỉ hoạt động cơ sở cai nghiện ma túy tư nhân có thời hạn",["1. Cơ sở cai nghiện ma túy tư nhân bị đình chỉ hoạt động cai nghiện có thời hạn trong các trường hợp sau:","a) Không bảo đảm các điều kiện hoạt động theo quy định tại Điều 71 và Điều 72 của Nghị định này;","b) Không cung cấp dịch vụ sau 03 tháng kể từ ngày được cấp giấy phép hoạt động;","c) Có hành vi vi phạm các quy định về cai nghiện ma túy tại khoản 2 Điều 46 của Luật Phòng, chống ma túy mà không khắc phục vi phạm trong thời hạn 15 ngày làm việc kể từ ngày có yêu cầu bằng văn bản của cơ quan có thẩm quyền;","d) Các trường hợp khác theo quy định của pháp luật mà không khắc phục vi phạm trong thời hạn 15 ngày làm việc kể từ ngày có yêu cầu bằng văn bản của cơ quan có thẩm quyền.","2. Căn cứ tính chất, mức độ vi phạm, Công an cấp tỉnh nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở quyết định đình chỉ hoạt động của cơ sở cai nghiện ma túy tư nhân với thời hạn từ 03 tháng đến 06 tháng.","3. Thủ tục đình chỉ hoạt động cơ sở cai nghiện ma túy tư nhân:","a) Trong thời hạn 05 ngày làm việc kể từ ngày phát hiện có hành vi vi phạm theo quy định tại Khoản 1 Điều này, Công an cấp tỉnh nơi có cơ sở cai nghiện ma túy tư nhân đặt trụ sở lập biên bản theo Mẫu số 07 Phụ lục V ban hành kèm theo Nghị định này và xem xét, ra quyết định đình chỉ hoạt động cơ sở cai nghiện ma túy tư nhân theo Mẫu số 08 Phụ lục V ban hành kèm theo Nghị định này;","b) Cơ sở cai nghiện ma túy tư nhân có trách nhiệm hoàn trả chi phí cai nghiện ma túy chưa sử dụng và giải quyết các quyền, lợi ích hợp pháp khác của người cai nghiện theo hợp đồng dịch vụ cai nghiện khi bị đình chỉ hoạt động.","4. Người cai nghiện ma túy ở cơ sở cai nghiện ma túy tư nhân bị đình chỉ mà chưa hoàn thành 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật Phòng, chống ma túy thì tiếp tục thực hiện thời gian, quy trình còn lại quy định tại khoản 1 và khoản 2 Điều 29 của Luật Phòng, chống ma túy tại cơ sở cai nghiện ma túy công lập.","Trường hợp người cai nghiện ma túy hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật Phòng, chống ma túy có nguyện vọng tiếp tục thực hiện thời gian, quy trình còn lại quy định tại khoản 1 và khoản 2 Điều 29 của Luật Phòng, chống ma túy tại gia đình, cộng đồng thì cơ sở cai nghiện tư nhân bị đình chỉ thực hiện theo quy định tại khoản 4 Điều 94 Nghị định này.","5. Chuyển tiếp cai nghiện ma túy đối với người đang tham gia cai nghiện ma túy trong trường hợp cơ sở cai nghiện ma túy tư nhân bị đình chỉ hoạt động có thời hạn theo quyết định của Công an cấp tỉnh:","a) Trong thời hạn 24 giờ, kể từ khi ra quyết định đình chỉ hoạt động của cơ sở cai nghiện ma túy tư nhân, Công an cấp tỉnh chỉ định cơ sở cai nghiện ma túy công lập thuộc thẩm quyền quản lý thực hiện tiếp nhận, cai nghiện cho người đang cai nghiện ma túy tại cơ sở cai nghiện ma túy tư nhân bị đình chỉ.","b) Trong thời hạn 24 giờ, kể từ khi nhận được quyết định đình chỉ hoạt động, cơ sở cai nghiện ma túy tư nhân có trách nhiệm sao hồ sơ bệnh án của người cai nghiện ma túy để gửi cho cơ sở cai nghiện ma túy công lập được chỉ định tiếp nhận, cai nghiện ma túy.","Cơ sở cai nghiện ma túy tư nhân đưa người đang cai nghiện ma túy tại cơ sở cai nghiện ma túy tư nhân đến cơ sở cai nghiện ma túy công lập được chỉ định để tiếp tục cai nghiện ma túy.","c) Trong thời hạn 24 giờ, kể từ khi nhận được chỉ định của Công an cấp tỉnh, cơ sở cai nghiện ma túy công lập có trách nhiệm tiếp nhận cai nghiện cho người đang cai nghiện ma túy của cơ sở cai nghiện ma túy tư nhân bị đình chỉ.","d) Sau khi Công an cấp tỉnh có thông báo về việc cơ sở cai nghiện ma túy tư nhân hết thời hạn bị đình chỉ theo quy định tại điểm a khoản 6 Điều này, cơ sở cai nghiện ma túy công lập có trách nhiệm chuyển trả người đang tham gia cai nghiện ma túy chưa hoàn thành thời gian, quy trình cai nghiện ma túy về cơ sở cai nghiện ma túy tư nhân đó để tiếp tục thực hiện cai nghiện ma túy theo quy định.","đ) Việc giao, nhận hồ sơ, người phải được lập thành biên bản theo Mẫu số 42 Phụ lục V ban hành kèm theo Nghị định này.","6. Trong thời hạn 03 ngày làm việc, kể từ khi hết thời hạn đình chỉ, cơ sở cai nghiện ma túy tư nhân phải báo cáo kết quả khắc phục việc đình chỉ hoạt động cho Giám đốc Công an cấp tỉnh nơi ra quyết định đình chỉ theo Mẫu số 06 Phụ lục V ban hành kèm theo Nghị định này. Trong thời hạn 03 ngày làm việc, kể từ khi nhận được báo cáo kết quả khắc phục việc đình chỉ hoạt động, Giám đốc Công an cấp tỉnh có trách nhiệm xem xét báo cáo khắc phục vi phạm:","a) Trường hợp cơ sở cai nghiện ma túy tư nhân đã khắc phục xong, Giám đốc Công an cấp tỉnh có trách nhiệm thông báo cho phép cơ sở cai nghiện ma túy tư nhân được tiếp tục hoạt động cai nghiện ma túy.","b) Trường hợp cơ sở cai nghiện ma túy tư nhân bị đình chỉ không khắc phục các vi phạm hoặc việc khắc phục các vi phạm không đáp ứng các quy định, Công an cấp tỉnh thực hiện thu hồi giấy phép hoạt động của cơ sở cai nghiện ma túy tư nhân theo điểm b khoản 1 Điều 76 Nghị định này."]],["D",76,"Thu hồi giấy phép hoạt động",["1. Cơ sở cai nghiện ma túy tư nhân bị thu hồi giấy phép khi thuộc một trong các trường hợp sau đây:","a) Có văn bản đề nghị dừng hoạt động cai nghiện ma túy theo Mẫu số 09 Phụ lục V ban hành kèm theo Nghị định này;","b) Không có biện pháp khắc phục khi bị đình chỉ hoạt động theo quy định tại Điều 75 Nghị định này;","c) Sau 06 tháng, kể từ ngày được cấp giấy phép mà cơ sở cai nghiện ma túy tư nhân chưa tổ chức hoạt động cai nghiện ma túy hoặc ngừng hoạt động 06 tháng liên tiếp không có lý do, trừ trường hợp phải tạm dừng hoạt động do sự kiện bất khả kháng.","2. Thủ tục thu hồi giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân:","a) Trong thời hạn 02 ngày làm việc, Giám đốc Công an cấp tỉnh nơi cơ sở cai nghiện đặt trụ sở xem xét, quyết định thu hồi giấy phép của cơ sở cai nghiện ma túy tư nhân đối với trường hợp quy định tại điểm a Khoản 1 Điều này;","b) Trong thời hạn 05 ngày làm việc kể từ ngày phát hiện hành vi vi phạm theo quy định tại điểm b, điểm c Khoản 1 Điều này, Công an cấp tỉnh nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở lập biên bản theo Mẫu số 07 Phụ lục V ban hành kèm theo Nghị định này và báo cáo Giám đốc Công an cấp tỉnh xem xét, quyết định thu hồi giấy phép hoạt động cai nghiện ma túy theo Mẫu số 10 Phụ lục V ban hành kèm theo Nghị định này;","c) Giám đốc Công an cấp tỉnh nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở thông báo việc thu hồi giấy phép hoạt động cơ sở cai nghiện ma túy tư nhân cho Ủy ban nhân dân và Công an cấp xã nơi cơ sở cai nghiện ma túy tư nhân đặt trụ sở.","3. Cơ sở cai nghiện ma túy tư nhân có trách nhiệm hoàn trả chi phí cai nghiện ma túy chưa sử dụng và giải quyết các quyền, lợi ích hợp pháp khác của người cai nghiện theo hợp đồng dịch vụ cai nghiện khi bị thu hồi giấy phép hoạt động."]],["D",77,"Chế độ quản lý tại cơ sở cai nghiện ma túy tư nhân",["1. Xây dựng, ban hành nội quy, quy chế hoạt động.","2. Thực hiện quy trình cai nghiện ma túy theo quy định của Nghị định này.","3. Thực hiện cai nghiện ma túy tự nguyện theo đúng quy định tại Khoản 2, điểm a khoản 3, điểm a khoản 4 và khoản 5 Điều 33 của Luật Phòng, chống ma túy.","4. Thực hiện chế độ quản lý bảo đảm quyền và nghĩa vụ của người cai nghiện ma túy quy định tại Điều 45 của Luật Phòng, chống ma túy.","5. Bảo đảm an ninh, an toàn và phòng, chống dịch bệnh tại cơ sở cai nghiện ma túy tư nhân."]],["M","Mục 3","THỦ TỤC ĐĂNG KÝ, CÔNG BỐ TỔ CHỨC, CÁ NHÂN ĐỦ ĐIỀU KIỆN CUNG CẤP DỊCH VỤ CAI NGHIỆN MA TÚY TỰ NGUYỆN TẠI GIA ĐÌNH, CỘNG ĐỒNG"],["D",78,"Phạm vi dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["Dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng là hoạt động cung cấp một hoặc nhiều giai đoạn của quy trình cai nghiện ma túy được quy định tại khoản 2 Điều 29 của Luật Phòng, chống ma túy."]],["D",79,"Điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Tổ chức cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng được thành lập, tổ chức, hoạt động theo quy định của pháp luật. Nhân sự thực hiện việc cung cấp dịch vụ phải đáp ứng điều kiện, tiêu chuẩn tương ứng với một hoặc nhiều giai đoạn của quy trình cai nghiện ma túy do tổ chức cung cấp, theo quy định tại khoản 5 Điều 84, khoản 5 Điều 85, khoản 5 Điều 86 và khoản 6 Điều 88 của Nghị định này.","2. Cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng không trong thời gian bị truy cứu trách nhiệm hình sự, thời gian chấp hành bản án hình sự của tòa án; không trong thời hạn cấm hành nghề hoặc công việc liên quan trực tiếp đến việc cung cấp dịch vụ cai nghiện ma túy; có trình độ chuyên môn đáp ứng điều kiện, tiêu chuẩn theo quy định tại khoản 5 Điều 84, khoản 5 Điều 85, khoản 5 Điều 86, khoản 6 Điều 88 của Nghị định này.","3. Tổ chức cung cấp dịch vụ cai nghiện phải đáp ứng về cơ sở vật chất, trang thiết bị:","a) Có cơ sở vật chất để thực hiện việc tiếp nhận, cung cấp dịch vụ cai nghiện theo phạm vi dịch vụ đăng ký.","Trường hợp cung cấp dịch vụ nội trú, cơ sở phải đáp ứng các điều kiện về phòng ở quy định tại điểm b Khoản 1 Điều 71 Nghị định này;","b) Có trang thiết bị tối thiểu để thực hiện các dịch vụ đã đăng ký tương ứng với quy định tại Phụ lục IV ban hành kèm theo Nghị định này.","4. Cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải có địa điểm thực hiện việc cung cấp dịch vụ. Trường hợp cung cấp dịch vụ điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần và các bệnh lý khác phải có đủ trang thiết bị tối thiểu tương ứng quy định tại Phụ lục IV ban hành kèm theo Nghị định này."]],["D",80,"Hồ sơ, trình tự đăng ký, công bố cơ sở cai nghiện ma túy công lập, tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Hồ sơ đăng ký cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng của tổ chức gồm:","a) Văn bản của tổ chức đề nghị công bố đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 11 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 bản sao quyết định thành lập, cho phép thành lập hoặc giấy chứng nhận đăng ký doanh nghiệp;","Trường hợp tổ chức đã cung cấp mã số doanh nghiệp trong văn bản đề nghị tại điểm a khoản 1 Điều này thì không phải nộp 01 bản sao theo quy định tại điểm này.","c) Tài liệu chứng minh bảo đảm đủ các điều kiện cơ sở vật chất, trang thiết bị cung cấp dịch vụ;","d) 01 bản chính danh sách nhân viên theo Mẫu số 03 Phụ lục V ban hành kèm theo Nghị định này, kèm theo 01 bản sao văn bằng, chứng chỉ; tóm tắt lý lịch của người đứng đầu hoặc người đại diện hợp pháp của cơ sở cung cấp dịch vụ theo Mẫu số 04 Phụ lục V ban hành kèm theo Nghị định này.","2. Hồ sơ đăng ký cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng của cá nhân gồm:","a) Văn bản của cá nhân đề nghị công bố đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 11 Phụ lục V ban hành kèm theo Nghị định này;","b) Lý lịch tóm tắt theo Mẫu số 04 Phụ lục V ban hành kèm theo Nghị định này;","c) 01 bản sao văn bằng, chứng chỉ phù hợp với dịch vụ đăng ký.","3. Trình tự thực hiện:","a) Tổ chức, cá nhân gửi trực tiếp, qua bưu điện hoặc qua phương thức điện tử 01 bộ hồ sơ theo quy định tại khoản 1, khoản 2 Điều này đến Công an cấp tỉnh nơi tổ chức đặt trụ sở hoặc nơi cá nhân cư trú. Trường hợp gửi hồ sơ theo phương thức điện tử, tổ chức, cá nhân có trách nhiệm lưu giữ bản gốc của hồ sơ và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của hồ sơ.","Tổ chức, cá nhân được sử dụng thông tin trong cơ sở dữ liệu để thay thế giấy tờ là thành phần hồ sơ thủ tục hành chính theo quy định của Chính phủ cắt giảm, đơn giản hóa thủ tục hành chính dựa trên dữ liệu.","b) Trong thời hạn 05 ngày làm việc, kể từ ngày nhận được hồ sơ đăng ký hợp lệ, Giám đốc Công an cấp tỉnh công bố tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 12 Phụ lục V ban hành kèm theo Nghị định này. Trường hợp không đủ điều kiện công bố phải trả lời bằng văn bản, nêu rõ lý do và hướng dẫn bổ sung hồ sơ.","4. Trưởng phòng Cảnh sát điều tra tội phạm về ma túy trình Giám đốc Công an cấp tỉnh Tờ trình công bố cơ sở cai nghiện ma túy công lập đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng kèm theo Quyết định thành lập cơ sở cai nghiện ma túy công lập để Giám đốc Công an cấp tỉnh công bố cơ sở cai nghiện ma túy công lập đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 12 Phụ lục V ban hành kèm theo Nghị định này.","5. Việc công bố tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải được niêm yết công khai tại trang thông tin điện tử của Công an cấp tỉnh, trụ sở Ủy ban nhân dân và Công an cấp xã, thông báo trên các phương tiện thông tin đại chúng trên địa bàn."]],["D",81,"Đình chỉ việc cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng bị đình chỉ trong thời hạn 03 tháng trong các trường hợp sau:","a) Không bảo đảm các điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo quy định tại Điều 79 của Nghị định này;","b) Không cung cấp dịch vụ cai nghiện ma túy trong thời hạn 06 tháng liên tục kể từ ngày được công bố đủ điều kiện cung cấp dịch vụ;","c) Có hành vi vi phạm các quy định về cai nghiện ma túy tại khoản 8 Điều 32 của Luật Phòng, chống ma túy mà trong thời hạn 15 ngày làm việc không khắc phục theo yêu cầu;","d) Các trường hợp khác theo quy định của pháp luật mà trong thời hạn 15 ngày làm việc không khắc phục theo yêu cầu.","2. Thủ tục đình chỉ việc cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng:","a) Trong thời hạn 03 ngày làm việc kể từ ngày phát hiện hành vi vi phạm theo quy định tại khoản 1 Điều này, Công an cấp xã có trách nhiệm lập biên bản theo Mẫu số 13 Phụ lục V ban hành kèm theo Nghị định này, báo cáo Giám đốc Công an cấp tỉnh. Trong thời hạn 03 ngày làm việc kể từ ngày lập biên bản, Giám đốc Công an cấp tỉnh xem xét, quyết định đình chỉ hoạt động cung cấp dịch vụ cai nghiện ma túy tự nguyện theo Mẫu số 14 Phụ lục V ban hành kèm theo Nghị định này;","b) Tổ chức, cá nhân bị đình chỉ hoạt động có trách nhiệm hoàn trả chi phí sử dụng dịch vụ cai nghiện chưa sử dụng và giải quyết các quyền, lợi ích hợp pháp khác của người cai nghiện theo thỏa thuận cung cấp dịch vụ cai nghiện.","3. Người cai nghiện ma túy sử dụng dịch vụ tại tổ chức, cá nhân bị đình chỉ thì tiếp tục thực hiện thời gian, quy trình còn lại theo quy định tại khoản 1 và khoản 2 Điều 29 của Luật Phòng, chống ma túy tại tổ chức, cá nhân cung cấp dịch vụ khác trên địa bàn.","Trường hợp không có tổ chức, cá nhân cung cấp dịch vụ trên địa bàn, Công an cấp xã có trách nhiệm tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy có trách nhiệm tư vấn, hướng dẫn người đang sử dụng dịch vụ có thể tiếp tục cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập.","4. Chuyển tiếp cai nghiện ma túy đối với người đang sử dụng dịch vụ cai nghiện tại các tổ chức, cá nhân bị đình chỉ hoạt động có thời hạn theo quyết định của Công an cấp tỉnh:","a) Trong thời hạn 24 giờ, kể từ khi ra quyết định đình chỉ hoạt động của tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy, Công an cấp xã có trách nhiệm tư vấn, hướng dẫn người đang cai nghiện ma túy sử dụng dịch vụ tại các tổ chức, cá nhân khác trên địa bàn.","Trường hợp người đang cai nghiện ma túy có nguyện vọng sử dụng dịch vụ của cơ sở cai nghiện ma túy công lập, người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy báo cáo Công an cấp xã trình Giám đốc công an cấp tỉnh chỉ định cơ sở cai nghiện ma túy công lập tiếp nhận người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng vào cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập.","b) Trong thời hạn 24 giờ, kể từ khi nhận được chỉ định của Công an cấp tỉnh, cơ sở cai nghiện ma túy công lập có trách nhiệm tiếp nhận cai nghiện cho người đang cai nghiện ma túy tại gia đình, cộng đồng.","c) Cơ sở cai nghiện ma túy công lập được chỉ định có trách nhiệm chuyển người đang tham gia cai nghiện ma túy chưa hoàn thành thời gian, quy trình về cai nghiện ma túy tại tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy sau khi Công an cấp tỉnh thực hiện thủ tục thông báo đối với tổ chức, cá nhân bị đình chỉ khi hết thời hạn bị đình chỉ theo quy định tại điểm a khoản 5 Điều này.","5. Trong thời hạn 03 ngày làm việc, trước khi hết thời hạn đình chỉ, tổ chức, cá nhân phải báo cáo kết quả khắc phục việc đình chỉ hoạt động cho Giám đốc Công an cấp tỉnh nơi ra quyết định đình chỉ theo Mẫu số 15 Phụ lục V ban hành kèm theo Nghị định này. Trong thời hạn 03 ngày làm việc, kể từ khi nhận được báo cáo kết quả khắc phục việc đình chỉ hoạt động, Giám đốc Công an cấp tỉnh có trách nhiệm xem xét báo cáo khắc phục vi phạm:","a) Trường hợp hồ sơ đủ điều kiện, Giám đốc Công an cấp tỉnh có trách nhiệm thông báo cho tổ chức, cá nhân đủ điều kiện tiếp tục thực hiện cai nghiện ma túy.","b) Trường hợp tổ chức, cá nhân bị đình chỉ không khắc phục các vi phạm hoặc việc khắc phục các vi phạm không đáp ứng các quy định, Công an cấp tỉnh thực hiện thu hồi công bố tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy."]],["D",82,"Hồ sơ, trình tự công bố lại đối với tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Các trường hợp công bố lại đối với tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng gồm:","a) Thay đổi người đứng đầu;","b) Thay đổi địa điểm trụ sở.","2. Hồ sơ đề nghị công bố lại đối với tổ chức cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng gồm văn bản đề nghị công bố lại của tổ chức theo Mẫu số 11 Phụ lục V ban hành kèm theo Nghị định này và bổ sung các tài liệu như sau:","a) Trường hợp thay đổi người đứng đầu: Tóm tắt lý lịch của người đứng đầu tổ chức cung cấp dịch vụ theo Mẫu số 04 Phụ lục V ban hành kèm theo Nghị định này và các văn bằng, chứng chỉ;","b) Trường hợp thay đổi địa điểm trụ sở: Tài liệu chứng minh địa điểm trụ sở mới của cơ sở cung cấp dịch vụ;","3. Hồ sơ đề nghị công bố lại đối với cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng gồm:","a) Văn bản đề nghị công bố lại của cá nhân theo Mẫu số 11 Phụ lục V ban hành kèm theo Nghị định này;","b) Báo cáo kết quả khắc phục việc đình chỉ cung cấp dịch vụ theo Mẫu số 15 Phụ lục V ban hành kèm theo Nghị định này.","4. Trong thời hạn 05 ngày làm việc kể từ ngày nhận được hồ sơ hợp lệ, Giám đốc Công an cấp tỉnh công bố lại tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 12 Phụ lục V ban hành kèm theo Nghị định này. Trường hợp không đủ điều kiện công bố lại phải trả lời bằng văn bản, nêu rõ lý do và hướng dẫn bổ sung hồ sơ.","5. Việc công bố lại đối với tổ chức, cá nhân đủ điều kiện cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải được niêm yết công khai tại trang thông tin điện tử của Công an cấp tỉnh, trụ sở Ủy ban nhân dân cấp xã, trụ sở Công an cấp xã và thông báo trên các phương tiện thông tin đại chúng."]],["D",83,"Giao nhiệm vụ cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng cho đơn vị sự nghiệp công lập",["1. Căn cứ vào nhu cầu cai nghiện tự nguyện tại gia đình, cộng đồng và chức năng, nhiệm vụ, điều kiện thực tế, Giám đốc Công an cấp tỉnh chủ trì, phối hợp với các cơ quan có liên quan tham mưu Chủ tịch Ủy ban nhân dân cấp tỉnh quyết định giao nhiệm vụ cho các đơn vị sự nghiệp công lập thuộc thẩm quyền cung cấp một hoặc nhiều dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng khi đáp ứng đủ điều kiện về cơ sở vật chất, trang thiết bị và nhân sự tương ứng với nhiệm vụ được giao theo Mẫu số 16 Phụ lục V ban hành kèm theo Nghị định này, gồm:","a) Cơ sở y tế cung cấp dịch vụ theo quy định tại điểm b khoản 2 Điều 29 của Luật Phòng, chống ma túy;","b) Cơ sở giáo dục nghề nghiệp cung cấp dịch vụ đào tạo nghề;","c) Tổ chức dịch vụ việc làm công cung cấp dịch vụ tư vấn, giới thiệu việc làm;","d) Các đơn vị sự nghiệp khác được giao thực hiện cung cấp các dịch vụ phù hợp với chức năng, nhiệm vụ của đơn vị.","2. Đơn vị sự nghiệp công lập được giao nhiệm vụ cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải đáp ứng các điều kiện cơ sở vật chất, trang thiết bị, nhân sự theo quy định tại Điều 79 của Nghị định này.","3. Chủ tịch Ủy ban nhân dân cấp tỉnh bố trí nguồn lực cho đơn vị sự nghiệp công lập được giao nhiệm vụ và thông báo danh sách trên trang thông tin điện tử của Ủy ban nhân dân cấp tỉnh, Công an cấp tỉnh, trụ sở Ủy ban nhân dân cấp xã, Công an cấp xã và các phương tiện thông tin đại chúng trên địa bàn."]],["M","Mục 4","QUY TRÌNH CAI NGHIỆN MA TÚY"],["D",84,"Giai đoạn tiếp nhận, phân loại",["1. Thực hiện các thủ tục tiếp nhận người cai nghiện theo nội quy, quy chế của cơ sở cai nghiện ma túy, cơ sở cung cấp dịch vụ cai nghiện ma túy tự nguyện.","2. Thu thập thông tin cá nhân của người nghiện ma túy để tư vấn xây dựng kế hoạch cai nghiện, gồm: độ tuổi, giới tính, tình trạng sức khỏe, loại ma túy sử dụng, mức độ sử dụng, trình độ học vấn, nghề nghiệp và các vấn đề khác về bản thân, gia đình người nghiện ma túy phục vụ công tác cai nghiện ma túy theo Mẫu số 17 Phụ lục V ban hành kèm theo Nghị định này.","3. Cung cấp thông tin về chương trình cai nghiện cho người nghiện ma túy.","4. Phân loại đối tượng và tư vấn xây dựng kế hoạch cai nghiện ma túy theo Mẫu số 18 Phụ lục V ban hành kèm theo Nghị định này.","5. Người thực hiện giai đoạn tiếp nhận, phân loại có trình độ từ trung cấp trở lên và được đào tạo bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy.","6. Thời gian thực hiện giai đoạn tiếp nhận, phân loại tối đa 02 ngày."]],["D",85,"Giai đoạn điều trị cắt cơn, giải độc, rối loạn tâm thần và các bệnh lý khác",["1. Khám bệnh, lập hồ sơ bệnh án theo quy định của pháp luật về khám bệnh, chữa bệnh; xác định mức độ và tình trạng sử dụng ma túy của người nghiện làm căn cứ xây dựng và áp dụng phác đồ điều trị cắt cơn, giải độc; phát hiện các dấu hiệu rối loạn tâm thần, các bệnh lý kèm theo và bệnh cơ hội.","2. Xây dựng, thực hiện phác đồ điều trị kết hợp giữa sử dụng thuốc với các biện pháp tâm lý trị liệu và vật lý trị liệu phục hồi chức năng, kết hợp điều trị cắt cơn, giải độc với điều trị rối loạn tâm thần và các bệnh cơ hội khác.","3. Tư vấn tâm lý đối với người nghiện trước khi điều trị cắt cơn, giải độc.","4. Việc thực hiện giai đoạn điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần, điều trị các bệnh lý khác theo chỉ định, hướng dẫn chuyên môn của Bộ Y tế.","5. Người phụ trách chuyên môn, thực hiện giai đoạn điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần, điều trị các bệnh lý khác là bác sĩ, có chứng chỉ hành nghề khám bệnh, chữa bệnh chuyên khoa tâm thần hoặc đa khoa hoặc chuyên khoa nội hoặc chuyên khoa y học cổ truyền. Trường hợp bác sĩ có chứng chỉ hành nghề khám bệnh, chữa bệnh đa khoa hoặc chuyên khoa nội hoặc chuyên khoa y học cổ truyền phải được đào tạo, bồi dưỡng kiến thức chuyên môn về điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần tại cơ sở có chức năng đào tạo.","6. Thời gian thực hiện giai đoạn điều trị cắt cơn, giải độc, điều trị rối loạn tâm thần, điều trị các bệnh lý khác tối thiểu 10 ngày."]],["D",86,"Giai đoạn giáo dục, tư vấn phục hồi hành vi, nhân cách",["1. Tổ chức dạy văn hóa, các lớp học xóa mù chữ, học tập các chuyên đề: giáo dục công dân, sức khỏe và cộng đồng, pháp luật, chính trị, đạo đức, truyền thống dân tộc và chuyên đề phù hợp khác với số lượng, trình độ học vấn người cai nghiện.","2. Tổ chức các hoạt động trị liệu tâm lý nhằm điều trị các rối loạn tâm thần, nâng cao kỹ năng sống, giá trị sống, tư duy tích cực, kỹ năng tự quản lý bản thân cho người cai nghiện.","3. Kết hợp việc học tập, trị liệu với việc tư vấn, khuyến khích người cai nghiện tham gia các hoạt động lao động, sinh hoạt hàng ngày tại cơ sở để tạo ý thức, thói quen tốt trong sinh hoạt.","4. Tổ chức thực hiện các hoạt động văn hóa, văn nghệ, thể thao, các chương trình sinh hoạt tập thể, trò chơi vận động cho người cai nghiện.","5. Người thực hiện giai đoạn giáo dục, tư vấn phục hồi hành vi, nhân cách phải có trình độ từ trung cấp trở lên, được đào tạo bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy, tư vấn tâm lý, phục hồi hành vi, kỹ năng quản lý người cai nghiện ma túy.","6. Thời gian thực hiện giai đoạn giáo dục, tư vấn phục hồi hành vi, nhân cách tối thiểu 03 tháng."]],["D",87,"Giai đoạn lao động trị liệu, học nghề",["1. Tổ chức các hoạt động lao động trị liệu nhằm giúp người cai nghiện cải thiện về sức khỏe thể chất, tâm trí, tăng cường ý thức tổ chức, kỷ luật trong lao động, nâng cao tinh thần tự lập và giúp người cai nghiện nhận thức được giá trị của lao động.","2. Căn cứ vào trình độ, nguyện vọng của người cai nghiện để tổ chức các hoạt động hướng nghiệp, giáo dục nghề nghiệp phù hợp với điều kiện thực tế theo quy định của Luật Giáo dục nghề nghiệp.","3. Thời gian thực hiện sau khi kết thúc giai đoạn điều trị cắt cơn giải độc, rối loạn tâm thần và các bệnh lý khác đến hết thời hạn cai nghiện ma túy."]],["D",88,"Giai đoạn chuẩn bị tái hòa nhập cộng đồng",["1. Đánh giá kết quả thực hiện kế hoạch cai nghiện theo các mục tiêu; đánh giá tình trạng sức khỏe thể chất, tâm thần của người cai nghiện ma túy.","2. Xác định nơi cư trú của người cai nghiện để chuẩn bị thực hiện biện pháp quản lý sau cai nghiện ma túy; tư vấn các biện pháp phòng, chống tái nghiện cho người hoàn thành cai nghiện ma túy; tư vấn kỹ năng từ chối sử dụng trái phép chất ma túy khi tái hòa nhập cộng đồng.","3. Cung cấp thông tin về biện pháp quản lý sau cai nghiện tại cộng đồng và các chính sách hỗ trợ hòa nhập của nhà nước đối với người sau cai nghiện ma túy; giới thiệu, cung cấp thông tin, địa chỉ dịch vụ công tác xã hội, nhóm sinh hoạt đồng đẳng tại địa phương cho người cai nghiện ma túy.","4. Phổ biến chính sách, pháp luật, thông tin về tình hình kinh tế - xã hội, thị trường lao động, tư vấn, giáo dục kỹ năng sống, trợ giúp về tâm lý, hỗ trợ các thủ tục pháp lý nhằm trang bị kiến thức cần thiết, nâng cao khả năng tự giải quyết những khó khăn, vướng mắc của người cai nghiện ma túy.","5. Hướng dẫn người cai nghiện ma túy xây dựng kế hoạch tái hòa nhập cộng đồng theo Mẫu số 19 Phụ lục V ban hành kèm theo Nghị định này. Kế hoạch cần xác định mục tiêu, nguyện vọng của người cai nghiện ma túy, hoàn cảnh thực tế, sự hỗ trợ của các nguồn lực, năng lực bản thân người cai nghiện ma túy, chọn việc làm phù hợp với sức khỏe và kỹ năng lao động của bản thân.","6. Người thực hiện giai đoạn chuẩn bị tái hòa nhập cộng đồng có trình độ từ trung cấp trở lên và được đào tạo, bồi dưỡng kiến thức chuyên môn trong công tác cai nghiện ma túy.","7. Thời gian thực hiện giai đoạn chuẩn bị tái hòa nhập cộng đồng là 30 ngày trước khi hoàn thành chương trình cai nghiện ma túy.","8. Quy trình cai nghiện ma túy thực hiện theo quy định của Bộ Công an."]],["M","Mục 5","THỦ TỤC ĐĂNG KÝ VÀ QUYẾT ĐỊNH CAI NGHIỆN MA TÚY TỰ NGUYỆN HOẶC ĐIỀU TRỊ NGHIỆN BẰNG THUỐC THAY THẾ"],["D",89,"Đăng ký cai nghiện ma túy tự nguyện hoặc đăng ký điều trị nghiện bằng thuốc thay thế",["1. Đối với người có kết quả xác định tình trạng nghiện là nghiện ma túy:","a) Trường hợp có nơi cư trú ổn định, trong thời hạn 24 giờ kể từ khi được cơ quan có thẩm quyền xác định, thông báo là nghiện ma túy, người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi phải đăng ký cai nghiện ma túy tự nguyện hoặc đăng ký điều trị nghiện bằng thuốc thay thế tại Công an cấp xã nơi người đó cư trú. Trường hợp do sự kiện bất khả kháng không thể thực hiện đúng thời hạn trên thì thời hạn được tính lại kể từ thời điểm sự kiện bất khả kháng chấm dứt theo quyết định của cơ quan có thẩm quyền.","b) Trường hợp người không có nơi cư trú ổn định, trong thời hạn 24 giờ kể từ khi được cơ quan có thẩm quyền xác định, thông báo là nghiện ma túy, người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi phải đăng ký tại Công an cấp xã nơi phát hiện hành vi sử dụng trái phép chất ma túy và thực hiện việc cai nghiện tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","2. Thủ tục, hồ sơ đăng ký điều trị nghiện bằng thuốc thay thế thực hiện theo quy định của Chính phủ.","Trường hợp đủ tiêu chuẩn tham gia điều trị nghiện bằng thuốc thay thế, trong thời hạn 24 giờ, cơ sở điều trị thay thế gửi thông báo tiếp nhận điều trị nghiện bằng thuốc thay thế cho Công an cấp xã nơi người đăng ký tham gia điều trị nghiện bằng thuốc thay thế.","3. Hồ sơ đăng ký cai nghiện ma túy tự nguyện gồm:","a) Lý lịch của người đăng ký đi cai nghiện ma túy theo Mẫu số 33 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 đơn xin đi cai nghiện tự nguyện của người nghiện ma túy; trường hợp người nghiện ma túy chưa đủ 18 tuổi thì phải có ý kiến của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ theo Mẫu số 20 Phụ lục V ban hành kèm theo Nghị định này;","c) 01 bản sao xác nhận tình trạng nghiện ma túy của cơ sở y tế có thẩm quyền;","Trường hợp người nghiện ma túy đang tham gia điều trị bằng thuốc thay thế mà đăng ký cai nghiện ma túy tự nguyện thì nộp 01 giấy xác nhận đang điều trị của cơ sở điều trị nghiện bằng thuốc thay thế theo Mẫu số 35 Phụ lục V ban hành kèm theo Nghị định này;","d) 01 bản sao một trong các loại giấy tờ tùy thân của người nghiện ma túy: căn cước, căn cước công dân, hộ chiếu, tài khoản định danh VNeID...;","đ) Văn bản của Trưởng Công an cấp xã đề nghị xem xét đưa vào cơ sở cai nghiện ma túy công lập, trường giáo dưỡng trong trường hợp đăng ký cai nghiện ma túy tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","4. Trình tự thực hiện đăng ký cai nghiện ma túy tự nguyện:","Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi nộp 01 bộ hồ sơ theo quy định tại khoản 3 Điều này như sau:","a) Trường hợp nộp trực tiếp tại điểm tiếp nhận đăng ký cai nghiện của Công an cấp xã nơi cư trú hoặc Công an cấp xã nơi phát hiện hành vi sử dụng trái phép chất ma túy; xuất trình bản chính giấy tờ tùy thân để đối chiếu.","b) Trường hợp nộp trực tuyến tại Cổng Dịch vụ công quốc gia hoặc Ứng dụng định danh quốc gia, người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi có trách nhiệm lưu giữ toàn bộ bản gốc của hồ sơ và chịu trách nhiệm trước pháp luật về tính chính xác, trung thực của hồ sơ.","Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi được sử dụng thông tin trong cơ sở dữ liệu để thay thế giấy tờ là thành phần hồ sơ thủ tục hành chính theo quy định của Chính phủ cắt giảm, đơn giản hóa thủ tục hành chính dựa trên dữ liệu.","5. Người tiếp nhận kiểm tra hồ sơ, đối chiếu giấy tờ tùy thân và vào sổ đăng ký cai nghiện ma túy tự nguyện theo Mẫu số 21 Phụ lục V ban hành kèm theo Nghị định này; Trường hợp hồ sơ chưa hợp lệ, người tiếp nhận hướng dẫn, thông báo người đăng ký hoàn thiện, bổ sung hồ sơ đăng ký cai nghiện ma túy tự nguyện."]],["D",90,"Tiếp nhận đăng ký cai nghiện ma túy tự nguyện",["1. Công an cấp xã bố trí địa điểm, nhân sự tiếp nhận hồ sơ, hướng dẫn việc đăng ký cai nghiện ma túy tự nguyện.","2. Địa điểm tiếp nhận đăng ký cai nghiện ma túy tự nguyện phải có bàn, ghế làm việc, máy vi tính, tủ hồ sơ phục vụ cho việc tiếp nhận đăng ký và lưu hồ sơ đăng ký.","3. Việc đăng ký bằng hình thức trực tuyến qua cổng thông tin, trang thông tin điện tử hoặc qua nền tảng số thực hiện theo hướng dẫn của Bộ Công an."]],["D",91,"Quyết định cai nghiện ma túy tự nguyện",["1. Trong thời hạn 24 giờ kể từ khi tiếp nhận đăng ký cai nghiện ma túy tự nguyện, Công an cấp xã có trách nhiệm kiểm tra hồ sơ đăng ký cai nghiện ma túy tự nguyện và ra quyết định cai nghiện ma túy tự nguyện.","2. Quyết định cai nghiện ma túy tự nguyện theo Mẫu số 22 Phụ lục V ban hành kèm theo Nghị định này phải được gửi cho:","a) Cá nhân người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và được lập biên bản giao nhận quyết định theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này;","b) Giám đốc Công an cấp tỉnh, trong trường hợp người nghiện ma túy đăng ký đi cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng;","c) Phòng Cảnh sát điều tra tội phạm về ma túy Công an cấp tỉnh để theo dõi, quản lý theo chức năng, nhiệm vụ được phân công."]],["M","Mục 6","TỔ CHỨC CAI NGHIỆN MA TÚY TỰ NGUYỆN"],["D",92,"Tiếp nhận cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, cai nghiện ma túy tại cơ sở cai nghiện ma túy tư nhân",["1. Tiếp nhận cai nghiện ma túy tự nguyện tại gia đình, cộng đồng:","a) Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi khi đến đăng ký cai nghiện ma túy tự nguyện tại gia đình, cộng đồng thì Công an cấp xã lập biên bản tiếp nhận đăng ký cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 24 Phụ lục V ban hành kèm theo Nghị định này.","Người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải cam kết bằng văn bản về việc chấp hành nghiêm chỉnh các biện pháp quản lý, giám sát.","Trường hợp người cai nghiện ma túy là người từ đủ 12 tuổi đến dưới 18 tuổi thì văn bản cam kết có xác nhận của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ theo Mẫu số 25 Phụ lục V ban hành kèm theo Nghị định này.","b) Tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng: kiểm tra quyết định cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; đối chiếu và tư vấn kế hoạch cai nghiện ma túy; thông tin về dịch vụ cai nghiện ma túy hiện có tại cơ sở, mức chi phí sử dụng dịch vụ cai nghiện ma túy và chế độ hỗ trợ đối với người cai nghiện (nếu có);","c) Sau khi tiếp nhận vào cai nghiện, trường hợp người đang cai nghiện ma túy tự nguyện tại gia đình, cộng đồng thay đổi nơi cư trú thì phải báo cho Công an cấp xã nơi ra quyết định cai nghiện ma túy tự nguyện; Công an cấp xã nơi chuyển đi có trách nhiệm thông báo kèm theo hồ sơ của người cai nghiện ma túy tự nguyện cho Công an cấp xã nơi chuyển đến trong thời hạn 24 giờ kể từ khi người đó chuyển khỏi địa phương để đưa vào danh sách và tiếp tục quản lý hỗ trợ.","Hồ sơ gồm có: Văn bản thông báo đề nghị tiếp tục quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 26 Phụ lục V ban hành kèm theo Nghị định này; quyết định cai nghiện ma túy tự nguyện; biên bản tiếp nhận đăng ký cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","2. Tiếp nhận cai nghiện ma túy tại cơ sở cai nghiện ma túy tư nhân:","a) Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi nộp 01 bản quyết định cai nghiện ma túy tự nguyện của Công an cấp xã và xuất trình bản chính một trong các loại giấy tờ tùy thân để đối chiếu.","b) Cơ sở cai nghiện ma túy tư nhân: kiểm tra quyết định cai nghiện ma túy tự nguyện tại gia đình, cộng đồng; đối chiếu thông tin và tư vấn kế hoạch cai nghiện ma túy; thông tin về dịch vụ cai nghiện ma túy hiện có tại cơ sở, mức chi phí sử dụng dịch vụ cai nghiện ma túy và chế độ hỗ trợ đối với người cai nghiện (nếu có);","c) Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và đại diện cơ sở cai nghiện ma túy tư nhân ký kết hợp đồng dịch vụ cai nghiện ma túy theo Mẫu số 29 Phụ lục V ban hành kèm theo Nghị định này.","d) Cơ sở cai nghiện ma túy tư nhân lập biên bản tiếp nhận cai nghiện ma túy tự nguyện theo Mẫu số 24 Phụ lục V ban hành kèm theo Nghị định này;","Biên bản tiếp nhận cai nghiện ma túy tự nguyện được gửi: 01 bản cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi, 01 bản gửi Công an cấp xã nơi ra Quyết định cai nghiện ma túy tự nguyện."]],["D",93,"Hoàn thành cai nghiện ma túy tự nguyện tại gia đình, cộng đồng",["1. Tổ chức, cá nhân cung cấp dịch vụ cai nghiện ma túy tự nguyện tại gia đình, cộng đồng cấp giấy xác nhận hoàn thành dịch vụ cai nghiện ma túy theo Mẫu số 27 Phụ lục V ban hành kèm theo Nghị định này và gửi:","a) 01 bản cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và được lập biên bản giao nhận Giấy xác nhận theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 bản gửi người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","2. Chậm nhất 30 ngày trước khi hết thời hạn cai nghiện ma túy tự nguyện tại gia đình, cộng đồng, người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy có trách nhiệm thông báo cho Công an cấp xã nơi người cai nghiện cư trú theo Mẫu số 51 Phụ lục V ban hành kèm theo Nghị định này.","3. Khi hết thời hạn cai nghiện ma túy tự nguyện tại gia đình, cộng đồng người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng đánh giá kết quả cai nghiện ma túy tự nguyện và đề nghị Trưởng Công an cấp xã nơi người nghiện đang cư trú cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện tại gia đình, cộng đồng theo Mẫu số 28 Phụ lục V ban hành kèm theo Nghị định này.","4. Trong thời hạn 24 giờ, trước khi người cai nghiện ma túy đã thực hiện đầy đủ thời hạn, quy trình quy định tại khoản 1 và khoản 2 Điều 29 của Luật Phòng, chống ma túy, Trưởng Công an cấp xã nơi người nghiện cư trú có trách nhiệm:","a) Cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện tại gia đình, cộng đồng. Giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện tại gia đình, cộng đồng phải được gửi cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và được lập biên bản giao nhận Giấy xác nhận theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này; Công an cấp xã nơi người cai nghiện đăng ký cai nghiện tự nguyện; người được giao nhiệm vụ tư vấn tâm lý, xã hội, quản lý, hỗ trợ người cai nghiện ma túy tự nguyện tại gia đình, cộng đồng.","b) Thông báo và trao quyết định quản lý sau cai cho người hoàn thành cai nghiện ma túy và được lập biên bản giao nhận quyết định theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này."]],["D",94,"Kết thúc hợp đồng dịch vụ cai nghiện ma túy tại cơ sở cai nghiện ma túy tư nhân",["1. Trước khi kết thúc thời gian cung cấp dịch vụ cai nghiện theo hợp đồng, cơ sở cai nghiện ma túy tư nhân đánh giá kết quả cai nghiện ma túy; phối hợp với người cai nghiện từ đủ 18 tuổi trở lên hoặc với cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi để làm các thủ tục thanh lý hợp đồng theo quy định của pháp luật.","2. Chậm nhất 30 ngày trước khi hết thời hạn hợp đồng, người đứng đầu cơ sở cai nghiện ma túy tư nhân có trách nhiệm thông báo cho Công an cấp xã nơi người cai nghiện cư trú theo Mẫu số 51 Phụ lục V ban hành kèm theo Nghị định này.","3. Trong thời hạn 24 giờ, trước khi người cai nghiện ma túy đã thực hiện đầy đủ thời hạn, quy trình quy định tại khoản 1 và khoản 2 Điều 29 của Luật Phòng, chống ma túy, người đứng đầu cơ sở cai nghiện ma túy tư nhân có trách nhiệm:","a) Cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện theo Mẫu số 30 Phụ lục V ban hành kèm theo Nghị định này và gửi bản sao cho Công an cấp xã nơi người hoàn thành cai nghiện ma túy cư trú.","Giấy xác nhận hoàn thành gửi cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi.","b) Thông báo và trao quyết định quản lý sau cai cho người hoàn thành cai nghiện ma túy và được lập biên bản giao nhận quyết định theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này.","4. Trong thời hạn 24 giờ, trước khi người cai nghiện ma túy đã hoàn thành ít nhất 03 giai đoạn quy định tại các điểm a, b và c khoản 2 Điều 29 của Luật Phòng, chống ma túy, người đứng đầu cơ sở cai nghiện ma túy tư nhân có trách nhiệm cấp giấy xác nhận thời gian, quy trình người cai nghiện ma túy đã thực hiện tại cơ sở đó cho người cai nghiện ma túy theo Mẫu số 30 Phụ lục V ban hành kèm theo Nghị định này và thông báo về việc cai nghiện ma túy cho Công an cấp xã nơi người cai nghiện ma túy cư trú.","Giấy xác nhận thời gian, quy trình người cai nghiện ma túy đã thực hiện được gửi cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cho cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi và được lập biên bản giao nhận giấy xác nhận theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này."]],["D",95,"Thi hành quyết định cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng",["1. Trong thời hạn 24 giờ kể từ khi ban hành quyết định cai nghiện ma túy tự nguyện, Trưởng Công an cấp xã gửi văn bản đề nghị cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người cai nghiện ma túy kèm theo quyết định quy định tại Khoản 1 Điều 91 Nghị định này đến Giám đốc Công an cấp tỉnh.","2. Trong thời hạn 24 giờ, kể từ khi nhận được văn bản đề nghị của Trưởng Công an cấp xã, Giám đốc Công an cấp tỉnh:","a) Quyết định cơ sở cai nghiện ma túy công lập thuộc thẩm quyền quản lý tiếp nhận người cai nghiện ma túy tự nguyện.","Trường hợp cơ sở cai nghiện ma túy công lập thuộc địa bàn quản lý không còn khả năng tiếp nhận người cai nghiện ma túy tự nguyện, Giám đốc Công an cấp tỉnh gửi văn bản đề nghị Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy quyết định cơ sở cai nghiện ma túy công lập của tỉnh, thành phố khác tiếp nhận người cai nghiện ma túy tự nguyện.","b) Gửi văn bản đề nghị Cục trưởng Cục Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng quyết định trường giáo dưỡng tiếp nhận người từ đủ 12 tuổi đến dưới 18 tuổi cai nghiện ma túy tự nguyện.","3. Trong thời hạn 24 giờ, kể từ khi nhận được văn bản đề nghị của Giám đốc công an cấp tỉnh:","a) Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy quyết định cơ sở cai nghiện ma túy công lập của tỉnh khác tiếp nhận người cai nghiện ma túy tự nguyện.","b) Cục trưởng Cục Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng quyết định trường giáo dưỡng tiếp nhận người từ đủ 12 tuổi đến dưới 18 tuổi cai nghiện ma túy tự nguyện.","4. Quyết định của cơ quan có thẩm quyền về việc cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người cai nghiện ma túy tự nguyện phải gửi ngay cho Trưởng Công an cấp xã hoặc Giám đốc Công an cấp tỉnh để tổ chức đưa người cai nghiện ma túy đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng."]],["D",96,"Tiếp nhận người cai nghiện ma túy tự nguyện vào cơ sở cai nghiện ma túy công lập, trường giáo dưỡng",["1. Khi tiếp nhận, cơ sở cai nghiện ma túy công lập, trường giáo dưỡng phải kiểm tra, đối chiếu người với hồ sơ tiếp nhận; lập biên bản giao, nhận giữa cơ quan Công an đưa đi và cơ sở cai nghiện ma túy công lập, trường giáo dưỡng theo Mẫu số 31 Phụ lục V ban hành kèm theo Nghị định này.","2. Hồ sơ tiếp nhận do cơ quan Công an đưa người đi cai nghiện ma túy tự nguyện cung cấp gồm:","a) 01 Quyết định cai nghiện ma túy tự nguyện;","b) 01 bộ hồ sơ đăng ký cai nghiện ma túy tự nguyện theo quy định tại khoản 3 Điều 89 của Nghị định này;","c) 01 Quyết định giao cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người cai nghiện ma túy tự nguyện."]],["D",97,"Hoàn thành cai nghiện ma túy tự nguyện tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng",["1. Chậm nhất 30 ngày trước khi hết thời hạn cai nghiện ma túy tự nguyện, Trưởng cơ sở cai nghiện ma túy công lập, Hiệu trưởng trường giáo dưỡng có trách nhiệm thông báo Công an cấp xã nơi người nghiện ma túy từ đủ 18 tuổi trở lên hoàn thành cai nghiện ma túy cư trú hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi biết ngày người cai nghiện hoàn thành cai nghiện ma túy tự nguyện theo Mẫu số 51 Phụ lục V ban hành kèm theo Nghị định này.","2. Trong thời hạn 24 giờ trước khi người cai nghiện ma túy hoàn thành cai nghiện ma túy tự nguyện Trưởng cơ sở cai nghiện ma túy công lập, Hiệu trưởng trường giáo dưỡng có trách nhiệm:","a) Cấp giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện theo Mẫu số 30 Phụ lục V ban hành kèm theo Nghị định này;","Giấy xác nhận hoàn thành cai nghiện ma túy tự nguyện gửi Chủ tịch Ủy ban nhân dân cấp xã, Trưởng Công an cấp xã nơi người sau cai nghiện cư trú, người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi.","b) Thông báo và trao quyết định quản lý sau cai cho người hoàn thành cai nghiện ma túy và được lập biên bản giao nhận quyết định theo Mẫu số 23 Phụ lục V ban hành kèm theo Nghị định này.","3. Người hoàn thành quyết định cai nghiện ma túy tự nguyện được nhận lại tiền và đồ vật gửi lưu ký, các văn bằng, chứng chỉ học văn hóa, học nghề (nếu có); được cấp tiền tàu xe, tiền ăn đường và một bộ quần áo thường."]],["M","Mục 7","QUẢN LÝ NGƯỜI NGHIỆN MA TÚY TRONG THỜI GIAN LẬP HỒ SƠ ĐƯA ĐI CAI NGHIỆN BẮT BUỘC"],["D",98,"Quyết định và thời gian quản lý",["1. Trưởng Công an cấp xã nơi lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc ra quyết định giao người bị đề nghị cho cơ sở cai nghiện ma túy công lập, trường giáo dưỡng nơi gần nhất để quản lý trong thời gian lập hồ sơ đề nghị theo Mẫu số 32 Phụ lục V ban hành kèm theo Nghị định này.","Quyết định được gửi cho người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người từ đủ 12 tuổi đến dưới 18 tuổi, cơ sở cai nghiện ma túy công lập, trường giáo dưỡng nơi gần nhất.","2. Quyết định phải ghi rõ: ngày, tháng, năm quyết định; họ, tên, chức vụ của người quyết định; tên, địa chỉ của cơ sở được giao quản lý; họ, tên, ngày, tháng, năm sinh, nơi cư trú của người được quản lý; lý do, thời hạn quản lý.","3. Thời gian quản lý được tính từ thời điểm Công an cấp xã ra quyết định giao người bị đề nghị cho cơ sở cai nghiện ma túy công lập, trường giáo dưỡng để quản lý."]],["D",99,"Thi hành quyết định quản lý",["1. Công an cấp xã nơi ra quyết định có trách nhiệm đưa người nghiện ma túy đến cơ sở cai nghiện ma túy công lập hoặc trường giáo dưỡng nơi gần nhất để quản lý.","2. Hồ sơ bàn giao gồm:","a) 01 Quyết định giao người nghiện ma túy để quản lý trong thời gian lập hồ sơ đưa đi cai nghiện bắt buộc cho cơ sở cai nghiện ma túy công lập, trường giáo dưỡng theo quy định tại Điều 98 của Nghị định này;","b) 01 Tóm tắt lý lịch của người bị quản lý có xác nhận của cơ quan lập hồ sơ theo Mẫu số 33 Phụ lục V ban hành kèm theo Nghị định này.","3. Thủ tục bàn giao:","a) Công an cấp xã nơi ra quyết định giao người nghiện ma túy để quản lý trong thời gian lập hồ sơ đưa đi cai nghiện bắt buộc bàn giao người bị quản lý cho cơ sở cai nghiện ma túy công lập hoặc trường giáo dưỡng.","b) Đại diện cơ sở cai nghiện ma túy công lập hoặc trường giáo dưỡng kiểm tra hồ sơ của người bị quản lý, đối chiếu người với các thông tin trong hồ sơ, bảo đảm đúng người và lập biên bản giao nhận theo Mẫu số 31 Phụ lục V ban hành kèm theo Nghị định này."]],["M","Mục 8","THỦ TỤC LẬP HỒ SƠ ÁP DỤNG BIỆN PHÁP XỬ LÝ HÀNH CHÍNH ĐƯA ĐI CAI NGHIỆN BẮT BUỘC"],["D",100,"Lập hồ sơ đề nghị áp dụng biện pháp xử lý hành chính đưa đi cai nghiện bắt buộc",["1. Trong thời hạn 01 ngày làm việc kể từ khi phát hiện người nghiện ma túy thuộc đối tượng quy định tại khoản 1 Điều 35 của Luật Phòng, chống ma túy, Trưởng Công an cấp xã lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc.","2. Việc xác định nơi cư trú của người nghiện ma túy thực hiện theo quy định tại Điều 58 của Nghị định này."]],["D",101,"Thành phần hồ sơ",["1. Đối với người nghiện ma túy từ đủ 18 tuổi trở lên có nơi cư trú ổn định:","a) 01 bản tóm tắt lý lịch của người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc theo Mẫu số 33 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 biên bản vi phạm một trong các hành vi vi phạm pháp luật quy định tại khoản 1 Điều 35 của Luật Phòng, chống ma túy theo Mẫu số 34 Phụ lục V ban hành kèm theo Nghị định này;","c) 01 bản sao Phiếu kết quả xác định tình trạng nghiện ma túy của cơ sở đủ điều kiện xác định tình trạng nghiện ma túy hoặc xác nhận của cơ sở đang điều trị nghiện bằng thuốc thay thế theo Mẫu số 35 Phụ lục V ban hành kèm theo Nghị định này;","d) Văn bản của Trưởng Công an cấp xã đề nghị xem xét áp dụng biện pháp đưa đi cai nghiện bắt buộc theo Mẫu số 36 Phụ lục V ban hành kèm theo Nghị định này và các tài liệu khác có liên quan (nếu có).","2. Đối với người nghiện ma túy từ đủ 18 tuổi trở lên không có nơi cư trú ổn định:","a) Các tài liệu quy định tại Khoản 1 Điều này;","b) Văn bản xác định người nghiện ma túy không có nơi cư trú ổn định của cơ quan Công an có thẩm quyền."]],["D",102,"Thông báo về việc lập hồ sơ, trình tự, thủ tục chuyển hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc",["1. Sau khi hoàn thành hồ sơ đề nghị, Công an cấp xã nơi lập hồ sơ phải thông báo bằng văn bản cho người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc hoặc người đại diện hợp pháp của họ về việc lập hồ sơ, kèm 01 bản sao bộ hồ sơ theo Mẫu số 37 Phụ lục V ban hành kèm theo Nghị định này.","2. Văn bản thông báo về việc lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc gồm các nội dung cơ bản sau đây:","a) Họ và tên người vi phạm;","b) Lý do lập hồ sơ đề nghị;","c) Quyền của người được thông báo;","d) Thời gian đọc hồ sơ.","3. Trong thời hạn 03 ngày làm việc kể từ ngày nhận được thông báo, người nghiện ma túy hoặc người đại diện hợp pháp của họ có quyền đọc hồ sơ và ghi chép các nội dung cần thiết.","4. Trong thời hạn 01 ngày làm việc kể từ ngày hết thời hạn đọc hồ sơ theo quy định tại Khoản 3 Điều này, Trưởng Công an cấp xã quyết định chuyển hồ sơ đề nghị Tòa án nhân dân khu vực áp dụng biện pháp đưa đi cai nghiện bắt buộc.","Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc phải được đánh bút lục và lập thành hai bản, bản gốc chuyển cho Tòa án nhân dân khu vực, bản sao lưu tại Công an cấp xã theo quy định của pháp luật về lưu trữ.","5. Trường hợp Tòa án nhân dân khu vực có văn bản đề nghị làm rõ một số nội dung trong hồ sơ, trong thời hạn 02 ngày làm việc kể từ ngày nhận được văn bản đề nghị, Trưởng Công an cấp xã có trách nhiệm trả lời bằng văn bản và nêu rõ lý do."]],["M","Mục 9","TRÌNH TỰ THỦ TỤC LẬP HỒ SƠ ĐỀ NGHỊ ĐƯA ĐI CAI NGHIỆN BẮT BUỘC ĐỐI VỚI NGƯỜI NGHIỆN MA TÚY TỪ ĐỦ 12 TUỔI ĐẾN DƯỚI 18 TUỔI"],["D",103,"Lập hồ sơ đề nghị đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi",["1. Trong thời hạn 01 ngày làm việc kể từ khi phát hiện người nghiện ma túy thuộc đối tượng quy định tại Khoản 1 Điều 36 Luật Phòng, chống ma túy, Trưởng Công an cấp xã lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi.","2. Việc xác định nơi cư trú của người nghiện ma túy thực hiện theo quy định tại Điều 58 của Nghị định này."]],["D",104,"Thành phần hồ sơ đề nghị đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi",["1. Đối với người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi có nơi cư trú ổn định:","a) 01 bản tóm tắt lý lịch của người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi theo Mẫu số 33 Phụ lục V ban hành kèm theo Nghị định này;","b) 01 biên bản vi phạm một trong các hành vi vi phạm pháp luật quy định tại Khoản 1 Điều 36 của Luật Phòng, chống ma túy theo Mẫu số 34 Phụ lục V ban hành kèm theo Nghị định này;","c) 01 bản sao Phiếu kết quả xác định tình trạng nghiện ma túy của cơ sở đủ điều kiện xác định tình trạng nghiện ma túy hoặc xác nhận của cơ sở đang điều trị nghiện bằng thuốc thay thế theo Mẫu số 35 Phụ lục V ban hành kèm theo Nghị định này;","d) 01 bản tường trình của người nghiện ma túy hoặc của người đại diện hợp pháp của họ theo Mẫu số 38 Phụ lục V ban hành kèm theo Nghị định này;","Trường hợp người nghiện ma túy không biết chữ để viết bản tường trình thì cơ quan lập hồ sơ ghi biên bản lời khai của người nghiện ma túy để thay thế cho bản tường trình theo Mẫu số 58 Phụ lục V ban hành kèm theo Nghị định này.","đ) 01 bản ý kiến bằng văn bản của cha, mẹ, người giám hộ hoặc người đại diện hợp pháp theo Mẫu số 39 Phụ lục V ban hành kèm theo Nghị định này;","e) Trường hợp người nghiện ma túy cố tình không viết tường trình; cha, mẹ, người giám hộ hoặc người đại diện hợp pháp không có ý kiến bằng văn bản thì cơ quan Công an lập biên bản về việc không chấp hành để thay thế bản tường trình, ý kiến; có sự chứng kiến của người đủ 18 tuổi trở lên và có đủ năng lực hành vi dân sự theo Mẫu số 40 Phụ lục V ban hành kèm theo Nghị định này;","g) Văn bản của Trưởng Công an cấp xã đề nghị xem xét áp dụng biện pháp đưa đi cai nghiện bắt buộc theo Mẫu số 36 Phụ lục V ban hành kèm theo Nghị định này và các tài liệu khác có liên quan (nếu có).","Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc phải được đánh bút lục và lập thành hai bản, bản gốc chuyển cho Tòa án nhân dân khu vực, bản sao lưu tại Công an cấp xã theo quy định của pháp luật về lưu trữ.","2. Đối với người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi không có nơi cư trú ổn định:","a) Các tài liệu quy định tại Khoản 1 Điều này;","b) Văn bản xác định người nghiện ma túy không có nơi cư trú ổn định của cơ quan Công an có thẩm quyền."]],["D",105,"Thông báo về việc lập hồ sơ, trình tự, thủ tục chuyển hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc đối với người từ đủ 12 tuổi đến dưới 18 tuổi",["1. Sau khi hoàn thành hồ sơ đề nghị, Công an cấp xã nơi lập hồ sơ phải thông báo bằng văn bản cho người bị đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc và cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của họ về việc lập hồ sơ, kèm 01 bản sao bộ hồ sơ theo Mẫu số 37 Phụ lục V ban hành kèm theo Nghị định này.","2. Văn bản thông báo về việc lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc gồm các nội dung cơ bản sau đây:","a) Họ và tên người vi phạm;","b) Lý do lập hồ sơ đề nghị;","c) Quyền của người được thông báo;","d) Thời gian đọc hồ sơ.","3. Trong thời hạn 03 ngày làm việc kể từ ngày nhận được thông báo, người nghiện ma túy và cha, mẹ, người giám hộ hoặc người đại diện hợp pháp có quyền đọc hồ sơ và ghi chép các nội dung cần thiết.","Trường hợp cha, mẹ, người giám hộ hoặc người đại diện hợp pháp không nhận thông báo thì cơ quan Công an lập biên bản về việc không nhận thông báo; có sự chứng kiến của người đủ 18 tuổi trở lên và có đủ năng lực hành vi dân sự theo Mẫu số 41 Phụ lục V ban hành kèm theo Nghị định này;","4. Trong thời hạn 01 ngày làm việc kể từ ngày hết thời hạn đọc hồ sơ theo quy định tại Khoản 3 Điều này, Trưởng Công an cấp xã quyết định và chuyển hồ sơ đề nghị Tòa án nhân dân khu vực áp dụng biện pháp đưa đi cai nghiện bắt buộc.","Hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc phải được đánh bút lục và lập thành hai bản, bản gốc chuyển cho Tòa án nhân dân khu vực, bản sao lưu tại Công an cấp xã theo quy định của pháp luật về lưu trữ.","5. Trường hợp Tòa án nhân dân khu vực có văn bản đề nghị làm rõ một số nội dung trong hồ sơ, trong thời hạn 02 ngày làm việc kể từ ngày nhận được văn bản đề nghị, Trưởng Công an cấp xã có trách nhiệm trả lời bằng văn bản và nêu rõ lý do."]],["M","Mục 10","THI HÀNH QUYẾT ĐỊNH ĐƯA ĐI CAI NGHIỆN BẮT BUỘC"],["D",106,"Quyết định cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người nghiện ma túy bị áp dụng biện pháp đưa đi cai nghiện bắt buộc",["1. Trong thời hạn 24 giờ kể từ khi nhận được quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc của Tòa án nhân dân khu vực, Trưởng Công an cấp xã nơi lập hồ sơ đề nghị áp dụng biện pháp đưa đi cai nghiện bắt buộc gửi Công văn đề nghị kèm theo quyết định của Tòa án nhân dân khu vực đến Giám đốc Công an cấp tỉnh.","2. Trong thời hạn 24 giờ kể từ khi nhận được văn bản đề nghị của Trưởng Công an cấp xã, Giám đốc Công an cấp tỉnh có trách nhiệm:","a) Quyết định cơ sở cai nghiện ma túy công lập thuộc thẩm quyền quản lý tiếp nhận người cai nghiện ma túy bắt buộc.","Trường hợp cơ sở cai nghiện ma túy công lập thuộc địa bàn quản lý không còn khả năng tiếp nhận cai nghiện ma túy bắt buộc, Giám đốc Công an cấp tỉnh gửi văn bản đề nghị Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy quyết định cơ sở cai nghiện ma túy công lập của tỉnh, thành phố khác tiếp nhận người cai nghiện ma túy bắt buộc.","b) Gửi văn bản đề nghị Cục trưởng Cục Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng quyết định trường giáo dưỡng tiếp nhận người từ đủ 12 tuổi đến dưới 18 tuổi cai nghiện ma túy bắt buộc.","3. Trong thời hạn 24 giờ kể từ khi nhận được văn bản đề nghị của Giám đốc công an cấp tỉnh:","a) Cục trưởng Cục Cảnh sát điều tra tội phạm về ma túy quyết định cơ sở cai nghiện ma túy công lập tiếp nhận người cai nghiện ma túy bắt buộc.","b) Cục trưởng Cục Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng quyết định trường giáo dưỡng tiếp nhận người từ đủ 12 tuổi đến dưới 18 tuổi cai nghiện ma túy bắt buộc.","4. Quyết định cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người nghiện ma túy bị áp dụng biện pháp đưa đi cai nghiện bắt buộc của cơ quan có thẩm quyền phải gửi cho Trưởng Công an cấp xã hoặc Giám đốc Công an cấp tỉnh, Cơ sở cai nghiện, trường giáo dưỡng được chỉ định tiếp nhận để tổ chức đưa người cai nghiện ma túy đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng trong thời hạn 24 giờ kể từ khi ban hành Quyết định."]],["D",107,"Tổ chức đưa người phải chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc",["1. Trong thời hạn 24 giờ, kể từ khi nhận được Quyết định giao cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc, Công an cấp xã nơi lập hồ sơ có trách nhiệm đưa người cai nghiện ma túy đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","Trường hợp người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc đang được quản lý tại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng được giao tiếp nhận thì Trưởng cơ sở cai nghiện ma túy công lập, Hiệu trưởng trường giáo dưỡng thông báo cho người nghiện biết và thực hiện cai nghiện bắt buộc theo quy định.","2. Trường hợp người nghiện ma túy không chấp hành quyết định đưa đi cai nghiện bắt buộc, Trưởng Công an cấp xã nơi lập hồ sơ ra quyết định tạm giữ hành chính và áp giải theo thủ tục hành chính để đưa người phải chấp hành đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng.","3. Trường hợp do sự kiện bất khả kháng không thể thực hiện đúng thời hạn quy định tại Khoản 1 Điều này thì thời hạn được tính lại kể từ thời điểm sự kiện bất khả kháng chấm dứt theo quyết định của cơ quan có thẩm quyền.","4. Trường hợp người nghiện có Quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc nhưng bỏ trốn thì thời gian bỏ trốn không được tính vào thời gian cai nghiện. Khi cơ quan chức năng phát hiện thì người đó phải tiếp tục thực hiện Quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc."]],["D",108,"Thủ tục tiếp nhận người bị đưa đi cai nghiện bắt buộc",["1. Khi tiếp nhận, cơ sở cai nghiện ma túy công lập, trường giáo dưỡng phải kiểm tra, đối chiếu người với hồ sơ tiếp nhận, giấy tờ tùy thân của người bị đưa đi cai nghiện bắt buộc; kiểm tra sơ bộ tình trạng sức khỏe và lập biên bản giao, nhận theo Mẫu số 42 Phụ lục V ban hành kèm theo Nghị định này.","Biên bản giao, nhận ghi rõ tình trạng sức khỏe; số lượng tài liệu, hồ sơ; tư trang, đồ dùng cá nhân của người bị đưa đi cai nghiện bắt buộc.","2. Hồ sơ tiếp nhận người bị đưa đi cai nghiện bắt buộc gồm:","a) Quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc của Tòa án nhân dân khu vực, Quyết định giao cơ sở cai nghiện ma túy công lập, trường giáo dưỡng tiếp nhận người cai nghiện ma túy bắt buộc.","b) Bản sao tóm tắt lý lịch của người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc do cơ quan lập hồ sơ cung cấp."]],["D",109,"Truy tìm người nghiện bỏ trốn",["1. Người phải chấp hành quyết định nhưng chưa đưa đến cơ sở cai nghiện ma túy công lập, trường giáo dưỡng bỏ trốn thì Giám đốc Công an cấp tỉnh ra quyết định truy tìm.","2. Người nghiện đang được quản lý trong thời gian lập hồ sơ, người đang cai nghiện bắt buộc bỏ trốn thì Trưởng cơ sở cai nghiện ma túy công lập Hiệu trưởng Trường giáo dưỡng ra quyết định truy tìm theo Mẫu số 43 Phụ lục V ban hành kèm theo Nghị định này.","3. Thời gian bỏ trốn không được tính vào thời hạn chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc."]],["M","Mục 11","HOÀN, MIỄN, TẠM ĐÌNH CHỈ, TẠM THỜI ĐƯA RA KHỎI CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP, TRƯỜNG GIÁO DƯỠNG ĐỐI VỚI NGƯỜI CAI NGHIỆN MA TÚY"],["D",110,"Hoãn, miễn, tạm đình chỉ chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện ma túy",["1. Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi phải chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc thuộc trường hợp được hoãn, miễn chấp hành quyết định áp dụng biện pháp đưa đi cai nghiện bắt buộc theo quy định tại khoản 1 và khoản 2 Điều 39 Luật Phòng, chống ma túy thì làm đơn đề nghị theo Mẫu số 44, Mẫu số 45 Phụ lục V ban hành kèm theo Nghị định này gửi Tòa án nhân dân khu vực có thẩm quyền để xem xét, quyết định.","2. Người đang chấp hành quyết định tại cơ sở cai nghiện ma túy, trường giáo dưỡng thuộc trường hợp được tạm đình chỉ hoặc miễn chấp hành quyết định tại khoản 3 Điều 39 của Luật Phòng, chống ma túy được Trưởng cơ sở cai nghiện ma túy, Hiệu trưởng trường giáo dưỡng làm văn bản đề nghị theo Mẫu số 46 Phụ lục V ban hành kèm theo Nghị định này gửi Tòa án nhân dân khu vực có thẩm quyền để xem xét, quyết định.","3. Người nghiện ma túy từ đủ 18 tuổi trở lên hoặc cha, mẹ, người giám hộ hoặc người đại diện hợp pháp của người nghiện ma túy từ đủ 12 tuổi đến dưới 18 tuổi phải chấp hành quyết định cai nghiện ma túy tự nguyện thuộc trường hợp được hoãn, miễn chấp hành quyết định cai nghiện ma túy tự nguyện theo quy định tại khoản 1 và khoản 2 Điều 39 Luật Phòng, chống ma túy thì làm đơn đề nghị theo Mẫu số 44, Mẫu số 45 Phụ lục V ban hành kèm theo Nghị định này gửi Giám đốc công an cấp tỉnh nơi ra quyết định xem xét, quyết định.","4. Người đang chấp hành quyết định tại cơ sở cai nghiện ma túy, trường giáo dưỡng thuộc trường hợp được tạm đình chỉ hoặc miễn chấp hành quyết định tại khoản 3 Điều 39 của Luật Phòng, chống ma túy được Trưởng cơ sở cai nghiện ma túy, Hiệu trưởng trường giáo dưỡng làm văn bản đề nghị theo Mẫu số 46 Phụ lục V ban hành kèm theo Nghị định này gửi Giám đốc công an cấp tỉnh nơi ra quyết định xem xét, quyết định.","5. Các trường hợp gửi đơn xin hoãn, miễn, tạm đình chỉ phải gửi kèm theo tài liệu chứng minh."]],["D",111,"Tạm thời đưa người cai nghiện ra khỏi cơ sở cai nghiện ma túy công lập, trường giáo dưỡng theo yêu cầu của cơ quan tiến hành tố tụng hình sự",["1. Theo yêu cầu của cơ quan tiến hành tố tụng hình sự có thẩm quyền, Trưởng Cơ sở cai nghiện ma túy công lập, Hiệu trưởng Trường giáo dưỡng quyết định tạm thời đưa người cai nghiện ra khỏi cơ sở cai nghiện ma túy công lập, trường giáo dưỡng để tham gia tố tụng trong các vụ án có liên quan đến người đó theo Mẫu số 47 Phụ lục V ban hành kèm theo Nghị định này.","Quyết định tạm thời đưa người nghiện ra khỏi cơ sở cai nghiện ma túy công lập, trường giáo dưỡng gửi cho Giám đốc Công an cấp tỉnh, Cục trưởng Cảnh sát quản lý trại giam, cơ sở giáo dục bắt buộc, trường giáo dưỡng.","2. Cơ quan có yêu cầu đưa người cai nghiện ra khỏi cơ sở cai nghiện ma túy công lập, trường giáo dưỡng chịu trách nhiệm đưa người cai nghiện đi và đưa người cai nghiện trở lại cơ sở cai nghiện ma túy công lập, trường giáo dưỡng đúng thời hạn. Khi giao, nhận người cai nghiện phải lập biên bản theo Mẫu số 42 Phụ lục V ban hành kèm theo Nghị định này.","Trong thời gian tạm thời đưa người ra khỏi cơ sở cai nghiện ma túy công lập, trường giáo dưỡng cơ quan yêu cầu chịu trách nhiệm quản lý người nghiện ma túy.","3. Trường hợp cần gia hạn thì Thủ trưởng cơ quan tiến hành tố tụng hình sự có thẩm quyền phải có văn bản đề nghị Phó Thủ trưởng cơ quan cảnh sát điều tra Công an cấp tỉnh về việc gia hạn.","4. Thời gian tạm thời đưa ra khỏi nơi chấp hành biện pháp xử lý hành chính được tính vào thời hạn chấp hành biện pháp đó."]],["M","Mục 12","CHẾ ĐỘ ĐỐI VỚI NGƯỜI NGHIỆN BỊ ÁP DỤNG BIỆN PHÁP ĐƯA ĐI CAI NGHIỆN BẮT BUỘC TẠI CƠ SỞ CAI NGHIỆN MA TÚY CÔNG LẬP"],["D",112,"Chế độ quản lý",["1. Người bị áp dụng biện pháp đưa đi cai nghiện bắt buộc (sau đây gọi chung là người cai nghiện ma túy) phải cai nghiện, học tập, lao động và sinh hoạt dưới sự quản lý, giám sát của cơ sở cai nghiện ma túy công lập.","2. Căn cứ vào quy mô của cơ sở cai nghiện ma túy công lập thời hạn chấp hành quyết định, đặc điểm nhân thân, tình trạng nghiện ma túy, tình trạng sức khỏe, giới tính, độ tuổi, trình độ học vấn của người cai nghiện, Trưởng cơ sở cai nghiện ma túy công lập sắp xếp vào tổ phù hợp với yêu cầu của công tác quản lý, cai nghiện. Mỗi tổ phải có người của cơ sở cai nghiện ma túy công lập trực tiếp phụ trách."]],["D",113,"Chế độ ăn, mặc và đồ dùng sinh hoạt của người cai nghiện ma túy",["1. Định mức tiền ăn hàng tháng của người cai nghiện bằng 0,8 mức lương cơ sở hiện hành. Ngày lễ, Tết dương lịch người cai nghiện được ăn thêm không quá 03 lần tiêu chuẩn ngày thường; các ngày Tết nguyên đán người cai nghiện được ăn thêm không quá 05 lần tiêu chuẩn ngày thường; chế độ ăn đối với người cai nghiện bị ốm do Trưởng Cơ sở cai nghiện ma túy công lập quyết định theo chỉ định của nhân viên y tế điều trị, nhưng không thấp hơn 03 lần tiêu chuẩn ngày thường.","2. Chế độ mặc, trang phục, đồ dùng sinh hoạt của người cai nghiện ma túy trong năm được cấp như sau:","a) 02 bộ quần áo dài;","b) 02 bộ quần áo ngắn tay;","c) 02 bộ quần áo lót;","d) 02 đôi dép nhựa;","đ) 01 áo mưa nilông;","e) 01 mũ vải;","g) 03 khăn mặt;","h) 03 bàn chải đánh răng;","i) 02 chiếu cá nhân;","k) 800 g kem đánh răng;","l) 3,6 kg xà phòng;","m) 800 ml dầu gội đầu.","Người cai nghiện ma túy vào cơ sở cai nghiện ma túy công lập được cấp 01 màn, 01 chăn sợi, 01 gối vải cotton lõi bông. Đối với các cơ sở cai nghiện ma túy công lập từ thành phố Đà Nẵng trở ra phía Bắc, mỗi người cai nghiện ma túy được cấp 01 áo ấm, 02 đôi tất và 01 chăn bông có vỏ nặng không quá 02 kg dùng trong 02 năm.","3. Người cai nghiện ma túy là nữ được cấp đồ dùng cần thiết cho vệ sinh cá nhân không quá 90.000 đồng/người cai nghiện/tháng.","4. Người cai nghiện tham gia lao động, học nghề đối với những công việc mà pháp luật quy định phải có bảo hộ lao động thì phát thêm 02 bộ quần áo, đồ bảo hộ lao động, học nghề cho người cai nghiện ma túy.","5. Bộ trưởng Bộ Công an quy định mẫu trang phục, đồ bảo hộ, học nghề cho người cai nghiện ma túy.","6. Các định mức quy định tại khoản 1, khoản 2, khoản 3 và khoản 4 Điều này là mức tối thiểu do Bộ Công an cấp. Căn cứ vào điều kiện cụ thể của từng địa phương, Ủy ban nhân dân cấp tỉnh trình Hội đồng nhân dân cùng cấp hỗ trợ bổ sung định mức cho phù hợp."]],["D",114,"Chế độ khám, chữa bệnh",["1. Cơ sở cai nghiện công lập phải tổ chức khám sức khỏe định kỳ cho người cai nghiện ma túy 01 lần/năm và thường xuyên có biện pháp đề phòng dịch bệnh; phòng, chống lây nhiễm HIV/AIDS và các bệnh truyền nhiễm khác cho người cai nghiện ma túy.","2. Người cai nghiện ma túy khi bị bệnh được điều trị tại Tổ Y tế của cơ sở cai nghiện ma túy công lập. Trường hợp người cai nghiện ma túy bị bệnh vượt quá khả năng điều trị của bộ phận y tế cơ sở cai nghiện ma túy công lập thì được đưa đi cơ sở khám bệnh, chữa bệnh hoặc được tạm đình chỉ chấp hành quyết định đưa về gia đình điều trị theo mẫu số 46 Phụ lục V ban hành kèm theo Nghị định này. Trưởng cơ sở cai nghiện ma túy công lập phải báo cáo Công an cấp tỉnh và thông báo cho cha, mẹ hoặc người giám hộ của người cai nghiện ma túy.","3. Chi trả chi phí điều trị:","a) Trường hợp người cai nghiện được tạm đình chỉ thi hành quyết định đưa về gia đình điều trị thì gia đình phải chi trả toàn bộ kinh phí khám, chữa bệnh.","b) Trường hợp người cai nghiện có bảo hiểm y tế thì kinh phí khám, chữa bệnh cho người cai nghiện do bảo hiểm y tế chi trả theo quy định.","Trường hợp người cai nghiện ma túy không có bảo hiểm y tế thì kinh phí khám, chữa bệnh cho người cai nghiện do ngân sách nhà nước bảo đảm trong dự toán chi của cơ sở cai nghiện ma túy. Cơ sở cai nghiện công lập trực tiếp thanh toán tiền viện phí cho cơ sở y tế nơi người cai nghiện ma túy điều trị.","c) Người cai nghiện điều trị tại cơ sở cai nghiện ma túy và cơ sở khám bệnh, chữa bệnh nhà nước được ngân sách nhà nước chi trả chi phí khám sức khỏe định kỳ; chi thuốc chữa bệnh thông thường; chi đưa, đón, trông người cai nghiện ma túy.","Trường hợp người cai nghiện bị thương tích do tai nạn lao động, thiên tai, hỏa hoạn thì cơ sở cai nghiện ma túy phải tổ chức điều trị và làm thủ tục để thực hiện chế độ trợ cấp theo quy định.","4. Trong thời gian điều trị tại cơ sở khám bệnh, chữa bệnh nhà nước, cơ sở cai nghiện có trách nhiệm quản lý chặt chẽ, không để người cai nghiện trốn hoặc vi phạm pháp luật. Thời gian điều trị bệnh của người cai nghiện được tính vào thời gian chấp hành quyết định.","5. Người cai nghiện trong thời gian ở cơ sở cai nghiện ma túy được nhận thuốc từ gia đình nhưng phải có đơn thuốc theo chỉ định chuyên môn và được Tổ Y tế giám sát sử dụng."]],["D",115,"Chế độ học văn hóa",["1. Người cai nghiện được tham gia các lớp học văn hóa phù hợp với trình độ của mình. Căn cứ vào khả năng và điều kiện thực tế, cơ sở cai nghiện ma túy công lập tổ chức dạy văn hóa theo quy định của pháp luật. Cơ sở cai nghiện ma túy công lập có trách nhiệm tổ chức các lớp học xóa mù chữ theo quy định của Bộ Giáo dục và Đào tạo.","2. Cơ sở cai nghiện ma túy công lập phối hợp với cơ quan quản lý giáo dục và đào tạo tại địa phương tổ chức thi học kỳ, kết thúc năm học, chuyể
