{ id:'hinh-thuc', g:'Chung', title:'Hình thức và thời hạn cai nghiện', sub:'Tự nguyện, bắt buộc; 24 và 36 tháng; quản lý sau cai', body:`
<h2>Hai hình thức</h2>
<ul><li><b>Tự nguyện:</b> tại gia đình, cộng đồng; tại cơ sở tư nhân; tại cơ sở công lập (theo hợp đồng dịch vụ).</li>
<li><b>Bắt buộc:</b> người từ đủ 18 tuổi tại cơ sở công lập; người từ đủ 12 đến dưới 18 tuổi tại trường giáo dưỡng hoặc cơ sở công lập đủ điều kiện.</li></ul>
${C('Điều 30 Luật PCMT 2025')}
<h2>Thời hạn ${C('khoản 1 Điều 29; khoản 1, 2 Điều 42 Luật')}</h2>
<div class="fact card" style="margin:8px 0">
<div class="v">24 tháng</div><div class="k">Người cai nghiện lần đầu</div>
<div class="v">36 tháng</div><div class="k">Người cai nghiện từ lần thứ hai trở lên</div>
<div class="v">01 năm</div><div class="k">Quản lý sau cai: người hoàn thành cai tự nguyện, điều trị thay thế; người 12–18 tuổi chấp hành xong bắt buộc</div>
<div class="v">02 năm</div><div class="k">Quản lý sau cai: người đã chấp hành xong quyết định đưa đi cai nghiện bắt buộc</div>
</div>
<p>Thời hạn áp dụng chung cho cai nghiện tự nguyện và bắt buộc; người cai nghiện phải thực hiện đủ thời hạn và 5 giai đoạn ${C('khoản 3 Điều 29 Luật')}</p>
<h2>Một số quy định khác của Luật</h2>
<ul><li>Cơ sở công lập cai nghiện cho người từ đủ 18 tuổi; trường giáo dưỡng, cơ sở công lập đủ điều kiện cho người từ đủ 12 đến dưới 18 tuổi ${C('khoản 1 Điều 28 Luật')}</li>
<li>Người bị giao cơ sở quản lý trong thời gian lập hồ sơ được hưởng chế độ như người cai nghiện bắt buộc; thời gian quản lý được trừ vào thời gian cai nghiện ${C('Điều 37 Luật')}</li>
<li>Không áp dụng đưa đi cai nghiện bắt buộc: người không có năng lực trách nhiệm hành chính; người đang mang thai; phụ nữ hoặc người duy nhất nuôi con dưới 36 tháng tuổi ${C('khoản 2 Điều 35 Luật')}</li>
<li>Bị kết án tù khi còn thời hạn cai nghiện: chấp hành xong án phải tiếp tục cai nghiện thời hạn còn lại ${C('khoản 1 Điều 47 Luật')}</li></ul>
<h2>Nghĩa vụ của cơ sở cai nghiện ${C('khoản 2 Điều 46 Luật')}</h2>
<ul><li>Tôn trọng tính mạng, sức khỏe, danh dự, nhân phẩm, tài sản của người cai nghiện.</li><li>Phòng, chống thẩm lậu ma túy vào cơ sở.</li><li>Bố trí khu hoặc phòng riêng cho nữ giới, người mắc bệnh truyền nhiễm nhóm A, nhóm B; người có giới tính thực tế khác hồ sơ được quản lý phòng riêng theo giới tính thực tế.</li><li>Người cai nghiện trốn khỏi cơ sở: thông báo Công an cấp xã nơi lập hồ sơ <b>trong 24 giờ</b>.</li></ul>
<h2>Quyền, nghĩa vụ của người cai nghiện ${C('Điều 45 Luật')}</h2>
<p>Được bảo đảm hoặc hỗ trợ kinh phí cai nghiện; được hưởng kết quả lao động trị liệu; thực hiện đúng quy định về cai nghiện, tuân thủ hướng dẫn chuyên môn; nộp chi phí theo quy định.</p>
<ul><li>Thời gian bỏ trốn <b>không</b> tính vào thời hạn chấp hành ${C('khoản 3 Điều 109 NĐ163')}</li>
<li>Thời gian điều trị bệnh, về chịu tang, tạm đưa ra khỏi cơ sở phục vụ tố tụng <b>được</b> tính vào thời hạn ${C('Điều 111, 114, 121 NĐ163')}</li></ul>`},

{ id:'giai-doan', g:'Quy trình', title:'Quy trình 5 giai đoạn cai nghiện', sub:'Thời gian, nội dung, người thực hiện từng giai đoạn', body:`
<ol class="steps">
<li><b>Tiếp nhận, phân loại — tối đa 02 ngày</b>Kiểm tra hồ sơ, đối chiếu đúng người; thu thập thông tin (tuổi, giới tính, sức khỏe, loại ma túy, mức độ sử dụng, học vấn, nghề nghiệp, gia đình); kiểm tra người và đồ dùng (nam kiểm tra nam, nữ kiểm tra nữ); lưu giữ tài sản; cấp phát đồ dùng; chụp ảnh; lập biên bản giao nhận; phổ biến nội quy; tư vấn cho người cai nghiện và gia đình; xếp phòng, phân khu; phân loại, lập kế hoạch cai nghiện. ${C('Đ84 NĐ163; Đ9 TT79')}</li>
<li><b>Cắt cơn, giải độc, điều trị rối loạn tâm thần — tối thiểu 10 ngày</b>Khám, lập bệnh án (Mẫu 02); tư vấn tâm lý trước khi cắt cơn; xây dựng, thực hiện phác đồ theo hướng dẫn của Bộ Y tế; theo dõi, ghi diễn biến hằng ngày; cấp phát, giám sát dùng thuốc chặt chẽ; vượt khả năng thì chuyển cơ sở y tế. Người phụ trách chuyên môn là bác sĩ có chứng chỉ hành nghề phù hợp. ${C('Đ85 NĐ163; Đ10 TT79')}</li>
<li><b>Giáo dục, tư vấn, phục hồi hành vi, nhân cách — tối thiểu 03 tháng</b>Chào cờ thứ Hai hằng tuần; học đội ngũ, chính trị, pháp luật, kỹ năng sống (thực hành 60%), bổ túc văn hóa, xóa mù chữ; rèn luyện thể chất sau cắt cơn; tư vấn cá nhân, nhóm; văn hóa, văn nghệ, thể thao. Đánh giá học tập: giữa khóa 30%, bài tập tình huống 30%, cuối khóa 40%. ${C('Đ86 NĐ163; Đ11 TT79')}</li>
<li><b>Lao động trị liệu, học nghề — từ sau cắt cơn đến hết thời hạn</b>Phân nhóm lao động theo sức khỏe, tuổi, giới tính; học nghề nếu còn từ 03 tháng trở lên; hướng nghiệp, giới thiệu việc làm; khám sức khỏe định kỳ 01 lần/năm. ${C('Đ87 NĐ163; Đ12 TT79')}</li>
<li><b>Chuẩn bị tái hòa nhập — 30 ngày cuối</b>Đánh giá kết quả kế hoạch cai nghiện; xác định nơi cư trú; tư vấn phòng tái nghiện, kỹ năng từ chối; thông tin chính sách học nghề, vay vốn, việc làm; hướng dẫn lập kế hoạch tái hòa nhập (Mẫu 19 NĐ163); thông báo Công an cấp xã và gia đình chậm nhất 30 ngày trước khi hết hạn. ${C('Đ88 NĐ163; Đ13 TT79')}</li>
</ol>
<div class="note">Người thực hiện giai đoạn 1, 3, 5: trình độ từ trung cấp trở lên, được bồi dưỡng chuyên môn cai nghiện ${C('khoản 5 Đ84, khoản 5 Đ86, khoản 6 Đ88 NĐ163')}</div>`},

{ id:'tu-van', g:'Quy trình', title:'Tư vấn tâm lý cá nhân và nhóm', sub:'Định mức thời gian, nội dung tư vấn', body:`
<div class="fact card" style="margin:8px 0">
<div class="v">≥ 45 phút</div><div class="k">Mỗi lần tư vấn cá nhân, không quá 02 lần/tuần</div>
<div class="v">≥ 60 phút</div><div class="k">Mỗi lần tư vấn nhóm, không quá 02 lần/tuần</div>
<div class="v">Hằng tuần</div><div class="k">Sinh hoạt nhóm kỹ năng sống trong suốt quá trình cai nghiện</div>
</div>
<h2>Tư vấn cá nhân dùng khi</h2>
<ul><li>Có tư tưởng tiêu cực, lo lắng, vi phạm quy chế, kích động, chống đối.</li><li>Trước khi cắt cơn, giải độc.</li><li>Có tin không tốt từ gia đình, sắp hết hạn, sau kỷ luật.</li></ul>
<h2>Tư vấn nhóm</h2>
<p>Chia nhóm để học viên chia sẻ tâm tư, lo âu, cùng tìm cách giúp nhau xóa mặc cảm; sinh hoạt các chủ đề đạo đức, trách nhiệm với gia đình, xã hội, tác hại ma túy.</p>
${C('điểm b khoản 1 Điều 11 TT79')}
<div class="note bad">Học viên có biểu hiện muốn tự sát, tự gây thương tích: xem ngay tình huống <a href="#th--tu-hai">"Học viên có nguy cơ tự hại"</a>.</div>`},

{ id:'to-chuc', g:'Quy trình', title:'Tổ chức bộ máy và nhân sự', sub:'Vị trí việc làm, điều kiện nhân sự, các khu chức năng', body:`
<h2>Khung vị trí việc làm ${C('Đ6 TT79')}</h2>
<ul><li>Trưởng cơ sở, Phó Trưởng cơ sở, Tổ trưởng, Phó Tổ trưởng.</li>
<li>Tham mưu, hành chính, tổng hợp; tổ chức cán bộ; kế hoạch tài chính; văn thư; thủ quỹ; tiếp nhận, quản lý, lưu trữ, số hóa hồ sơ người cai nghiện; tiếp dân; căng tin; sửa chữa, bảo trì; cấp dưỡng; vệ sinh; lái xe.</li>
<li>Quản lý người cai nghiện và giáo dục, dạy nghề.</li>
<li>Y tế: bác sĩ, dược sĩ, y tá, y sĩ, điều dưỡng, phục hồi chức năng, kỹ thuật viên.</li></ul>
<h2>Điều kiện nhân sự ${C('Đ7 TT79')}</h2>
<p>Chỉ huy, cán bộ, chiến sĩ, lao động hợp đồng làm công tác quản lý, giáo dục, dạy nghề và nhân viên y tế phải có chứng chỉ hoặc chứng nhận bồi dưỡng chuyên môn cai nghiện theo khung chương trình của Cục trưởng Cục CSĐT tội phạm về ma túy.</p>
<h2>Các khu bắt buộc ${C('khoản 2 Đ66 NĐ163')}</h2>
<p>Hành chính, quản trị · Thăm gặp, tiếp nhận · Y tế, điều trị cắt cơn · Quản lý người cai nghiện · Dạy văn hóa · Giáo dục nghề nghiệp.</p>
<h2>Tổ Y tế ${C('Đ68 NĐ163')}</h2>
<p>Xác định tình trạng nghiện; cắt cơn, giải độc, điều trị rối loạn tâm thần; khám chữa bệnh, phục hồi sức khỏe; phòng, chống dịch bệnh.</p>`},

{ id:'noi-quy', g:'Nội quy', title:'Nội quy học viên phải chấp hành', sub:'Hiệu lệnh, lễ tiết, trật tự, trang phục, học tập, tài sản', body:`
<h2>1. Hiệu lệnh, thời gian</h2><ul><li>Tuyệt đối tuân theo mệnh lệnh, hướng dẫn của cán bộ.</li><li>Đúng thời gian học tập, lao động, sinh hoạt.</li><li>Có hiệu lệnh tập hợp thì xếp hàng theo tổ nhanh, trật tự.</li><li>Chấp hành điểm danh tại khu quản lý, thăm gặp, y tế, lao động.</li></ul>
<h2>2. Lễ tiết</h2><ul><li>Giao tiếp bằng tiếng Việt (trừ người chưa biết tiếng Việt).</li><li>Gọi "cán bộ" xưng "tôi"; gọi khách là "quý khách"; gọi nhau là "anh", "chị".</li><li>Nói "vâng", "dạ", "thưa", "cảm ơn", "xin lỗi"; trả lời "có" khi được gọi tên.</li><li>Gặp cán bộ, khách: hạ mũ nón cầm tay phải, đứng nghiêm cách 03 mét, chào "chào cán bộ" hoặc "chào quý khách".</li><li>Ra vào cổng theo tổ: đi thành hàng đôi, tổ trưởng báo cáo tên tổ, quân số.</li></ul>
<h2>3. Trật tự nội vụ</h2><ul><li>Ăn, ngủ đúng giờ, đúng nơi; giữ vệ sinh cá nhân, phòng ở; đồ dùng gấp xếp gọn gàng.</li><li>Nam tóc ngắn, không để râu ria; nữ tóc gọn gàng.</li></ul>
<h2>4. Trang phục</h2><p>Mặc trang phục được cấp chỉnh tề khi học tập, lao động, sinh hoạt tập thể, ra vào cổng, thăm gặp; không cho mượn, không tẩy xóa, viết vẽ lên quần áo được cấp.</p>
<h2>5. Học tập, lao động</h2><p>Tích cực, tự giác; chấp hành kỷ luật, an toàn, vệ sinh lao động; dụng cụ dùng xong cất đúng nơi quy định.</p>
<h2>6. Bảo vệ tài sản</h2><p>Giữ gìn tài sản của cơ sở, tập thể, người khác; hết hạn phải bàn giao lại dụng cụ, tài sản, trang phục được giao; gây thiệt hại thì xử lý theo pháp luật.</p>
${C('Điều 14 TT79')}`},

{ id:'cam', g:'Nội quy', title:'21 hành vi bị nghiêm cấm', sub:'Và mức kỷ luật cơ bản tương ứng (Điều 32)', body:`
<p>Áp dụng khi hành vi chưa đến mức xử lý hình sự ${C('Điều 15 TT79')}. Cột phải là hình thức kỷ luật cơ bản theo Điều 32; tăng hoặc giảm tùy tình tiết.</p>
<div class="tw"><table><thead><tr><th>K.</th><th>Hành vi</th><th>Mức cơ bản</th></tr></thead><tbody id="tblCam"></tbody></table></div>`},

{ id:'do-cam', g:'Nội quy', title:'Đồ vật, chất cấm và cách xử lý', sub:'8 nhóm đồ vật cấm; thu giữ, niêm phong, hội đồng xử lý', body:`
<h2>8 nhóm đồ vật, chất cấm ${C('Điều 16 TT79')}</h2>
<div class="tw"><table><thead><tr><th>K.</th><th>Nhóm</th><th>Xử lý sau thu giữ</th></tr></thead><tbody>
<tr><td>1</td><td>Vũ khí, vật liệu nổ, tiền chất thuốc nổ, công cụ hỗ trợ</td><td rowspan="2">Lập biên bản, chuyển ngay kèm hồ sơ cho cơ quan có thẩm quyền</td></tr>
<tr><td>2</td><td>Ma túy, tiền chất, chất hướng thần; chất độc, gây mê, phóng xạ; thuốc chữa bệnh (trừ có chỉ định y tế)</td></tr>
<tr><td>3</td><td>Chất cháy, chất dễ cháy, dễ nổ</td><td rowspan="2">Trưởng cơ sở quyết định xử lý, tổ chức tiêu hủy</td></tr>
<tr><td>4</td><td>Rượu, bia, thuốc lá các loại (cả điện tử, nung nóng), thuốc lào, xì gà, chất kích thích</td></tr>
<tr><td>5</td><td>Thiết bị đun nấu; đồ dùng bằng kim loại, sành, sứ, đá, đất nung, thủy tinh, phích nước</td><td rowspan="2">Lưu ký, trả lại khi hết hạn hoặc giao thân nhân theo đề nghị của học viên</td></tr>
<tr><td>6</td><td>Tiền, vàng, kim cương, đá quý; máy ghi âm, ghi hình, đồng hồ, điện thoại, bộ đàm, thiết bị thu phát</td></tr>
<tr><td>7</td><td>Sách báo nước ngoài chưa kiểm duyệt; ấn phẩm tôn giáo không được phép; tranh ảnh, phim có nội dung mê tín, phản động, đồi trụy</td><td rowspan="2">Kiểm tra, xác minh, lập hồ sơ rồi tiêu hủy</td></tr>
<tr><td>8</td><td>Bài lá, công cụ đánh bạc; đồ vật có thể dùng để trốn, gây nguy hại, mất vệ sinh</td></tr>
</tbody></table></div>
<p>Đồ vật liên quan vụ án hình sự: chuyển cơ quan điều tra ${C('điểm b khoản 2 Đ17')}</p>
<h2>Quy trình thu giữ ${C('khoản 1 Điều 17 TT79')}</h2>
<ol class="steps">
<li><b>Lập biên bản thu giữ</b>Ghi rõ số lượng, khối lượng, chủng loại, hình dạng, kích thước, màu sắc, tình trạng. Yêu cầu người vi phạm viết tường trình; lấy lời khai người vi phạm, người chứng kiến.</li>
<li><b>Niêm phong</b>Đồ nghi là vàng, bạc, đá quý, kim loại quý, ma túy: niêm phong có chữ ký người lập biên bản, người vi phạm hoặc người chứng kiến. Không xác định được người vi phạm: ít nhất 02 người chứng kiến.</li>
<li><b>Báo cáo Trưởng cơ sở</b>Để quản lý, xác minh, xử lý chặt chẽ, an toàn.</li>
<li><b>Lưu giữ hoặc chuyển giao</b>Giao nhận phải lập biên bản và vào sổ theo dõi.</li>
<li><b>Tiêu hủy (nếu có)</b>Hội đồng do Trưởng cơ sở làm Chủ tịch, Phó Trưởng cơ sở làm Phó Chủ tịch; thành viên: cán bộ quản lý, đơn vị liên quan, y tế, hành chính, kế toán.</li>
</ol>
<h2>Hồ sơ thu giữ, xử lý ${C('Điều 18 TT79')}</h2>
<p>Biên bản thu giữ, niêm phong; biên bản lời khai; bản tường trình; báo cáo, đề nghị; biên bản họp Hội đồng xử lý đồ vật (và Hội đồng kỷ luật hoặc kết luận cơ quan điều tra); quyết định thu giữ; quyết định xử lý đồ vật; quyết định xử lý hành vi; biên bản xử lý (bàn giao, tiêu hủy); biên bản bàn giao hồ sơ; tài liệu khác. Lưu trong hồ sơ người cai nghiện.</p>`},

{ id:'gio-giac', g:'Nội quy', title:'Thời gian biểu hằng ngày', sub:'Mùa đông, mùa hè (Phụ lục II)', body:`<div id="schedBox"></div>${C('Phụ lục II TT79')}`},

{ id:'xep-loai', g:'Đánh giá', title:'Đánh giá, xếp loại học viên', sub:'10 tiêu chí 100 điểm; xếp loại tuần, tháng, quý', body:`
<h2>Tiêu chí, thang điểm ${C('Đ21, Phụ lục III TT79')}</h2>
<div class="tw"><table><thead><tr><th>#</th><th>Tiêu chí</th><th>Điểm</th></tr></thead><tbody id="tblTC"></tbody></table></div>
<h2>Xếp loại tuần ${C('khoản 1 Đ22')}</h2>
<div class="fact card" style="margin:8px 0"><div class="v"><span class="pill t-tot">Tốt</span></div><div class="k">Từ 80 điểm trở lên</div><div class="v"><span class="pill t-kha">Khá</span></div><div class="k">Từ 65 đến dưới 80</div><div class="v"><span class="pill t-tb">Trung bình</span></div><div class="k">Từ 50 đến dưới 65</div><div class="v"><span class="pill t-kem">Kém</span></div><div class="k">Dưới 50</div></div>
<h2>Xếp loại tháng ${C('khoản 2 Đ22')}</h2>
<ul><li><b>Tốt:</b> 03 tuần Tốt, các tuần còn lại không Trung bình hoặc Kém.</li><li><b>Khá:</b> 02 tuần Khá trở lên, các tuần còn lại không Kém.</li><li><b>Trung bình:</b> 03 tuần Trung bình.</li><li><b>Kém:</b> không thuộc các loại trên.</li></ul>
<h2>Xếp loại quý ${C('khoản 3 Đ22')}</h2>
<ul><li><b>Tốt:</b> 02 tháng Tốt, tháng còn lại không Trung bình hoặc Kém.</li><li><b>Khá:</b> 02 tháng Khá trở lên, tháng còn lại không Kém.</li><li><b>Trung bình:</b> 02 tháng Trung bình.</li><li><b>Kém:</b> không thuộc các loại trên.</li></ul>
<h2>Trình tự ${C('Đ23 TT79')}</h2>
<ol class="steps">
<li><b>Thứ Sáu hằng tuần</b>Cán bộ phụ trách tổ họp tổ nhận xét, xếp loại tuần; ghi Phiếu Mẫu 03; công bố công khai; lập biên bản họp.</li>
<li><b>Ngày 25 hằng tháng (và ngày 25 tháng cuối quý)</b>Họp tổ xếp loại tháng, quý; lập danh sách chuyển Tổ Tham mưu.</li>
<li><b>Trong 03 ngày làm việc</b>Tổ Tham mưu báo cáo Trưởng cơ sở xếp loại.</li>
<li><b>Khiếu nại: trong 05 ngày làm việc</b>Trưởng cơ sở phải trả lời học viên.</li>
</ol>
<p>Xếp loại tính từ ngày tiếp nhận đến khi hoàn thành chương trình ${C('khoản 2 Đ20')}. Kết quả học tập là căn cứ để đánh giá, phân loại ${C('Đ11')}.</p>`},

{ id:'khen', g:'Đánh giá', title:'Khen thưởng', sub:'Định kỳ, đột xuất; tiêu chuẩn; chế độ được hưởng', body:`
<h2>Khen thưởng định kỳ ${C('khoản 2 Đ25 TT79')}</h2>
<ul><li>Xếp loại Tốt trong tháng (quý).</li><li>Không vi phạm nội quy trong kỳ; tự giác thực hiện quy trình.</li><li><b>Không quá 15%</b> tổng số người của tổ.</li></ul>
<p><b>Được hưởng:</b> biểu dương trước tổ, phân khu; tăng 01 lần thăm gặp trong tháng, 02 lần trong quý hoặc tăng thời gian thăm gặp lên 1,5 lần; tăng 01 lần liên lạc hoặc thời gian liên lạc lên 1,5 lần ${C('khoản 2 Đ26')}</p>
<h2>Khen thưởng đột xuất ${C('khoản 1 Đ25')}</h2>
<div class="tw"><table><thead><tr><th>Tiêu chuẩn</th><th>Điều chỉnh xếp loại</th></tr></thead><tbody>
<tr><td>a) Lập công cứu người, tài sản trị giá từ 10 triệu đồng trong thiên tai, hỏa hoạn, tai nạn, dịch bệnh</td><td>Nâng 01 bậc xếp loại của 02 tháng trong quý</td></tr>
<tr><td>b) Cung cấp tin giúp phát hiện âm mưu chống phá, bắt người bỏ trốn, ngăn chặn phạm tội, phá hoại (được xác nhận)</td><td>Nâng 01 bậc xếp loại quý</td></tr>
<tr><td>c) Cứu người đang nguy hiểm hoặc tài sản trị giá từ 30 triệu đồng</td><td>Nâng 02 bậc xếp loại quý (Khá lên Tốt)</td></tr>
</tbody></table></div>
<p>Kèm biểu dương trước toàn cơ sở và các chế độ thăm gặp, liên lạc như khen định kỳ ${C('khoản 1 Đ26')}</p>
<h2>Trình tự ${C('Đ27 TT79')}</h2>
<ol class="steps"><li><b>Họp tổ</b>Có biên bản, tối thiểu 2/3 người dự họp đồng ý. Khen đột xuất: người được đề nghị viết báo cáo thành tích.</li><li><b>Đề nghị Tổ Tham mưu</b>Định kỳ: gửi cùng Phiếu xếp loại tháng. Đột xuất: chậm nhất 03 ngày sau khi đủ tiêu chuẩn; Tổ Tham mưu đề xuất trong 04 ngày.</li><li><b>Trưởng cơ sở quyết định trong 03 ngày làm việc</b>Theo Mẫu 04. Không khen thưởng thì thông báo rõ lý do.</li></ol>`},

{ id:'ky-luat', g:'Đánh giá', title:'Kỷ luật', sub:'Hình thức, áp dụng, thời hiệu, trình tự', body:`
<h2>3 hình thức ${C('Đ31 TT79')}</h2>
<div class="tw"><table><thead><tr><th>Hình thức</th><th>Áp dụng khi</th><th>Không được thăm gặp</th></tr></thead><tbody>
<tr><td><b>Phê bình</b></td><td>Vi phạm khoản 11–21 Điều 15; hoặc mức cảnh cáo nhưng có tình tiết giảm nhẹ</td><td>01 tuần</td></tr>
<tr><td><b>Cảnh cáo</b></td><td>Vi phạm khoản 2, 3, 5–10; đã phê bình mà còn vi phạm; mức phê bình nhưng có tình tiết tăng nặng</td><td>02 tuần</td></tr>
<tr><td><b>Khu quản lý riêng</b> (tối đa 07 ngày, không thăm gặp, liên lạc)</td><td>Vi phạm khoản 1, 4; đã cảnh cáo mà còn vi phạm; mức cảnh cáo nhưng có tình tiết tăng nặng</td><td>04 tuần</td></tr>
</tbody></table></div>
${C('Đ32; khoản 3 Đ31 TT79')}
<h2>Thời hiệu, thời hạn ${C('khoản 2 Đ29')}</h2>
<div class="fact card" style="margin:8px 0"><div class="v">30 ngày</div><div class="k">Thời hiệu: tính từ khi có hành vi; quá hạn thì không xử lý kỷ luật</div><div class="v">15 ngày</div><div class="k">Thời hạn: từ khi phát hiện đến khi có quyết định</div><div class="v">30 ngày</div><div class="k">Thời hạn tối đa nếu vụ việc phức tạp cần xác minh</div><div class="v">30 ngày</div><div class="k">Thời gian chấp hành quyết định kỷ luật tối đa</div></div>
<h2>Nguyên tắc ${C('khoản 1 Đ29')}</h2><ul><li>Khách quan, công bằng, công khai, đúng người, đúng hành vi.</li><li>Nhiều hành vi cùng lúc: kết luận từng hành vi, áp dụng hình thức cao nhất.</li><li>Xem xét tính chất, mức độ, nguyên nhân, hậu quả, tình tiết, thái độ sửa chữa.</li></ul>
<h2>Tình tiết giảm nhẹ ${C('khoản 1 Đ30')}</h2><ul><li>Vi phạm lần đầu, do nguyên nhân khách quan.</li><li>Chủ động khai báo, tự giác nhận trách nhiệm, khắc phục hậu quả, giúp phát hiện vi phạm.</li><li>Bị ép buộc hoặc lệ thuộc vật chất, tinh thần.</li></ul>
<h2>Tình tiết tăng nặng ${C('khoản 2 Đ30')}</h2><ul><li>Có tổ chức, là người tổ chức, chủ mưu, khởi xướng.</li><li>Vi phạm nhiều lần; đã được giáo dục mà không sửa.</li><li>Vi phạm đối với nhiều người.</li><li>Xúi giục, lôi kéo người chưa thành niên; ép buộc người khác.</li><li>Che giấu, báo cáo sai, chống đối, không viết bản kiểm điểm, không dự họp kiểm điểm không có lý do.</li></ul>
<h2>Chưa xem xét, miễn kỷ luật ${C('khoản 3 Đ29')}</h2><ul><li><b>Chưa xem xét:</b> đang điều trị bệnh hiểm nghèo, mất khả năng nhận thức, ốm nặng điều trị nội trú; đang bị khởi tố, tạm giữ, tạm giam.</li><li><b>Miễn:</b> mất năng lực hành vi dân sự khi vi phạm; phòng vệ chính đáng, tình thế cấp thiết, bất khả kháng; đã chết.</li></ul>
<h2>Trình tự ${C('Đ33 TT79')}</h2>
<ol class="steps"><li><b>Lập biên bản vi phạm</b>Cán bộ phụ trách tổ, theo Mẫu 05.</li><li><b>Trong 02 ngày</b>Người vi phạm viết bản kiểm điểm; họp tổ (≥ 2/3 đồng ý), đề xuất hình thức gửi Tổ Tham mưu.</li><li><b>Trong 03 ngày làm việc</b>Tổ Tham mưu đề xuất Trưởng cơ sở.</li><li><b>Trong 02 ngày làm việc</b>Trưởng cơ sở quyết định (Mẫu 06) hoặc thông báo lý do không xử lý. Quyết định lưu hồ sơ.</li></ol>
<h2>Hạn chế khác khi đang chấp hành kỷ luật</h2><ul><li>Hạn chế nhận tiền tối đa 01 tháng; mua hàng căng tin tối đa 10 ngày ${C('khoản 8 Đ41')}</li><li>Hạn chế nhận, gửi thư tối đa 01 tháng ${C('khoản 2 Đ42')}</li><li>Hạn chế liên lạc điện thoại tối đa 01 tháng ${C('khoản 4 Đ43')}</li><li>Gây thiệt hại tài sản, sức khỏe phải bồi thường ${C('khoản 4 Đ31')}</li></ul>`},

{ id:'tham-gap', g:'Chế độ', title:'Thăm gặp thân nhân', sub:'Số lần, thời gian, người được gặp, giấy tờ', body:`
<div class="fact card" style="margin:8px 0">
<div class="v">1 lần/tuần</div><div class="k">Tại phòng thăm gặp của cơ sở</div>
<div class="v">45 phút</div><div class="k">Mỗi lần; Trưởng cơ sở cho thêm tối đa 15 phút</div>
<div class="v">03 người</div><div class="k">Tối đa mỗi lần; trường hợp đặc biệt tối đa 05 người</div>
<div class="v">15 ngày</div><div class="k">Vào cơ sở chưa đủ 15 ngày thì chưa được thăm gặp</div>
</div>
${C('Đ34, Đ35 TT79')}
<h2>Không được thăm gặp khi</h2><ul><li>Vào cơ sở chưa đủ 15 ngày.</li><li>Đang bị xem xét kỷ luật hoặc đang thi hành kỷ luật (1, 2 hoặc 4 tuần).</li><li>Cơ quan đang thụ lý vụ án có văn bản đề nghị không cho gặp.</li></ul>
<h2>Thân nhân được gặp ${C('khoản 1 Đ35')}</h2>
<p>Cụ nội, cụ ngoại; ông bà nội, ngoại; bố mẹ đẻ, bố mẹ vợ (chồng), bố mẹ nuôi hợp pháp; vợ hoặc chồng; con đẻ, con dâu, con rể, con nuôi hợp pháp; anh chị em ruột, dâu, rể; anh chị em vợ (chồng); cô, dì, chú, bác, cậu, cháu ruột.</p>
<h2>Giấy tờ ${C('Đ36 TT79')}</h2>
<ul><li>Có tên trong Sổ theo dõi thăm gặp (Mẫu 07).</li><li>Lần đầu hoặc chưa có tên: xác thực VNeID; hoặc Căn cước, CCCD, Hộ chiếu; hoặc giấy tờ chứng minh nhân thân và quan hệ.</li><li>Đại diện cơ quan, tổ chức, cá nhân khác: văn bản đề nghị (cá nhân phải có xác nhận nơi làm việc hoặc chính quyền nơi cư trú) và giấy tờ tùy thân.</li><li>Không có giấy tờ: làm đơn, Trưởng cơ sở xem xét.</li></ul>
<h2>Người đến thăm phải ${C('Đ38')}</h2>
<ul><li>Trang phục lịch sự (không quần đùi, váy ngắn, trang phục phản cảm); xuất trình giấy tờ.</li><li>Không ghi âm, ghi hình nơi có biển cấm; không đưa thiết bị liên lạc, đồ vật cấm cho học viên.</li><li>Hết giờ phải ra về; vi phạm thì Trưởng cơ sở có thể tạm dừng giải quyết thăm gặp.</li></ul>
<h2>Cán bộ tổ chức thăm gặp ${C('Đ39')}</h2>
<p>Kiểm tra giấy tờ; lập danh sách, ghi Sổ Mẫu 07; báo cáo lãnh đạo duyệt; kiểm soát đồ vật thân nhân mang theo; giám sát chặt trường hợp được kéo dài thời gian.</p>
<p>Học viên khi gặp phải mặc trang phục được cấp, giao tiếp bằng tiếng Việt; người dân tộc thiểu số, người nước ngoài không biết tiếng Việt phải có người phiên dịch hoặc giám sát ${C('Đ37')}</p>`},

{ id:'tien', g:'Chế độ', title:'Tiền, đồ lưu ký và căng tin', sub:'Đồ lưu ký, nhận tiền, sử dụng, căng tin, kết quả lao động', body:`
<div class="fact card" style="margin:8px 0">
<div class="v">02 lần</div><div class="k">Số lần gửi tiền tối đa mỗi tháng</div>
<div class="v">3 triệu đ</div><div class="k">Số tiền nhận tối đa mỗi tháng</div>
</div>
${C('khoản 1 Đ41 TT79')}
<h2>Cách nhận tiền</h2>
<ul><li><b>Khi thăm gặp:</b> cán bộ thăm gặp kiểm tra, nhận, cho người gửi ký Sổ Mẫu 07; cuối ngày bàn giao bộ phận tài chính, báo người phụ trách lưu ký và căng tin.</li><li><b>Qua tài khoản ngân hàng của cơ sở</b> hoặc <b>bưu điện:</b> bộ phận tài chính Tổ Tham mưu quản lý, báo người phụ trách lưu ký, thông báo ngay cho học viên.</li><li>Học viên từ chối nhận tiền qua tài khoản: lập biên bản, hoàn tiền cho người gửi (người gửi chịu phí).</li></ul>
<h2>Sử dụng tiền lưu ký</h2>
<ul><li>Mua hàng thiết yếu tại căng tin, trả cước liên lạc, gửi về gia đình, nhận lại khi hết hạn.</li><li>Mua qua sổ, mỗi lần mua học viên ký xác nhận; giao dịch qua hệ thống bán hàng căng tin, minh bạch.</li><li>Giá hàng do Trưởng cơ sở duyệt, không cao hơn giá bán lẻ tại địa phương.</li><li>Tiền thưởng, kết quả lao động trị liệu được chuyển vào lưu ký.</li></ul>
${C('khoản 2–7 Đ41 TT79')}
<h2>Tiền mặt và đồ lưu ký ${C('Điều 40 TT79')}</h2>
<ul><li>Khi tiếp nhận hoặc trong thời gian cai nghiện, học viên có vàng, bạc, ngoại tệ, tiền Việt Nam, cổ phiếu, trái phiếu, thẻ ngân hàng, đồng hồ, trang sức, máy móc, thiết bị, căn cước, hộ chiếu, văn bằng, chứng chỉ, giấy tờ có giá, quần áo tư trang chưa dùng: <b>lập biên bản, niêm phong, gửi lưu ký</b>; trả lại khi chấp hành xong.</li>
<li>Riêng tiền Việt Nam (tiền mặt) gửi lưu ký để học viên sử dụng trong thời gian cai nghiện.</li>
<li>Phát hiện đồ lưu ký là đồ vật, chất cấm: xử lý theo Điều 17.</li>
<li>Học viên muốn chuyển đồ, tài sản, giấy tờ cho thân nhân, người đại diện: lập biên bản bàn giao trực tiếp hoặc gửi bưu chính (cước do học viên hoặc thân nhân trả).</li>
<li>Chuyển học viên sang cơ sở khác: chuyển giao lưu ký cho nơi tiếp nhận, biên bản có chữ ký bên giao, bên nhận và học viên.</li>
<li>Học viên chết: lập biên bản bàn giao tiền, đồ lưu ký, tài sản cá nhân cho thân nhân, người đại diện theo pháp luật.</li>
<li>Biên bản nhận, trả phải mô tả đúng mệnh giá, số lượng, khối lượng, chủng loại, hình dạng, kích thước, màu sắc.</li>
<li>Quản lý lưu ký trên phần mềm, kết nối tài khoản ngân hàng của cơ sở để thân nhân chuyển tiền vào lưu ký.</li></ul>
<h2>Phân chia kết quả lao động trị liệu ${C('Đ118 NĐ163')}</h2>
<p>Phần chênh lệch thu lớn hơn chi sau khi trừ chi phí hợp lý:</p>
<div class="fact card" style="margin:8px 0"><div class="v">30%</div><div class="k">Bổ sung định mức ăn, uống</div><div class="v">20%</div><div class="k">Hỗ trợ phục vụ sinh hoạt</div><div class="v">20%</div><div class="k">Gửi lưu ký cho học viên, nhận lại khi chấp hành xong</div><div class="v">30%</div><div class="k">Văn hóa, văn nghệ, thể thao, khen thưởng</div></div>`},

{ id:'thu-lien-lac', g:'Chế độ', title:'Thư và liên lạc điện thoại', sub:'Kiểm duyệt thư; số lần, thời lượng cuộc gọi', body:`
<h2>Thư ${C('Đ42 TT79')}</h2>
<ul><li>Được nhận, gửi thư qua bưu chính và khi gặp thân nhân.</li><li>Trưởng cơ sở chỉ đạo kiểm tra, kiểm duyệt; nội dung không phù hợp công tác quản lý, giáo dục thì lập biên bản thu giữ.</li><li>Đang chấp hành kỷ luật: có thể hạn chế tối đa 01 tháng, phải thông báo học viên và thân nhân.</li></ul>
<h2>Điện thoại, gọi hình ${C('Đ43 TT79')}</h2>
<div class="fact card" style="margin:8px 0"><div class="v">04 lần/tháng</div><div class="k">Với thân nhân trong nước, có cán bộ giám sát, tự chịu cước</div><div class="v">15 phút</div><div class="k">Mỗi lần</div><div class="v">+02 lần, +30 phút</div><div class="k">Trưởng cơ sở cho thêm khi giải quyết quyền lợi chính đáng hoặc vì công tác giáo dục</div></div>
<ul><li>Trước khi gọi phải đăng ký nội dung; gọi đúng số, đúng nội dung đã đăng ký trong Sổ Mẫu 08; dùng tiếng Việt.</li><li>Cán bộ giám sát phát hiện nội dung khác đăng ký thì dừng cuộc gọi; cần thiết lập biên bản, đề xuất kỷ luật.</li><li>Đang bị điều tra, truy tố, xét xử tội phạm khác: không được liên lạc.</li><li>Trường hợp cấp bách: cán bộ phụ trách tổ đề xuất Trưởng cơ sở cho gọi thêm.</li></ul>`},

{ id:'lao-dong', g:'Chế độ', title:'Lao động trị liệu, học nghề', sub:'Giờ lao động, kế hoạch năm, học nghề', body:`
<div class="fact card" style="margin:8px 0"><div class="v">8 giờ/ngày</div><div class="k">Tối đa thời gian lao động trị liệu</div><div class="v">48 giờ/tuần</div><div class="k">Tối đa mỗi tuần</div><div class="v">≥ 03 tháng</div><div class="k">Thời gian cai nghiện còn lại để được học nghề</div></div>
${C('Đ117 NĐ163; Đ12 TT79')}
<ul><li>Lao động trị liệu là nghĩa vụ; bố trí phù hợp tuổi, sức khỏe, giới tính, trình độ, nguyện vọng; có giám sát ${C('Đ44 TT79')}</li><li>Hình thức: trồng trọt, chăn nuôi, chăm sóc vườn cây, vệ sinh khuôn viên; liên kết gia công phù hợp.</li><li>Học nghề trình độ sơ cấp: chăn nuôi, trồng trọt, gốm, mộc, xây dựng, cơ khí, nấu ăn, khách sạn, điện, sửa ô tô, xe máy… ${C('Đ116 NĐ163')}</li><li>Kế hoạch lao động, học nghề năm sau gửi Phòng CSĐT tội phạm về ma túy trước ngày 15/10; Giám đốc Công an tỉnh duyệt trong 30 ngày ${C('Đ45 TT79')}</li><li>Phát thêm 02 bộ quần áo, đồ bảo hộ khi làm việc pháp luật yêu cầu bảo hộ ${C('khoản 4 Đ113 NĐ163')}</li></ul>`},

{ id:'an-mac-y-te', g:'Chế độ', title:'Chế độ ăn, mặc, khám chữa bệnh', sub:'Định mức ăn, đồ dùng cấp phát, y tế', body:`
<h2>Ăn ${C('khoản 1 Đ113 NĐ163')}</h2>
<ul><li>Tiền ăn hằng tháng bằng <b>0,8 mức lương cơ sở</b>.</li><li>Lễ, Tết dương lịch: ăn thêm không quá 03 lần tiêu chuẩn ngày thường; Tết Nguyên đán: không quá 05 lần.</li><li>Người ốm: theo chỉ định y tế, không thấp hơn 03 lần tiêu chuẩn ngày thường.</li></ul>
<h2>Đồ dùng cấp mỗi năm ${C('khoản 2 Đ113')}</h2>
<p>02 bộ quần áo dài · 02 bộ ngắn tay · 02 bộ quần áo lót · 02 đôi dép nhựa · 01 áo mưa · 01 mũ vải · 03 khăn mặt · 03 bàn chải · 02 chiếu · 800 g kem đánh răng · 3,6 kg xà phòng · 800 ml dầu gội.</p>
<p>Khi vào: 01 màn, 01 chăn sợi, 01 gối. Cơ sở từ Đà Nẵng trở ra Bắc: thêm 01 áo ấm, 02 đôi tất, 01 chăn bông (dùng 02 năm). Nữ: đồ vệ sinh không quá 90.000 đồng/tháng.</p>
<h2>Khám, chữa bệnh ${C('Đ114 NĐ163')}</h2>
<ul><li>Khám sức khỏe định kỳ 01 lần/năm; phòng dịch, phòng lây nhiễm HIV/AIDS.</li><li>Ốm thì điều trị tại Tổ Y tế; vượt khả năng thì chuyển cơ sở khám chữa bệnh hoặc đề nghị tạm đình chỉ về gia đình điều trị; báo cáo Công an tỉnh, thông báo gia đình.</li><li>Trong thời gian điều trị ngoài cơ sở: cơ sở cai nghiện vẫn quản lý chặt, không để trốn.</li><li>Gia đình gửi thuốc phải có đơn thuốc, Tổ Y tế giám sát sử dụng.</li></ul>`},

{ id:'dac-biet', g:'Chế độ', title:'Chịu tang, tạm đưa ra, hoãn, miễn', sub:'Các trường hợp đặc biệt trong thời gian chấp hành', body:`
<h2>Về chịu tang ${C('Đ121 NĐ163')}</h2>
<ul><li>Khi bố, mẹ (cả bên vợ hoặc chồng), vợ hoặc chồng, con chết.</li><li>Tối đa 05 ngày, không kể thời gian đi đường; được tính vào thời hạn.</li><li>Gia đình làm đơn (Mẫu 48) kèm giấy chứng tử hoặc xác nhận của Trưởng Công an xã nơi tổ chức tang lễ; cam kết quản lý.</li><li>Trưởng cơ sở quyết định trong 24 giờ (Mẫu 49); gia đình đưa, đón, chịu chi phí; giao nhận lập biên bản Mẫu 23.</li><li>Khi trở lại: kiểm tra sức khỏe, tình trạng sử dụng ma túy. Quá hạn không về: ra quyết định truy tìm.</li></ul>
<h2>Tạm đưa ra phục vụ tố tụng ${C('Đ111 NĐ163')}</h2>
<p>Theo yêu cầu của cơ quan tiến hành tố tụng, Trưởng cơ sở quyết định (Mẫu 47). Cơ quan yêu cầu chịu trách nhiệm đưa đi, đưa về, quản lý trong thời gian đó; giao nhận lập biên bản Mẫu 42. Thời gian này được tính vào thời hạn.</p>
<h2>Tạm đình chỉ, miễn phần còn lại ${C('Đ110 NĐ163')}</h2>
<p><b>Khoản 3 Điều 39 Luật:</b> người đang chấp hành bị ốm nặng được đưa về gia đình điều trị thì được tạm đình chỉ; thời gian điều trị tính vào thời hạn. Sức khỏe phục hồi mà thời hạn còn lại từ 03 tháng trở lên thì phải tiếp tục chấp hành. Người mắc bệnh hiểm nghèo, phụ nữ mang thai được miễn phần thời gian còn lại.</p><p>Thủ tục:  Trưởng cơ sở lập văn bản đề nghị (Mẫu 46) gửi Tòa án nhân dân khu vực (bắt buộc) hoặc Giám đốc Công an tỉnh (tự nguyện), kèm tài liệu chứng minh.</p>`},

{ id:'het-han', g:'Sau cai', title:'Hết hạn, tái hòa nhập, quản lý sau cai', sub:'Các mốc 30 ngày, 15 ngày, 24 giờ', body:`
<ol class="steps">
<li><b>Chậm nhất 30 ngày trước khi hết hạn</b>Thông báo Tòa án khu vực nơi ra quyết định, Công an cấp xã nơi cư trú, gia đình (Mẫu 51). ${C('Đ123 NĐ163; Đ13 TT79')}</li>
<li><b>Chậm nhất 15 ngày trước khi hết hạn</b>Lập hồ sơ đưa vào cơ sở bảo trợ xã hội nếu: người 12–18 tuổi không có nơi cư trú ổn định; người từ 18 tuổi không xác định được nơi cư trú và không còn khả năng lao động. ${C('Đ124 NĐ163')}</li>
<li><b>Trong 24 giờ trước khi hoàn thành</b>Cấp giấy xác nhận hoàn thành (Mẫu 50), gửi bản sao cho các nơi liên quan; trao quyết định quản lý sau cai, lập biên bản Mẫu 23. ${C('khoản 2 Đ123')}</li>
<li><b>Ngày ra cơ sở</b>Trả lại tiền, đồ vật lưu ký, văn bằng, chứng chỉ; cấp tiền tàu xe, tiền ăn đi đường, 01 bộ quần áo thường. Người 12–18 tuổi không có gia đình đón: cơ sở đưa về bàn giao gia đình hoặc UBND xã. ${C('khoản 3 Đ123; Đ13 TT79')}</li>
<li><b>Sau khi về địa phương</b>Trình diện Công an cấp xã; Chủ tịch UBND xã ra quyết định quản lý sau cai trong 02 ngày làm việc kể từ khi nhận thông báo. ${C('Đ134 NĐ163')}</li>
</ol>
<h2>Nội dung quản lý sau cai ${C('Đ136 NĐ163')}</h2>
<ul><li>Vắng mặt phải báo Công an xã; không báo thì thời gian vắng không được trừ vào thời hạn.</li><li>Đổi nơi cư trú: Công an xã nơi đi thông báo nơi đến trong 24 giờ.</li><li>Được tư vấn tâm lý, hướng dẫn thủ tục cư trú, căn cước, lý lịch tư pháp; hỗ trợ vay vốn, học nghề, việc làm; xét nghiệm ma túy.</li></ul>
<h2>Chính sách hỗ trợ ${C('Đ137 NĐ163')}</h2>
<p>Người 12–18 tuổi đi học được miễn, giảm học phí; học nghề được hỗ trợ đào tạo sơ cấp; được vay vốn tạo việc làm, ưu tiên chính sách việc làm công.</p>`},

{ id:'bo-tron', g:'Sau cai', title:'Truy tìm người bỏ trốn', sub:'Thẩm quyền, thời hạn', body:`
<ul><li>Người đang cai nghiện bắt buộc hoặc đang được quản lý trong thời gian lập hồ sơ bỏ trốn: <b>Trưởng cơ sở</b> ra quyết định truy tìm (Mẫu 43) ${C('khoản 2 Đ109 NĐ163')}</li><li>Chưa đưa đến cơ sở mà bỏ trốn: Giám đốc Công an tỉnh ra quyết định truy tìm ${C('khoản 1 Đ109')}</li><li>Thời gian bỏ trốn không tính vào thời hạn chấp hành ${C('khoản 3 Đ109')}</li><li>Trong <b>24 giờ</b> kể từ khi học viên trốn: thông báo Công an cấp xã nơi lập hồ sơ đề nghị đưa đi cai nghiện ${C('điểm i khoản 2 Điều 46 Luật')}</li></ul>
<p>Xem các bước cụ thể ở tình huống <a href="#th--bo-tron">"Học viên bỏ trốn"</a>.</p>`},

{ id:'vi-thanh-nien', g:'Sau cai', title:'Người từ đủ 12 đến dưới 18 tuổi', sub:'Nơi cai nghiện, chế độ áp dụng', body:`
<ul><li>Cai nghiện bắt buộc tại trường giáo dưỡng hoặc cơ sở công lập đủ điều kiện; Tòa án nhân dân xem xét, quyết định.</li><li>Cơ sở công lập phải có khu dạy văn hóa và khu quản lý riêng cho người từ 12 đến dưới 18 tuổi ${C('khoản 4 Đ66 NĐ163')}</li><li>Chế độ thực hiện như chế độ của học sinh trường giáo dưỡng ${C('Đ3 TT79')}</li><li>Hết hạn mà không có gia đình đón: cơ sở đưa về bàn giao gia đình hoặc UBND xã; không có nơi cư trú: đưa vào cơ sở bảo trợ xã hội.</li><li>Khi đủ 18 tuổi mà thời gian cai nghiện còn lại từ đủ 03 tháng trở lên: chuyển sang cơ sở cai nghiện công lập ${C('khoản 4 Điều 36 Luật')}</li><li>Việc đưa đi cai nghiện bắt buộc do Tòa án nhân dân khu vực quyết định, không phải biện pháp xử lý hành chính ${C('khoản 8 Điều 36 Luật')}</li><li>Quản lý sau cai 01 năm ${C('khoản 1 Điều 42 Luật')}</li></ul>`}
];

function monthClass(cls){ const n = cls.length; if(!n) return null; const c = k=>cls.filter(x=>x===k).length, ge = r=>cls.filter(x=>RANK[x]>=RANK[r]).length;
  if(c('tot')>=Math.min(3,n) && c('tb')===0 && c('kem')===0) return 'tot';

  if(cls.filter(x=>x==='tot').length>=Math.min(2,n) && ge('kha')===n) return 'tot';

function suggest(act, prior, aggr, mitig){
  const why = []; let lv = ACTS[act-1][1];
  why.push(`Khoản ${act} Điều 15 → mức cơ bản: ${FORM[lv]}`);
  if(lv==='pb' && prior==='pb'){ lv='cc'; why.push('Đã bị phê bình mà còn vi phạm → Cảnh cáo (điểm b khoản 2 Điều 32)'); }
  if(lv!=='kr' && (prior==='cc'||prior==='kr')){ lv='kr'; why.push('Đã bị cảnh cáo mà còn vi phạm → Khu quản lý riêng (điểm b khoản 3 Điều 32)'); }
  if(aggr && lv==='pb'){ lv='cc'; why.push('Có tình tiết tăng nặng → Cảnh cáo (điểm c khoản 2 Điều 32)'); }
  else if(aggr && lv==='cc'){ lv='kr'; why.push('Có tình tiết tăng nặng → Khu quản lý riêng (điểm c khoản 3 Điều 32)'); }
  else if(!aggr && mitig && lv==='cc' && !prior){ lv='pb'; why.push('Có tình tiết giảm nhẹ → Phê bình (điểm b khoản 1 Điều 32)'); }
  return {lv, why};
}

function vbArt(doc, n){ const d = VB()[doc]; if(!d) return null; return d.items.find(x=>x[0]==='D' && x[1]===n) || null; }
function vbMax(doc){ return VB()[doc].items.filter(x=>x[0]==='D').length; }
function parseRef(q){
  let s = ' '+norm(q).replace(/[.,;:()]/g,' ')+' ';
  const r = {doc:null, n:null, k:null};
  let m = s.match(/\skhoan\s*(\d+)/); if(m){ r.k = +m[1]; s = s.replace(m[0],' '); }
  m = s.match(/\s(?:dieu|d)\s*(\d+)/); if(m){ r.n = +m[1]; s = s.replace(m[0],' '); }
  m = s.match(/nghi\s*dinh|\snd\s?\d*|163/); const m2 = s.match(/thong\s*tu|\stt\s?\d*|\s79\s/); const m3 = s.match(/luat|lpcmt|\s120\s|qh15/);
  const cand = [[m,'nd163'],[m2,'tt79'],[m3,'luat']].filter(x=>x[0]).sort((a,b)=>a[0].index-b[0].index);
  if(cand.length) r.doc = cand[0][1];
  return r;
}
function linkLaw(html){
  return html.replace(/<span class="law">([^<]+)<\/span>/g, (all, t) => {
    const parts = t.split(';').map(x=>x.trim()).filter(Boolean);
    let any = false;
    const out = parts.map(pt => { const r = parseRef(pt); if(r.doc && r.n && vbArt(r.doc, r.n)){ any = true; return `<a class="lawlink" href="#vb--${r.doc}--${r.n}${r.k?'--k'+r.k:''}">${esc(pt)}</a>`; } return esc(pt); }).join('; ');
    return any ? `<span class="law">${out}</span>` : all;
  });
}
function vbRows(rows){
  let html = '', tbl = [];
  const flush = () => { if(tbl.length){ html += '<div class="tw"><table>'+tbl.map((r,i)=>'<tr>'+r.split('§TD§').map(c=>i===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table></div>'; tbl = []; } };
  rows.forEach(p=>{
    if(p.startsWith('§TR§')){ tbl.push(p.slice(4)); return; }
    flush();
    let m = p.match(/^(\d+)\.\s/);
    if(m){ html += `<p class="k" id="k${m[1]}"><b class="kn">${m[1]}.</b> ${esc(p.slice(m[0].length))}</p>`; return; }
    if(/^[a-zđ]\)\s/.test(p)){ html += `<p class="pt">${esc(p)}</p>`; return; }
    html += `<p>${esc(p)}</p>`;
  });
  flush(); return html;
}
function vbContext(doc, n){

  return [ch, mu].filter(Boolean).map(x=>`${x[1]}. ${x[2]}`).join(' › ');
}

let INDEX = null;
function buildIndex(){
  INDEX = [];
  TOPICS.forEach(t=>INDEX.push({type:'Tra cứu', title:t.title, href:'#tc--'+t.id, text: norm(t.title+' '+t.sub+' '+strip(t.body)), raw: strip(t.body)}));
  SITUATIONS.forEach(s=>INDEX.push({type:'Tình huống', title:s.title, href:'#th--'+s.id, text: norm(s.title+' '+s.sub+' '+s.steps.flat().join(' ')), raw: s.steps.map(x=>x.join(' ')).join(' ')}));
  ACTS.forEach((a,i)=>INDEX.push({type:'Hành vi cấm', title:`Khoản ${i+1}: ${a[0]}`, href:'#tc--cam', text: norm(a[0]+' khoan '+(i+1)), raw:`Mức cơ bản: ${FORM[a[1]]}`}));
  VBIDS.forEach(doc=>{ const d = VB()[doc]; d.items.forEach(x=>{ if(x[0]!=='D') return; const body = x[3].map(p=>p.replace(/§T[RD]§/g,' ')).join(' '); INDEX.push({type:d.short, title:`Điều ${x[1]}. ${x[2]}`, href:`#vb--${doc}--${x[1]}`, text: norm(x[2]+' '+body), tnorm: norm(x[2]), raw: body}); }); });
  QUIZ.forEach(q=>INDEX.push({type:'Hỏi đáp', title:q.q, href:'#on-tap', text: norm(q.q+' '+q.e+' '+q.l), raw: q.a[q.c]+'. '+q.e+' ('+q.l+')'}));
}
function search(q){
  if(!INDEX) buildIndex();
  const terms = norm(q).split(/\s+/).filter(x=>x.length>1);
  if(!terms.length) return [];
  return INDEX.map(it=>{ let sc = it.href.startsWith('#vb')?0:2; const tn = it.tnorm || norm(it.title); for(const t of terms){ if(!it.text.includes(t)) return null; sc += (tn.includes(t)?5:1); } return {...it, sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,40);
}
function snippet(raw, q){
  const n = norm(raw), t = norm(q).split(/\s+/).filter(x=>x.length>1)[0]||''; const i = n.indexOf(t);
  const s = Math.max(0,i-40), e = Math.min(raw.length, i+90);
  let out = esc((s>0?'…':'')+raw.slice(s,e)+(e<raw.length?'…':''));
  return out;
}

function nowSched(){
  const m = new Date().getMonth()+1; const summer = store.get('season', (m>=4 && m<=9)?'he':'dong') === 'he';

  SCHED.forEach((r,i)=>{ const t = (summer?r[1]:r[0]).split('–'); const st = toMin(t[0]); const en = t[1]?toMin(t[1]):st+15; if(mins>=st && mins<en) idx = i; });
  return {summer, idx};
}

function vSearch(q){
  header('Kết quả tìm kiếm', q, true);

  let top = '';
  if(ref.n){
    const docs = ref.doc ? [ref.doc] : VBIDS;
    const hits = docs.map(dc=>[dc, vbArt(dc, ref.n)]);
    top = `<div class="sec-t">Điều ${ref.n}${ref.doc?' – '+VB()[ref.doc].short:' trong các văn bản'}</div><div class="list">${hits.map(([dc,x])=> x ? `<a href="#vb--${dc}--${ref.n}${ref.k?'--k'+ref.k:''}"><span class="num">Đ${ref.n}</span><div class="tx"><b>${esc(VB()[dc].short)} – Điều ${ref.n}. ${esc(x[2])}</b><span>${esc(x[3].slice(0,1).join(' ').slice(0,110))}…</span></div>${chev}</a>` : `<button class="row" disabled><div class="tx"><b>${esc(VB()[dc].short)}</b><span>Không có Điều ${ref.n} (văn bản có ${vbMax(dc)} điều)</span></div></button>`).join('')}</div>`;
  }
  let rest = q;
  if(ref.n){ rest = norm(q).replace(/(dieu|khoan|diem)\s*\d+/g,' ').replace(/\d+/g,' ').split(/\s+/).filter(w=>w && !['nghi','dinh','thong','tu','luat','nd','tt','pcmt','qh15','d','cua','so','theo'].includes(w)).join(' '); }
  const r = rest ? search(rest) : [];
  return `<form class="search" role="search" id="sForm"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sInput" type="search" value="${esc(q)}" aria-label="Tìm trong sổ tay" autocomplete="off"></form>
  ${top}${r.length?`${top?'<div class="sec-t">Kết quả khác</div>':''}<div class="list hit">${r.map(x=>`<a href="${x.href}"><div class="tx"><b>${esc(x.title)}</b><span>${x.type} · ${snippet(x.raw,q)}</span></div>${chev}</a>`).join('')}</div>`:top?'':`<div class="empty">Không tìm thấy "${esc(q)}". Thử từ khóa ngắn hơn, ví dụ: "tiền", "điện thoại", "điều 56 nghị định 163".</div>`}`;
}

      [T.n>=1 && T.n<=(T.special?5:3), `${T.n} người (tối đa ${T.special?5:3})`],
      [T.rels, T.rels?'Đều thuộc diện thân nhân khoản 1 Điều 35':'Có người không thuộc diện thân nhân (cần văn bản đề nghị)'],
      [T.docs, T.docs?'Có tên trong sổ hoặc đã xác thực giấy tờ':'Chưa xuất trình giấy tờ (hướng dẫn làm đơn)'],
      [!T.court, T.court?'Cơ quan thụ lý vụ án đề nghị không cho gặp':'Không có đề nghị hạn chế của cơ quan tố tụng']
    ];
    const ok = checks.every(c=>c[0]);
    const tg = (id,v,l) => `<label class="tog"><input type="checkbox" id="${id}" ${v?'checked':''}><span>${l}</span></label>`;
    return `<div class="card">
    <div class="grid2"><label class="f">Ngày tiếp nhận<input type="date" id="tAdmit" value="${T.admit}"></label><label class="f">Ngày thăm<input type="date" id="tDate" value="${T.date}"></label></div>
    <div class="grid2"><label class="f">Kỷ luật gần nhất<select id="tDisc"><option value="">Không có</option><option value="pb" ${T.disc==='pb'?'selected':''}>Phê bình</option><option value="cc" ${T.disc==='cc'?'selected':''}>Cảnh cáo</option><option value="kr" ${T.disc==='kr'?'selected':''}>Khu quản lý riêng</option></select></label><label class="f">Ngày quyết định<input type="date" id="tDiscDate" value="${T.discDate}" ${T.disc?'':'disabled'}></label></div>
    ${tg('tPend',T.pending,'Đang bị xem xét kỷ luật')}
    ${tg('tWeek',T.week,'Đã thăm gặp trong tuần này')}
    ${T.week?tg('tBonus',T.bonus,'Còn lần thăm gặp được thưởng (khen thưởng)'):''}
    <div class="stepper"><div class="lb">Số thân nhân đến thăm</div><div class="ct"><button id="tDec" aria-label="Giảm">−</button><output>${T.n}</output><button id="tInc" aria-label="Tăng">+</button></div></div>
    ${tg('tSpecial',T.special,'Trưởng cơ sở đồng ý trường hợp đặc biệt (tối đa 5)')}
    ${tg('tRels',T.rels,'Tất cả là thân nhân theo khoản 1 Điều 35')}
    ${tg('tDocs',T.docs,'Có tên trong Sổ thăm gặp hoặc có giấy tờ hợp lệ')}
    ${tg('tCourt',T.court,'Có văn bản cơ quan tố tụng đề nghị không cho gặp')}</div>
    <div class="card"><div class="row2"><h2>Kết quả</h2><span class="sp"></span>${ok?'<span class="pill t-tot">Đủ điều kiện</span>':'<span class="pill t-kem">Chưa đủ điều kiện</span>'}</div>
    ${checks.map(c=>`<div class="chk" style="padding:6px 0"><b style="width:20px;color:var(--${c[0]?'good':'bad'})">${c[0]?'✓':'✕'}</b><span>${c[1]}</span></div>`).join('')}
    <p class="law" style="background:none;padding:0;margin-top:6px">Mỗi lần ≤ 45 phút (+15 phút nếu Trưởng cơ sở đồng ý). Nhận tiền ≤ 02 lần, ≤ 3 triệu đồng/tháng.</p></div>`;
  }
  if(id==='moc'){
    header('Tính mốc thời hạn','Điều 84–88, 123–124 NĐ163',true);
    const M = store.get('moc',{admit:TODAY, months:24});
    const end = addMonths(M.admit, M.months);
    const rows = [
      [M.admit,'Ngày tiếp nhận'],
      [addDays(M.admit,2),'Kết thúc tiếp nhận, phân loại (tối đa 02 ngày)'],
      [addDays(M.admit,15),'Được thăm gặp thân nhân (đủ 15 ngày)'],
      [addDays(M.admit,12),'Sớm nhất kết thúc cắt cơn (tối thiểu 10 ngày)'],
      [addMonths(addDays(M.admit,12),3),'Sớm nhất kết thúc giai đoạn giáo dục (tối thiểu 03 tháng)'],
      [addMonths(end,-3),'Hạn chót bắt đầu học nghề (còn ≥ 03 tháng)'],
      [addDays(end,-30),'Hạn thông báo Tòa án, Công an xã, gia đình; bắt đầu chuẩn bị tái hòa nhập'],
      [addDays(end,-15),'Hạn lập hồ sơ đưa vào cơ sở bảo trợ xã hội (nếu thuộc diện)'],
      [addDays(end,-1),'Trong 24 giờ trước khi ra: cấp giấy xác nhận hoàn thành, trao quyết định quản lý sau cai'],
      [end,'Hết thời hạn']
    ].sort((a,b)=>a[0]<b[0]?-1:1);
    return `<div class="card"><div class="grid2"><label class="f">Ngày tiếp nhận<input type="date" id="mAdmit" value="${M.admit}"></label><label class="f">Thời hạn (tháng)<select id="mMonths">${[6,12,18,24,36].map(m=>`<option value="${m}" ${M.months===m?'selected':''}>${m} tháng</option>`).join('')}</select></label></div>
    <p class="law" style="background:none;padding:0">Khoản 1 Điều 29 Luật: lần đầu 24 tháng, từ lần thứ hai 36 tháng. Thời gian quản lý trong lúc lập hồ sơ được trừ (Điều 37 Luật).</p></div>
    <div class="card"><ul class="sched">${rows.map(r=>`<li class="${r[0]<=TODAY && TODAY<addDays(r[0],1)?'now':''}"><span class="t">${vn(r[0])}</span><span>${r[1]}${r[0]<TODAY?' <span class="law">đã qua</span>':''}</span></li>`).join('')}</ul>
    <p class="law" style="background:none;padding:0">Thời gian bỏ trốn không tính vào thời hạn; phải cộng thêm nếu có.</p></div>`;
  }
  if(id==='khen'){
    header('Chỉ tiêu khen thưởng','điểm c khoản 2 Điều 25',true);
    const n = store.get('khenN',12), q = Math.floor(n*0.15);
    return `<div class="card"><div class="stepper"><div class="lb">Số người của tổ</div><div class="ct"><button id="nDec" aria-label="Giảm">−</button><output>${n}</output><button id="nInc" aria-label="Tăng">+</button></div></div></div>
    <div class="result"><div class="big">${q}</div><div style="flex:1">người tối đa được khen thưởng định kỳ<br><span style="opacity:.8;font-size:.85em">${n} × 15% = ${(n*0.15).toFixed(2)}, làm tròn xuống</span></div></div>
    <div class="note info" style="margin-top:12px">Tiêu chuẩn: xếp loại Tốt trong tháng (quý), không vi phạm nội quy, tự giác thực hiện quy trình. Họp tổ ≥ 2/3 đồng ý.${q===0?' Tổ dưới 7 người thì 15% chưa đủ 1 người; đơn vị cần thống nhất cách làm tròn.':''}</div>`;
  }
  return vCongCu();
}
/* ====================== ÔN TẬP ====================== */
let QZ = null;
function vOnTap(){
  header('Ôn tập kiến thức', `${QUIZ.length} câu hỏi có đáp án và căn cứ`);
  const best = store.get('best',null), wrong = store.get('wrong',[]);
  if(!QZ) return `<div class="card"><h2>Bài kiểm tra nhanh</h2><p>10 câu ngẫu nhiên. Trả lời xong mỗi câu sẽ thấy đáp án và điều khoản căn cứ.</p>${best!=null?`<p class="law">Kết quả tốt nhất: ${best}/10</p>`:''}<button class="btn pri full" id="qStart">Bắt đầu 10 câu</button></div>
  ${wrong.length?`<div class="card"><h2>Câu từng trả lời sai: ${wrong.length}</h2><button class="btn full" id="qWrong">Ôn lại các câu sai</button></div>`:''}
  <div class="card"><h2>Toàn bộ câu hỏi</h2><button class="btn full" id="qAll">Làm hết ${QUIZ.length} câu</button></div>`;
  const it = QUIZ[QZ.ids[QZ.i]], ans = QZ.ans[QZ.i];
  if(QZ.i>=QZ.ids.length) return '';
  return `<div class="row2"><span class="law">Câu ${QZ.i+1}/${QZ.ids.length}</span><span class="sp"></span><span class="law">Đúng ${QZ.score}</span></div>
  <div class="prog"><i style="width:${(QZ.i)/QZ.ids.length*100}%"></i></div>
  <div class="card"><h2 style="font-weight:600">${esc(it.q)}</h2>
  ${it.a.map((a,i)=>`<button class="q-opt ${ans!=null?(i===it.c?'ok':(i===ans?'no':'')):''}" data-ans="${i}" ${ans!=null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}
  ${ans!=null?`<div class="note ${ans===it.c?'info':'bad'}"><b>${ans===it.c?'Chính xác.':'Chưa đúng.'}</b> ${esc(it.e)}<br><span class="law">${esc(it.l)}</span></div><button class="btn pri full" id="qNext">${QZ.i+1<QZ.ids.length?'Câu tiếp theo':'Xem kết quả'}</button>`:''}</div>`;
}
function vQuizDone(){
  header('Kết quả ôn tập','',false);
  const n = QZ.ids.length, s = QZ.score;
  return `<div class="card" style="text-align:center"><div style="font-size:2.6em;font-weight:700;color:var(--accent)">${s}/${n}</div><p>${s/n>=0.8?'Nắm vững quy định.':s/n>=0.5?'Cần ôn thêm một số nội dung.':'Nên đọc lại các chủ đề trong mục Tra cứu.'}</p><button class="btn pri full" id="qAgain">Làm bài khác</button></div>
  <div class="list">${QZ.ids.map((id,i)=>{ const q = QUIZ[id], ok = QZ.ans[i]===q.c; return `<button class="row" disabled><span class="num" style="color:var(--${ok?'good':'bad'})">${ok?'✓':'✕'}</span><div class="tx"><b>${esc(q.q)}</b><span>Đáp án: ${esc(q.a[q.c])} · ${esc(q.l)}</span></div></button>`; }).join('')}</div>`;
}
function startQuiz(ids){ QZ = {ids, i:0, ans:[], score:0}; render(); }
const shuffle = a => { const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

/* ====================== ĐIỀU HƯỚNG ====================== */
function pushRecent(k){ let r = store.get('recent',[]); r = [k, ...r.filter(x=>x!==k)].slice(0,8); store.set('recent', r); }
function route(){ const h = location.hash.slice(1) || 'home'; const [a, b, c, d] = h.split('--'); return {a, b: b?decodeURIComponent(b):'', c: c||'', d: d||''}; }
let lastQ = '';
function render(){
  const {a,b,c,d} = route(); let html = '', tab = 'home';
  if(a==='home') html = vHome();
  else if(a==='tra-cuu'){ html = vTraCuu(); tab='tra-cuu'; }
  else if(a==='tc'){ html = vTopic(b); tab='tra-cuu'; }
  else if(a==='tinh-huong'){ html = vTinhHuong(); tab='tinh-huong'; }
  else if(a==='th'){ html = vSituation(b); tab='tinh-huong'; }
  else if(a==='cong-cu'){ html = vCongCu(); tab='cong-cu'; }
  else if(a==='cc'){ html = vTool(b); tab='cong-cu'; }
  else if(a==='on-tap'){ html = (QZ && QZ.i>=QZ.ids.length) ? vQuizDone() : vOnTap(); tab='on-tap'; }
  else if(a==='tim'){ html = vSearch(lastQ); tab='home'; }
  else if(a==='vb'){ html = c ? vDieu(b, c, d) : vVanBan(b); tab='tra-cuu'; }
  else html = vHome();
  $('#main').innerHTML = html;
  document.querySelectorAll('nav.tabs a').forEach(x=>x.classList.toggle('on', x.dataset.t===tab));
  bind(a,b);
  if(a==='vb' && vbFlashK){ const el = document.getElementById('k'+vbFlashK); if(el){ setTimeout(()=>{ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 2500); }, 50); } vbFlashK = null; }
}
function bind(a,b){
  const sf = $('#sForm');
  if(sf){ const inp = $('#sInput'); sf.onsubmit = e=>{ e.preventDefault(); const q = inp.value.trim(); if(!q) return; inp.blur(); const ref = parseRef(q); if(ref.doc && ref.n && vbArt(ref.doc, ref.n)){ location.hash = `vb--${ref.doc}--${ref.n}${ref.k?'--k'+ref.k:''}`; return; } lastQ = q; if(location.hash==='#tim') render(); else location.hash='tim'; }; if(a==='tim') { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
  const ib = $('#installBtn'); if(ib) ib.hidden = !deferredPrompt;
  const th = $('#themeBtn'); if(th) th.onclick = ()=>{ const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const nx = cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx); };
  document.querySelectorAll('[data-season]').forEach(x=>x.onclick = ()=>{ store.set('season', x.dataset.season); render(); });
  const qg = $('#qGo'); if(qg){ const go = ()=>{ const dc = $('#qDoc').value, n = +$('#qNum').value; if(!n) return toast('Nhập số điều'); location.hash = `vb--${dc}--${n}`; }; qg.onclick = go; $('#qNum').onkeydown = e=>{ if(e.key==='Enter') go(); }; }
  const vf = $('#vbFilter'); if(vf){ vf.oninput = ()=>{ const t = norm(vf.value.trim()); const num = /^\d+$/.test(vf.value.trim()); document.querySelectorAll('#vbList details').forEach(dt=>{ let any = false; dt.querySelectorAll('a').forEach(x=>{ const ok = !t || (num ? x.dataset.f.startsWith('dieu '+t+' ') : x.dataset.f.includes(t)); x.hidden = !ok; if(ok) any = true; }); dt.hidden = !any; if(t) dt.open = any; }); }; $('#vbOpenAll').onclick = ()=>{ const ds = document.querySelectorAll('#vbList details'); const allOpen = [...ds].every(x=>x.open); ds.forEach(x=>x.open = !allOpen); }; }
  if(a==='th'){ document.querySelectorAll('[data-chk]').forEach(x=>x.onchange = ()=>{ const l = [...document.querySelectorAll('[data-chk]')].filter(z=>z.checked).map(z=>Number(z.dataset.chk)); store.set('chk-'+b, l); }); const r = $('#chkReset'); if(r) r.onclick = ()=>{ store.set('chk-'+b, []); render(); }; }
  if(a==='cc' && b==='diem'){
    document.querySelectorAll('[data-inc]').forEach(x=>x.onclick = ()=>{ const i = +x.dataset.inc; TS.c[i] = Math.min(10, TS.c[i]+1); render(); });
    document.querySelectorAll('[data-dec]').forEach(x=>x.onclick = ()=>{ const i = +x.dataset.dec; TS.c[i] = Math.max(0, TS.c[i]-1); render(); });
    document.querySelectorAll('[data-v]').forEach(x=>x.onchange = ()=>{ TS.v[+x.dataset.v] = x.checked; render(); });
    $('#tsReset').onclick = ()=>{ TS = {c:Array(10).fill(10), v:[false,false,false]}; render(); };
  }
  if(a==='cc' && b==='thang'){
    document.querySelectorAll('[data-w]').forEach(x=>x.onchange = ()=>{ const w = store.get('wk',['tot','tot','tot','kha']); w[+x.dataset.w] = x.value; store.set('wk',w); render(); });
    document.querySelectorAll('[data-q]').forEach(x=>x.onchange = ()=>{ const q = store.get('qm',['tot','tot','kha']); q[+x.dataset.q] = x.value; store.set('qm',q); render(); });
    $('#wAdd').onclick = ()=>{ const w = store.get('wk',['tot','tot','tot','kha']); if(w.length<5){ w.push('kha'); store.set('wk',w); render(); } };
    $('#wDel').onclick = ()=>{ const w = store.get('wk',['tot','tot','tot','kha']); if(w.length>1){ w.pop(); store.set('wk',w); render(); } };
  }
  if(a==='cc' && b==='ky-luat'){
    const K = store.get('kl',{act:17, prior:'', aggr:false, mitig:false, date:TODAY, found:TODAY, complex:false});
    const up = (k,v)=>{ K[k]=v; if(k==='date' && K.found<v) K.found = v; if(k==='found' && v<K.date) K.found = K.date; store.set('kl',K); render(); };
    $('#kAct').onchange = e=>up('act', +e.target.value); $('#kPrior').onchange = e=>up('prior', e.target.value);
    $('#kAggr').onchange = e=>up('aggr', e.target.checked); $('#kMitig').onchange = e=>up('mitig', e.target.checked);
    $('#kDate').onchange = e=>e.target.value && up('date', e.target.value); $('#kFound').onchange = e=>e.target.value && up('found', e.target.value);
    $('#kCx').onchange = e=>up('complex', e.target.checked);
  }
  if(a==='cc' && b==='tham-gap'){
    const T = store.get('tg',{admit:addDays(TODAY,-20), date:TODAY, disc:'', discDate:'', pending:false, n:2, special:false, rels:true, docs:true, week:false, bonus:false, court:false});
    const up = (k,v)=>{ T[k]=v; if(k==='disc' && v && !T.discDate) T.discDate = TODAY; if(k==='week' && !v) T.bonus=false; store.set('tg',T); render(); };
    $('#tAdmit').onchange = e=>e.target.value && up('admit', e.target.value); $('#tDate').onchange = e=>e.target.value && up('date', e.target.value);
    $('#tDisc').onchange = e=>up('disc', e.target.value); $('#tDiscDate').onchange = e=>up('discDate', e.target.value);
    [['tPend','pending'],['tWeek','week'],['tBonus','bonus'],['tSpecial','special'],['tRels','rels'],['tDocs','docs'],['tCourt','court']].forEach(([id,k])=>{ const el = $('#'+id); if(el) el.onchange = e=>up(k, e.target.checked); });
    $('#tInc').onclick = ()=>up('n', Math.min(6, T.n+1)); $('#tDec').onclick = ()=>up('n', Math.max(1, T.n-1));
  }
  if(a==='cc' && b==='moc'){
    const M = store.get('moc',{admit:TODAY, months:24});
    $('#mAdmit').onchange = e=>{ if(e.target.value){ M.admit = e.target.value; store.set('moc',M); render(); } };
    $('#mMonths').onchange = e=>{ M.months = +e.target.value; store.set('moc',M); render(); };
  }
  if(a==='cc' && b==='khen'){
    $('#nInc').onclick = ()=>{ store.set('khenN', Math.min(60, store.get('khenN',12)+1)); render(); };
    $('#nDec').onclick = ()=>{ store.set('khenN', Math.max(1, store.get('khenN',12)-1)); render(); };
  }
  if(a==='on-tap'){
    const st = $('#qStart'); if(st) st.onclick = ()=>startQuiz(shuffle(QUIZ.map((_,i)=>i)).slice(0,10));
    const al = $('#qAll'); if(al) al.onclick = ()=>startQuiz(shuffle(QUIZ.map((_,i)=>i)));
    const wr = $('#qWrong'); if(wr) wr.onclick = ()=>startQuiz(shuffle(store.get('wrong',[])).filter(i=>i<QUIZ.length));
    const ag = $('#qAgain'); if(ag) ag.onclick = ()=>{ QZ = null; render(); };
    document.querySelectorAll('[data-ans]').forEach(x=>x.onclick = ()=>{
      const i = +x.dataset.ans, id = QZ.ids[QZ.i], ok = i===QUIZ[id].c; QZ.ans[QZ.i] = i; if(ok) QZ.score++;
      let w = store.get('wrong',[]); w = ok ? w.filter(z=>z!==id) : [...new Set([...w,id])]; store.set('wrong', w); render(); });
    const nx = $('#qNext'); if(nx) nx.onclick = ()=>{ QZ.i++; if(QZ.i>=QZ.ids.length){ const n = QZ.ids.length; if(n===10){ const b0 = store.get('best',null); if(b0==null || QZ.score>b0) store.set('best', QZ.score); } } render(); window.scrollTo(0,0); };
  }
}
$('#back').onclick = ()=>{ if(history.length>1) history.back(); else location.hash = 'home'; };
const FS = [15,16,17.5,19];
let fsI = store.get('fs',1);
function applyFs(){ document.documentElement.style.setProperty('--fs', FS[fsI]+'px'); }
$('#fs').onclick = ()=>{ fsI = (fsI+1)%FS.length; store.set('fs',fsI); applyFs(); toast('Cỡ chữ '+(fsI+1)+'/'+FS.length); };
document.querySelectorAll('nav.tabs a').forEach(x=>x.addEventListener('click', ()=>{ if(x.dataset.t==='on-tap' && QZ && QZ.i>=QZ.ids.length) QZ = null; }));
window.addEventListener('hashchange', ()=>{ window.scrollTo(0,0); render(); });
function standalone(){ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } }
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt = e; const b = $('#installBtn'); if(b) b.hidden = false; });
document.addEventListener('click', e=>{ if(e.target && e.target.id==='installBtn' && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt = null; e.target.hidden = true; }); } });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
(function init(){ const t = store.get('theme',null); if(t) document.documentElement.setAttribute('data-theme', t); applyFs(); render(); })();
</script>
</body>
</html>
